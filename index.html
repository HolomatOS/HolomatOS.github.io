<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCore Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .status.checking {
            background: #fff3cd;
            color: #856404;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status strong {
            display: block;
            margin-bottom: 5px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .info-list {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }

        .info-list li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .info-list li:last-child {
            border-bottom: none;
        }

        #ar-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .ar-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 1000;
        }

        .exit-ar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background: rgba(255, 59, 48, 0.9);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 ARCore Compatibility Test</h1>
        
        <div id="status" class="status checking">
            <strong>Checking...</strong>
            <span>Testing your device for ARCore/WebXR support...</span>
        </div>

        <ul id="info" class="info-list"></ul>

        <button id="test-ar" disabled>Test AR Experience</button>
        <button id="details-btn" style="display: none; background: #6c757d;">Show Technical Details</button>
    </div>

    <canvas id="ar-view"></canvas>

    <script>
        const statusDiv = document.getElementById('status');
        const infoList = document.getElementById('info');
        const testArBtn = document.getElementById('test-ar');
        const detailsBtn = document.getElementById('details-btn');
        const arView = document.getElementById('ar-view');

        let arSupported = false;
        let xrSession = null;

        async function checkARSupport() {
            const results = {
                browser: navigator.userAgent,
                webxr: false,
                arSupported: false,
                arMode: 'none',
                https: window.location.protocol === 'https:',
                deviceMotion: 'DeviceMotionEvent' in window,
                deviceOrientation: 'DeviceOrientationEvent' in window
            };

            // Check WebXR support
            if ('xr' in navigator) {
                results.webxr = true;
                
                try {
                    // Check for immersive-ar mode
                    const supported = await navigator.xr.isSessionSupported('immersive-ar');
                    results.arSupported = supported;
                    results.arMode = supported ? 'immersive-ar' : 'none';
                } catch (err) {
                    console.error('AR check error:', err);
                }
            }

            displayResults(results);
            return results;
        }

        function displayResults(results) {
            infoList.innerHTML = '';

            // Browser info
            const browserMatch = results.browser.match(/(Chrome|Firefox|Safari)\/[\d.]+/);
            addInfo('Browser', browserMatch ? browserMatch[0] : 'Unknown');

            // WebXR support
            addInfo('WebXR API', results.webxr ? '✅ Available' : '❌ Not Available', results.webxr);

            // AR support
            addInfo('AR Mode', results.arSupported ? '✅ Supported (ARCore)' : '❌ Not Supported', results.arSupported);

            // HTTPS
            addInfo('Secure Context', results.https ? '✅ HTTPS' : '⚠️ HTTP (AR requires HTTPS)', results.https);

            // Sensors
            addInfo('Motion Sensors', results.deviceMotion ? '✅ Available' : '❌ Not Available', results.deviceMotion);
            addInfo('Orientation Sensors', results.deviceOrientation ? '✅ Available' : '❌ Not Available', results.deviceOrientation);

            // Overall status
            if (results.arSupported && results.https) {
                arSupported = true;
                statusDiv.className = 'status success';
                statusDiv.innerHTML = '<strong>✅ ARCore Supported!</strong><span>Your device can run WebXR AR experiences. Click "Test AR Experience" to try it!</span>';
                testArBtn.disabled = false;
            } else if (!results.https) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = '<strong>⚠️ HTTPS Required</strong><span>AR requires a secure connection (HTTPS). Your device may support AR, but it needs HTTPS to work.</span>';
            } else if (!results.webxr) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = '<strong>❌ WebXR Not Available</strong><span>Your browser doesn\'t support WebXR. Try using Chrome or Chrome Beta on Android.</span>';
            } else {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = '<strong>❌ AR Not Supported</strong><span>Your device doesn\'t support WebXR AR mode. ARCore may not be available on this device.</span>';
            }

            detailsBtn.style.display = 'block';
        }

        function addInfo(label, value, success = null) {
            const li = document.createElement('li');
            li.innerHTML = `<strong>${label}:</strong> ${value}`;
            if (success !== null) {
                li.style.color = success ? '#155724' : '#721c24';
            }
            infoList.appendChild(li);
        }

        testArBtn.addEventListener('click', async () => {
            if (!arSupported) return;

            try {
                testArBtn.disabled = true;
                testArBtn.textContent = 'Starting AR...';

                // Request AR session
                xrSession = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['local', 'hit-test']
                });

                // Session started successfully
                statusDiv.className = 'status success';
                statusDiv.innerHTML = '<strong>✅ AR Session Active!</strong><span>Move your phone around to test tracking. You should see a colored cube.</span>';

                // Setup WebGL
                const canvas = document.getElementById('ar-view');
                const gl = canvas.getContext('webgl', { xrCompatible: true });

                await gl.makeXRCompatible();

                // Setup XR layer
                const xrLayer = new XRWebGLLayer(xrSession, gl);
                xrSession.updateRenderState({ baseLayer: xrLayer });

                // Reference space
                const refSpace = await xrSession.requestReferenceSpace('local');

                // Create test cube
                arView.style.display = 'block';
                document.body.appendChild(createAROverlay());
                document.body.appendChild(createExitButton());

                // Render loop
                xrSession.requestAnimationFrame(function render(time, frame) {
                    const pose = frame.getViewerPose(refSpace);
                    
                    if (pose) {
                        gl.bindFramebuffer(gl.FRAMEBUFFER, xrLayer.framebuffer);
                        
                        // Clear with semi-transparent background
                        gl.clearColor(0, 0, 0, 0);
                        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                        // Simple rendering (camera passthrough happens automatically)
                        for (const view of pose.views) {
                            const viewport = xrLayer.getViewport(view);
                            gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
                        }
                    }

                    xrSession.requestAnimationFrame(render);
                });

            } catch (err) {
                console.error('AR session error:', err);
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `<strong>❌ AR Failed</strong><span>${err.message}</span>`;
                testArBtn.disabled = false;
                testArBtn.textContent = 'Test AR Experience';
            }
        });

        function createAROverlay() {
            const overlay = document.createElement('div');
            overlay.className = 'ar-overlay';
            overlay.innerHTML = `
                <strong>📱 AR Mode Active</strong><br>
                Move your phone around<br>
                Camera passthrough working!
            `;
            return overlay;
        }

        function createExitButton() {
            const btn = document.createElement('button');
            btn.className = 'exit-ar';
            btn.textContent = 'Exit AR';
            btn.onclick = () => {
                if (xrSession) {
                    xrSession.end();
                    window.location.reload();
                }
            };
            return btn;
        }

        detailsBtn.addEventListener('click', () => {
            alert('User Agent:\n' + navigator.userAgent);
        });

        // Auto-check on load
        checkARSupport();
    </script>
</body>
</html>
