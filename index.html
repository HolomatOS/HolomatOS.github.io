<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Road Viewer HUD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

video, canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

#speed {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 48px;
  font-weight: bold;
  opacity: 0.9;
}
</style>
</head>

<body>

<div id="speed">65</div>
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { exact: "environment" } },
    audio: false
  });
  video.srcObject = stream;
}

video.onloadedmetadata = () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  drawHUD();
};

function drawHUD() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Road fade
  const grad = ctx.createLinearGradient(0, canvas.height, 0, canvas.height * 0.5);
  grad.addColorStop(0, "rgba(0,0,0,0.8)");
  grad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, canvas.height * 0.5, canvas.width, canvas.height);

  // Blue guidance lines
  ctx.strokeStyle = "rgba(0,150,255,0.9)";
  ctx.lineWidth = 6;

  ctx.beginPath();
  ctx.moveTo(canvas.width * 0.42, canvas.height);
  ctx.lineTo(canvas.width * 0.47, canvas.height * 0.55);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(canvas.width * 0.58, canvas.height);
  ctx.lineTo(canvas.width * 0.53, canvas.height * 0.55);
  ctx.stroke();

  // Center path
  ctx.strokeStyle = "rgba(0,200,255,0.6)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(canvas.width * 0.5, canvas.height);
  ctx.lineTo(canvas.width * 0.5, canvas.height * 0.55);
  ctx.stroke();

  requestAnimationFrame(drawHUD);
}

startCamera();
</script>

</body>
</html>
