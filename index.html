<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tesseract AR</title>
<style>
* { margin:0; padding:0; box-sizing:border-box }
body { background:#000510; overflow:hidden; font-family:'Courier New',monospace; touch-action:none }

#overlay {
  position:fixed; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(0,5,16,.97); z-index:100;
}
.logo {
  font-size:clamp(1.4rem,6vw,2.6rem); letter-spacing:.4rem;
  color:#00aaff; text-shadow:0 0 40px rgba(0,170,255,.9);
  margin-bottom:.4rem;
}
.sub { font-size:.65rem; letter-spacing:.3rem; color:#00aaff; opacity:.35; margin-bottom:2.2rem }
.btn {
  padding:.7rem 2rem; font-size:.75rem; background:transparent;
  border:1px solid rgba(0,170,255,.5); color:#00aaff; cursor:pointer;
  font-family:inherit; letter-spacing:.18rem; text-transform:uppercase;
  transition:all .2s; margin:.3rem; display:block; width:270px; text-align:center;
}
.btn:hover { background:rgba(0,170,255,.09); border-color:rgba(0,170,255,.95) }
.note {
  margin-top:1rem; font-size:.58rem; color:#00aaff; opacity:.24;
  text-align:center; max-width:280px; line-height:2;
}

#hud {
  display:none; position:fixed; top:14px; left:14px;
  font-size:.58rem; letter-spacing:.08rem; color:#00aaff; opacity:.5;
  z-index:50; line-height:2.2; pointer-events:none; text-transform:uppercase;
}
#status {
  display:none; position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  font-size:.6rem; letter-spacing:.14rem; color:#00aaff; opacity:.4;
  z-index:50; pointer-events:none; text-transform:uppercase; white-space:nowrap;
}
#toast {
  position:fixed; bottom:56px; left:50%; transform:translateX(-50%);
  font-size:.6rem; color:#00aaff; opacity:0; z-index:50; pointer-events:none;
  letter-spacing:.12rem; text-transform:uppercase; white-space:nowrap;
  transition:opacity .3s;
}
#toast.show { opacity:.5 }
canvas { display:block; position:fixed; top:0; left:0 }
</style>
</head>
<body>

<div id="overlay">
  <div class="logo">◈ TESSERACT ◈</div>
  <div class="sub">HOLOGRAPHIC INTERFACE</div>
  <button class="btn" onclick="startAR()">⬡ AR Mode (Quest)</button>
  <button class="btn" onclick="startDemo()">⬡ Preview Mode</button>
  <p class="note">
    AR: Close your whole hand to grab<br>
    Open hand to release world-locked<br>
    Preview: click to spawn · drag to move
  </p>
</div>

<div id="hud">
  <div>SYS: <span style="color:#00ff88">ONLINE</span></div>
  <div id="h-state">STATE: IDLE</div>
  <div id="h-curl">CURL: —</div>
  <div id="h-surface">SURFACE: SCANNING</div>
</div>
<div id="status"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";

// ─── globals ────────────────────────────────────────────────
var scene, camera, renderer, clock, scanT = 0;
var reticleGroup;
var holoCube = null, cubeSpawned = false;
var grabbed = false, grabHand = null;
var xrSession = null, hitSrc = null, refSpace = null;
var handState = {
  left:  { wHist:[], curl:0, wasClosed:false, wasPinch:false },
  right: { wHist:[], curl:0, wasClosed:false, wasPinch:false }
};

// ─── helpers ────────────────────────────────────────────────
function holo(c, o) {
  o = (o === undefined) ? 1 : o;
  return new THREE.MeshBasicMaterial({
    color:c, transparent:o<1, opacity:o,
    side:THREE.DoubleSide, depthWrite:false
  });
}
function lmat(c, o) {
  o = (o === undefined) ? 1 : o;
  return new THREE.LineBasicMaterial({ color:c, transparent:o<1, opacity:o });
}
function setHUD(id, t) { var e=document.getElementById(id); if(e) e.textContent=t; }
function setStatus(t) { setHUD('status', t); }
function toast(msg, ms) {
  ms = ms || 2000;
  var e = document.getElementById('toast');
  e.textContent = msg; e.classList.add('show');
  setTimeout(function(){ e.classList.remove('show'); }, ms);
}

// ─── TESSERACT ───────────────────────────────────────────────
var KNUCKLES  = ['index-finger-metacarpal','middle-finger-metacarpal','ring-finger-metacarpal','pinky-metacarpal'];
var TIPS      = ['thumb-tip','index-finger-tip','middle-finger-tip','ring-finger-tip','pinky-finger-tip'];

function buildCube() {
  var g = new THREE.Group();
  var S = 0.11, h = S/2;

  // outer wireframe
  g.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(S,S,S)),
    lmat(0x22ccff, 0.92)));

  // inner counter-spinning wireframe
  var inn = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(S*.52,S*.52,S*.52)),
    lmat(0x88eeff, 0.65));
  inn.userData.inner = true; g.add(inn);

  // faint solid body
  g.add(new THREE.Mesh(new THREE.BoxGeometry(S,S,S), holo(0x002266, 0.05)));

  // glow layers
  var g3 = new THREE.Mesh(new THREE.SphereGeometry(S*.52,16,16), holo(0x0033aa, 0.07));
  g3.userData.g3 = true; g.add(g3);
  var g2 = new THREE.Mesh(new THREE.SphereGeometry(S*.30,14,14), holo(0x0099ff, 0.22));
  g2.userData.g2 = true; g.add(g2);
  var g1 = new THREE.Mesh(new THREE.SphereGeometry(S*.15,12,12), holo(0x55ddff, 0.65));
  g1.userData.g1 = true; g.add(g1);
  var cr = new THREE.Mesh(new THREE.SphereGeometry(S*.07,10,10), holo(0xeeffff, 1.0));
  cr.userData.core = true; g.add(cr);

  // corner dots
  var cx = [-h,h], cy = [-h,h], cz = [-h,h];
  for (var xi=0;xi<2;xi++) for (var yi=0;yi<2;yi++) for (var zi=0;zi<2;zi++) {
    var d = new THREE.Mesh(new THREE.SphereGeometry(.0055,6,6), holo(0x88eeff, 0.85));
    d.position.set(cx[xi], cy[yi], cz[zi]); g.add(d);
  }

  // energy tendrils center→corners
  var tc = [[-h,-h,-h],[h,h,h],[h,-h,-h],[-h,h,h]];
  for (var ti=0; ti<tc.length; ti++) {
    var pts = [new THREE.Vector3(0,0,0), new THREE.Vector3(tc[ti][0],tc[ti][1],tc[ti][2])];
    var tl = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lmat(0x44bbff, 0.28));
    tl.userData.tendril = true; g.add(tl);
  }

  // ground rings
  var r1 = new THREE.Mesh(new THREE.RingGeometry(S*.88,S*.96,40), holo(0x0088ff, 0.28));
  r1.rotation.x=-Math.PI/2; r1.userData.ring1=true; g.add(r1);
  var r2 = new THREE.Mesh(new THREE.RingGeometry(S*1.28,S*1.35,48), holo(0x0055ff, 0.12));
  r2.rotation.x=-Math.PI/2; r2.userData.ring2=true; g.add(r2);

  g.userData.sx = 0.008; g.userData.sy = 0.012; g.userData.sz = 0.005;
  g.userData.fp = Math.random()*Math.PI*2;
  return g;
}

function tickCube(isGrabbed) {
  if (!holoCube) return;
  var T = scanT, sp = isGrabbed ? 5.5 : 2.2;

  if (!isGrabbed) {
    holoCube.rotation.x += holoCube.userData.sx;
    holoCube.rotation.y += holoCube.userData.sy;
    holoCube.rotation.z += holoCube.userData.sz;
    holoCube.position.y += Math.sin(T*1.4 + holoCube.userData.fp) * 0.00035;
  }

  // smooth spin speed
  var tx = isGrabbed ? 0.001 : 0.008;
  var ty = isGrabbed ? 0.002 : 0.012;
  var tz = isGrabbed ? 0.0005: 0.005;
  holoCube.userData.sx += (tx - holoCube.userData.sx) * 0.06;
  holoCube.userData.sy += (ty - holoCube.userData.sy) * 0.06;
  holoCube.userData.sz += (tz - holoCube.userData.sz) * 0.06;

  holoCube.traverse(function(c) {
    if (c.userData.inner) { c.rotation.x -= 0.011; c.rotation.y += 0.008; }
    if (c.userData.core)
      c.material.opacity = (isGrabbed?.95:.70) + Math.sin(T*sp)*.05;
    if (c.userData.g1)
      c.material.opacity = (isGrabbed?.62:.25) + Math.sin(T*sp+1)*.08;
    if (c.userData.g2)
      c.material.opacity = (isGrabbed?.22:.12) + Math.sin(T*sp+2)*.05;
    if (c.userData.g3) {
      var s = (isGrabbed?1.35:1.0) + Math.sin(T*sp*.7)*.12;
      c.scale.set(s,s,s);
      c.material.opacity = (isGrabbed?.20:.06) + Math.sin(T*sp)*.03;
    }
    if (c.userData.ring1) {
      var s1=1+Math.sin(T*2)*.07; c.scale.set(s1,1,s1);
      c.material.opacity = isGrabbed?.58:(.26+Math.sin(T*2)*.08);
    }
    if (c.userData.ring2) {
      var s2=1+Math.sin(T*1.5+1)*.1; c.scale.set(s2,1,s2);
      c.material.opacity = isGrabbed?.22:(.11+Math.sin(T*1.8)*.04);
    }
    if (c.userData.tendril)
      c.material.opacity = (isGrabbed?.60:.22) + Math.sin(T*4)*.08;
  });
}

function spawnCube(pos) {
  if (holoCube) scene.remove(holoCube);
  holoCube = buildCube();
  holoCube.position.set(pos.x, pos.y+0.06, pos.z);
  scene.add(holoCube);
  cubeSpawned = true; grabbed = false;
  setHUD('h-state', 'STATE: ACTIVE');
  setStatus('CLOSE HAND TO GRAB');
  toast('TESSERACT SPAWNED — CLOSE HAND TO GRAB', 2200);
}

// ─── HAND TRACKING ──────────────────────────────────────────
function getJP(frame, joint) {
  try {
    var p = frame.getJointPose(joint, refSpace);
    if (!p) return null;
    return new THREE.Vector3(
      p.transform.position.x,
      p.transform.position.y,
      p.transform.position.z);
  } catch(e) { return null; }
}

function getPalm(frame, hand) {
  var total = new THREE.Vector3(), n = 0;
  for (var i=0; i<KNUCKLES.length; i++) {
    try {
      var j = hand.get(KNUCKLES[i]);
      var p = j ? getJP(frame,j) : null;
      if (p) { total.add(p); n++; }
    } catch(e) {}
  }
  try {
    var wj = hand.get('wrist');
    var wp = wj ? getJP(frame,wj) : null;
    if (wp) { total.add(wp); n++; }
  } catch(e) {}
  if (n===0) return null;
  return total.divideScalar(n);
}

function getCurl(frame, hand, palm) {
  if (!palm) return 0;
  var sum=0, n=0;
  for (var i=0; i<TIPS.length; i++) {
    try {
      var j = hand.get(TIPS[i]);
      var tp = j ? getJP(frame,j) : null;
      if (!tp) continue;
      // open ~0.10-0.14m, closed ~0.03-0.07m
      var score = 1 - Math.min(1, Math.max(0, (tp.distanceTo(palm)-0.035)/0.08));
      sum += score; n++;
    } catch(e) {}
  }
  return n===0 ? 0 : sum/n;
}

function processHands(frame) {
  if (!xrSession) return;
  for (var si=0; si<xrSession.inputSources.length; si++) {
    var src = xrSession.inputSources[si];
    if (!src.hand) continue;
    var side = src.handedness;
    var hs = handState[side]; if (!hs) continue;
    var hand = src.hand;

    var palm = getPalm(frame, hand);
    var curl = getCurl(frame, hand, palm);
    hs.curl = curl;

    if (side==='right') setHUD('h-curl', 'CURL: '+Math.round(curl*100)+'%');

    var closed = curl > 0.60;
    var wasClosed = hs.wasClosed;
    hs.wasClosed = closed;

    // CLOSE: grab or spawn
    if (closed && !wasClosed && palm) {
      if (cubeSpawned && holoCube && palm.distanceTo(holoCube.position) < 0.28) {
        grabbed=true; grabHand=side;
        setHUD('h-state','STATE: GRABBED');
        toast('TESSERACT IN HAND', 1200);
      } else if (!cubeSpawned) {
        spawnCube(palm);
      }
    }

    // OPEN: release
    if (!closed && wasClosed && grabbed && grabHand===side) {
      grabbed=false; grabHand=null;
      setHUD('h-state','STATE: RELEASED');
      setStatus('WORLD LOCKED — CLOSE HAND TO GRAB AGAIN');
      setTimeout(function(){ setHUD('h-state','STATE: ACTIVE'); }, 1200);
    }

    // FOLLOW palm while grabbed
    if (grabbed && grabHand===side && palm && holoCube) {
      holoCube.position.x += (palm.x - holoCube.position.x) * 0.5;
      holoCube.position.y += (palm.y+0.018 - holoCube.position.y) * 0.5;
      holoCube.position.z += (palm.z - holoCube.position.z) * 0.5;
    }

    // pinch = spawn fallback (if cube not yet placed)
    try {
      var ij=hand.get('index-finger-tip'), tj=hand.get('thumb-tip');
      var ip=ij?getJP(frame,ij):null, tp2=tj?getJP(frame,tj):null;
      if (ip&&tp2) {
        var pinch = ip.distanceTo(tp2)<0.032;
        var wasP = hs.wasPinch; hs.wasPinch=pinch;
        if (pinch&&!wasP&&!cubeSpawned&&palm) spawnCube(palm);
      }
    } catch(e) {}
  }
}

// ─── SCENE ──────────────────────────────────────────────────
function initScene(xrMode) {
  clock  = new THREE.Clock();
  scene  = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 100);

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.xr.enabled = (xrMode === true);   // KEY: only true in AR mode
  document.body.appendChild(renderer.domElement);

  // Reticle
  reticleGroup = new THREE.Group();
  var rO=new THREE.Mesh(new THREE.RingGeometry(.09,.106,40), holo(0x00aaff,.78));
  var rI=new THREE.Mesh(new THREE.RingGeometry(.013,.022,16), holo(0x00ffff,.72));
  var rP=new THREE.Mesh(new THREE.RingGeometry(.135,.14,44),  holo(0x0066ff,.20));
  rO.rotation.x=rI.rotation.x=rP.rotation.x=-Math.PI/2;
  reticleGroup.add(rO,rI,rP);
  var ticks=[[ .13,0,0],[-.13,0,0],[0,0, .13],[0,0,-.13]];
  for (var ti=0;ti<ticks.length;ti++) {
    var tk=new THREE.Mesh(new THREE.BoxGeometry(.016,.001,.002),holo(0x00aaff,.58));
    tk.position.set(ticks[ti][0],ticks[ti][1],ticks[ti][2]);
    reticleGroup.add(tk);
  }
  reticleGroup.visible=false;
  scene.add(reticleGroup);

  window.addEventListener('resize', function() {
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
}

// ─── AR MODE ────────────────────────────────────────────────
async function startAR() {
  if (!navigator.xr) { alert('WebXR not available'); return; }
  var ok = await navigator.xr.isSessionSupported('immersive-ar').catch(function(){ return false; });
  if (!ok) { alert('AR not supported — use Preview Mode'); return; }

  initScene(true);

  try {
    xrSession = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['hand-tracking','dom-overlay','local-floor'],
      domOverlay: { root: document.body }
    });
    renderer.xr.setSession(xrSession);

    var vSp = await xrSession.requestReferenceSpace('viewer');
    hitSrc   = await xrSession.requestHitTestSource({ space: vSp });
    refSpace = await xrSession.requestReferenceSpace('local');

    xrSession.addEventListener('select', function() {
      // tap = spawn cube at reticle / in front of camera
      if (!cubeSpawned) {
        if (reticleGroup.visible) {
          spawnCube(reticleGroup.position);
        } else {
          var d=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
          spawnCube(camera.position.clone().addScaledVector(d,.55));
        }
      }
    });
    xrSession.addEventListener('end', function(){ xrSession=null; hitSrc=null; });

    renderer.setAnimationLoop(arLoop);
    showUI('POINT AT SURFACE · TAP TO SPAWN · CLOSE HAND TO GRAB');
  } catch(e) { alert('AR Error: '+e.message); }
}

function arLoop(ts, frame) {
  if (!frame) return;
  var dt = clock.getDelta(); scanT += dt;

  if (hitSrc && refSpace && !cubeSpawned) {
    var hits = frame.getHitTestResults(hitSrc);
    if (hits.length > 0) {
      var pose = hits[0].getPose(refSpace);
      var pp=pose.transform.position, po=pose.transform.orientation;
      reticleGroup.position.set(pp.x, pp.y, pp.z);
      reticleGroup.quaternion.set(po.x, po.y, po.z, po.w);
      reticleGroup.visible=true;
      var rs=1+Math.sin(scanT*3)*.03;
      reticleGroup.scale.set(rs,1,rs);
      setHUD('h-surface','SURFACE: DETECTED ✓');
    } else {
      reticleGroup.visible=false;
      setHUD('h-surface','SURFACE: SCANNING...');
    }
  }

  processHands(frame);
  tickCube(grabbed);
  renderer.render(scene, camera);
}

// ─── DEMO MODE ──────────────────────────────────────────────
function startDemo() {
  initScene(false);   // xr.enabled stays FALSE → camera.position is writable
  camera.position.set(0, 1.4, 0.6);
  camera.lookAt(0, 1.1, -0.5);
  showUI('CLICK TO SPAWN · DRAG CUBE · SPACE = RESPAWN');

  var drag=false, pM={x:0,y:0}, camA={x:0,y:0};

  renderer.domElement.addEventListener('mousedown', function(e) {
    if (e.button!==0) return;
    drag=true; pM={x:e.clientX,y:e.clientY};
    if (holoCube && nearCube(e.clientX,e.clientY)) {
      grabbed=true; grabHand='mouse';
      setHUD('h-state','STATE: GRABBED');
    }
  });
  renderer.domElement.addEventListener('mousemove', function(e) {
    if (!drag) return;
    if (grabbed && grabHand==='mouse') {
      moveCubeTo(e.clientX,e.clientY);
    } else {
      camA.y += (e.clientX-pM.x)*.005;
      camA.x += (e.clientY-pM.y)*.004;
      camA.x = Math.max(-.45, Math.min(.45, camA.x));
      camera.position.x = Math.sin(camA.y)*.7;
      camera.position.y = 1.1+camA.x*.4;
      camera.lookAt(0,.9,-0.5);
    }
    pM={x:e.clientX,y:e.clientY};
  });
  renderer.domElement.addEventListener('mouseup', function() {
    if (grabbed&&grabHand==='mouse') {
      grabbed=false; grabHand=null;
      setHUD('h-state','STATE: RELEASED');
      setTimeout(function(){ if(cubeSpawned) setHUD('h-state','STATE: ACTIVE'); },1000);
    }
    drag=false;
  });
  renderer.domElement.addEventListener('click', function(e) {
    if (grabbed || nearCube(e.clientX,e.clientY)) return;
    var ray=castRay(e.clientX,e.clientY);
    // spawn on virtual floor or just in front of camera
    var t=(0.9-ray.origin.y)/ray.direction.y;
    if (t>0&&t<6) spawnCube(ray.origin.clone().addScaledVector(ray.direction,t));
    else {
      var d=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
      spawnCube(camera.position.clone().addScaledVector(d,.8));
    }
  });

  // touch drag
  var tStart=null;
  renderer.domElement.addEventListener('touchstart',function(e){
    var tx=e.touches[0].clientX,ty=e.touches[0].clientY;
    tStart={x:tx,y:ty};
    if (holoCube&&nearCube(tx,ty)){grabbed=true;grabHand='touch';}
  },{passive:true});
  renderer.domElement.addEventListener('touchmove',function(e){
    if (grabbed&&grabHand==='touch') moveCubeTo(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:true});
  renderer.domElement.addEventListener('touchend',function(e){
    if (grabbed&&grabHand==='touch'){grabbed=false;grabHand=null;} tStart=null;
  });

  window.addEventListener('keydown', function(e) {
    if (e.key===' ') {
      e.preventDefault();
      var d=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
      spawnCube(camera.position.clone().addScaledVector(d,.8));
    }
  });

  renderer.setAnimationLoop(function() {
    scanT += clock.getDelta();
    tickCube(grabbed);
    renderer.render(scene,camera);
  });
}

// ─── RAY / PICK ─────────────────────────────────────────────
function castRay(mx,my) {
  var ndc=new THREE.Vector2((mx/innerWidth)*2-1, -(my/innerHeight)*2+1);
  var rc=new THREE.Raycaster(); rc.setFromCamera(ndc,camera); return rc.ray;
}
var _sc=new THREE.Vector3();
function nearCube(mx,my) {
  if (!holoCube) return false;
  _sc.copy(holoCube.position).project(camera);
  var sx=((_sc.x+1)/2)*innerWidth, sy=((-_sc.y+1)/2)*innerHeight;
  return Math.hypot(mx-sx,my-sy)<70;
}
function moveCubeTo(mx,my) {
  if (!holoCube) return;
  var ray=castRay(mx,my);
  var d=camera.position.distanceTo(holoCube.position);
  var tgt=ray.origin.clone().addScaledVector(ray.direction,d);
  holoCube.position.x+=(tgt.x-holoCube.position.x)*.42;
  holoCube.position.y+=(tgt.y-holoCube.position.y)*.42;
  holoCube.position.z+=(tgt.z-holoCube.position.z)*.42;
}

// ─── SHOW UI ────────────────────────────────────────────────
function showUI(msg) {
  document.getElementById('overlay').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('status').style.display='block';
  setStatus(msg);
  toast('TESSERACT SYSTEM ONLINE');
}
</script>
</body>
</html>
