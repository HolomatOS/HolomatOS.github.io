<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Moto G - AR Receiver</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #info {
      position: absolute; left: 0; right: 0; top: 0;
      color: #9cf; font: 14px/1.4 system-ui, sans-serif;
      background: rgba(0,0,0,0.7); padding: 8px 12px; z-index: 3;
    }
    #hud {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
    }
    .reticle {
      position: absolute; left: 50%; top: 50%; width: 60px; height: 60px;
      border: 2px solid rgba(140,220,255,0.8); border-radius: 50%;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 12px rgba(140,220,255,0.6);
    }
    .tick { position: absolute; width: 2px; height: 18px; background: rgba(140,220,255,0.8); }
    .tick.t1 { left: 50%; top: calc(50% - 50px); transform: translateX(-50%); }
    .tick.t2 { left: 50%; top: calc(50% + 32px); transform: translateX(-50%); }
    .tick.t3 { top: 50%; left: calc(50% - 50px); transform: translateY(-50%); }
    .tick.t4 { top: 50%; left: calc(50% + 48px); transform: translateY(-50%); }
    #handCanvas {
      position: absolute; inset: 0; pointer-events: none; z-index: 1;
    }
    #connectPanel {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.95);
      padding: 30px;
      border-radius: 16px;
      z-index: 100;
      text-align: center;
      min-width: 300px;
    }
    #connectPanel h2 { color: #fff; margin: 0 0 10px; }
    #connectPanel p { color: #aaa; margin: 0 0 20px; font-size: 14px; }
    .modeBtn {
      display: block;
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 12px;
      color: white;
    }
    #handTrackingBtn { background: #4CAF50; }
    #skipHandBtn { background: #2196F3; }
    #connectionStatus { margin-top: 10px; color: #ff0; font-size: 13px; font-family: monospace; }
    #status {
      position: absolute;
      bottom: 10px; left: 10px;
      background: rgba(0,0,0,0.7);
      color: #0f0;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      z-index: 10;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="info">ðŸ“± Icon auto-spawns | Click icon â†’ Map opens | Vision Pro style</div>
  <div id="hud">
    <div class="reticle"></div>
    <div class="tick t1"></div><div class="tick t2"></div><div class="tick t3"></div><div class="tick t4"></div>
  </div>
  <canvas id="handCanvas"></canvas>

  <div id="connectPanel">
    <h2>ðŸ–ï¸ Choose Mode</h2>
    <p>Use hand tracking from Phone 2<br>or just tap & gaze</p>
    <button class="modeBtn" id="handTrackingBtn">ðŸ–ï¸ ENABLE HAND TRACKING</button>
    <button class="modeBtn" id="skipHandBtn">ðŸ‘† SKIP - TAP ONLY</button>
    <div id="connectionStatus"></div>
  </div>

  <div id="status">
    <div id="statusConnection">Mode: Not selected</div>
    <div id="statusHands">Hands: --</div>
    <div id="statusPinch">Action: --</div>
  </div>

  <!-- PeerJS for WebRTC -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { ARButton } from "https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js";

    let camera, scene, renderer;
    let reticle, controller;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    const panels = [];
    const raycaster = new THREE.Raycaster();
    let hoveredObject = null;  // Track what we're looking at
    let activePanel = null;

    // Hand data from Phone 2
    let handLandmarks = null;
    let lastPinch = false;
    let peer, connection;
    let handTrackingEnabled = false; // User choice

    // Two-hand resize tracking
    let lastTwoHandDistance = null;
    let isResizing = false;
    let initialPanelScale = 1.0;

    // Offset adjustment for camera position difference
    const HAND_OFFSET_X = 0;
    const HAND_OFFSET_Y = -200;
    const HAND_SCALE = 1.0;
    const ICON_FORWARD_DISTANCE = 1.0;
    const ICON_HEIGHT_ABOVE_GROUND = 1.3;
    let groundYEstimate = null;
    let handConnectTimeout = null;

    // Reuse vectors to reduce per-frame allocations on mobile AR.
    const tmpOrigin = new THREE.Vector3();
    const tmpDirection = new THREE.Vector3();
    const tmpCamPos = new THREE.Vector3();
    const tmpForward = new THREE.Vector3();
    const tmpReticlePos = new THREE.Vector3();

    // Canvas for hand overlay
    const handCanvas = document.getElementById('handCanvas');
    const handCtx = handCanvas.getContext('2d');
    handCanvas.width = window.innerWidth;
    handCanvas.height = window.innerHeight;

    init();
    setupConnection();
    animate();

    function setupConnection() {
      const myPeerId = 'moto-receiver-' + Math.random().toString(36).substr(2, 9);
      const handBtn = document.getElementById('handTrackingBtn');
      const statusEl = document.getElementById('connectionStatus');

      function showConnectError(message) {
        statusEl.textContent = message;
        statusEl.style.color = '#ff6b6b';
        handBtn.disabled = false;
        handBtn.textContent = 'RETRY HAND TRACKING';
      }

      // HAND TRACKING button
      handBtn.addEventListener('click', () => {
        handTrackingEnabled = true;
        statusEl.textContent = 'Initializing...';
        statusEl.style.color = '#ff0';
        handBtn.disabled = true;
        handBtn.textContent = 'Initializing...';

        if (peer && !peer.destroyed) {
          peer.destroy();
        }

        peer = new Peer(myPeerId);
        peer.on('open', (id) => {
          statusEl.innerHTML =
            `YOUR ID:<br><span style="color:#0ff;font-size:18px;">${id}</span><br><small>Enter on Phone 2</small>`;
          handBtn.textContent = 'Waiting for Phone 2...';

          if (handConnectTimeout) clearTimeout(handConnectTimeout);
          handConnectTimeout = setTimeout(() => {
            if (!connection || !connection.open) {
              showConnectError('No connection from Phone 2. Check peer ID and retry.');
            }
          }, 20000);
        });

        peer.on('connection', (conn) => {
          connection = conn;
          if (handConnectTimeout) clearTimeout(handConnectTimeout);
          document.getElementById('connectPanel').classList.add('hidden');
          document.getElementById('statusConnection').textContent = 'Hand Tracking: Connected';
          document.getElementById('statusConnection').style.color = '#0f0';

          conn.on('data', (data) => {
            if (data.type === 'hand') {
              handLandmarks = data.landmarks;
              updateHandDisplay(data.handCount || 0, data.twoHandDistance);
            }
          });

          conn.on('close', () => {
            document.getElementById('statusConnection').textContent = 'Hand Tracking: Disconnected';
            document.getElementById('statusConnection').style.color = '#f00';
            document.getElementById('statusHands').textContent = 'Hands: --';
            document.getElementById('statusPinch').textContent = 'Action: --';
            handLandmarks = null;
            lastPinch = false;
          });

          conn.on('error', () => {
            document.getElementById('statusConnection').textContent = 'Hand Tracking: Connection error';
            document.getElementById('statusConnection').style.color = '#f00';
          });
        });

        peer.on('error', (err) => {
          showConnectError(`Peer error: ${err.type || 'unknown'}`);
        });
      });

      // TAP ONLY button
      document.getElementById('skipHandBtn').addEventListener('click', () => {
        handTrackingEnabled = false;
        document.getElementById('connectPanel').classList.add('hidden');
        document.getElementById('statusConnection').textContent = 'Mode: Tap & Gaze Only';
        document.getElementById('statusConnection').style.color = '#4fc3f7';
        document.getElementById('statusHands').textContent = 'Hand Tracking: Off';
        document.getElementById('statusPinch').textContent = 'Tap screen to interact';
      });
    }
    // Spawn icon in AIR in front of camera (not on floor)
    function spawnIconInAir() {
      if (panels.length > 0) return; // Only spawn once
      if (groundYEstimate === null) return;
      const icon = makeMapIcon();

      // Place icon 1m in front of camera and 1m above detected ground.
      camera.getWorldDirection(tmpForward);
      tmpForward.y = 0;
      if (tmpForward.lengthSq() < 1e-6) {
        tmpForward.set(0, 0, -1);
      } else {
        tmpForward.normalize();
      }
      camera.getWorldPosition(tmpCamPos);

      icon.position.copy(tmpCamPos).addScaledVector(tmpForward, ICON_FORWARD_DISTANCE);
      icon.position.y = groundYEstimate + ICON_HEIGHT_ABOVE_GROUND;
      icon.lookAt(tmpCamPos); // Face toward user

      scene.add(icon);
      panels.push(icon);
    }
    function updateHandDisplay(handCount, twoHandDistance) {
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
      document.getElementById('statusHands').textContent = `Hands: ${handCount}`;

      if (!handLandmarks || handCount === 0) {
        document.getElementById('statusPinch').textContent = 'Pinch: No hands';
        lastPinch = false;
        isResizing = false;
        lastTwoHandDistance = null;
        return;
      }

      if (handCount === 2 && twoHandDistance) {
        handleTwoHandResize(twoHandDistance);
        return;
      }

      if (handCount === 1) {
        handleSingleHandPinch();
      }
    }

    function handleTwoHandResize(currentDistance) {
      document.getElementById('statusPinch').textContent = `Resize: ${Math.round(currentDistance)}px`;

      if (!isResizing && activePanel) {
        isResizing = true;
        lastTwoHandDistance = currentDistance;
        initialPanelScale = activePanel.scale.x;
        return;
      }

      if (isResizing && activePanel && lastTwoHandDistance) {
        const scaleChange = currentDistance / lastTwoHandDistance;
        const newScale = initialPanelScale * scaleChange;
        const clampedScale = Math.max(0.5, Math.min(3.0, newScale));
        activePanel.scale.setScalar(clampedScale);
        document.getElementById('statusPinch').textContent = `Scale: ${clampedScale.toFixed(2)}x`;
      }

      if (!activePanel) {
        isResizing = false;
        lastTwoHandDistance = null;
      }
    }

    function handleSingleHandPinch() {
      // Stop any resize mode
      if (isResizing) {
        isResizing = false;
        lastTwoHandDistance = null;
      }

      // Get first hand only
      const landmarks = Array.isArray(handLandmarks[0]) ? handLandmarks[0] : handLandmarks;

      // Apply offset to compensate for camera position difference
      const thumb = landmarks[4];
      const index = landmarks[8];
      
      const thumbX = (thumb.x * handCanvas.width) + HAND_OFFSET_X;
      const thumbY = (thumb.y * handCanvas.height) + HAND_OFFSET_Y;
      const indexX = (index.x * handCanvas.width) + HAND_OFFSET_X;
      const indexY = (index.y * handCanvas.height) + HAND_OFFSET_Y;
      
      const dx = thumbX - indexX;
      const dy = thumbY - indexY;
      const distance = Math.sqrt(dx*dx + dy*dy);
      
      const isPinching = distance < 50;
      
      document.getElementById('statusPinch').textContent = `Pinch: ${isPinching ? 'YES âœ“' : `No (${Math.round(distance)}px)`}`;
      
      // PINCH START - Grab panel or spawn if no panel
      if (isPinching && !lastPinch) {
        // Check if clicking icon
        const hitIcon = getIconUnderGaze();
        if (hitIcon) {
          openMapPanel(hitIcon);
          return;
        }

        const hitPanel = getPanelUnderGaze();
        if (hitPanel) {
          // Grab existing panel
          activePanel = hitPanel;
          activePanel.userData.selected = true;
          activePanel.scale.setScalar(activePanel.scale.x * 1.08);
          initialPanelScale = activePanel.scale.x;
        } else if (reticle.visible) {
          // Spawn icon (not clock)
          spawnMapIcon();
        }
      }
      
      // PINCH RELEASE - Drop panel
      if (!isPinching && lastPinch) {
        if (activePanel) {
          activePanel.userData.selected = false;
          // Keep current scale, don't reset
          activePanel = null;
        }
      }
      
      lastPinch = isPinching;
    }

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      const geometry = new THREE.RingGeometry(0.06, 0.075, 32).rotateX(-Math.PI / 2);
      const material = new THREE.MeshBasicMaterial({ color: 0x8cdcff });
      reticle = new THREE.Mesh(geometry, material);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      controller = renderer.xr.getController(0);
      controller.addEventListener("select", onSelect);
      scene.add(controller);

      renderer.domElement.addEventListener("click", onCanvasClick);

      document.body.appendChild(ARButton.createButton(renderer, {
        requiredFeatures: ["hit-test"],
        optionalFeatures: ["dom-overlay"],
        domOverlay: { root: document.body }
      }));

      window.addEventListener("resize", onWindowResize);
    }

    function onSelect() {
      const hitPanel = getPanelUnderGaze();

      if (activePanel) {
        activePanel.userData.selected = false;

        activePanel = null;
        return;
      }

      if (hitPanel) {
        activePanel = hitPanel;
        activePanel.userData.selected = true;
        activePanel.scale.setScalar(1.08);
        return;
      }
    }

    function onCanvasClick() {
      // Check if clicking on icon
      const hitIcon = getIconUnderGaze();
      if (hitIcon) {
        openMapPanel(hitIcon);
        return;
      }

      // Otherwise spawn icon
      if (reticle.visible) {
        spawnMapIcon();
      }
    }

    function getPanelUnderGaze() {
      if (panels.length === 0) return null;

      camera.getWorldPosition(tmpOrigin);
      camera.getWorldDirection(tmpDirection);
      raycaster.set(tmpOrigin, tmpDirection);

      const hits = raycaster.intersectObjects(panels, true);
      if (!hits.length) return null;

      let candidate = hits[0].object;
      while (candidate && !candidate.userData.isPanel) {
        candidate = candidate.parent;
      }
      return candidate;
    }

    function getIconUnderGaze() {
      if (panels.length === 0) return null;

      camera.getWorldPosition(tmpOrigin);
      camera.getWorldDirection(tmpDirection);
      raycaster.set(tmpOrigin, tmpDirection);

      const allIcons = [];
      panels.forEach(panel => {
        if (panel.userData.isIcon) {
          allIcons.push(panel);
        }
      });

      const hits = raycaster.intersectObjects(allIcons, true);
      return hits.length > 0 ? hits[0].object.parent || hits[0].object : null;
    }

    function spawnMapIcon() {
      const icon = makeMapIcon();
      icon.position.setFromMatrixPosition(reticle.matrix);
      icon.quaternion.setFromRotationMatrix(reticle.matrix);
      scene.add(icon);
      panels.push(icon);
    }

    function makeMapIcon() {
      const group = new THREE.Group();

      // Render icon.png exactly as-is (no shape clipping or overlay).
      const textureLoader = new THREE.TextureLoader();
      textureLoader.load(
        'icon.png',
        (texture) => {
          texture.colorSpace = THREE.SRGBColorSpace;
          const imgW = texture.image.width || 1;
          const imgH = texture.image.height || 1;
          const aspect = imgW / imgH;
          const height = 0.15;
          const width = height * aspect;

          const iconMat = new THREE.MeshBasicMaterial({ 
            map: texture, 
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide
          });
          const iconMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(width, height),
            iconMat
          );
          group.add(iconMesh);
        },
        undefined,
        (error) => {
          console.error('Error loading icon.png:', error);
          const fallbackMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
          const fallbackMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.16), fallbackMat);
          group.add(fallbackMesh);
        }
      );

      group.userData.isIcon = true;
      group.userData.isPanel = false;
      group.userData.hoverTime = 0;
      group.scale.setScalar(1);

      return group;
    }

    function openMapPanel(icon) {
      // Check if map already open for this icon
      if (icon.userData.mapPanel) return;

      const mapPanel = makeMapPanel();
      
      // Position map panel ON TOP of the icon (same position)
      mapPanel.position.copy(icon.position);
      mapPanel.quaternion.copy(icon.quaternion);
      
      // Slight offset forward so it's in front
      const offset = new THREE.Vector3(0, 0, 0.01);
      offset.applyQuaternion(icon.quaternion);
      mapPanel.position.add(offset);
      
      scene.add(mapPanel);
      panels.push(mapPanel);
      
      // Hide icon when map opens
      icon.visible = false;
      
      // Link map to icon
      icon.userData.mapPanel = mapPanel;
      mapPanel.userData.iconRef = icon;
    }

    function makeRoundedRectShape(width, height, radius) {
      const shape = new THREE.Shape();
      const w = width;
      const h = height;
      const r = Math.min(radius, w * 0.5, h * 0.5);
      shape.moveTo(-w / 2 + r, -h / 2);
      shape.lineTo(w / 2 - r, -h / 2);
      shape.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
      shape.lineTo(w / 2, h / 2 - r);
      shape.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
      shape.lineTo(-w / 2 + r, h / 2);
      shape.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
      shape.lineTo(-w / 2, -h / 2 + r);
      shape.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
      return shape;
    }

    function makeMapPanel() {
      const group = new THREE.Group();

      // Vision Pro inspired layered rounded glass shell.
      const panelW = 1.2;
      const panelH = 1.0;
      const cornerR = 0.1;
      const panelShape = makeRoundedRectShape(panelW, panelH, cornerR);
      const panelGeom = new THREE.ShapeGeometry(panelShape, 24);

      const panelMat = new THREE.MeshPhysicalMaterial({
        color: 0x5e7281,
        transparent: true,
        opacity: 0.93,
        transmission: 0.22,
        roughness: 0.16,
        metalness: 0.08,
        clearcoat: 1.0,
        clearcoatRoughness: 0.12,
        reflectivity: 0.5,
        ior: 1.5,
        thickness: 0.75,
        side: THREE.DoubleSide
      });
      const panel = new THREE.Mesh(panelGeom, panelMat);
      group.add(panel);

      // Soft top highlight.
      const gradientCanvas = document.createElement('canvas');
      gradientCanvas.width = 512;
      gradientCanvas.height = 512;
      const gradCtx = gradientCanvas.getContext('2d');
      const gradient = gradCtx.createLinearGradient(0, 0, 0, 512);
      gradient.addColorStop(0, 'rgba(255,255,255,0.32)');
      gradient.addColorStop(0.45, 'rgba(180,205,220,0.12)');
      gradient.addColorStop(1, 'rgba(120,145,165,0.05)');
      gradCtx.fillStyle = gradient;
      gradCtx.fillRect(0, 0, 512, 512);
      
      const gradTexture = new THREE.CanvasTexture(gradientCanvas);
      const gradMat = new THREE.MeshBasicMaterial({ 
        map: gradTexture, 
        transparent: true,
        opacity: 0.72
      });
      const gradMesh = new THREE.Mesh(new THREE.ShapeGeometry(panelShape, 24), gradMat);
      gradMesh.position.z = 0.001;
      group.add(gradMesh);

      // Inner edge line.
      const borderGeom = new THREE.EdgesGeometry(new THREE.ShapeGeometry(panelShape, 24));
      const borderMat = new THREE.LineBasicMaterial({ 
        color: 0xd7e6f0,
        transparent: true, 
        opacity: 0.42
      });
      const border = new THREE.LineSegments(borderGeom, borderMat);
      group.add(border);

      // Subtle glass shadow for depth.
      const shadowMat = new THREE.MeshBasicMaterial({
        color: 0x000000,
        transparent: true,
        opacity: 0.12,
        depthWrite: false
      });
      const shadowMesh = new THREE.Mesh(new THREE.ShapeGeometry(panelShape, 24), shadowMat);
      shadowMesh.position.set(0.012, -0.015, -0.0015);
      group.add(shadowMesh);

      // Map canvas
      const mapCanvas = document.createElement('canvas');
      mapCanvas.width = 1024;
      mapCanvas.height = 768;
      const mapCtx = mapCanvas.getContext('2d');
      
      // Loading screen
      mapCtx.fillStyle = '#556670';
      mapCtx.fillRect(0, 0, 1024, 768);
      mapCtx.fillStyle = '#ffffff';
      mapCtx.font = 'bold 32px system-ui';
      mapCtx.textAlign = 'center';
      mapCtx.fillText('Loading OpenStreetMap...', 512, 384);
      
      const mapTexture = new THREE.CanvasTexture(mapCanvas);
      mapTexture.minFilter = THREE.LinearFilter;
      mapTexture.magFilter = THREE.LinearFilter;
      
      const mapMat = new THREE.MeshBasicMaterial({ 
        map: mapTexture,
        transparent: false
      });
      const mapDisplay = new THREE.Mesh(
        new THREE.ShapeGeometry(makeRoundedRectShape(1.13, 0.92, 0.07), 20),
        mapMat
      );
      mapDisplay.position.z = 0.002;
      group.add(mapDisplay);

      // Title
      const titleCanvas = document.createElement('canvas');
      titleCanvas.width = 512;
      titleCanvas.height = 64;
      const titleCtx = titleCanvas.getContext('2d');
      titleCtx.fillStyle = '#ffffff';
      titleCtx.font = 'bold 28px system-ui';
      titleCtx.textAlign = 'center';
      titleCtx.fillText('ðŸ—ºï¸ OpenStreetMap', 256, 40);
      
      const titleTexture = new THREE.CanvasTexture(titleCanvas);
      const titleMat = new THREE.MeshBasicMaterial({ map: titleTexture, transparent: true });
      const titleMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.08), titleMat);
      titleMesh.position.set(0, 0.46, 0.003);
      group.add(titleMesh);

      group.userData.isPanel = true;
      group.userData.isMapPanel = true;
      group.userData.mapCanvas = mapCanvas;
      group.userData.mapCtx = mapCtx;
      group.userData.mapTexture = mapTexture;
      group.userData.glassShell = panel;
      group.userData.innerBorder = border;
      group.userData.shadowMesh = shadowMesh;

      // Add hover glow border
      const hoverGlowGeom = new THREE.EdgesGeometry(new THREE.ShapeGeometry(panelShape, 24));
      const hoverGlowMat = new THREE.LineBasicMaterial({ 
        color: 0xe9f6ff,
        transparent: true, 
        opacity: 0,
        linewidth: 3
      });
      const hoverGlow = new THREE.LineSegments(hoverGlowGeom, hoverGlowMat);
      hoverGlow.position.z = 0.005;
      group.add(hoverGlow);
      
      group.userData.hoverGlow = hoverGlow;
      group.userData.hoverTime = 0;

      // Load actual map
      loadMapTiles(mapCtx, mapTexture, 40.7608, -111.8910, 13);

      return group;
    }

    function loadMapTiles(ctx, texture, lat, lon, zoom) {
      const n = Math.pow(2, zoom);
      const xtile = Math.floor((lon + 180) / 360 * n);
      const ytile = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n);
      
      // Load 3x3 grid
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          const x = xtile + dx;
          const y = ytile + dy;
          const url = `https://tile.openstreetmap.org/${zoom}/${x}/${y}.png`;
          
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = function() {
            const offsetX = (dx + 1) * 256 + 128;
            const offsetY = (dy + 1) * 256 + 128;
            ctx.drawImage(img, offsetX, offsetY, 256, 256);
            
            // Add marker
            ctx.fillStyle = '#EA4335';
            ctx.beginPath();
            ctx.arc(512, 384, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(512, 384, 6, 0, Math.PI * 2);
            ctx.fill();
            
            // Location text
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 24px system-ui';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.strokeText('Salt Lake City, UT', 512, 50);
            ctx.fillText('Salt Lake City, UT', 512, 50);

            // OSM attribution (required by tile usage policy).
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(685, 730, 330, 30);
            ctx.fillStyle = '#ffffff';
            ctx.font = '18px system-ui';
            ctx.textAlign = 'right';
            ctx.fillText('(c) OpenStreetMap contributors', 1000, 751);
            
            texture.needsUpdate = true;
          };
          img.onerror = function() {
            console.error('Failed to load tile:', url);
          };
          img.src = url;
        }
      }
    }

    function createVisionProGlass() {
      return new THREE.MeshPhysicalMaterial({
        color: 0x556670,  // Exact Vision Pro blue-gray from image
        transparent: true,
        opacity: 0.92,  // Mostly opaque like in image
        transmission: 0.15,  // Slight transparency
        roughness: 0.25,
        metalness: 0.05,
        clearcoat: 0.6,
        clearcoatRoughness: 0.15,
        reflectivity: 0.4,
        ior: 1.45,
        thickness: 0.5,
        side: THREE.DoubleSide
      });
    }

    function makeClockPanel() {
      const group = new THREE.Group();

      // Main panel with Vision Pro blue-gray color
      const panelGeom = new THREE.PlaneGeometry(1.0, 0.4);
      const panelMat = createVisionProGlass();
      const panel = new THREE.Mesh(panelGeom, panelMat);
      group.add(panel);

      // Subtle gradient overlay (darker at top, lighter at bottom)
      const gradientCanvas = document.createElement('canvas');
      gradientCanvas.width = 512;
      gradientCanvas.height = 512;
      const gradCtx = gradientCanvas.getContext('2d');
      const gradient = gradCtx.createLinearGradient(0, 0, 0, 512);
      gradient.addColorStop(0, 'rgba(85, 102, 112, 0.3)');  // Top darker
      gradient.addColorStop(1, 'rgba(90, 107, 118, 0.1)');  // Bottom lighter
      gradCtx.fillStyle = gradient;
      gradCtx.fillRect(0, 0, 512, 512);
      
      const gradTexture = new THREE.CanvasTexture(gradientCanvas);
      const gradMat = new THREE.MeshBasicMaterial({ 
        map: gradTexture, 
        transparent: true,
        opacity: 0.5
      });
      const gradMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.4), gradMat);
      gradMesh.position.z = 0.001;
      group.add(gradMesh);

      // Subtle border (lighter gray)
      const borderGeom = new THREE.EdgesGeometry(panelGeom);
      const borderMat = new THREE.LineBasicMaterial({ 
        color: 0x9a9b9d,  // Light gray border
        transparent: true, 
        opacity: 0.3
      });
      const border = new THREE.LineSegments(borderGeom, borderMat);
      group.add(border);

      const clockCanvas = document.createElement('canvas');
      clockCanvas.width = 512;
      clockCanvas.height = 128;
      const clockCtx = clockCanvas.getContext('2d');
      const clockTexture = new THREE.CanvasTexture(clockCanvas);
      clockTexture.minFilter = THREE.LinearFilter;
      clockTexture.magFilter = THREE.LinearFilter;

      const clockMat = new THREE.MeshBasicMaterial({ map: clockTexture, transparent: true });
      const clockMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.35), clockMat);
      clockMesh.position.z = 0.002;
      group.add(clockMesh);

      group.userData.isPanel = true;
      group.userData.selected = false;
      group.userData.clockCtx = clockCtx;
      group.userData.clockTexture = clockTexture;
      group.scale.setScalar(1);

      updateClock(group);

      return group;
    }

    function updateClock(panel) {
      if (!panel.userData.clockCtx) return;

      const now = new Date();
      const timeString = now.toLocaleTimeString('en-US', { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit',
        hour12: true 
      });
      const dateString = now.toLocaleDateString('en-US', { 
        weekday: 'short', 
        month: 'short', 
        day: 'numeric' 
      });

      const ctx = panel.userData.clockCtx;
      const tex = panel.userData.clockTexture;

      ctx.clearRect(0, 0, 512, 128);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 56px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(timeString, 256, 55);

      ctx.font = '24px system-ui';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.fillText(dateString, 256, 100);

      tex.needsUpdate = true;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      handCanvas.width = window.innerWidth;
      handCanvas.height = window.innerHeight;
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace("viewer").then((space) => {
            session.requestHitTestSource({ space }).then((source) => {
              hitTestSource = source;
            });
          });

          session.addEventListener("end", () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });

          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
            tmpReticlePos.setFromMatrixPosition(reticle.matrix);
            groundYEstimate = tmpReticlePos.y;
          } else {
            reticle.visible = false;
          }
          
          // Spawn icon in the air in front of camera (only once after AR starts)
          spawnIconInAir();
        }
      }

      if (activePanel && reticle.visible) {
        activePanel.position.setFromMatrixPosition(reticle.matrix);
        activePanel.quaternion.setFromRotationMatrix(reticle.matrix);
      }

      panels.forEach(panel => {
        if (panel.userData.clockCtx) {
          updateClock(panel);
        }
        
        // Update hover effects
        updateHoverEffect(panel);
      });

      // Check what we're looking at
      detectHover();

      renderer.render(scene, camera);
    }

    function detectHover() {
      camera.getWorldPosition(tmpOrigin);
      camera.getWorldDirection(tmpDirection);
      raycaster.set(tmpOrigin, tmpDirection);

      const hits = raycaster.intersectObjects(panels, true);
      
      if (hits.length > 0) {
        let target = hits[0].object;
        // Find parent panel or icon
        while (target && !target.userData.isIcon && !target.userData.isMapPanel) {
          target = target.parent;
        }
        
        if (target && (target.userData.isIcon || target.userData.isMapPanel)) {
          if (hoveredObject !== target) {
            // Unhover previous
            if (hoveredObject) {
              hoveredObject.userData.hoverTime = 0;
            }
            // Hover new
            hoveredObject = target;
          }
        } else {
          if (hoveredObject) {
            hoveredObject.userData.hoverTime = 0;
            hoveredObject = null;
          }
        }
      } else {
        if (hoveredObject) {
          hoveredObject.userData.hoverTime = 0;
          hoveredObject = null;
        }
      }
    }

    function updateHoverEffect(object) {
      if (!object.userData) return;
      
      const isHovered = (hoveredObject === object);
      
      // Smooth hover ramp similar to Vision Pro focus transitions.
      if (isHovered) {
        object.userData.hoverTime = Math.min(object.userData.hoverTime + 0.045, 1);
      } else {
        object.userData.hoverTime = Math.max(object.userData.hoverTime - 0.055, 0);
      }
      
      const hoverAmount = object.userData.hoverTime;

      if (object.userData.isIcon) {
        object.scale.setScalar(1 + hoverAmount * 0.04);
      }
      
      // Icon hover: brighter ring + slight scale up.
      if (object.userData.hoverRing) {
        const ring = object.userData.hoverRing;
        const pulse = Math.sin(Date.now() * 0.0045) * 0.18 + 0.82;
        ring.material.opacity = hoverAmount * pulse * 0.9;
        ring.scale.setScalar(1 + hoverAmount * 0.12);
        object.scale.setScalar(1 + hoverAmount * 0.06);
      }
      
      // Panel hover: edge light + subtle shell refinement.
      if (object.userData.hoverGlow) {
        const glow = object.userData.hoverGlow;
        const sweep = Math.sin(Date.now() * 0.0035) * 0.25 + 0.75;
        glow.material.opacity = hoverAmount * sweep * 0.75;
      }

      if (object.userData.glassShell) {
        object.userData.glassShell.material.clearcoat = 1.0 - (0.15 * (1 - hoverAmount));
        object.userData.glassShell.material.transmission = 0.18 + (hoverAmount * 0.08);
      }

      if (object.userData.innerBorder) {
        object.userData.innerBorder.material.opacity = 0.35 + (hoverAmount * 0.35);
      }

      if (object.userData.shadowMesh) {
        object.userData.shadowMesh.material.opacity = 0.08 + (hoverAmount * 0.08);
      }
    }
  </script>
