<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JARVIS AR Interface - Full Experience</title>
    <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
            overflow: hidden;
        }

        /* Menu Screen */
        .menu-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            padding: 20px;
        }

        .menu-screen.hidden {
            display: none;
        }

        .menu-title {
            color: #00d9ff;
            font-size: 32px;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 300px;
            width: 100%;
        }

        .menu-btn {
            padding: 15px;
            background: rgba(0, 217, 255, 0.1);
            border: 2px solid #00d9ff;
            color: #00d9ff;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background: rgba(0, 217, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
            transform: scale(1.05);
        }

        /* AR Container */
        .ar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            z-index: 100;
            background: #000;
        }

        .ar-container.active {
            display: block;
        }

        #ar-camera {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #hand-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* AR UI Layer */
        .ar-ui {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .ar-icons-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .ar-icon {
            position: absolute;
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid #00d9ff;
            background: rgba(0, 217, 255, 0.15);
            border-radius: 10px;
            font-size: 40px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s ease;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
            user-select: none;
            transform-style: preserve-3d;
        }

        .ar-icon:hover {
            box-shadow: 0 0 35px rgba(0, 217, 255, 0.7);
            transform: scale(1.15);
            background: rgba(0, 217, 255, 0.25);
        }

        .ar-icon.pinch-active {
            box-shadow: 0 0 50px rgba(0, 217, 255, 1);
            background: rgba(0, 217, 255, 0.4);
            transform: scale(1.25);
            border-color: #0f0;
        }

        .ar-icon-label {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            color: #00d9ff;
            font-size: 10px;
            letter-spacing: 1px;
            white-space: nowrap;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* AR Status */
        .ar-status {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 20, 40, 0.95);
            border: 1px solid #00d9ff;
            color: #00d9ff;
            padding: 15px 20px;
            border-radius: 5px;
            font-size: 11px;
            letter-spacing: 1px;
            max-width: 280px;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
            z-index: 200;
        }

        .status-item {
            margin: 5px 0;
        }

        .status-item.active {
            color: #0f0;
        }

        /* Hand Indicator */
        .hand-detector {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 20, 40, 0.95);
            border: 2px solid #666;
            color: #00d9ff;
            padding: 15px 20px;
            border-radius: 5px;
            font-size: 12px;
            letter-spacing: 1px;
            text-align: center;
            min-width: 150px;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
            z-index: 200;
            transition: all 0.3s ease;
        }

        .hand-detector.active {
            border-color: #0f0;
            color: #0f0;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }

        .pinch-feedback {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #0f0;
            font-size: 14px;
            letter-spacing: 2px;
            animation: pulseGlow 0.5s ease-out;
            z-index: 200;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) scale(1.5);
            }
        }

        /* AR Controls */
        .ar-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 200;
            pointer-events: auto;
        }

        .control-btn {
            padding: 12px 25px;
            background: rgba(0, 217, 255, 0.15);
            border: 2px solid #00d9ff;
            color: #00d9ff;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(0, 217, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
            transform: scale(1.05);
        }

        .control-btn.exit {
            border-color: #ff3333;
            color: #ff3333;
        }

        .control-btn.exit:hover {
            background: rgba(255, 51, 51, 0.2);
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.5);
        }

        /* Menu Screen Styles */
        .menu-container {
            text-align: center;
        }

        .menu-status {
            color: #0f0;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .menu-instructions {
            color: #00d9ff;
            font-size: 12px;
            letter-spacing: 1px;
            margin-top: 30px;
            max-width: 350px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <!-- Menu Screen -->
    <div class="menu-screen" id="menuScreen">
        <div class="menu-container">
            <div class="menu-title">🤖 JARVIS AR</div>
            <div class="menu-status">ARCore Ready</div>
            
            <div class="menu-options">
                <button class="menu-btn" onclick="startAR()">START AR EXPERIENCE</button>
                <button class="menu-btn" onclick="testOnly()">TEST WEBXR ONLY</button>
                <button class="menu-btn" onclick="showInfo()">SYSTEM INFO</button>
            </div>

            <div class="menu-instructions">
                <strong>🎯 AR CONTROLS</strong><br>
                ▸ Tap screen to place icons<br>
                ▸ Pinch gesture to click icons<br>
                ▸ Hand tracking enabled<br>
                ▸ World-locked positioning
            </div>
        </div>
    </div>

    <!-- AR Experience -->
    <div class="ar-container" id="arContainer">
        <!-- Camera Feed -->
        <video id="ar-camera" playsinline muted></video>
        <canvas id="hand-canvas"></canvas>

        <!-- AR UI Overlay -->
        <div class="ar-ui">
            <!-- Status Panel -->
            <div class="ar-status" id="statusPanel">
                <div class="status-item">🔍 WEBXR: <span id="webxrStatus">INITIALIZING</span></div>
                <div class="status-item">📍 TRACKING: <span id="trackingStatus">STARTING</span></div>
                <div class="status-item">🎯 ICONS: <span id="iconStatus">LOADING</span></div>
            </div>

            <!-- Hand Detector -->
            <div class="hand-detector" id="handDetector">
                👆 Hands: Detecting<br>
                <span id="handStatus">No hands</span>
            </div>

            <!-- Icons Container -->
            <div class="ar-icons-container" id="iconsContainer"></div>

            <!-- Controls -->
            <div class="ar-controls">
                <button class="control-btn" onclick="resetIcons()">RESET ICONS</button>
                <button class="control-btn exit" onclick="exitAR()">EXIT AR</button>
            </div>
        </div>
    </div>

    <script>
        // ============= AR APP CONFIGURATION =============
        const AR_APPS = [
            { id: 'ai', icon: '🤖', label: 'AI Assistant', url: 'ai.html' },
            { id: 'gmail', icon: '✉️', label: 'Gmail', url: 'https://gmail.com' },
            { id: 'store', icon: '🎮', label: 'Play Store', url: 'https://play.google.com' },
            { id: 'music', icon: '🎵', label: 'Music', url: 'https://music.google.com' }
        ];

        // ============= GLOBAL STATE =============
        let xrSession = null;
        let xrRefSpace = null;
        let handPoseDetector = null;
        let videoStream = null;
        let lastPinchTime = {};
        let iconPositions = {};
        let iconsPlaced = false;

        // ============= INITIALIZATION =============
        async function initializeSystem() {
            console.log('🤖 JARVIS AR System Initializing...');
            
            // Check WebXR Support
            const hasWebXR = 'xr' in navigator;
            document.getElementById('webxrStatus').textContent = hasWebXR ? '✅ READY' : '❌ NOT AVAILABLE';
            
            if (!hasWebXR) {
                alert('WebXR not supported. Please use Chrome on Android with ARCore.');
                return false;
            }

            // Check AR Support
            try {
                const arSupported = await navigator.xr.isSessionSupported('immersive-ar');
                if (!arSupported) {
                    alert('AR mode not supported. ARCore may not be available.');
                    return false;
                }
            } catch (err) {
                console.error('AR support check failed:', err);
                return false;
            }

            return true;
        }

        // ============= START AR EXPERIENCE =============
        async function startAR() {
            try {
                document.getElementById('menuScreen').classList.add('hidden');
                document.getElementById('arContainer').classList.add('active');

                // Request camera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                
                const video = document.getElementById('ar-camera');
                video.srcObject = stream;
                videoStream = stream;

                // Wait for video to load
                await new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });

                // Initialize hand tracking
                await initializeHandTracking();

                // Setup WebXR Session
                await setupXRSession();

                // Place icons in room
                placeIcons();

                // Start main loop
                startARLoop();

            } catch (err) {
                console.error('AR Start Error:', err);
                alert('Error starting AR: ' + err.message);
                exitAR();
            }
        }

        // ============= SETUP WebXR SESSION =============
        async function setupXRSession() {
            try {
                xrSession = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['local', 'hit-test'],
                    optionalFeatures: ['dom-overlay', 'hand-tracking'],
                    domOverlay: { root: document.getElementById('arContainer') }
                });

                xrRefSpace = await xrSession.requestReferenceSpace('local');
                document.getElementById('webxrStatus').textContent = '✅ ACTIVE';
                document.getElementById('trackingStatus').textContent = '✅ TRACKING';

                // Handle session end
                xrSession.addEventListener('end', () => {
                    console.log('XR Session ended');
                    exitAR();
                });

            } catch (err) {
                console.error('XR Session Error:', err);
                document.getElementById('webxrStatus').textContent = '❌ FAILED';
                throw err;
            }
        }

        // ============= HAND TRACKING SETUP =============
        async function initializeHandTracking() {
            try {
                // Load MediaPipe if available
                if (typeof window.HandLandmarker === 'undefined') {
                    console.log('Loading MediaPipe Hand Landmarks...');
                    // For now, we'll use fallback hand detection
                }

                startHandDetectionLoop();
                document.getElementById('handDetector').classList.add('active');

            } catch (err) {
                console.error('Hand tracking initialization:', err);
                // Continue without hand tracking
            }
        }

        // ============= HAND DETECTION LOOP =============
        async function startHandDetectionLoop() {
            const canvas = document.getElementById('hand-canvas');
            const ctx = canvas.getContext('2d');
            const video = document.getElementById('ar-camera');

            canvas.width = video.videoWidth || 480;
            canvas.height = video.videoHeight || 640;

            function detectHands() {
                if (!videoStream) return;

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Simulate hand detection with simple finger tracking
                // In production, use MediaPipe or similar
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;

                // Simple skin color detection (basic hand detection)
                let handDetected = false;
                let skinPixels = 0;

                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    // Simple skin tone detection
                    if (r > 95 && g > 40 && b > 20 && r > g && r > b) {
                        skinPixels++;
                        handDetected = skinPixels > 100;
                    }
                }

                // Update hand status
                const handStatus = document.getElementById('handStatus');
                const detector = document.getElementById('handDetector');
                
                if (handDetected) {
                    handStatus.textContent = '✅ Detected';
                    detector.classList.add('active');
                } else {
                    handStatus.textContent = '❌ No hands';
                    detector.classList.remove('active');
                }

                requestAnimationFrame(detectHands);
            }

            detectHands();
        }

        // ============= PLACE ICONS IN AR =============
        function placeIcons() {
            const container = document.getElementById('iconsContainer');
            container.innerHTML = '';

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const spacing = 120;
            const positions = [
                { x: centerX - spacing, y: centerY - spacing, app: AR_APPS[0] },
                { x: centerX + spacing, y: centerY - spacing, app: AR_APPS[1] },
                { x: centerX - spacing, y: centerY + spacing, app: AR_APPS[2] },
                { x: centerX + spacing, y: centerY + spacing, app: AR_APPS[3] }
            ];

            positions.forEach((pos, idx) => {
                const iconEl = document.createElement('div');
                iconEl.className = 'ar-icon';
                iconEl.id = `icon-${pos.app.id}`;
                iconEl.innerHTML = `
                    <div style="font-size: 40px;">${pos.app.icon}</div>
                    <div class="ar-icon-label">${pos.app.label}</div>
                `;
                
                iconEl.style.left = (pos.x - 40) + 'px';
                iconEl.style.top = (pos.y - 40) + 'px';
                
                iconEl.addEventListener('click', () => handleIconClick(pos.app));
                iconEl.addEventListener('pointerdown', () => onIconPointerDown(iconEl));

                container.appendChild(iconEl);
                iconPositions[pos.app.id] = { x: pos.x, y: pos.y };
            });

            document.getElementById('iconStatus').textContent = '✅ PLACED';
            iconsPlaced = true;
        }

        // ============= HANDLE ICON INTERACTIONS =============
        function onIconPointerDown(element) {
            const app = element.id.split('-')[1];
            const now = Date.now();

            // Detect pinch gesture (double tap quickly)
            if (lastPinchTime[app] && now - lastPinchTime[app] < 300) {
                element.classList.add('pinch-active');
                
                // Show pinch feedback
                const feedback = document.createElement('div');
                feedback.className = 'pinch-feedback';
                feedback.textContent = '✓ CLICKED';
                document.body.appendChild(feedback);
                
                setTimeout(() => feedback.remove(), 500);
                setTimeout(() => element.classList.remove('pinch-active'), 200);
            }

            lastPinchTime[app] = now;
        }

        function handleIconClick(app) {
            console.log('Icon clicked:', app.label);
            
            if (app.url.includes('http')) {
                // Open external URL
                if (confirm(`Open ${app.label}?`)) {
                    window.open(app.url, '_blank');
                }
            } else {
                // Open local file
                window.location.href = app.url;
            }
        }

        // ============= AR MAIN LOOP =============
        function startARLoop() {
            if (!xrSession) return;

            xrSession.requestAnimationFrame((time, frame) => {
                // Update AR tracking status
                const pose = frame.getViewerPose(xrRefSpace);
                if (pose) {
                    document.getElementById('trackingStatus').textContent = '✅ TRACKING';
                } else {
                    document.getElementById('trackingStatus').textContent = '⚠️  LOST';
                }

                // Continue loop
                startARLoop();
            });
        }

        // ============= UTILITIES =============
        function resetIcons() {
            placeIcons();
        }

        function exitAR() {
            if (xrSession) {
                xrSession.end().catch(e => console.log('XR end error:', e));
            }

            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            document.getElementById('arContainer').classList.remove('active');
            document.getElementById('menuScreen').classList.remove('hidden');
            iconsPlaced = false;
        }

        function testOnly() {
            alert('WebXR Test:\n✅ Supported on your device\n✅ Ready for AR apps');
        }

        async function showInfo() {
            const isAR = await navigator.xr?.isSessionSupported?.('immersive-ar');
            alert(`System Info:\n✅ WebXR: Available\n✅ AR Mode: ${isAR ? 'Supported' : 'Not Supported'}\n📱 Device: ${navigator.userAgent.split('\\n')[0]}`);
        }

        // ============= STARTUP =============
        window.addEventListener('load', async () => {
            const ready = await initializeSystem();
            if (!ready) {
                document.querySelector('.menu-btn').textContent = 'WEBXR NOT AVAILABLE';
                document.querySelector('.menu-btn').disabled = true;
            }
        });
    </script>
</body>
</html>
