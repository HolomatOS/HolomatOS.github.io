<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>STARK AR</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  :root {
    --gold: #FFB300;
    --red: #B71C1C;
    --cyan: #00E5FF;
    --dark: #050A0F;
    --panel: rgba(0, 229, 255, 0.08);
  }

  body {
    background: var(--dark);
    font-family: 'Share Tech Mono', monospace;
    color: var(--cyan);
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  canvas { display: block; }

  /* ── SPLASH SCREEN ── */
  #splash {
    position: fixed; inset: 0;
    background: var(--dark);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px; z-index: 100;
    transition: opacity 0.6s;
  }
  #splash.hide { opacity: 0; pointer-events: none; }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 48px; font-weight: 900;
    letter-spacing: 12px;
    background: linear-gradient(135deg, var(--gold), var(--red) 50%, var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(255,179,0,0.6));
    animation: pulse-logo 2s ease-in-out infinite;
  }
  @keyframes pulse-logo {
    0%,100% { filter: drop-shadow(0 0 20px rgba(255,179,0,0.6)); }
    50%      { filter: drop-shadow(0 0 40px rgba(255,179,0,1)); }
  }

  .sub { font-size: 11px; letter-spacing: 6px; color: var(--cyan); opacity: 0.7; }

  .arc {
    width: 90px; height: 90px;
    border-radius: 50%;
    border: 3px solid var(--cyan);
    box-shadow: 0 0 30px var(--cyan), inset 0 0 30px rgba(0,229,255,0.2);
    display: flex; align-items: center; justify-content: center;
    animation: spin-ring 4s linear infinite;
    position: relative;
  }
  .arc::before {
    content: '';
    position: absolute; width: 60px; height: 60px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    box-shadow: 0 0 20px var(--gold), inset 0 0 20px rgba(255,179,0,0.2);
    animation: spin-ring 2s linear infinite reverse;
  }
  .arc-core {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle, white, var(--cyan));
    box-shadow: 0 0 20px var(--cyan), 0 0 40px white;
    z-index: 1;
  }
  @keyframes spin-ring {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .status-line { font-size: 10px; letter-spacing: 3px; color: var(--gold); opacity: 0.8; }

  #start-btn {
    margin-top: 16px;
    padding: 14px 40px;
    border: 2px solid var(--gold);
    background: transparent;
    color: var(--gold);
    font-family: 'Orbitron', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 4px;
    cursor: pointer;
    position: relative; overflow: hidden;
    transition: all 0.3s;
  }
  #start-btn::before {
    content: '';
    position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,179,0,0.3), transparent);
    transition: left 0.4s;
  }
  #start-btn:hover::before { left: 100%; }
  #start-btn:hover {
    background: rgba(255,179,0,0.15);
    box-shadow: 0 0 30px rgba(255,179,0,0.5);
  }
  #start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #no-xr {
    display: none;
    color: var(--red);
    font-size: 11px; letter-spacing: 2px;
    text-align: center; max-width: 260px;
    border: 1px solid var(--red);
    padding: 12px 20px;
    background: rgba(183,28,28,0.1);
  }

  /* ── HUD OVERLAY (shown during AR) ── */
  #hud {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 10;
    display: none;
  }

  /* Corner brackets */
  .corner {
    position: absolute; width: 40px; height: 40px;
    opacity: 0.7;
  }
  .corner.tl { top: 16px; left: 16px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .corner.tr { top: 16px; right: 16px; border-top: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
  .corner.bl { bottom: 16px; left: 16px; border-bottom: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .corner.br { bottom: 16px; right: 16px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

  /* Top bar */
  #hud-top {
    position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 20px;
  }
  .hud-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px; letter-spacing: 4px;
    color: var(--gold);
    text-shadow: 0 0 10px var(--gold);
  }
  .hud-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* Bottom panel */
  #hud-bottom {
    position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
    text-align: center;
  }
  #hint-text {
    font-size: 11px; letter-spacing: 3px; color: var(--cyan); opacity: 0.8;
    text-shadow: 0 0 10px var(--cyan);
    animation: fade-hint 3s ease-in-out infinite;
  }
  @keyframes fade-hint { 0%,100%{opacity:0.4} 50%{opacity:1} }

  /* Side stats */
  #hud-left {
    position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px;
  }
  .stat-row { font-size: 9px; letter-spacing: 2px; color: var(--cyan); opacity: 0.6; }
  .stat-val { color: var(--gold); }

  /* Object count badge */
  #obj-count {
    position: absolute; top: 24px; right: 60px;
    font-family: 'Orbitron', sans-serif;
    font-size: 9px; letter-spacing: 2px; color: var(--cyan);
  }

  /* Clear button */
  #clear-btn {
    position: fixed; bottom: 80px; right: 20px;
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 2px solid rgba(0,229,255,0.5);
    background: rgba(0,10,20,0.7);
    color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px; letter-spacing: 1px;
    cursor: pointer; z-index: 20;
    display: none;
    align-items: center; justify-content: center;
    text-align: center;
    pointer-events: all;
    transition: all 0.3s;
  }
  #clear-btn:active {
    background: rgba(183,28,28,0.4);
    border-color: var(--red);
    color: var(--red);
  }

  /* Reticle pulse ring */
  #reticle-hud {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 60px; height: 60px;
    pointer-events: none; z-index: 11;
    display: none;
  }
  .reticle-ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(0,229,255,0.4);
    animation: reticle-pulse 2s ease-out infinite;
  }
  .reticle-ring:nth-child(2) { animation-delay: 0.7s; }
  .reticle-ring:nth-child(3) { animation-delay: 1.4s; }
  @keyframes reticle-pulse {
    0%   { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(1.8); opacity: 0; }
  }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="logo">STARK</div>
  <div class="sub">AUGMENTED REALITY SYSTEM</div>
  <div class="arc"><div class="arc-core"></div></div>
  <div class="status-line">MARK L · SYSTEMS ONLINE</div>
  <button id="start-btn">INITIALIZE AR</button>
  <div id="no-xr">WebXR not supported.<br>Open in Chrome on Android<br>with ARCore installed.</div>
</div>

<!-- HUD overlay -->
<div id="hud">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div id="hud-top">
    <div class="hud-label">STARK AR</div>
    <div class="hud-dot"></div>
    <div class="hud-label" id="live-label">LIVE</div>
  </div>
  <div id="hud-left">
    <div class="stat-row">PWR <span class="stat-val" id="stat-pwr">100%</span></div>
    <div class="stat-row">OBJ <span class="stat-val" id="stat-obj">0</span></div>
    <div class="stat-row">SRF <span class="stat-val" id="stat-srf">SCAN</span></div>
  </div>
  <div id="hud-bottom">
    <div id="hint-text">POINT AT A SURFACE · TAP TO PLACE</div>
  </div>
</div>

<!-- Reticle rings -->
<div id="reticle-hud">
  <div class="reticle-ring"></div>
  <div class="reticle-ring"></div>
  <div class="reticle-ring"></div>
</div>

<!-- Clear button -->
<button id="clear-btn" onclick="clearObjects()">CLEAR<br>ALL</button>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

let camera, scene, renderer, xrSession;
let hitTestSource = null;
let hitTestSourceRequested = false;
let reticle, placedObjects = [];
let objectCount = 0;

const COLORS = { gold: 0xFFB300, red: 0xB71C1C, cyan: 0x00E5FF, white: 0xFFFFFF };

// ── SCENE SETUP ──
function initScene() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Lighting
  scene.add(new THREE.AmbientLight(0x404080, 1.5));
  const pLight = new THREE.PointLight(COLORS.cyan, 2, 5);
  pLight.position.set(0, 1, 0);
  scene.add(pLight);

  // Reticle (surface indicator)
  reticle = buildReticle();
  reticle.visible = false;
  scene.add(reticle);

  // Tap to place
  renderer.domElement.addEventListener('click', onTap);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function buildReticle() {
  const group = new THREE.Group();
  // Outer ring
  const ringGeo = new THREE.RingGeometry(0.08, 0.10, 32);
  const ringMat = new THREE.MeshBasicMaterial({ color: COLORS.cyan, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  group.add(ring);
  // Inner dot
  const dotGeo = new THREE.CircleGeometry(0.015, 16);
  const dotMat = new THREE.MeshBasicMaterial({ color: COLORS.gold, side: THREE.DoubleSide });
  const dot = new THREE.Mesh(dotGeo, dotMat);
  dot.rotation.x = -Math.PI / 2;
  group.add(dot);
  // Cross hairs
  for (let i = 0; i < 4; i++) {
    const lineGeo = new THREE.BoxGeometry(0.04, 0.002, 0.002);
    const lineMat = new THREE.MeshBasicMaterial({ color: COLORS.cyan, transparent: true, opacity: 0.6 });
    const line = new THREE.Mesh(lineGeo, lineMat);
    line.rotation.y = (i * Math.PI) / 2;
    line.position.set(Math.sin(i * Math.PI / 2) * 0.06, 0, Math.cos(i * Math.PI / 2) * 0.06);
    group.add(line);
  }
  group.matrixAutoUpdate = false;
  return group;
}

// ── HOLOGRAPHIC OBJECT BUILDER ──
function buildHologramObject(type) {
  const group = new THREE.Group();

  if (type === 0) {
    // Arc Reactor
    buildArcReactor(group);
  } else if (type === 1) {
    // Floating data panel
    buildDataPanel(group);
  } else {
    // Iron Man helmet wireframe
    buildHelmetOutline(group);
  }

  return group;
}

function buildArcReactor(group) {
  const mat = (col, op=1) => new THREE.MeshStandardMaterial({
    color: col, emissive: col, emissiveIntensity: 0.8,
    transparent: op < 1, opacity: op, wireframe: false
  });

  // Core glow sphere
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 16), mat(COLORS.white));
  group.add(core);

  // Inner ring
  const r1 = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.005, 8, 32), mat(COLORS.cyan));
  group.add(r1);

  // Mid ring
  const r2 = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.003, 8, 32), mat(COLORS.gold));
  r2.rotation.x = Math.PI / 4;
  group.add(r2);

  // Outer ring
  const r3 = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.003, 8, 32), mat(COLORS.cyan, 0.7));
  r3.rotation.x = -Math.PI / 4;
  group.add(r3);

  // Spokes
  for (let i = 0; i < 6; i++) {
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.003, 0.003), mat(COLORS.cyan, 0.5));
    spoke.rotation.z = (i * Math.PI) / 3;
    group.add(spoke);
  }

  // Glow light
  const pt = new THREE.PointLight(COLORS.cyan, 1.5, 0.5);
  group.add(pt);

  // Animate
  group.userData.animate = (t) => {
    r1.rotation.z = t * 1.2;
    r2.rotation.z = -t * 0.8;
    r3.rotation.z = t * 0.5;
    core.scale.setScalar(0.9 + 0.1 * Math.sin(t * 3));
    pt.intensity = 1.2 + 0.3 * Math.sin(t * 4);
  };

  group.position.y = 0.05;
}

function buildDataPanel(group) {
  const panelMat = new THREE.MeshBasicMaterial({
    color: COLORS.cyan, transparent: true, opacity: 0.15, side: THREE.DoubleSide
  });
  const borderMat = new THREE.MeshBasicMaterial({ color: COLORS.cyan, transparent: true, opacity: 0.8 });
  const goldMat = new THREE.MeshBasicMaterial({ color: COLORS.gold, transparent: true, opacity: 0.9 });

  // Main panel face
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.18), panelMat);
  panel.rotation.x = -Math.PI / 6;
  group.add(panel);

  // Border frame lines
  const framePts = [[-0.14, 0.09], [0.14, 0.09], [0.14, -0.09], [-0.14, -0.09], [-0.14, 0.09]];
  const frameGeo = new THREE.BufferGeometry().setFromPoints(framePts.map(([x,y]) => new THREE.Vector3(x, y, 0)));
  const frameLine = new THREE.Line(frameGeo, new THREE.LineBasicMaterial({ color: COLORS.cyan, transparent: true, opacity: 0.9 }));
  frameLine.rotation.x = -Math.PI / 6;
  group.add(frameLine);

  // Data bar rows
  for (let i = 0; i < 4; i++) {
    const w = 0.05 + Math.random() * 0.16;
    const bar = new THREE.Mesh(new THREE.PlaneGeometry(w, 0.008), goldMat);
    bar.rotation.x = -Math.PI / 6;
    bar.position.set(-0.09 + w / 2, 0.055 - i * 0.028, 0.001);
    group.add(bar);
    bar.userData.baseW = w;
  }

  // Corner accent ticks
  [[-0.14, 0.09], [0.14, 0.09]].forEach(([x, y]) => {
    const tick = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.002, 0.001), goldMat);
    tick.rotation.x = -Math.PI / 6;
    tick.position.set(x, y, 0.001);
    group.add(tick);
  });

  group.position.y = 0.1;

  group.userData.animate = (t) => {
    group.rotation.y = Math.sin(t * 0.5) * 0.15;
  };
}

function buildHelmetOutline(group) {
  const mat = new THREE.MeshBasicMaterial({ color: COLORS.gold, wireframe: true, transparent: true, opacity: 0.7 });
  const redMat = new THREE.MeshBasicMaterial({ color: COLORS.red, wireframe: true, transparent: true, opacity: 0.5 });

  // Dome (head)
  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6, 0, Math.PI * 2, 0, Math.PI * 0.65), mat);
  dome.position.y = 0.03;
  group.add(dome);

  // Face plate
  const face = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.06), redMat);
  face.position.y = 0.0;
  group.add(face);

  // Eye slits
  for (let s of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.008, 0.01),
      new THREE.MeshBasicMaterial({ color: COLORS.cyan, transparent: true, opacity: 0.9 }));
    eye.position.set(s * 0.022, 0.01, 0.03);
    group.add(eye);
    // Eye glow
    const eg = new THREE.PointLight(COLORS.cyan, 0.8, 0.2);
    eg.position.copy(eye.position);
    group.add(eg);
  }

  group.position.y = 0.06;

  group.userData.animate = (t) => {
    group.rotation.y = t * 0.4;
    group.position.y = 0.06 + 0.01 * Math.sin(t * 1.5);
  };
}

// ── TAP TO PLACE ──
let nextType = 0;
function onTap() {
  if (!reticle.visible) return;

  const obj = buildHologramObject(nextType % 3);
  nextType++;

  const matrix = new THREE.Matrix4();
  matrix.fromArray(reticle.matrix.elements);
  obj.position.setFromMatrixPosition(matrix);
  obj.quaternion.setFromRotationMatrix(matrix);

  scene.add(obj);
  placedObjects.push(obj);
  objectCount++;
  document.getElementById('stat-obj').textContent = objectCount;
  document.getElementById('stat-srf').textContent = 'LOCKED';

  // Pulse on place
  document.getElementById('reticle-hud').style.animation = 'none';
  setTimeout(() => document.getElementById('reticle-hud').style.animation = '', 10);
}

window.clearObjects = function() {
  placedObjects.forEach(o => scene.remove(o));
  placedObjects = [];
  objectCount = 0;
  document.getElementById('stat-obj').textContent = '0';
  document.getElementById('stat-srf').textContent = 'SCAN';
};

// ── AR SESSION ──
async function startAR() {
  const btn = document.getElementById('start-btn');
  btn.disabled = true;
  btn.textContent = 'LOADING...';

  if (!navigator.xr) {
    document.getElementById('no-xr').style.display = 'block';
    btn.textContent = 'NOT AVAILABLE';
    return;
  }

  const supported = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
  if (!supported) {
    document.getElementById('no-xr').style.display = 'block';
    btn.textContent = 'NOT SUPPORTED';
    return;
  }

  initScene();

  xrSession = await navigator.xr.requestSession('immersive-ar', {
    requiredFeatures: ['hit-test'],
    optionalFeatures: ['dom-overlay', 'light-estimation'],
    domOverlay: { root: document.body }
  });

  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(xrSession);

  // Show HUD
  document.getElementById('splash').classList.add('hide');
  document.getElementById('hud').style.display = 'block';
  document.getElementById('reticle-hud').style.display = 'block';
  document.getElementById('clear-btn').style.display = 'flex';

  xrSession.addEventListener('end', () => {
    document.getElementById('hud').style.display = 'none';
    document.getElementById('reticle-hud').style.display = 'none';
    document.getElementById('clear-btn').style.display = 'none';
    document.getElementById('splash').classList.remove('hide');
    btn.disabled = false;
    btn.textContent = 'INITIALIZE AR';
  });

  renderer.setAnimationLoop(render);
}

// ── RENDER LOOP ──
let clock = new THREE.Clock();

function render(timestamp, frame) {
  const t = clock.getElapsedTime();

  // Hit testing
  if (frame) {
    const refSpace = renderer.xr.getReferenceSpace();
    const session = renderer.xr.getSession();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then(vs => {
        session.requestHitTestSource({ space: vs }).then(src => {
          hitTestSource = src;
        });
      });
      hitTestSourceRequested = true;
    }

    if (hitTestSource) {
      const results = frame.getHitTestResults(hitTestSource);
      if (results.length > 0) {
        const hit = results[0];
        const pose = hit.getPose(refSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
        document.getElementById('stat-srf').textContent = 'FOUND';
      } else {
        reticle.visible = false;
        if (objectCount === 0) document.getElementById('stat-srf').textContent = 'SCAN';
      }
    }
  }

  // Animate placed objects
  placedObjects.forEach(obj => {
    if (obj.userData.animate) obj.userData.animate(t);
  });

  // Update power stat (cosmetic)
  const pwr = 100 - Math.floor(t * 0.1) % 5;
  document.getElementById('stat-pwr').textContent = Math.max(95, pwr) + '%';

  renderer.render(scene, camera);
}

// ── INIT ──
document.getElementById('start-btn').addEventListener('click', () => {
  startAR().catch(e => {
    console.error(e);
    document.getElementById('no-xr').style.display = 'block';
    document.getElementById('no-xr').textContent = 'Error: ' + e.message;
    document.getElementById('start-btn').disabled = false;
    document.getElementById('start-btn').textContent = 'RETRY';
  });
});

// Check XR availability on load
window.addEventListener('load', async () => {
  if (!navigator.xr) {
    document.getElementById('no-xr').style.display = 'block';
    document.getElementById('start-btn').disabled = true;
  }
});
</script>
</body>
</html>
