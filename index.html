<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>AR HUD Prototype</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #info {
      position: absolute; left: 0; right: 0; top: 0;
      color: #9cf; font: 14px/1.4 system-ui, sans-serif;
      background: rgba(0,0,0,0.5); padding: 8px 12px; z-index: 2;
    }
    #overlay {
      position: absolute; left: 12px; top: 48px; z-index: 3;
      color: #cfe9ff; font: 13px/1.4 system-ui, sans-serif;
      background: rgba(0,0,0,0.6); padding: 10px 12px; border: 1px solid rgba(140,220,255,0.4);
      border-radius: 8px; max-width: calc(100vw - 24px);
    }
    #overlay .row { margin: 6px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #overlay label { min-width: 70px; color: #9cf; }
    #overlay input {
      background: rgba(5,15,25,0.9); color: #e6f4ff; border: 1px solid rgba(140,220,255,0.4);
      padding: 4px 6px; border-radius: 4px; min-width: 180px;
    }
    #overlay button {
      background: rgba(10,30,45,0.9); color: #e6f4ff; border: 1px solid rgba(140,220,255,0.5);
      padding: 5px 8px; border-radius: 5px; cursor: pointer;
    }
    #overlay button:disabled { opacity: 0.5; cursor: default; }
    #status { color: #7fd0ff; }
    #hud {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
    }
    .reticle {
      position: absolute; left: 50%; top: 50%; width: 60px; height: 60px;
      border: 2px solid rgba(140,220,255,0.8); border-radius: 50%;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 12px rgba(140,220,255,0.6);
    }
    .tick { position: absolute; width: 2px; height: 18px; background: rgba(140,220,255,0.8); }
    .tick.t1 { left: 50%; top: calc(50% - 50px); transform: translateX(-50%); }
    .tick.t2 { left: 50%; top: calc(50% + 32px); transform: translateX(-50%); }
    .tick.t3 { top: 50%; left: calc(50% - 50px); transform: translateY(-50%); }
    .tick.t4 { top: 50%; left: calc(50% + 48px); transform: translateY(-50%); }
  </style>
</head>
<body>
  <div id="info">Tap "Enter AR". Tap to spawn a time panel. Tap a panel to pick up, tap again to drop. Double-tap to place your PC screen panel (after connecting below).</div>
  <div id="overlay">
    <div class="row">
      <label for="wsUrl">Signal WS</label>
      <input id="wsUrl" value="ws://192.168.1.2:8080" />
    </div>
    <div class="row">
      <label for="roomId">Room</label>
      <input id="roomId" value="ar" />
    </div>
    <div class="row">
      <button id="connectBtn">Connect PC Stream</button>
      <button id="disconnectBtn" disabled>Disconnect</button>
      <span id="status">Not connected</span>
    </div>
  </div>
  <div id="hud">
    <div class="reticle"></div>
    <div class="tick t1"></div><div class="tick t2"></div><div class="tick t3"></div><div class="tick t4"></div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { ARButton } from "https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js";

    let camera, scene, renderer;
    let reticle, controller;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    const panels = [];
    const raycaster = new THREE.Raycaster();
    let activePanel = null;
    let screenVideoEl = null;
    let screenTexture = null;
    let remoteStream = null;
    let peer = null;
    let ws = null;
    let connecting = false;
    let lastTapTime = 0;
    const tapCooldownMs = 250;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      const geometry = new THREE.RingGeometry(0.06, 0.075, 32).rotateX(-Math.PI / 2);
      const material = new THREE.MeshBasicMaterial({ color: 0x8cdcff });
      reticle = new THREE.Mesh(geometry, material);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      controller = renderer.xr.getController(0);
      controller.addEventListener("select", onSelect);
      scene.add(controller);

      renderer.domElement.addEventListener("dblclick", onDoubleClick);
      document.getElementById("connectBtn").addEventListener("click", connectToPc);
      document.getElementById("disconnectBtn").addEventListener("click", disconnectFromPc);

      document.body.appendChild(ARButton.createButton(renderer, {
        requiredFeatures: ["hit-test"],
        optionalFeatures: ["dom-overlay"],
        domOverlay: { root: document.body }
      }));

      window.addEventListener("resize", onWindowResize);
    }

    function onSelect() {
      const now = performance.now();
      if (now - lastTapTime < tapCooldownMs) return;
      lastTapTime = now;

      const hitPanel = getPanelUnderGaze();

      if (activePanel) {
        activePanel.userData.selected = false;
        activePanel.scale.setScalar(1);
        activePanel = null;
        return;
      }

      if (hitPanel) {
        activePanel = hitPanel;
        activePanel.userData.selected = true;
        activePanel.scale.setScalar(1.08);
        return;
      }

      if (!reticle.visible) return;

      const hud = makeHudPanel();
      hud.position.setFromMatrixPosition(reticle.matrix);
      hud.quaternion.setFromRotationMatrix(reticle.matrix);
      scene.add(hud);
      panels.push(hud);
    }

    function onDoubleClick() {
      if (!reticle.visible) return;
      if (!screenTexture) {
        setStatus("No PC stream yet. Tap Connect first.");
        return;
      }

      const screenPanel = makeScreenPanel(screenTexture);
      screenPanel.position.setFromMatrixPosition(reticle.matrix);
      screenPanel.quaternion.setFromRotationMatrix(reticle.matrix);
      scene.add(screenPanel);
      panels.push(screenPanel);
    }

    function connectToPc() {
      if (connecting || screenTexture) return;
      const wsUrl = document.getElementById("wsUrl").value.trim();
      const roomId = document.getElementById("roomId").value.trim();
      if (!wsUrl || !roomId) {
        setStatus("Enter Signal WS and Room.");
        return;
      }

      connecting = true;
      setStatus("Connecting...");
      const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
      peer = pc;

      pc.ontrack = (ev) => {
        if (!remoteStream) remoteStream = new MediaStream();
        remoteStream.addTrack(ev.track);
        setupRemoteVideo(remoteStream);
      };

      pc.onicecandidate = (ev) => {
        if (ev.candidate) sendSignal({ type: "candidate", candidate: ev.candidate });
      };

      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        ws.send(JSON.stringify({ room: roomId, data: { type: "join", role: "receiver" } }));
        setStatus("Waiting for PC...");
        document.getElementById("connectBtn").disabled = true;
        document.getElementById("disconnectBtn").disabled = false;
      };
      ws.onmessage = async (msg) => {
        const payload = safeParse(msg.data);
        if (!payload || payload.room !== roomId) return;
        const data = payload.data || {};
        if (data.type === "offer") {
          await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          sendSignal({ type: "answer", answer });
        } else if (data.type === "candidate" && data.candidate) {
          try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch {}
        }
      };
      ws.onclose = () => {
        setStatus("Disconnected");
        connecting = false;
        cleanupConnection();
      };
      ws.onerror = () => {
        setStatus("Signal error");
        connecting = false;
      };

      function sendSignal(data) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ room: roomId, data }));
        }
      }
    }

    function disconnectFromPc() {
      cleanupConnection();
      setStatus("Disconnected");
    }

    function cleanupConnection() {
      if (ws) { ws.close(); ws = null; }
      if (peer) { peer.close(); peer = null; }
      if (screenVideoEl) { screenVideoEl.pause(); screenVideoEl = null; }
      screenTexture = null;
      remoteStream = null;
      connecting = false;
      document.getElementById("connectBtn").disabled = false;
      document.getElementById("disconnectBtn").disabled = true;
    }

    function setupRemoteVideo(stream) {
      if (screenTexture) return;
      const video = document.createElement("video");
      video.srcObject = stream;
      video.muted = true;
      video.playsInline = true;
      video.addEventListener("loadedmetadata", () => {
        video.play().catch(() => {});
      });

      screenVideoEl = video;
      screenTexture = new THREE.VideoTexture(video);
      screenTexture.minFilter = THREE.LinearFilter;
      screenTexture.magFilter = THREE.LinearFilter;
      screenTexture.colorSpace = THREE.SRGBColorSpace;
      setStatus("PC stream connected");
    }

    function setStatus(text) {
      const el = document.getElementById("status");
      if (el) el.textContent = text;
    }

    function safeParse(value) {
      try { return JSON.parse(value); } catch { return null; }
    }

    function getPanelUnderGaze() {
      if (panels.length === 0) return null;

      const origin = new THREE.Vector3();
      const direction = new THREE.Vector3();
      camera.getWorldPosition(origin);
      camera.getWorldDirection(direction);
      raycaster.set(origin, direction);

      const hits = raycaster.intersectObjects(panels, true);
      if (!hits.length) return null;

      const candidate = hits[0].object.parent;
      return candidate && candidate.userData && candidate.userData.isHudPanel ? candidate : null;
    }

    function makeHudPanel() {
      const group = new THREE.Group();

      const panelGeom = new THREE.PlaneGeometry(0.7, 0.35);
      const panelMat = new THREE.MeshBasicMaterial({ color: 0x0b2033, transparent: true, opacity: 0.75 });
      const panel = new THREE.Mesh(panelGeom, panelMat);
      group.add(panel);

      const borderGeom = new THREE.EdgesGeometry(panelGeom);
      const borderMat = new THREE.LineBasicMaterial({ color: 0x8cdcff });
      const border = new THREE.LineSegments(borderGeom, borderMat);
      group.add(border);

      const timeCanvas = document.createElement("canvas");
      timeCanvas.width = 512;
      timeCanvas.height = 256;
      const timeCtx = timeCanvas.getContext("2d");
      const timeTexture = new THREE.CanvasTexture(timeCanvas);
      timeTexture.minFilter = THREE.LinearFilter;
      timeTexture.magFilter = THREE.LinearFilter;

      const timeMat = new THREE.MeshBasicMaterial({ map: timeTexture, transparent: true });
      const timePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.2), timeMat);
      timePlane.position.set(0, 0, 0.002);
      group.add(timePlane);

      const dotGeom = new THREE.CircleGeometry(0.01, 16);
      const dotMat = new THREE.MeshBasicMaterial({ color: 0x8cdcff });
      const dot = new THREE.Mesh(dotGeom, dotMat);
      dot.position.set(-0.28, 0.11, 0.001);
      group.add(dot);

      group.userData.isHudPanel = true;
      group.userData.selected = false;
      group.userData.timeCtx = timeCtx;
      group.userData.timeTexture = timeTexture;
      group.userData.lastTimeText = "";
      group.scale.setScalar(1);

      updatePanelTime(group, true);

      return group;
    }

    function makeScreenPanel(texture) {
      const group = new THREE.Group();

      const panelGeom = new THREE.PlaneGeometry(0.9, 0.5);
      const panelMat = new THREE.MeshBasicMaterial({ color: 0x0b2033, transparent: true, opacity: 0.75 });
      const panel = new THREE.Mesh(panelGeom, panelMat);
      group.add(panel);

      const borderGeom = new THREE.EdgesGeometry(panelGeom);
      const borderMat = new THREE.LineBasicMaterial({ color: 0x8cdcff });
      const border = new THREE.LineSegments(borderGeom, borderMat);
      group.add(border);

      const videoMat = new THREE.MeshBasicMaterial({ map: texture });
      const videoPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.82, 0.46), videoMat);
      videoPlane.position.set(0, 0, 0.002);
      group.add(videoPlane);

      group.userData.isHudPanel = true;
      group.userData.selected = false;
      group.scale.setScalar(1);

      return group;
    }

    function updatePanelTime(panel, force) {
      const now = new Date();
      const timeText = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      if (!force && panel.userData.lastTimeText === timeText) return;

      panel.userData.lastTimeText = timeText;
      const ctx = panel.userData.timeCtx;
      const tex = panel.userData.timeTexture;

      ctx.clearRect(0, 0, 512, 256);
      ctx.fillStyle = "rgba(0,0,0,0)";
      ctx.fillRect(0, 0, 512, 256);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 80px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(timeText, 256, 128);
      tex.needsUpdate = true;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace("viewer").then((space) => {
            session.requestHitTestSource({ space }).then((source) => {
              hitTestSource = source;
            });
          });

          session.addEventListener("end", () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });

          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      if (activePanel && reticle.visible) {
        activePanel.position.setFromMatrixPosition(reticle.matrix);
        activePanel.quaternion.setFromRotationMatrix(reticle.matrix);
      }

      for (const panel of panels) {
        if (panel.userData.timeCtx) updatePanelTime(panel, false);
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
