<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover handles the Moto G's curved edges & gesture bar -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AR Nav</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne+Mono&family=Syne:wght@400;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --neon:  #00ffe7;
      --neon2: #ff2d78;
      --dark:  #080c14;
      --glass: rgba(8,12,20,0.84);
      --warn:  #ffe600;

      /* Moto G Stylus 2025 safe area fallbacks */
      --safe-top:    env(safe-area-inset-top,    24px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
      --safe-left:   env(safe-area-inset-left,   0px);
      --safe-right:  env(safe-area-inset-right,  0px);
    }

    html, body {
      background: var(--dark);
      font-family: 'Syne', sans-serif;
      color: #fff;
      overflow: hidden;
      height: 100%; width: 100%;
      /* prevent overscroll bounce */
      overscroll-behavior: none;
    }

    /* ─────────────────────────────────────────
       SETUP SCREEN
    ───────────────────────────────────────── */
    #setup-screen {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center;
      /* scrollable so nothing gets cut on any screen height */
      overflow-y: auto;
      padding: calc(var(--safe-top) + 1.5rem) 1.5rem
               calc(var(--safe-bottom) + 1.5rem);
      background: var(--dark);
      gap: 1rem;
    }

    #setup-screen::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 20% 80%, rgba(0,255,231,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 80% 20%, rgba(255,45,120,0.08) 0%, transparent 70%);
    }

    .logo {
      font-size: 2.8rem; font-weight: 800;
      letter-spacing: -2px; text-align: center; z-index: 1;
      /* bump down a touch so it clears the status bar */
      margin-top: 0.5rem;
    }
    .logo span { color: var(--neon); }

    .tagline {
      font-family: 'Syne Mono', monospace; font-size: 0.68rem;
      letter-spacing: 0.18em; color: rgba(255,255,255,0.38);
      text-transform: uppercase; z-index: 1; text-align: center;
    }

    .divider {
      width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon), transparent);
      opacity: 0.22; z-index: 1;
    }

    .section-label {
      font-family: 'Syne Mono', monospace; font-size: 0.64rem;
      letter-spacing: 0.14em; color: var(--neon);
      text-transform: uppercase; align-self: flex-start; z-index: 1;
    }

    /* 2-col grid — fits well on 74mm wide screen */
    .category-grid {
      width: 100%; display: grid;
      grid-template-columns: 1fr 1fr; gap: 0.55rem; z-index: 1;
    }

    .cat-btn {
      /* min 48px touch target — Android accessibility guideline */
      min-height: 56px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 0.7rem 0.5rem;
      color: rgba(255,255,255,0.6); font-family: 'Syne', sans-serif;
      font-size: 0.8rem; cursor: pointer; text-align: center;
      transition: all 0.18s;
      display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
      user-select: none;
    }

    .cat-btn .icon { font-size: 1.4rem; }
    .cat-btn.active {
      background: rgba(0,255,231,0.1);
      border-color: var(--neon); color: var(--neon);
    }

    .slider-row {
      width: 100%; display: flex; flex-direction: column; gap: 0.45rem; z-index: 1;
    }

    .slider-row label {
      font-family: 'Syne Mono', monospace; font-size: 0.64rem;
      color: rgba(255,255,255,0.5); display: flex; justify-content: space-between;
    }

    .slider-row label span { color: var(--neon); }

    input[type=range] {
      width: 100%; accent-color: var(--neon);
      /* taller thumb on tall-screen phone */
      height: 20px;
    }

    .launch-btn {
      width: 100%; z-index: 1;
      /* large enough for finger on a 6.7" screen */
      min-height: 56px;
      background: linear-gradient(135deg, var(--neon) 0%, #00b8a0 100%);
      border: none; border-radius: 14px; padding: 1rem;
      color: var(--dark); font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 1rem; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      /* bottom margin so it clears Android gesture bar */
      margin-bottom: 0.5rem;
    }

    .launch-btn:active { transform: scale(0.98); opacity: 0.9; }

    /* ─────────────────────────────────────────
       AR SCENE
    ───────────────────────────────────────── */
    #ar-wrapper { display: none; position: fixed; inset: 0; }
    a-scene { width: 100%; height: 100%; }

    /* ─────────────────────────────────────────
       HUD SHELL
    ───────────────────────────────────────── */
    #hud {
      display: none; position: fixed; inset: 0;
      pointer-events: none; z-index: 50;
    }

    /* ── TOP BAR ── */
    #hud-top {
      position: absolute; top: 0; left: 0; right: 0;
      /* respect notch / status bar */
      padding: calc(var(--safe-top) + 0.6rem) 1rem 0.8rem;
      background: linear-gradient(to bottom, rgba(8,12,20,0.92), transparent);
      display: flex; align-items: center; justify-content: space-between;
    }

    #hud-title { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.5px; }
    #hud-title span { color: var(--neon); }

    #gps-pill {
      font-family: 'Syne Mono', monospace; font-size: 0.6rem;
      background: var(--glass); border: 1px solid rgba(0,255,231,0.2);
      border-radius: 20px; padding: 0.35rem 0.75rem;
      color: rgba(255,255,255,0.5); backdrop-filter: blur(8px);
      transition: all 0.3s;
    }

    .gps-good { border-color: rgba(0,255,231,0.5) !important; color: var(--neon) !important; }
    .gps-bad  { border-color: rgba(255,230,0,0.5)  !important; color: var(--warn) !important; }

    /* ── PLACE CHIPS ── */
    /* sits just below the top bar */
    #place-selector {
      position: absolute;
      /* dynamic top based on safe area + top bar height (~72px) */
      top: calc(var(--safe-top) + 68px);
      left: 0; right: 0;
      padding: 0 1rem;
      pointer-events: all;
      display: flex; gap: 0.5rem;
      overflow-x: auto; scrollbar-width: none;
    }
    #place-selector::-webkit-scrollbar { display: none; }

    .place-chip {
      flex-shrink: 0;
      /* 36px min height = comfortable thumb tap */
      min-height: 36px;
      background: var(--glass); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 0.35rem 0.85rem;
      font-family: 'Syne Mono', monospace; font-size: 0.62rem;
      color: rgba(255,255,255,0.55); cursor: pointer;
      backdrop-filter: blur(8px); transition: all 0.18s;
      white-space: nowrap; display: flex; align-items: center;
    }

    .place-chip.active {
      background: rgba(0,255,231,0.12);
      border-color: var(--neon); color: var(--neon);
    }

    /* ── COMPASS (center) ── */
    #compass-wrap {
      position: absolute;
      /* 
        On a 6.7" 2712×1220 phone the usable viewport is very tall.
        Centre the compass in the middle third of the screen so it
        doesn't overlap chips above or legend below.
      */
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column;
      align-items: center; gap: 0.5rem;
      pointer-events: none;
    }

    #compass-ring {
      position: relative;
      /* slightly larger on the big 6.7" screen */
      width: 150px; height: 150px;
    }

    #compass-ring svg {
      width: 100%; height: 100%;
      filter: drop-shadow(0 0 10px rgba(0,255,231,0.4));
    }

    #arrow-group {
      transform-origin: 75px 75px;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }

    #target-label {
      font-family: 'Syne Mono', monospace;
      font-size: 0.72rem; color: var(--neon);
      text-align: center; max-width: 180px; line-height: 1.4;
      text-shadow: 0 0 12px rgba(0,255,231,0.6);
    }

    #target-dist {
      font-size: 1.3rem; font-weight: 800;
      color: #fff; letter-spacing: -0.5px;
    }

    #arrived-badge {
      display: none;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      background: rgba(0,255,231,0.15);
      border: 2px solid var(--neon); border-radius: 50%;
      width: 150px; height: 150px;
      align-items: center; justify-content: center;
      flex-direction: column; text-align: center;
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 0.9rem; color: var(--neon);
      animation: arriveGlow 1.5s ease-in-out infinite;
    }

    @keyframes arriveGlow {
      0%,100% { box-shadow: 0 0 12px rgba(0,255,231,0.3); }
      50%      { box-shadow: 0 0 35px rgba(0,255,231,0.7); }
    }

    /* ── BOTTOM HUD ── */
    #hud-bottom {
      position: absolute; bottom: 0; left: 0; right: 0;
      /* respect Android gesture navigation bar */
      padding: 0.8rem 1rem calc(var(--safe-bottom) + 0.8rem);
      background: linear-gradient(to top, rgba(8,12,20,0.94), transparent);
      pointer-events: all;
    }

    #place-count {
      font-family: 'Syne Mono', monospace; font-size: 0.62rem;
      color: rgba(255,255,255,0.3); margin-bottom: 0.5rem; text-align: center;
    }

    /* legend scrolls — max 3 rows visible on a 6.7" screen */
    #pin-legend {
      max-height: 120px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.4rem;
      margin-bottom: 0.7rem;
      /* subtle inner shadow so user knows it's scrollable */
      mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 88%, transparent 100%);
    }

    .legend-item {
      /* 40px touch target */
      min-height: 40px;
      display: flex; align-items: center; gap: 0.55rem;
      font-size: 0.75rem; cursor: pointer;
      border-radius: 8px; padding: 0.2rem 0.4rem;
      transition: background 0.15s;
    }

    .legend-item:hover, .legend-item:active { background: rgba(255,255,255,0.06); }
    .legend-item.active-target { background: rgba(0,255,231,0.08); }

    .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    .legend-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .legend-type {
      font-family: 'Syne Mono', monospace; font-size: 0.58rem;
      color: rgba(255,255,255,0.28); flex-shrink: 0;
    }

    .legend-dist {
      font-family: 'Syne Mono', monospace; font-size: 0.63rem;
      color: rgba(255,255,255,0.4); flex-shrink: 0;
    }

    /* back button — full width, easy to tap */
    .back-btn {
      width: 100%; min-height: 48px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 0.75rem;
      color: rgba(255,255,255,0.6);
      font-family: 'Syne', sans-serif; font-size: 0.85rem; cursor: pointer;
    }

    /* ── CROSSHAIR dot ── */
    #crosshair {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(0,255,231,0.65);
      pointer-events: none; z-index: 51; display: none;
    }

    /* ── STATUS TOAST ── */
    #status-bar {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      background: var(--glass); border: 1px solid rgba(0,255,231,0.3);
      border-radius: 14px; padding: 1rem 1.5rem;
      font-family: 'Syne Mono', monospace; font-size: 0.75rem;
      color: var(--neon); z-index: 200; backdrop-filter: blur(12px);
      display: none; text-align: center; min-width: 200px;
      /* never wider than the phone minus padding */
      max-width: calc(100vw - 3rem);
    }

    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid rgba(0,255,231,0.3);
      border-top-color: var(--neon); border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem; vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ── SETUP ──────────────────────────────────────────────────── -->
<div id="setup-screen">
  <div class="logo">AR<span>NAV</span></div>
  <div class="tagline">Optimised · Moto G Stylus 2025</div>
  <div class="divider"></div>

  <div class="section-label">🏷 What to show nearby</div>

  <div class="category-grid">
    <button class="cat-btn active" data-key="restaurant" onclick="toggleCat(this)">
      <span class="icon">🍔</span>Food & Drink
    </button>
    <button class="cat-btn active" data-key="fuel" onclick="toggleCat(this)">
      <span class="icon">⛽</span>Gas Stations
    </button>
    <button class="cat-btn active" data-key="shop" onclick="toggleCat(this)">
      <span class="icon">🛍</span>Shops
    </button>
    <button class="cat-btn active" data-key="amenity" onclick="toggleCat(this)">
      <span class="icon">🏥</span>Amenities
    </button>
  </div>

  <div class="slider-row">
    <label>
      Search radius
      <span id="radius-label">300 m</span>
    </label>
    <input type="range" id="radius-slider" min="100" max="1000" step="50" value="300"
      oninput="document.getElementById('radius-label').textContent = this.value + ' m'" />
  </div>

  <div class="divider"></div>

  <button class="launch-btn" onclick="launchAR()">Find Places &amp; Launch AR →</button>
</div>

<!-- ── STATUS ─────────────────────────────────────────────────── -->
<div id="status-bar"></div>

<!-- ── AR SCENE ───────────────────────────────────────────────── -->
<div id="ar-wrapper">
  <a-scene id="ar-scene" embedded
    arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true;"
    renderer="logarithmicDepthBuffer: true;"
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false">
    <a-camera gps-camera rotation-reader></a-camera>
  </a-scene>
</div>

<!-- ── HUD ────────────────────────────────────────────────────── -->
<div id="hud">

  <div id="hud-top">
    <div id="hud-title">AR<span>NAV</span></div>
    <div id="gps-pill">--- , ---</div>
  </div>

  <div id="place-selector"></div>

  <!-- compass — centre of screen -->
  <div id="compass-wrap">
    <div id="compass-ring">
      <svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
        <!-- rings -->
        <circle cx="75" cy="75" r="70" fill="none" stroke="rgba(0,255,231,0.12)" stroke-width="1.5"/>
        <circle cx="75" cy="75" r="55" fill="none" stroke="rgba(0,255,231,0.07)" stroke-width="1"/>
        <!-- cardinal ticks -->
        <g stroke="rgba(0,255,231,0.3)" stroke-width="1.5">
          <line x1="75" y1="5"   x2="75" y2="18"/>
          <line x1="75" y1="132" x2="75" y2="145"/>
          <line x1="5"  y1="75"  x2="18" y2="75"/>
          <line x1="132" y1="75" x2="145" y2="75"/>
        </g>
        <!-- N label -->
        <text x="75" y="32" text-anchor="middle" fill="rgba(0,255,231,0.6)"
          font-family="Syne Mono,monospace" font-size="10" font-weight="bold">N</text>
        <!-- rotating arrow -->
        <g id="arrow-group">
          <polygon points="75,26 68,58 75,50 82,58"
            fill="#00ffe7" opacity="0.95"/>
          <polygon points="75,124 68,92 75,100 82,92"
            fill="rgba(255,45,120,0.75)"/>
          <circle cx="75" cy="75" r="5" fill="#00ffe7" opacity="0.9"/>
        </g>
      </svg>
      <div id="arrived-badge">
        <div style="font-size:1.8rem">✓</div>
        <div>Arrived!</div>
      </div>
    </div>

    <div id="target-dist">---</div>
    <div id="target-label">tap a place chip to navigate</div>
  </div>

  <div id="crosshair"></div>

  <div id="hud-bottom">
    <div id="place-count"></div>
    <div id="pin-legend"></div>
    <button class="back-btn" onclick="goBack()">← Back to Setup</button>
  </div>
</div>

<!-- ── JS ─────────────────────────────────────────────────────── -->
<script>
  const CAT_COLORS = {
    restaurant:'#ff9f43', cafe:'#ff9f43', bar:'#ff9f43', fast_food:'#ff9f43',
    fuel:'#54a0ff',
    shop:'#a29bfe', supermarket:'#a29bfe', convenience:'#a29bfe',
    pharmacy:'#00ffe7', hospital:'#00ffe7', amenity:'#00ffe7',
    default:'#fd79a8',
  };

  const CAT_ICONS = {
    restaurant:'🍔', cafe:'☕', bar:'🍺', fast_food:'🌮',
    fuel:'⛽', shop:'🛍', supermarket:'🛒', convenience:'🏪',
    pharmacy:'💊', hospital:'🏥', amenity:'📍', default:'📌',
  };

  let activeCats   = new Set(['restaurant','fuel','shop','amenity']);
  let userLat = null, userLng = null;
  let deviceHeading = 0;
  let targetPlace   = null;
  let allPlaces     = [];
  let watchId       = null;
  let headingTimer  = null;

  function toggleCat(btn) {
    const key = btn.dataset.key;
    activeCats.has(key) ? activeCats.delete(key) : activeCats.add(key);
    btn.classList.toggle('active');
  }

  // ── LAUNCH ──────────────────────────────────────────────────
  async function launchAR() {
    if (!activeCats.size) { showStatus('Pick at least one category!', 2500); return; }

    showStatus('<span class="spinner"></span>Getting GPS…');

    let pos;
    try { pos = await getPosition(); }
    catch { showStatus('GPS denied — allow location access.', 3000); return; }

    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    updateGPSPill(pos.coords.accuracy);

    showStatus('<span class="spinner"></span>Fetching nearby places…');

    let places;
    try {
      places = await fetchNearbyPlaces(
        userLat, userLng,
        parseInt(document.getElementById('radius-slider').value)
      );
    } catch {
      showStatus('OpenStreetMap timeout — try again.', 3000); return;
    }

    if (!places.length) { showStatus('No places found. Try bigger radius.', 3000); return; }

    allPlaces = places;
    buildARScene(places);
    buildPlaceChips(places);
    setTarget(places[0]);

    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('ar-wrapper').style.display   = 'block';
    document.getElementById('hud').style.display          = 'block';
    document.getElementById('crosshair').style.display    = 'block';
    hideStatus();

    startLocationWatch();
    startCompass();
  }

  // ── FETCH OSM ────────────────────────────────────────────────
  async function fetchNearbyPlaces(lat, lng, radius) {
    let f = [];
    if (activeCats.has('restaurant'))
      f.push(`node["amenity"~"restaurant|cafe|bar|fast_food"](around:${radius},${lat},${lng});`);
    if (activeCats.has('fuel'))
      f.push(`node["amenity"="fuel"](around:${radius},${lat},${lng});`);
    if (activeCats.has('shop'))
      f.push(`node["shop"~"supermarket|convenience|clothes|electronics|bakery"](around:${radius},${lat},${lng});`);
    if (activeCats.has('amenity'))
      f.push(`node["amenity"~"pharmacy|hospital|bank|atm|police|post_office"](around:${radius},${lat},${lng});`);

    const query = `[out:json][timeout:10];(${f.join('')});out body;`;
    const res   = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
    const data  = await res.json();

    return data.elements
      .filter(el => el.lat && el.lon && el.tags)
      .map(el => {
        const t    = el.tags;
        const name = t.name || t['name:en'] || (t.amenity||t.shop||'place').replace(/_/g,' ');
        const type = t.amenity || t.shop || 'place';
        return { name, type, lat: el.lat, lng: el.lon,
                 dist: getDist(lat, lng, el.lat, el.lon) };
      })
      .filter(p => p.name)
      .sort((a,b) => a.dist - b.dist)
      .slice(0, 20);
  }

  // ── BUILD AR SCENE ───────────────────────────────────────────
  function buildARScene(places) {
    const scene = document.getElementById('ar-scene');
    scene.querySelectorAll('[gps-entity-place]').forEach(e => e.remove());

    places.forEach((p, i) => {
      const color  = CAT_COLORS[p.type] || CAT_COLORS.default;
      const icon   = CAT_ICONS[p.type]  || CAT_ICONS.default;
      const h      = 2 + (i % 5) * 2;

      const pillar = document.createElement('a-cylinder');
      pillar.setAttribute('gps-entity-place', `latitude:${p.lat};longitude:${p.lng}`);
      pillar.setAttribute('color', color);
      pillar.setAttribute('radius', '0.4');
      pillar.setAttribute('height', `${h}`);
      pillar.setAttribute('position', `0 ${h/2} 0`);
      pillar.setAttribute('opacity', '0.7');
      scene.appendChild(pillar);

      const sphere = document.createElement('a-sphere');
      sphere.setAttribute('gps-entity-place', `latitude:${p.lat};longitude:${p.lng}`);
      sphere.setAttribute('color', color);
      sphere.setAttribute('radius', '1');
      sphere.setAttribute('position', `0 ${h+1} 0`);
      sphere.setAttribute('opacity', '0.9');
      sphere.setAttribute('animation',
        `property:position;to:0 ${h+2} 0;dir:alternate;dur:${2000+i*150};easing:easeInOutSine;loop:true`);
      scene.appendChild(sphere);

      const label = document.createElement('a-text');
      label.setAttribute('gps-entity-place', `latitude:${p.lat};longitude:${p.lng}`);
      label.setAttribute('value', `${icon} ${p.name}`);
      label.setAttribute('color', color);
      label.setAttribute('align', 'center');
      label.setAttribute('width', '18');
      label.setAttribute('position', `0 ${h+3.5} 0`);
      scene.appendChild(label);
    });
  }

  // ── PLACE CHIPS ─────────────────────────────────────────────
  function buildPlaceChips(places) {
    const sel = document.getElementById('place-selector');
    sel.innerHTML = '';
    places.forEach((p, i) => {
      const chip = document.createElement('div');
      chip.className = 'place-chip' + (i===0 ? ' active' : '');
      chip.dataset.index = i;
      chip.textContent   = `${CAT_ICONS[p.type]||'📌'} ${p.name}`;
      chip.onclick = () => {
        document.querySelectorAll('.place-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        setTarget(places[i]);
      };
      sel.appendChild(chip);
    });
  }

  // ── LEGEND ──────────────────────────────────────────────────
  function buildLegend(places) {
    const legend = document.getElementById('pin-legend');
    legend.innerHTML = '';
    document.getElementById('place-count').textContent = `${places.length} places nearby`;

    places.forEach((p, i) => {
      const color = CAT_COLORS[p.type] || CAT_COLORS.default;
      const item  = document.createElement('div');
      item.className = 'legend-item' + (targetPlace===p ? ' active-target' : '');
      item.innerHTML = `
        <div class="legend-dot" style="background:${color}"></div>
        <span class="legend-name">${CAT_ICONS[p.type]||'📌'} ${p.name}</span>
        <span class="legend-type">${p.type}</span>
        <span class="legend-dist">${fmtDist(p.dist)}</span>
      `;
      item.onclick = () => {
        document.querySelectorAll('.place-chip').forEach((c,j) =>
          c.classList.toggle('active', j===i));
        setTarget(p);
        buildLegend(allPlaces);
      };
      legend.appendChild(item);
    });
  }

  function setTarget(p) {
    targetPlace = p;
    updateArrow();
    buildLegend(allPlaces);
  }

  // ── COMPASS ─────────────────────────────────────────────────
  function startCompass() {
    if (window.DeviceOrientationEvent) {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(r => { if (r==='granted') listenOri(); })
          .catch(() => {});
      } else {
        listenOri();
      }
    }
    headingTimer = setInterval(updateArrow, 800);
  }

  function listenOri() {
    window.addEventListener('deviceorientationabsolute', onOri, true);
    window.addEventListener('deviceorientation',         onOri, true);
  }

  function onOri(e) {
    if (e.absolute && e.alpha != null)          deviceHeading = (360 - e.alpha) % 360;
    else if (e.webkitCompassHeading != null)    deviceHeading = e.webkitCompassHeading;
    else if (e.alpha != null)                   deviceHeading = (360 - e.alpha) % 360;
    updateArrow();
  }

  function updateArrow() {
    if (!targetPlace || userLat == null) return;

    const dist    = getDist(userLat, userLng, targetPlace.lat, targetPlace.lng);
    const bearing = getBearing(userLat, userLng, targetPlace.lat, targetPlace.lng);
    const angle   = (bearing - deviceHeading + 360) % 360;

    document.getElementById('arrow-group').style.transform = `rotate(${angle}deg)`;
    document.getElementById('target-dist').textContent     = fmtDist(dist);
    document.getElementById('target-label').textContent    =
      `${CAT_ICONS[targetPlace.type]||'📌'} ${targetPlace.name}`;

    const arrived = dist < 15;
    document.getElementById('arrived-badge').style.display = arrived ? 'flex' : 'none';
    document.getElementById('compass-ring').style.opacity  = arrived ? '0.25' : '1';
  }

  // ── LIVE LOCATION ────────────────────────────────────────────
  function startLocationWatch() {
    if (watchId) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(pos => {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      updateGPSPill(pos.coords.accuracy);
      allPlaces.forEach(p => { p.dist = getDist(userLat, userLng, p.lat, p.lng); });
      buildLegend(allPlaces);
      updateArrow();
    }, null, { enableHighAccuracy: true });
  }

  function updateGPSPill(acc) {
    const pill = document.getElementById('gps-pill');
    const good = acc < 20;
    pill.textContent = good ? `GPS ±${Math.round(acc)}m ✓` : `GPS ±${Math.round(acc)}m ⚠`;
    pill.className   = good ? 'gps-good' : 'gps-bad';
  }

  // ── BACK ────────────────────────────────────────────────────
  function goBack() {
    if (watchId)     navigator.geolocation.clearWatch(watchId);
    if (headingTimer) clearInterval(headingTimer);
    window.removeEventListener('deviceorientationabsolute', onOri, true);
    window.removeEventListener('deviceorientation',         onOri, true);

    document.getElementById('setup-screen').style.display = 'flex';
    document.getElementById('ar-wrapper').style.display   = 'none';
    document.getElementById('hud').style.display          = 'none';
    document.getElementById('crosshair').style.display    = 'none';
    document.getElementById('ar-scene')
      .querySelectorAll('[gps-entity-place]').forEach(e => e.remove());
    allPlaces = []; targetPlace = null;
  }

  // ── UTILS ────────────────────────────────────────────────────
  function getPosition() {
    return new Promise((res,rej) =>
      navigator.geolocation.getCurrentPosition(res, rej,
        { enableHighAccuracy: true, timeout: 12000 })
    );
  }

  function getDist(la1,lo1,la2,lo2) {
    const R=6371000, dLa=(la2-la1)*Math.PI/180, dLo=(lo2-lo1)*Math.PI/180;
    const a = Math.sin(dLa/2)**2 +
      Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  function getBearing(la1,lo1,la2,lo2) {
    const dL=(lo2-lo1)*Math.PI/180;
    const y=Math.sin(dL)*Math.cos(la2*Math.PI/180);
    const x=Math.cos(la1*Math.PI/180)*Math.sin(la2*Math.PI/180)-
            Math.sin(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.cos(dL);
    return (Math.atan2(y,x)*180/Math.PI+360)%360;
  }

  function fmtDist(m) {
    return m>1000 ? `${(m/1000).toFixed(1)} km` : `${Math.round(m)} m`;
  }

  function showStatus(html, ms=0) {
    const b=document.getElementById('status-bar');
    b.innerHTML=html; b.style.display='block';
    if (ms) setTimeout(hideStatus, ms);
  }

  function hideStatus() { document.getElementById('status-bar').style.display='none'; }
</script>
</body>
