<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hand Tracking Test - Minimal</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      transform: scaleX(-1);
      transform-origin: center center;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      padding: 15px;
      border-radius: 8px;
      font-size: 16px;
      z-index: 10;
      min-width: 200px;
    }
    .loading { color: #ff0 !important; }
    .detected { color: #0f0 !important; }
    .error { color: #f00 !important; }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="status" class="loading">
      <div>Status: Loading...</div>
      <div id="fps">FPS: --</div>
      <div id="hands">Hands: 0</div>
    </div>
  </div>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const fpsDiv = document.getElementById('fps');
    const handsDiv = document.getElementById('hands');

    let lastTime = Date.now();
    let frameCount = 0;

    async function setupCamera() {
      // Request rear camera explicitly
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { exact: 'environment' },  // EXACT forces rear camera
          width: { ideal: 640 },
          height: { ideal: 480 }
        }
      });

      video.srcObject = stream;

      return new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
          const dpr = window.devicePixelRatio || 1;
          canvas.width = Math.round(video.videoWidth * dpr);
          canvas.height = Math.round(video.videoHeight * dpr);
          canvas.style.width = `${video.clientWidth}px`;
          canvas.style.height = `${video.clientHeight}px`;
          resolve(video);
        };
      });
    }

    function setupMediaPipe() {
      updateStatus('Loading MediaPipe Hands...', 'loading');

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.5
      });

      hands.onResults(onResults);

      // DON'T use MediaPipe Camera - it overrides our camera selection!
      // Instead, manually send frames
      async function sendFrames() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          await hands.send({image: video});
        }
        requestAnimationFrame(sendFrames);
      }

      updateStatus('Model started — show your hand', 'detected');
      sendFrames();
    }

    function updateStatus(text, className) {
      statusDiv.querySelector('div').textContent = `Status: ${text}`;
      statusDiv.className = className;
    }

    // MediaPipe results handler - MINIMAL VISION PRO STYLE
    function onResults(results) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const hands = results.multiHandLandmarks || [];
      handsDiv.textContent = `Hands: ${hands.length}`;

      if (hands.length > 0) updateStatus('Hand detected!', 'detected');
      else updateStatus('Show your hand to camera', 'loading');

      for (const landmarks of hands) {
        // MINIMAL CONNECTIONS - Vision Pro style
        const connections = [
          [0, 1], [1, 2], [2, 3], [3, 4],  // Thumb
          [0, 5], [5, 6], [6, 7], [7, 8],  // Index
          [0, 9], [9, 10], [10, 11], [11, 12],  // Middle
          [0, 13], [13, 14], [14, 15], [15, 16],  // Ring
          [0, 17], [17, 18], [18, 19], [19, 20],  // Pinky
          [5, 9], [9, 13], [13, 17]  // Palm
        ];

        // Draw connections with pink-to-white gradient
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        for (const [s, e] of connections) {
          const x1 = landmarks[s].x * video.videoWidth;
          const y1 = landmarks[s].y * video.videoHeight;
          const x2 = landmarks[e].x * video.videoWidth;
          const y2 = landmarks[e].y * video.videoHeight;

          // Create gradient for each line - Pink to White
          const gradient = ctx.createLinearGradient(x1, y1, x2, y2);
          gradient.addColorStop(0, 'rgba(255, 150, 200, 0.8)');  // Pink
          gradient.addColorStop(1, 'rgba(255, 255, 255, 0.6)');  // White

          ctx.strokeStyle = gradient;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }

        // Small dots at joints - minimal
        for (let j = 0; j < landmarks.length; j++) {
          const lm = landmarks[j];
          const x = lm.x * video.videoWidth;
          const y = lm.y * video.videoHeight;
          
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, 2 * Math.PI);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
          ctx.fill();
        }
      }

      // FPS
      frameCount++;
      const now = Date.now();
      if (now - lastTime > 1000) {
        const fps = Math.round(frameCount * 1000 / (now - lastTime));
        fpsDiv.textContent = `FPS: ${fps}`;
        frameCount = 0;
        lastTime = now;
      }
    }

    async function main() {
      try {
        await setupCamera();

        const dpr = window.devicePixelRatio || 1;
        ctx.setTransform(-dpr, 0, 0, dpr, canvas.width, 0);

        setupMediaPipe();
      } catch (error) {
        console.error('Error:', error);
        updateStatus(`Error: ${error.message}`, 'error');
      }
    }

    main();
  </script>
</body>
</html>
