<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>HolomatOS // Uplink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg: #060a0d;
    --panel: rgba(10,20,24,.62);
    --line: #1d3a40;
    --cyan: #49e0ea;
    --cyan-dim: #2c8c93;
    --amber: #e8a23f;
    --red: #e85b4f;
    --text: #cdeef1;
    --text-dim: #6f9498;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: radial-gradient(120% 140% at 50% 0%, #0b171c 0%, var(--bg) 55%, #030506 100%);
    color:var(--text);
    font-family:'Share Tech Mono', monospace;
    overflow:hidden;
    overscroll-behavior:none;
  }
  #stage{
    position:fixed; inset:0;
    height:100dvh; width:100vw;
  }

  /* ---------- video layers ---------- */
  video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    background:#000;
  }
  #remoteVideo{ z-index:1; }
  #remoteVideo.hidden{ opacity:0; }
  #localPreview{
    position:absolute;
    z-index:5;
    /* reset every inset/size property the generic video{} rule set —
       otherwise sides this element doesn't redeclare (left/bottom/height)
       keep their video{} values and the box stretches full-height/left. */
    inset:auto; top:auto; right:auto; bottom:auto; left:auto;
    width:auto; height:auto;
    object-fit:cover;
    border:1px solid var(--line);
    box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 4px 18px rgba(0,0,0,.55);
  }

  /* broadcast mode: small PIP top-right */
  body.mode-broadcast #localPreview{
    top: calc(18px + var(--safe-t));
    right: calc(18px + var(--safe-r));
    bottom:auto; left:auto;
    width: 26vw; max-width:220px; min-width:120px;
    height:auto;
    aspect-ratio: 4/3;
    border-radius:2px;
  }
  /* viewer mode: no visible self-video, mic only */
  body.mode-viewer #localPreview{ display:none; }

  /* darken under the HUD chrome */
  #scrim{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    background:linear-gradient(180deg, rgba(3,6,7,.75) 0%, rgba(3,6,7,0) 16%, rgba(3,6,7,0) 78%, rgba(3,6,7,.85) 100%);
  }

  /* ---------- scanline / grid texture ---------- */
  #grain{
    position:absolute; inset:0; z-index:3; pointer-events:none; opacity:.5;
    background-image:
      repeating-linear-gradient(180deg, rgba(73,224,234,.035) 0px, rgba(73,224,234,.035) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:screen;
  }

  /* ---------- corner frame ---------- */
  .corner{
    position:absolute; z-index:6; width:34px; height:34px;
    border-color:var(--cyan-dim); pointer-events:none;
  }
  .corner.tl{ top:calc(14px + var(--safe-t)); left:calc(14px + var(--safe-l)); border-top:2px solid; border-left:2px solid; }
  .corner.tr{ top:calc(14px + var(--safe-t)); right:calc(14px + var(--safe-r)); border-top:2px solid; border-right:2px solid; }
  .corner.bl{ bottom:calc(14px + var(--safe-b)); left:calc(14px + var(--safe-l)); border-bottom:2px solid; border-left:2px solid; }
  .corner.br{ bottom:calc(14px + var(--safe-b)); right:calc(14px + var(--safe-r)); border-bottom:2px solid; border-right:2px solid; }

  /* ---------- top identity tag ---------- */
  #idTag{
    position:absolute; z-index:6;
    top:calc(18px + var(--safe-t)); left:calc(30px + var(--safe-l));
    font-family:'Orbitron', sans-serif; font-weight:700;
    font-size:13px; letter-spacing:.14em; color:var(--cyan);
    text-shadow:0 0 10px rgba(73,224,234,.45);
  }
  #idTag span{
    display:block; margin-top:3px;
    font-family:'Share Tech Mono', monospace; font-weight:400;
    font-size:10px; letter-spacing:.1em; color:var(--text-dim);
  }

  /* ---------- bottom telemetry strip ---------- */
  #telemetry{
    position:absolute; z-index:6;
    left:calc(30px + var(--safe-l)); right:calc(30px + var(--safe-r));
    bottom:calc(18px + var(--safe-b));
    display:flex; align-items:flex-end; justify-content:space-between; gap:14px;
  }
  #statusBlock{ min-width:0; }
  #statusLine{
    font-family:'Orbitron', sans-serif; font-weight:700;
    font-size:13px; letter-spacing:.1em;
    color:var(--amber);
    display:flex; align-items:center; gap:9px;
  }
  #statusLine .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 8px var(--amber);
    flex:none;
  }
  #statusLine.ok{ color:var(--cyan); }
  #statusLine.ok .dot{ background:var(--cyan); box-shadow:0 0 8px var(--cyan); animation:pulse 2s ease-in-out infinite; }
  #statusLine.bad{ color:var(--red); }
  #statusLine.bad .dot{ background:var(--red); box-shadow:0 0 8px var(--red); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  #statusSub{
    margin-top:5px; font-size:10.5px; letter-spacing:.06em; color:var(--text-dim);
    max-width:60vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* mic level meter */
  #meter{
    display:flex; align-items:flex-end; gap:3px; height:22px; flex:none;
  }
  #meter i{
    display:block; width:4px; border-radius:1px;
    background:var(--line);
    height:20%;
    transition:height .07s linear, background .07s linear;
  }

  #retryBtn{
    position:absolute; z-index:6;
    top:calc(18px + var(--safe-t)); right:calc(30px + var(--safe-r));
    font-family:'Share Tech Mono', monospace; font-size:10.5px; letter-spacing:.08em;
    color:var(--text-dim); background:transparent; border:1px solid var(--line);
    padding:6px 10px; cursor:pointer; border-radius:2px;
  }
  #retryBtn:hover{ color:var(--cyan); border-color:var(--cyan-dim); }
  #retryBtn:focus-visible, button:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  body.mode-broadcast #retryBtn{ top:calc(18px + var(--safe-t) + 34px + 6vw + 84px); }

  /* standby placeholder (viewer mode, no signal yet) */
  #standby{
    position:absolute; inset:0; z-index:1;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    text-align:center; padding:0 12vw;
  }
  #standby .glyph{
    width:64px; height:64px; border:1px solid var(--cyan-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 24px rgba(73,224,234,.15) inset;
  }
  #standby .glyph::before{
    content:''; width:10px; height:10px; border-radius:50%;
    background:var(--amber); box-shadow:0 0 10px var(--amber);
    animation:pulse 1.6s ease-in-out infinite;
  }
  #standby h1{
    font-family:'Orbitron', sans-serif; font-size:15px; letter-spacing:.12em;
    color:var(--text); margin:8px 0 0; font-weight:700;
  }
  #standby p{
    font-size:11px; letter-spacing:.05em; color:var(--text-dim); margin:0; line-height:1.6;
  }
  #remoteVideo.hidden ~ #standby{ display:flex; }
  #remoteVideo:not(.hidden) ~ #standby{ display:none; }
  /* broadcast/laptop mode never uses remoteVideo (only remote audio) —
     the "awaiting uplink" placeholder is a viewer-only concept */
  body.mode-broadcast #standby{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    #statusLine.ok .dot, #standby .glyph::before{ animation:none; }
  }

  /* ---------- tuned for the Galaxy A17's 412x892 CSS viewport (and
     similarly-sized compact phones) — viewer mode only ---------- */
  @media (max-width: 480px){
    body.mode-viewer #idTag{
      top:calc(16px + var(--safe-t)); left:calc(20px + var(--safe-l));
      font-size:12px;
    }
    body.mode-viewer #idTag span{ font-size:9px; }
    body.mode-viewer #retryBtn{
      top:calc(16px + var(--safe-t)); right:calc(20px + var(--safe-r));
      font-size:10px; padding:7px 10px;
    }
    body.mode-viewer .corner{ width:26px; height:26px; }
    body.mode-viewer .corner.tl, body.mode-viewer .corner.tr{ top:calc(10px + var(--safe-t)); }
    body.mode-viewer .corner.bl, body.mode-viewer .corner.br{ bottom:calc(10px + var(--safe-b)); }
    body.mode-viewer .corner.tl, body.mode-viewer .corner.bl{ left:calc(10px + var(--safe-l)); }
    body.mode-viewer .corner.tr, body.mode-viewer .corner.br{ right:calc(10px + var(--safe-r)); }
    body.mode-viewer #telemetry{
      left:calc(20px + var(--safe-l)); right:calc(20px + var(--safe-r));
      bottom:calc(16px + var(--safe-b));
      flex-direction:column; align-items:flex-start; gap:10px;
    }
    body.mode-viewer #statusLine{ font-size:14px; }
    body.mode-viewer #statusSub{ max-width:88vw; font-size:11px; white-space:normal; }
    body.mode-viewer #meter{ align-self:flex-end; height:26px; }
    body.mode-viewer #meter i{ width:5px; }
    body.mode-viewer #standby{ padding:0 9vw; gap:14px; }
    body.mode-viewer #standby .glyph{ width:78px; height:78px; }
    body.mode-viewer #standby .glyph::before{ width:12px; height:12px; }
    body.mode-viewer #standby h1{ font-size:17px; letter-spacing:.1em; }
    body.mode-viewer #standby p{ font-size:12.5px; line-height:1.7; }
  }
</style>
</head>
<body>

<div id="stage">
  <video id="remoteVideo" class="hidden" autoplay playsinline></video>
  <div id="standby">
    <div class="glyph"></div>
    <h1>AWAITING UPLINK</h1>
    <p>Standing by for the laptop broadcast.<br>Keep this page open on the handset.</p>
  </div>

  <video id="localPreview" autoplay playsinline muted></video>
  <div id="scrim"></div>
  <div id="grain"></div>

  <i class="corner tl"></i><i class="corner tr"></i>
  <i class="corner bl"></i><i class="corner br"></i>

  <div id="idTag">HOLOMAT·OS<span id="idSub">—</span></div>
  <button id="retryBtn" type="button">RE-SYNC</button>

  <div id="telemetry">
    <div id="statusBlock">
      <div id="statusLine"><i class="dot"></i><span id="statusText">INITIALIZING</span></div>
      <div id="statusSub" id="statusSub"></div>
    </div>
    <div id="meter" aria-hidden="true"></div>
  </div>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>

<script>
(function(){
  "use strict";

  // ---------------- config ----------------
  var params = new URLSearchParams(location.search);
  var isBroadcast = params.get('broadcast') === '1';
  // "id" (optional) names THIS peer; "target" (optional) names the far side.
  var MY_ID     = params.get('id') || (isBroadcast ? 'holomatos-laptop-01' : 'holomatos-phone-01');
  var TARGET_ID = params.get('target') || (isBroadcast ? 'holomatos-phone-01' : 'holomatos-laptop-01');

  document.body.classList.add(isBroadcast ? 'mode-broadcast' : 'mode-viewer');

  var idSub = document.getElementById('idSub');
  idSub.textContent = (isBroadcast ? 'BROADCAST · ' : 'RECEIVER · ') + MY_ID;

  var statusLine = document.getElementById('statusLine');
  var statusText = document.getElementById('statusText');
  var statusSub  = document.getElementById('statusSub');
  var retryBtn   = document.getElementById('retryBtn');
  var remoteVideo = document.getElementById('remoteVideo');
  var remoteAudio = document.getElementById('remoteAudio');
  var localPreview = document.getElementById('localPreview');
  var meterEl = document.getElementById('meter');

  var METER_BARS = 14;
  for (var i=0;i<METER_BARS;i++){ meterEl.appendChild(document.createElement('i')); }
  var meterBars = meterEl.querySelectorAll('i');

  function setStatus(text, sub, state){
    statusText.textContent = text;
    statusSub.textContent = sub || '';
    statusLine.className = state ? state : '';
  }

  // ---------------- mic level meter ----------------
  function attachMeter(stream){
    try{
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var src = ctx.createMediaStreamSource(stream);
      var analyser = ctx.createAnalyser();
      analyser.fftSize = 64;
      src.connect(analyser);
      var data = new Uint8Array(analyser.frequencyBinCount);
      (function tick(){
        analyser.getByteFrequencyData(data);
        var avg = data.reduce(function(a,b){return a+b;},0) / data.length;
        var level = Math.min(1, avg / 90);
        for (var i=0;i<meterBars.length;i++){
          var barThresh = i / meterBars.length;
          var on = level > barThresh;
          meterBars[i].style.height = on ? (24 + i*4) + '%' : '20%';
          meterBars[i].style.background = on ? (i > meterBars.length*0.75 ? '#e85b4f' : '#49e0ea') : '#1d3a40';
        }
        requestAnimationFrame(tick);
      })();
    }catch(e){ /* meter is cosmetic; ignore failures */ }
  }

  // ---------------- media acquisition ----------------
  var localStream = null;
  var peer = null;
  var activeCall = null;
  var reconnectTimer = null;
  var callAttemptTimer = null;

  function getMedia(){
    var constraints = isBroadcast
      ? { video: { facingMode:'user', width:{ideal:1280}, height:{ideal:720} }, audio: true }
      : { video:false, audio:true };
    return navigator.mediaDevices.getUserMedia(constraints);
  }

  function startPeer(){
    setStatus('LINKING NODE', MY_ID, '');
    peer = new Peer(MY_ID, {
      debug: 1
    });

    peer.on('open', function(id){
      setStatus(isBroadcast ? 'NODE ONLINE' : 'STANDBY', 'ID ' + id + ' · target ' + TARGET_ID, '');
      if (isBroadcast){
        beginCallLoop();
      }
    });

    peer.on('call', function(call){
      // viewer side receives the laptop's call and answers with its mic
      activeCall = call;
      call.answer(localStream);
      wireCall(call);
    });

    peer.on('error', function(err){
      console.warn('peer error', err && err.type, err);
      if (err && err.type === 'unavailable-id'){
        setStatus('ID BUSY', 'retrying uplink in 3s…', 'bad');
      } else if (err && err.type === 'peer-unavailable'){
        // normal while waiting for the other device to come online
      } else {
        setStatus('LINK ERROR', (err && err.type) || 'unknown', 'bad');
      }
      scheduleReconnect();
    });

    peer.on('disconnected', function(){
      setStatus('DISCONNECTED', 'reconnecting…', 'bad');
      scheduleReconnect();
    });

    peer.on('close', function(){
      setStatus('NODE CLOSED', 'retrying…', 'bad');
      scheduleReconnect();
    });
  }

  function scheduleReconnect(){
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(function(){
      if (peer && !peer.destroyed){
        try{ peer.reconnect(); }catch(e){ rebuildPeer(); }
      } else {
        rebuildPeer();
      }
    }, 3000);
  }

  function rebuildPeer(){
    try{ if (peer) peer.destroy(); }catch(e){}
    startPeer();
  }

  function beginCallLoop(){
    clearInterval(callAttemptTimer);
    callAttemptTimer = setInterval(function(){
      if (activeCall && activeCall.open) return; // already connected
      if (!peer || peer.disconnected || peer.destroyed) return;
      setStatus('SEEKING RECEIVER', 'calling ' + TARGET_ID + '…', '');
      var call = peer.call(TARGET_ID, localStream);
      if (!call) return;
      activeCall = call;
      wireCall(call);
    }, 3000);
  }

  function wireCall(call){
    call.on('stream', function(remoteStream){
      setStatus('UPLINK ESTABLISHED', TARGET_ID, 'ok');
      if (isBroadcast){
        // incoming = phone mic only
        remoteAudio.srcObject = remoteStream;
        attachMeter(remoteStream);
      } else {
        remoteVideo.srcObject = remoteStream;
        remoteVideo.classList.remove('hidden');
      }
    });
    call.on('close', function(){
      setStatus(isBroadcast ? 'RECEIVER LOST' : 'UPLINK LOST', 'awaiting reconnection…', 'bad');
      remoteVideo.classList.add('hidden');
      remoteVideo.srcObject = null;
      activeCall = null;
    });
    call.on('error', function(err){
      console.warn('call error', err);
      setStatus('CALL ERROR', String(err && err.message || err), 'bad');
      activeCall = null;
    });
  }

  retryBtn.addEventListener('click', function(){
    setStatus('RE-SYNCING', '', '');
    if (activeCall){ try{ activeCall.close(); }catch(e){} activeCall = null; }
    rebuildPeer();
  });

  // ---------------- boot ----------------
  getMedia().then(function(stream){
    localStream = stream;
    if (isBroadcast){
      localPreview.srcObject = stream;
    } else {
      attachMeter(stream); // show the phone's own mic level while idle/sending
    }
    startPeer();
  }).catch(function(err){
    setStatus('MEDIA DENIED', String(err && err.message || err), 'bad');
  });

  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && peer && peer.disconnected){
      try{ peer.reconnect(); }catch(e){}
    }
  });
})();
</script>
</body>
</html>
