<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>AR Hand Tracking - Digital Clock</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #info {
      position: absolute; left: 0; right: 0; top: 0;
      color: #9cf; font: 14px/1.4 system-ui, sans-serif;
      background: rgba(0,0,0,0.7); padding: 8px 12px; z-index: 2;
    }
    #handCanvas {
      position: absolute; inset: 0; pointer-events: none; z-index: 1;
    }
    #gestureDebug {
      position: absolute; right: 10px; bottom: 10px;
      color: #0f0; font: 14px monospace;
      background: rgba(0,0,0,0.7); padding: 8px; z-index: 3;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="info">🤏 Pinch to spawn/grab clock</div>
  <canvas id="handCanvas"></canvas>

  <!-- MediaPipe Hand Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { ARButton } from "https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js";

    let camera, scene, renderer;
    let reticle, controller;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    const panels = [];
    const raycaster = new THREE.Raycaster();
    let activePanel = null;

    // Hand tracking variables
    let hands, cameraFeed;
    let handCanvas, handCtx;
    let currentGesture = 'none';
    let handLandmarks = null;
    let isPinching = false;
    let lastPinchState = false;
    let fingerTipPosition = new THREE.Vector2();

    init();
    initHandTracking();
    animate();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      const geometry = new THREE.RingGeometry(0.06, 0.075, 16).rotateX(-Math.PI / 2);
      const material = new THREE.MeshBasicMaterial({ color: 0x8cdcff });
      reticle = new THREE.Mesh(geometry, material);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      controller = renderer.xr.getController(0);
      controller.addEventListener("select", onSelect);
      scene.add(controller);

      renderer.domElement.addEventListener("click", onCanvasClick);

      document.body.appendChild(ARButton.createButton(renderer, {
        requiredFeatures: ["hit-test"],
        optionalFeatures: ["dom-overlay"],
        domOverlay: { root: document.body }
      }));

      window.addEventListener("resize", onWindowResize);
    }

    // MEDIAPIPE HAND TRACKING INIT
    function initHandTracking() {
      handCanvas = document.getElementById('handCanvas');
      handCanvas.width = window.innerWidth;
      handCanvas.height = window.innerHeight;
      handCtx = handCanvas.getContext('2d');

      hands = new Hands({
        locateFile: (file) => {
          return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
      });

      hands.onResults(onHandResults);

      const videoElement = document.createElement('video');
      videoElement.style.display = 'none';
      document.body.appendChild(videoElement);

      cameraFeed = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({image: videoElement});
        },
        width: 640,
        height: 480
      });

      cameraFeed.start();
    }

    function onHandResults(results) {
      handCtx.save();
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        handLandmarks = results.multiHandLandmarks[0];
        
        // Draw clean skeleton - Vision Pro style
        drawVisionProSkeleton(handLandmarks);
        
        const gesture = detectGesture(handLandmarks);
        currentGesture = gesture;

        const indexTip = handLandmarks[8];
        fingerTipPosition.x = (indexTip.x * 2 - 1);
        fingerTipPosition.y = -(indexTip.y * 2 - 1);

        if (gesture === 'pinch' && !lastPinchState) {
          onPinchStart();
        } else if (gesture !== 'pinch' && lastPinchState) {
          onPinchEnd();
        }
        lastPinchState = (gesture === 'pinch');

      } else {
        handLandmarks = null;
        currentGesture = 'none';
      }

      handCtx.restore();
    }

    function drawVisionProSkeleton(landmarks) {
      const w = handCanvas.width;
      const h = handCanvas.height;

      // Connection lines - clean and minimal
      const connections = [
        [0,1],[1,2],[2,3],[3,4], // Thumb
        [0,5],[5,6],[6,7],[7,8], // Index
        [0,9],[9,10],[10,11],[11,12], // Middle
        [0,13],[13,14],[14,15],[15,16], // Ring
        [0,17],[17,18],[18,19],[19,20], // Pinky
        [5,9],[9,13],[13,17] // Palm
      ];

      // Gradient effect like Vision Pro
      handCtx.lineWidth = 2;
      handCtx.lineCap = 'round';
      handCtx.lineJoin = 'round';

      connections.forEach(([start, end]) => {
        const startPoint = landmarks[start];
        const endPoint = landmarks[end];
        
        // Create gradient for each line
        const gradient = handCtx.createLinearGradient(
          startPoint.x * w, startPoint.y * h,
          endPoint.x * w, endPoint.y * h
        );
        
        // Pink to white gradient like Vision Pro
        gradient.addColorStop(0, 'rgba(255, 150, 200, 0.8)');
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0.6)');
        
        handCtx.strokeStyle = gradient;
        handCtx.beginPath();
        handCtx.moveTo(startPoint.x * w, startPoint.y * h);
        handCtx.lineTo(endPoint.x * w, endPoint.y * h);
        handCtx.stroke();
      });

      // Small dots at joints - minimal
      landmarks.forEach((landmark) => {
        handCtx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        handCtx.beginPath();
        handCtx.arc(landmark.x * w, landmark.y * h, 3, 0, Math.PI * 2);
        handCtx.fill();
      });
    }

    function detectGesture(landmarks) {
      const thumbTip = landmarks[4];
      const indexTip = landmarks[8];

      const pinchDist = Math.sqrt(
        Math.pow(thumbTip.x - indexTip.x, 2) +
        Math.pow(thumbTip.y - indexTip.y, 2) +
        Math.pow(thumbTip.z - indexTip.z, 2)
      );

      if (pinchDist < 0.05) {
        return 'pinch';
      }

      return 'none';
    }

    function onPinchStart() {
      console.log('Pinch detected!');
      
      const hitPanel = getPanelAtFingerTip();
      
      if (activePanel) {
        activePanel.userData.selected = false;
        activePanel.scale.setScalar(1);
        activePanel = null;
      } else if (hitPanel) {
        activePanel = hitPanel;
        activePanel.userData.selected = true;
        activePanel.scale.setScalar(1.08);
      } else if (reticle.visible) {
        spawnClockPanel();
      }
    }

    function onPinchEnd() {
      console.log('Pinch released');
    }

    function getPanelAtFingerTip() {
      if (panels.length === 0 || !handLandmarks) return null;

      raycaster.setFromCamera(fingerTipPosition, camera);
      const hits = raycaster.intersectObjects(panels, true);
      
      if (!hits.length) return null;

      const candidate = hits[0].object.parent;
      return candidate && candidate.userData && candidate.userData.isPanel ? candidate : null;
    }

    function onSelect() {
      const hitPanel = getPanelUnderGaze();

      if (activePanel) {
        activePanel.userData.selected = false;
        activePanel.scale.setScalar(1);
        activePanel = null;
        return;
      }

      if (hitPanel) {
        activePanel = hitPanel;
        activePanel.userData.selected = true;
        activePanel.scale.setScalar(1.08);
        return;
      }
    }

    function onCanvasClick() {
      if (reticle.visible) {
        spawnClockPanel();
      }
    }

    function getPanelUnderGaze() {
      if (panels.length === 0) return null;

      const origin = new THREE.Vector3();
      const direction = new THREE.Vector3();
      camera.getWorldPosition(origin);
      camera.getWorldDirection(direction);
      raycaster.set(origin, direction);

      const hits = raycaster.intersectObjects(panels, true);
      if (!hits.length) return null;

      const candidate = hits[0].object.parent;
      return candidate && candidate.userData && candidate.userData.isPanel ? candidate : null;
    }

    function spawnClockPanel() {
      const panel = makeClockPanel();
      panel.position.setFromMatrixPosition(reticle.matrix);
      panel.quaternion.setFromRotationMatrix(reticle.matrix);
      scene.add(panel);
      panels.push(panel);
    }

    function createVisionProGlass() {
      return new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.15,
        transmission: 0.9,
        roughness: 0.3,
        metalness: 0,
        clearcoat: 0.5,
        clearcoatRoughness: 0.2,
        reflectivity: 0.4,
        ior: 1.5,
        thickness: 0.5,
        side: THREE.DoubleSide
      });
    }

    function makeClockPanel() {
      const group = new THREE.Group();

      const panelGeom = new THREE.PlaneGeometry(0.8, 0.3);
      const panelMat = createVisionProGlass();
      const panel = new THREE.Mesh(panelGeom, panelMat);
      group.add(panel);

      const borderGeom = new THREE.EdgesGeometry(panelGeom);
      const borderMat = new THREE.LineBasicMaterial({ 
        color: 0xffffff, 
        transparent: true, 
        opacity: 0.4
      });
      const border = new THREE.LineSegments(borderGeom, borderMat);
      group.add(border);

      // Digital clock canvas
      const clockCanvas = document.createElement('canvas');
      clockCanvas.width = 512;
      clockCanvas.height = 128;
      const clockCtx = clockCanvas.getContext('2d');
      const clockTexture = new THREE.CanvasTexture(clockCanvas);
      clockTexture.minFilter = THREE.LinearFilter;
      clockTexture.magFilter = THREE.LinearFilter;

      const clockMat = new THREE.MeshBasicMaterial({ map: clockTexture, transparent: true });
      const clockMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 0.25), clockMat);
      clockMesh.position.z = 0.002;
      group.add(clockMesh);

      group.userData.isPanel = true;
      group.userData.selected = false;
      group.userData.clockCtx = clockCtx;
      group.userData.clockTexture = clockTexture;
      group.scale.setScalar(1);

      updateClock(group);

      return group;
    }

    function updateClock(panel) {
      if (!panel.userData.clockCtx) return;

      const now = new Date();
      const timeString = now.toLocaleTimeString('en-US', { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit',
        hour12: true 
      });
      const dateString = now.toLocaleDateString('en-US', { 
        weekday: 'short', 
        month: 'short', 
        day: 'numeric' 
      });

      const ctx = panel.userData.clockCtx;
      const tex = panel.userData.clockTexture;

      ctx.clearRect(0, 0, 512, 128);

      // Draw time
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 56px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(timeString, 256, 55);

      // Draw date
      ctx.font = '24px system-ui';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.fillText(dateString, 256, 100);

      tex.needsUpdate = true;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      handCanvas.width = window.innerWidth;
      handCanvas.height = window.innerHeight;
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace("viewer").then((space) => {
            session.requestHitTestSource({ space }).then((source) => {
              hitTestSource = source;
            });
          });

          session.addEventListener("end", () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });

          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      if (activePanel && reticle.visible) {
        activePanel.position.setFromMatrixPosition(reticle.matrix);
        activePanel.quaternion.setFromRotationMatrix(reticle.matrix);
      }

      // Update all clocks
      panels.forEach(panel => {
        if (panel.userData.clockCtx) {
          updateClock(panel);
        }
      });

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
