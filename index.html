<!DOCTYPE html>
<html>
<head>
  <title>Markerless AR Cube</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- WebXR AR hit test -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: sans-serif;
    }

    #start-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 18px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 15px;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>

  <button id="start-button">Start AR</button>

  <a-scene id="ar-scene" embedded webxr="optionalFeatures: hit-test" xrweb="xrMode: ar" style="display:none;" vr-mode-ui="enabled: false">

    <!-- Cube placeholder (hidden until placed) -->
    <a-box id="cube" position="0 0 0" depth="0.3" height="0.3" width="0.3"
           material="color: red; opacity: 0.8"
           rotation="0 45 0"
           visible="false">
    </a-box>

    <!-- Camera -->
    <a-entity camera look-controls></a-entity>

    <!-- Lighting -->
    <a-light type="ambient" intensity="0.5"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.7"></a-light>

  </a-scene>

  <script>
    const startButton = document.getElementById('start-button');
    const arScene = document.getElementById('ar-scene');
    const cube = document.getElementById('cube');

    // Request fullscreen
    function goFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen();
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      else if (elem.mozRequestFullScreen) elem.mozRequestFullScreen();
      else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
    }

    // Start AR on button click
    startButton.addEventListener('click', async () => {
      startButton.style.display = 'none';
      arScene.style.display = 'block';
      goFullscreen();

      // Request AR session
      if (navigator.xr) {
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test', 'dom-overlay'],
          domOverlay: { root: document.body }
        });

        const renderer = arScene.renderer;
        renderer.xr.setSession(session);

        const viewerSpace = await session.requestReferenceSpace('viewer');
        const hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

        const onXRFrame = (time, frame) => {
          const referenceSpace = renderer.xr.getReferenceSpace();
          const hitTestResults = frame.getHitTestResults(hitTestSource);

          if (hitTestResults.length > 0 && !cube.getAttribute('visible')) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);

            cube.setAttribute('position', `${pose.transform.position.x} ${pose.transform.position.y} ${pose.transform.position.z}`);
            cube.setAttribute('visible', true);
          }

          session.requestAnimationFrame(onXRFrame);
        };
        session.requestAnimationFrame(onXRFrame);
      } else {
        alert('WebXR not supported on this device.');
      }

      // Tap to change cube color
      cube.addEventListener('click', () => {
        const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'cyan'];
        const randomColor = colors[Math.floor(Math.random() * colors.length)];
        cube.setAttribute('material', 'color', randomColor);
      });
    });
  </script>

</body>
</html>
