<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Holomatos Remote Host</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; width:100%; overflow:hidden;
    background:#0a0a0c; color:#ebebf0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action:manipulation; user-select:none;
  }
  #app {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100vh; width:100vw; padding:20px; gap:16px;
  }
  .preview {
    width:100%; max-width:640px; aspect-ratio:4/3; border-radius:14px;
    background:#141416; border:1.5px solid #2a2a30; overflow:hidden; position:relative;
  }
  .preview video {
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .preview .label {
    position:absolute; top:10px; left:10px;
    background:rgba(0,0,0,0.6); color:#eba53c;
    padding:4px 10px; border-radius:6px; font-size:11px; font-weight:600;
  }
  .btn {
    padding:14px 28px; border-radius:12px; border:none;
    background:linear-gradient(180deg,#eba53c,#c7852a); color:#0a0a0c;
    font-size:14px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .btn:active { transform:scale(0.96); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .status {
    font-size:13px; color:#6b6b76; text-align:center; max-width:500px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="preview">
    <video id="camera" autoplay playsinline muted></video>
    <div class="label" id="statusLabel">Initializing...</div>
  </div>

  <button class="btn" id="startBtn">
    <span>🎥</span> Start Camera & Mic
  </button>

  <div class="status" id="status">
    This page captures your camera and microphone and streams them to your phone.
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function() {
  // Read peer ID from URL param, or use a simple numeric ID
  const params = new URLSearchParams(window.location.search);
  let peerId = params.get('peerId') || params.get('host') || '1234567890';

  const camera = document.getElementById('camera');
  const startBtn = document.getElementById('startBtn');
  const statusEl = document.getElementById('status');
  const statusLabel = document.getElementById('statusLabel');

  let peer = null;
  let localStream = null;
  let audioContext = null;
  let peerReady = false;
  let mediaPc = null;
  let mediaConn = null;

  function log(msg) {
    console.log('[Holomatos]', msg);
    statusLabel.textContent = msg;
  }

  function playAudioChunk(int16Array) {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    const float32 = new Float32Array(int16Array.length);
    for (let i = 0; i < int16Array.length; i++) {
      float32[i] = int16Array[i] / 0x8000;
    }
    const buffer = audioContext.createBuffer(1, float32.length, 16000);
    buffer.getChannelData(0).set(float32);
    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.start();
  }

  async function start() {
    if (peer) {
      statusEl.textContent = 'Already started';
      return;
    }

    try {
      statusLabel.textContent = 'Requesting camera/mic...';
      statusEl.textContent = 'Please allow camera and microphone access.';

      localStream = await navigator.mediaDevices.getUserMedia({
        video: { width:{ideal:1280}, height:{ideal:720}, facingMode:"user" },
        audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true }
      });

      const videoTracks = localStream.getVideoTracks();
      const audioTracks = localStream.getAudioTracks();
      console.log('Host localStream tracks:', { video: videoTracks.length, audio: audioTracks.length });
      if (videoTracks.length === 0) {
        statusEl.textContent = 'Camera not available. Check permissions.';
      }

      camera.srcObject = localStream;
      await camera.play();
      statusLabel.textContent = 'Camera active. Connecting to signaling...';

      startBtn.disabled = true;
      startBtn.textContent = 'Connecting...';

      peer = new Peer(peerId, {
        host: '0.peerjs.com',
        port: 443,
        path: '/',
        secure: true,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
          ]
        }
      });

      peer.on('open', (id) => {
        log('Host peer ID: ' + id);
        peerReady = true;
        statusEl.textContent = 'Host ready. Phone URL: https://akshat2482.github.io?host=' + id;
      });

      peer.on('call', (call) => {
        console.log('Host received call from:', call.peer);
        log('Phone connecting...');
        const videoTrack = localStream ? localStream.getVideoTracks()[0] : null;
        const audioTrack = localStream ? localStream.getAudioTracks()[0] : null;
        console.log('Host answering call with tracks:', { videoTrack, audioTrack });
        console.log('Host localStream ready:', !!localStream);
        if (localStream) {
          try {
            call.answer(localStream);
            console.log('Host answered call with localStream');
          } catch (e) {
            console.error('Host call.answer failed:', e);
            statusEl.textContent = 'Failed to answer call: ' + (e.message || e);
          }
        } else {
          console.warn('Call received but localStream has no tracks');
          statusEl.textContent = 'Phone called before camera/mic started';
          call.answer();
        }
        call.on('stream', (remoteStream) => {
          log('Phone stream received');
          console.log('Host got remote stream tracks:', remoteStream.getTracks().map(t => t.kind));
        });
        call.on('close', () => {
          log('Phone disconnected');
          statusEl.textContent = 'Phone disconnected. Waiting for new connection...';
        });
        call.on('error', (err) => {
          console.error('Call error:', err);
          statusEl.textContent = 'Call error: ' + (err.type || err.message || 'unknown');
        });
      });

      peer.on('connection', (conn) => {
        log('Phone data channel open');
        statusEl.textContent = 'Connected! Receiving audio...';
        mediaConn = conn;
        mediaConn.binaryType = 'arraybuffer';

        mediaConn.on('data', (data) => {
          if (typeof data === 'string') {
            handleSignaling(data);
            return;
          }
          if (data instanceof ArrayBuffer) {
            const int16 = new Int16Array(data);
            playAudioChunk(int16);
          }
        });

        mediaConn.on('close', () => {
          log('Data channel closed');
          mediaConn = null;
        });

        setupMediaPeerConnection();
      });

      peer.on('error', (err) => {
        console.error('Peer error:', err);
        log('Error: ' + err.type);
        statusEl.textContent = 'Connection error: ' + err.type;
        startBtn.disabled = false;
        startBtn.textContent = 'Retry';
      });

    } catch (e) {
      console.error('Start error:', e);
      log('Error: ' + e.message);
      statusEl.textContent = 'Error: ' + e.message;
      startBtn.disabled = false;
      startBtn.textContent = 'Retry';
    }
  }

  function setupMediaPeerConnection() {
    if (mediaPc) {
      try { mediaPc.close(); } catch (e) {}
      mediaPc = null;
    }

    mediaPc = new RTCPeerConnection({
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
      ]
    });

    if (localStream) {
      localStream.getTracks().forEach(track => mediaPc.addTrack(track, localStream));
    }

    mediaPc.ontrack = (event) => {
      console.log('Host ontrack:', event.track.kind, event.streams.length);
      if (event.track.kind === 'audio' && event.streams[0]) {
        const audio = new Audio();
        audio.srcObject = event.streams[0];
        audio.play();
      }
    };

    mediaPc.onicecandidate = (event) => {
      if (event.candidate && mediaConn && mediaConn.readyState === 'open') {
        console.log('Host sending ICE candidate');
        mediaConn.send(JSON.stringify({ type: 'ice-candidate', candidate: event.candidate }));
      }
    };

    mediaPc.oniceconnectionstatechange = () => {
      console.log('Host ICE state:', mediaPc.iceConnectionState);
      statusEl.textContent = 'ICE: ' + mediaPc.iceConnectionState;
    };
  }

  async function handleSignaling(msg) {
    if (!mediaPc) return;
    try {
      const data = JSON.parse(msg);
      if (data.type === 'offer') {
        console.log('Host got offer');
        await mediaPc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        const answer = await mediaPc.createAnswer();
        await mediaPc.setLocalDescription(answer);
        if (mediaConn && mediaConn.readyState === 'open') {
          mediaConn.send(JSON.stringify({ type: 'answer', sdp: answer }));
        }
        statusEl.textContent = 'Sent answer, waiting for ICE...';
      } else if (data.type === 'answer') {
        console.log('Host got answer');
        await mediaPc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      } else if (data.type === 'ice-candidate') {
        console.log('Host got ICE candidate');
        try {
          await mediaPc.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) {}
      }
    } catch (e) {
      console.error('Host signaling error:', e);
    }
  }

  startBtn.addEventListener('click', start);
})();
</script>
</body>
</html>
