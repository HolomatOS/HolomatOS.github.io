<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>YOLO Scan</title>
  <style>
    html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:Arial;touch-action:none}
    .container{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center}
    video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:none}
    canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:none}
    .timer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0ff;font-size:60px;font-weight:bold;z-index:10;text-shadow:0 0 20px #0ff}
    .hud-top-left{position:absolute;top:10px;left:10px;width:140px;background:rgba(0,255,255,0.1);border:1px solid #0ff;border-radius:6px;padding:8px;color:#0ff;font-size:10px;display:none;z-index:5;font-family:monospace;flex-direction:column}
    .hud-middle-left{position:absolute;top:50%;left:10px;transform:translateY(-50%);width:140px;background:rgba(0,255,255,0.1);border:1px solid #0ff;border-radius:6px;padding:8px;color:#0ff;font-size:9px;display:none;z-index:5;max-height:200px;overflow-y:auto;font-family:monospace;flex-direction:column}
    .hud-top-left.visible, .hud-middle-left.visible {display:flex;}
    .hud-title{font-weight:bold;margin-bottom:6px;border-bottom:1px solid #0ff;padding-bottom:4px;font-size:11px}
    .hud-content{line-height:1.4;display:flex;flex-direction:column;gap:3px}
    .object-box{color:#0f0;margin:3px 0;padding:3px;background:rgba(0,255,0,0.1);border-left:2px solid #0f0;font-size:9px}
    .compass-container{position:absolute;bottom:10px;left:10px;width:100px;height:100px;display:none;align-items:center;justify-content:center;z-index:5;filter:drop-shadow(0 0 15px rgba(0,255,255,0.6))}
    .compass-container.visible {display:flex;}
    .compass-dial{position:absolute;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(50,100,150,0.9),rgba(10,30,60,0.95));border:2px solid;border-color:#0ff #00a0c0 #0088aa #0ff;display:flex;align-items:center;justify-content:center;font-size:8px;color:#0ff;font-family:monospace;font-weight:bold;box-shadow:inset 0 0 15px rgba(0,0,0,0.8),0 0 20px rgba(0,255,255,0.4)}
    .compass-cardinal{position:absolute;width:85px;height:85px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#0f0;font-weight:bold;text-shadow:0 0 6px rgba(0,255,0,0.8);z-index:3}
    .compass-cardinal span{position:absolute}
    .compass-cardinal span:nth-child(1){top:5px;color:#0f0;text-shadow:0 0 8px #0f0}
    .compass-cardinal span:nth-child(2){left:5px;color:#0ff}
    .compass-cardinal span:nth-child(3){right:5px;color:#0ff}
    .compass-cardinal span:nth-child(4){bottom:5px;color:#ff3333}
    .compass-needle{position:absolute;width:2px;height:40px;background:linear-gradient(180deg,#0f0 0%,#00ff00 40%,#0099ff 60%,#0077ff 100%);border-radius:1px;left:50%;top:8px;transform-origin:center 42px;box-shadow:0 0 8px rgba(0,255,0,0.9);z-index:10}
    .compass-center{position:absolute;width:10px;height:10px;background:radial-gradient(circle at 30% 30%,#00ff00,#00aa00);border-radius:50%;border:2px solid #0ff;top:50%;left:50%;transform:translate(-50%,-50%);z-index:11;box-shadow:0 0 10px rgba(0,255,0,0.9)}
    .compass-heading{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);color:#0f0;font-size:9px;font-family:monospace;font-weight:bold;white-space:nowrap;text-shadow:0 0 8px rgba(0,255,0,0.8)}
    .audio-visualizer{position:absolute;top:10px;right:10px;width:150px;height:40px;display:none;align-items:center;justify-content:center;z-index:5;background:rgba(0,20,40,0.6);border:1px solid #0ff;border-radius:6px;padding:6px;gap:2px;filter:drop-shadow(0 0 10px rgba(255,0,255,0.5))}
    .audio-visualizer.visible {display:flex;}
    .audio-bar{width:3px;background:linear-gradient(180deg,#ff00ff,#ff69b4);border-radius:1px;box-shadow:0 0 6px #ff00ff;transition:height 50ms ease-out;min-height:3px}
  </style>
</head>
<body>
  <div class="container">
    <div class="timer" id="timer">10</div>
  </div>
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  
  <div class="hud-top-left" id="hudTopLeft">
    <div class="hud-title">SYSTEM STATUS</div>
    <div class="hud-content">
      <div>TIME: <span id="timeDisplay">--:--:--</span></div>
      <div>DATE: <span id="dateDisplay">--/--/----</span></div>
      <div>MODEL: <span id="modelStatus">✓ Ready</span></div>
    </div>
  </div>
  <div class="hud-middle-left" id="hudMiddleLeft">
    <div class="hud-title">DETECTIONS</div>
    <div class="hud-content" id="objectsList">Scanning...</div>
  </div>

  <div class="compass-container" id="compassContainer">
    <div class="compass-dial">
      <div class="compass-cardinal" id="compassCardinal">
        <span>N</span>
        <span>W</span>
        <span>E</span>
        <span>S</span>
      </div>
      <div class="compass-needle" id="compassNeedle"></div>
      <div class="compass-center"></div>
      <div class="compass-heading" id="compassHeading">0°</div>
    </div>
  </div>

  <div class="audio-visualizer" id="audioVisualizer">
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
  </div>

<script>
const canvas = document.getElementById('canvas');
const camera = document.getElementById('camera');
const timer = document.getElementById('timer');
const ctx = canvas.getContext('2d');
const objectsList = document.getElementById('objectsList');
const timeDisplay = document.getElementById('timeDisplay');
const dateDisplay = document.getElementById('dateDisplay');

let sweeping = false;
let sweepPos = 0;
let scanComplete = false;
let audioContext = null;
let analyser = null;
let dataArray = null;

// Hardcoded random objects
const randomObjects = [
  'person', 'chair', 'laptop', 'bottle', 'cup', 'phone', 
  'book', 'backpack', 'keyboard', 'mouse', 'plant', 'clock'
];

function getRandomObjects() {
  const count = Math.floor(Math.random() * 4) + 3; // 3-6 objects
  const shuffled = [...randomObjects].sort(() => 0.5 - Math.random());
  return shuffled.slice(0, count).map(obj => ({
    name: obj,
    confidence: Math.floor(Math.random() * 30) + 70 // 70-99%
  }));
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

async function requestCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: 'environment'}
    });
    camera.srcObject = stream;
  } catch(err) {
    console.error('Camera error:', err);
  }
}

function updateTimeDate() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const mins = String(now.getMinutes()).padStart(2, '0');
  const secs = String(now.getSeconds()).padStart(2, '0');
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  const year = now.getFullYear();
  
  timeDisplay.textContent = `${hours}:${mins}:${secs}`;
  dateDisplay.textContent = `${month}/${day}/${year}`;
}

function displayRandomObjects() {
  const objects = getRandomObjects();
  let html = '';
  objects.forEach(obj => {
    html += `<div class="object-box">▪ ${obj.name} (${obj.confidence}%)</div>`;
  });
  objectsList.innerHTML = html;
}

function continueLiveCamera() {
  ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);
  requestAnimationFrame(continueLiveCamera);
}

function sweep() {
  if (!sweeping) return;
  
  ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);
  
  if (sweepPos <= canvas.width) {
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sweepPos, 0);
    ctx.lineTo(sweepPos, canvas.height);
    ctx.stroke();
    
    sweepPos += 3;
    requestAnimationFrame(sweep);
  } else {
    sweeping = false;
    scanComplete = true;
    
    document.getElementById('hudTopLeft').classList.add('visible');
    document.getElementById('hudMiddleLeft').classList.add('visible');
    document.getElementById('compassContainer').classList.add('visible');
    document.getElementById('audioVisualizer').classList.add('visible');
    
    displayRandomObjects();
    
    if (!audioContext) {
      initializeAudioVisualizer().then(() => {
        updateAudioVisualizer();
      });
    }
    
    continueLiveCamera();
    
    // Refresh objects every 5 seconds
    setInterval(displayRandomObjects, 5000);
  }
}

requestCamera();

// COMPASS
let currentHeading = 0;

function initializeCompass() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(permissionState => {
        if (permissionState === 'granted') {
          window.addEventListener('deviceorientation', updateCompass);
        }
      })
      .catch(console.error);
  } else {
    window.addEventListener('deviceorientation', updateCompass);
  }
}

function updateCompass(event) {
  let heading = event.alpha;
  if (heading === null) return;
  
  heading = (heading + 360) % 360;
  currentHeading = heading;
  
  const cardinal = document.getElementById('compassCardinal');
  cardinal.style.transform = `rotate(${heading}deg)`;
  
  let direction = 'N';
  if (heading > 337.5 || heading <= 22.5) direction = 'N';
  else if (heading > 22.5 && heading <= 67.5) direction = 'NE';
  else if (heading > 67.5 && heading <= 112.5) direction = 'E';
  else if (heading > 112.5 && heading <= 157.5) direction = 'SE';
  else if (heading > 157.5 && heading <= 202.5) direction = 'S';
  else if (heading > 202.5 && heading <= 247.5) direction = 'SW';
  else if (heading > 247.5 && heading <= 292.5) direction = 'W';
  else if (heading > 292.5 && heading <= 337.5) direction = 'NW';
  
  document.getElementById('compassHeading').textContent = Math.round(heading) + '° ' + direction;
}

window.addEventListener('load', () => {
  initializeCompass();
});

// AUDIO VISUALIZER
async function initializeAudioVisualizer() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 128;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
  } catch(err) {
    console.error('Audio error:', err);
  }
}

function updateAudioVisualizer() {
  if (!analyser || !dataArray) return;
  
  analyser.getByteFrequencyData(dataArray);
  const bars = document.querySelectorAll('.audio-bar');
  const step = Math.floor(dataArray.length / bars.length);
  
  bars.forEach((bar, index) => {
    const value = dataArray[index * step];
    const height = (value / 255) * 35;
    bar.style.height = Math.max(3, height) + 'px';
  });
  
  requestAnimationFrame(updateAudioVisualizer);
}

// Enter fullscreen function
function enterFullscreen() {
  const elem = document.documentElement;
  if (elem.requestFullscreen) {
    elem.requestFullscreen();
  } else if (elem.webkitRequestFullscreen) {
    elem.webkitRequestFullscreen();
  } else if (elem.msRequestFullscreen) {
    elem.msRequestFullscreen();
  }
}

// COUNTDOWN
let countdown = 10;
timer.textContent = countdown;

const countdownInterval = setInterval(() => {
  countdown--;
  timer.textContent = countdown;
  if (countdown <= 0) {
    clearInterval(countdownInterval);
    timer.style.display = 'none';
    
    // Enter fullscreen
    enterFullscreen();
    
    camera.style.display = 'block';
    canvas.style.display = 'block';
    sweeping = true;
    
    updateTimeDate();
    setInterval(updateTimeDate, 1000);
    
    sweep();
  }
}, 1000);
</script>
</body>
</html>
