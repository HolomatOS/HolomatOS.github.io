<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TELEKINESIS</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --grn:#00ff88;--grn2:rgba(0,255,136,.15);
  --red:#ff2244;--gold:#ffcc00;--dark:#000;
  --ggrn:rgba(0,255,136,.8);
}
body{background:#000;overflow:hidden;font-family:'Share Tech Mono',monospace;touch-action:none}

/* Video feed */
#vid{
  position:fixed;inset:0;width:100%;height:100%;
  object-fit:cover;z-index:0;
  transform:scaleX(-1); /* mirror selfie cam */
}

/* 2D joint overlay canvas (green dots) */
#dotCanvas{
  position:fixed;inset:0;width:100%;height:100%;
  z-index:2;pointer-events:none;
  transform:scaleX(-1);
}

/* Three.js canvas */
#threeCanvas{
  position:fixed;inset:0;width:100%;height:100%;
  z-index:3;pointer-events:none;
}

/* UI */
.screen{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px;gap:16px;text-align:center;
}
.screen.hidden{display:none!important}

/* BOOT */
#boot{background:radial-gradient(ellipse at 50% 50%,#050f05 0%,#000 70%)}
.tk-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:64px;letter-spacing:8px;
  background:linear-gradient(180deg,#00ff88 0%,#00aa55 60%,#003322 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1;margin-bottom:-8px;
  filter:drop-shadow(0 0 20px rgba(0,255,136,.5));
  animation:glow 3s ease-in-out infinite;
}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 20px rgba(0,255,136,.4))}50%{filter:drop-shadow(0 0 40px rgba(0,255,136,.9))}}
.tk-sub{font-size:9px;letter-spacing:6px;color:#1a3326;margin-bottom:8px}
.tk-desc{font-size:8px;color:#0a1f14;letter-spacing:1px;line-height:2.4;margin-bottom:4px}
.tk-desc span{color:#004422}
.go-btn{
  padding:14px 44px;background:transparent;
  border:1px solid var(--grn);color:var(--grn);
  font-family:'Share Tech Mono',monospace;font-size:11px;
  letter-spacing:4px;cursor:pointer;transition:all .3s;
  box-shadow:0 0 20px rgba(0,255,136,.1);
  -webkit-appearance:none;
}
.go-btn:hover,.go-btn:active{
  background:var(--grn);color:#000;
  box-shadow:0 0 40px rgba(0,255,136,.5);
}
.go-btn:active{transform:scale(.96)}
#bootErr{font-size:8px;color:var(--red);letter-spacing:1px;display:none;margin-top:4px;line-height:2}

/* LOADING */
#loading{background:rgba(0,0,0,.95)}
.ld-title{font-size:12px;letter-spacing:5px;color:var(--grn)}
.bar-wrap{width:260px;height:2px;background:#0a1f0a}
.bar-fill{height:100%;background:linear-gradient(90deg,#003322,var(--grn));width:0%;transition:width .3s}
.ld-msg{font-size:8px;color:#1a3326;letter-spacing:2px}

/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}

/* Corners */
.hc{position:absolute;width:28px;height:28px;border-color:var(--grn);border-style:solid;opacity:.35}
.hc.tl{top:12px;left:12px;border-width:2px 0 0 2px}
.hc.tr{top:12px;right:12px;border-width:2px 2px 0 0}
.hc.bl{bottom:12px;left:12px;border-width:0 0 2px 2px}
.hc.br{bottom:12px;right:12px;border-width:0 2px 2px 0}

/* Scan line */
.sln{position:absolute;top:0;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--grn),transparent);opacity:.08;animation:sc 4s linear infinite}
@keyframes sc{from{top:0}to{top:100%}}

/* Status */
#status{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.8);border:1px solid rgba(0,255,136,.2);
  border-top:2px solid var(--grn);
  padding:8px 18px;font-size:8px;letter-spacing:3px;
  color:var(--grn);text-shadow:0 0 8px var(--ggrn);
  white-space:nowrap;
}

/* Grip indicator */
#gripBar{
  position:absolute;top:18px;left:50%;transform:translateX(-50%);
  display:flex;gap:3px;align-items:center;opacity:0;transition:opacity .3s;
}
#gripBar span{font-size:7px;letter-spacing:3px;color:var(--grn);margin-right:6px}
.grip-pip{width:8px;height:8px;border-radius:50%;background:#0a1f0a;border:1px solid var(--grn);transition:background .15s}
.grip-pip.on{background:var(--grn);box-shadow:0 0 6px var(--ggrn)}

/* Lock indicator */
#lockRing{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:60px;height:60px;border-radius:50%;
  border:2px solid var(--grn);opacity:0;
  box-shadow:0 0 20px rgba(0,255,136,.4);
  pointer-events:none;transition:opacity .2s;
  display:flex;align-items:center;justify-content:center;
}
#lockRing.visible{opacity:1}
#lockRing::after{content:'LOCK';font-size:7px;letter-spacing:2px;color:var(--grn)}

/* Throw streak */
#throwFX{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:6px;
  color:var(--grn);opacity:0;pointer-events:none;white-space:nowrap;
  text-shadow:0 0 30px var(--ggrn);transition:opacity .1s;
}

/* Score */
#score{
  position:absolute;top:14px;right:52px;
  font-size:9px;letter-spacing:2px;color:var(--grn);
  text-shadow:0 0 8px var(--ggrn);
}

/* Dot label */
#dotLabel{
  position:absolute;bottom:58px;left:50%;transform:translateX(-50%);
  font-size:7px;letter-spacing:3px;color:rgba(0,255,136,.4);
}
</style>
</head>
<body>

<video id="vid" playsinline autoplay muted></video>
<canvas id="dotCanvas"></canvas>
<canvas id="threeCanvas"></canvas>

<!-- BOOT -->
<div id="boot" class="screen">
  <div class="tk-logo">TELE<br>KINESIS</div>
  <div class="tk-sub">HAND TRACKING · PHYSICS · AR</div>
  <div class="tk-desc">
    <span>POINT</span> finger at an orb to target it<br>
    <span>CLOSE FIST</span> to grab and hold it<br>
    <span>FLICK</span> your hand to throw it<br>
    21 landmarks · green joint overlay
  </div>
  <button class="go-btn" id="startBtn">⚡ ACTIVATE POWER</button>
  <div id="bootErr"></div>
</div>

<!-- LOADING -->
<div id="loading" class="screen hidden">
  <div class="ld-title">INITIALIZING</div>
  <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>
  <div class="ld-msg" id="ldMsg">LOADING...</div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hc tl"></div><div class="hc tr"></div>
  <div class="hc bl"></div><div class="hc br"></div>
  <div class="sln"></div>
  <div id="gripBar">
    <span>GRIP</span>
    <div class="grip-pip" id="gp0"></div>
    <div class="grip-pip" id="gp1"></div>
    <div class="grip-pip" id="gp2"></div>
    <div class="grip-pip" id="gp3"></div>
    <div class="grip-pip" id="gp4"></div>
  </div>
  <div id="lockRing"></div>
  <div id="throwFX">THROWN!</div>
  <div id="score">THROWS: 0</div>
  <div id="status">SHOW YOUR HAND</div>
  <div id="dotLabel">● 21 LANDMARKS ACTIVE</div>
</div>

<!-- TensorFlow.js + HandPose -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.2.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.0/dist/hand-pose-detection.js"></script>
<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
'use strict';

/* ══════════════════════════
   HELPERS
══════════════════════════ */
const $=id=>document.getElementById(id);
function ss(t){$('status').textContent=t}
function showScreen(id){
  ['boot','loading'].forEach(s=>$(s).classList.add('hidden'));
  if(id!=='__none__') $(id)?.classList.remove('hidden');
}
function setBar(p,m){$('barFill').style.width=p+'%';if(m)$('ldMsg').textContent=m}

/* ══════════════════════════
   JOINT NAMES (21 landmarks)
   TF HandPose uses MediaPipe convention
══════════════════════════ */
const JOINT_NAMES=[
  'wrist',
  'thumb_cmc','thumb_mcp','thumb_ip','thumb_tip',
  'index_finger_mcp','index_finger_pip','index_finger_dip','index_finger_tip',
  'middle_finger_mcp','middle_finger_pip','middle_finger_dip','middle_finger_tip',
  'ring_finger_mcp','ring_finger_pip','ring_finger_dip','ring_finger_tip',
  'pinky_finger_mcp','pinky_finger_pip','pinky_finger_dip','pinky_finger_tip',
];
// Bone connections for skeleton lines
const BONES=[
  [0,1],[1,2],[2,3],[3,4],           // thumb
  [0,5],[5,6],[6,7],[7,8],           // index
  [0,9],[9,10],[10,11],[11,12],      // middle
  [0,13],[13,14],[14,15],[15,16],    // ring
  [0,17],[17,18],[18,19],[19,20],    // pinky
  [5,9],[9,13],[13,17],              // palm cross
];

/* ══════════════════════════
   STATE
══════════════════════════ */
let detector=null;
let latestKP=null;       // 21 keypoints [{x,y,z,score,name},...]
let handVisible=false;
let lostFrames=0;

// Grip detection
let gripScore=0;          // 0-5 fingers curled
let isGripping=false;
let gripFrames=0;

// Telekinesis
let lockedOrb=null;       // which orb is targeted
let heldOrb=null;         // which orb is grabbed
let prevIndexPos=null;    // for throw velocity
let throwVel=new THREE.Vector3();
let throwCount=0;

// Index fingertip 3D position (projected)
let indexTip3D=new THREE.Vector3();

/* ══════════════════════════
   THREE.JS
══════════════════════════ */
let scene,camera,renderer,clock;
const orbs=[];           // physics objects
const ORB_COUNT=7;

/* ══════════════════════════
   DOT CANVAS
══════════════════════════ */
const dotCanvas=$('dotCanvas');
const dotCtx=dotCanvas.getContext('2d');

function resizeDotCanvas(){
  dotCanvas.width=innerWidth;
  dotCanvas.height=innerHeight;
}
window.addEventListener('resize',resizeDotCanvas);
resizeDotCanvas();

function drawJoints(kp){
  const W=innerWidth,H=innerHeight;
  dotCtx.clearRect(0,0,W,H);
  if(!kp||kp.length<21) return;

  // Draw skeleton bones first (under dots)
  dotCtx.strokeStyle='rgba(0,255,136,0.35)';
  dotCtx.lineWidth=1.5;
  dotCtx.beginPath();
  BONES.forEach(([a,b])=>{
    const pA=kp[a],pB=kp[b];
    if(!pA||!pB) return;
    dotCtx.moveTo(pA.x*W, pA.y*H);
    dotCtx.lineTo(pB.x*W, pB.y*H);
  });
  dotCtx.stroke();

  // Draw each joint as a green circle
  kp.forEach((p,i)=>{
    if(!p) return;
    const x=p.x*W, y=p.y*H;
    const isSpecial = i===8; // index fingertip
    const r = isSpecial ? 7 : i===0 ? 6 : 4;

    // Outer glow
    const grd=dotCtx.createRadialGradient(x,y,0,x,y,r*3);
    grd.addColorStop(0,'rgba(0,255,136,.25)');
    grd.addColorStop(1,'rgba(0,255,136,0)');
    dotCtx.fillStyle=grd;
    dotCtx.beginPath();
    dotCtx.arc(x,y,r*3,0,Math.PI*2);
    dotCtx.fill();

    // Main dot
    dotCtx.beginPath();
    dotCtx.arc(x,y,r,0,Math.PI*2);
    dotCtx.fillStyle=isSpecial?'#ffffff':'#00ff88';
    dotCtx.fill();

    // Border
    dotCtx.strokeStyle=isSpecial?'#00ff88':'rgba(0,255,136,.6)';
    dotCtx.lineWidth=1;
    dotCtx.stroke();

    // Joint number label
    dotCtx.fillStyle='rgba(0,255,136,.5)';
    dotCtx.font='8px Share Tech Mono';
    dotCtx.fillText(i, x+r+2, y-r);
  });
}

/* ══════════════════════════
   THREE.JS INIT
══════════════════════════ */
function initThree(){
  clock=new THREE.Clock();
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.001,50);
  camera.position.set(0,0,0);

  renderer=new THREE.WebGLRenderer({
    canvas:$('threeCanvas'),
    antialias:true,alpha:true,
    powerPreference:'high-performance'
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.setClearColor(0x000000,0);
  renderer.shadowMap.enabled=true;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.4;

  // Lighting
  scene.add(new THREE.AmbientLight(0x002211,.8));
  const key=new THREE.DirectionalLight(0x00ff88,2.5);
  key.position.set(2,3,2); key.castShadow=true; scene.add(key);
  const fill=new THREE.DirectionalLight(0x0044ff,1);
  fill.position.set(-2,1,1); scene.add(fill);
  const bot=new THREE.DirectionalLight(0xffffff,.5);
  bot.position.set(0,-2,2); scene.add(bot);

  // Orbs
  spawnOrbs();

  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    resizeDotCanvas();
  });
}

/* ══════════════════════════
   ORB OBJECTS
══════════════════════════ */
const orbMats=[
  new THREE.MeshStandardMaterial({color:0x00ff88,metalness:.9,roughness:.1,emissive:new THREE.Color(0x003311),emissiveIntensity:.5}),
  new THREE.MeshStandardMaterial({color:0x0088ff,metalness:.9,roughness:.1,emissive:new THREE.Color(0x001133),emissiveIntensity:.5}),
  new THREE.MeshStandardMaterial({color:0xff4400,metalness:.9,roughness:.1,emissive:new THREE.Color(0x330800),emissiveIntensity:.5}),
  new THREE.MeshStandardMaterial({color:0xffcc00,metalness:.9,roughness:.1,emissive:new THREE.Color(0x332200),emissiveIntensity:.5}),
  new THREE.MeshStandardMaterial({color:0xff00aa,metalness:.9,roughness:.1,emissive:new THREE.Color(0x330022),emissiveIntensity:.5}),
];

function spawnOrbs(){
  orbs.length=0;
  // Remove old
  scene.children.filter(c=>c.userData.isOrb).forEach(c=>scene.remove(c));

  for(let i=0;i<ORB_COUNT;i++){
    const geo=new THREE.IcosahedronGeometry(.04+Math.random()*.025,3);
    const mat=orbMats[i%orbMats.length].clone();
    const mesh=new THREE.Mesh(geo,mat);
    mesh.castShadow=true;
    mesh.userData.isOrb=true;
    mesh.userData.vel=new THREE.Vector3(
      (Math.random()-.5)*.002,
      (Math.random()-.5)*.001,
      (Math.random()-.5)*.001
    );
    mesh.userData.spin=new THREE.Vector3(
      (Math.random()-.5)*.03,
      (Math.random()-.5)*.03,
      (Math.random()-.5)*.03
    );
    mesh.userData.locked=false;
    mesh.userData.held=false;
    mesh.userData.baseEmissive=mat.emissive.clone();
    mesh.userData.baseColor=mat.color.clone();

    // Spread orbs in a field in front of camera
    mesh.position.set(
      (Math.random()-.5)*.8,
      (Math.random()-.5)*.5,
      -1.2-Math.random()*.6
    );
    scene.add(mesh);
    orbs.push(mesh);

    // Point light per orb (soft glow)
    const pl=new THREE.PointLight(mat.color,1.5,.25);
    mesh.add(pl);
  }
}

/* ══════════════════════════
   GRIP DETECTION
   Count how many fingers are curled
══════════════════════════ */
function detectGrip(kp){
  if(!kp||kp.length<21) return 0;
  const wrist=kp[0];
  const tips=[4,8,12,16,20];
  const mcps=[2,5,9,13,17];
  let curled=0;
  tips.forEach((tip,i)=>{
    const t=kp[tip],m=kp[mcps[i]];
    if(!t||!m) return;
    const dTip=Math.hypot(t.x-wrist.x,t.y-wrist.y);
    const dMCP=Math.hypot(m.x-wrist.x,m.y-wrist.y);
    if(dTip<dMCP*.85) curled++;
  });
  return curled; // 0=open, 5=full fist
}

/* ══════════════════════════
   INDEX FINGERTIP → 3D
   Project 2D landmark to 3D world space
══════════════════════════ */
function estimateDepth(kp){
  const iMCP=kp[5],pMCP=kp[17];
  if(!iMCP||!pMCP) return 0.8;
  const dx=(iMCP.x-pMCP.x)*innerWidth;
  const dy=(iMCP.y-pMCP.y)*innerHeight;
  const knucklePx=Math.sqrt(dx*dx+dy*dy);
  if(knucklePx<5) return 0.8;
  const fovR=camera.fov*Math.PI/180;
  const focalPx=innerHeight/(2*Math.tan(fovR/2));
  return Math.max(.25,Math.min((0.07*focalPx)/knucklePx,2.0));
}

function kp2D_to_3D(kp2d,depth){
  // kp2d.x,y are 0-1 normalized (mirrored by CSS on front cam)
  // we un-mirror here because dotCanvas is also mirrored
  const ndcX=-(kp2d.x*2-1); // un-mirror
  const ndcY=-(kp2d.y*2-1);
  const v=new THREE.Vector3(ndcX,ndcY,.5).unproject(camera);
  const dir=v.sub(camera.position).normalize();
  return camera.position.clone().add(dir.multiplyScalar(depth));
}

/* ══════════════════════════
   TARGETING — raycast from index tip toward orbs
══════════════════════════ */
const raycaster=new THREE.Raycaster();
raycaster.params.Points={threshold:.06};

function findTargetOrb(kp,depth){
  const tip=kp[8]; // index fingertip
  const pip=kp[7]; // index DIP (one joint back)
  if(!tip||!pip) return null;

  const tipPos=kp2D_to_3D(tip,depth);
  const pipPos=kp2D_to_3D(pip,depth*1.1);
  const dir=new THREE.Vector3().subVectors(tipPos,pipPos).normalize();

  raycaster.set(tipPos,dir);
  raycaster.far=3;
  const hits=raycaster.intersectObjects(orbs);
  return hits.length>0?hits[0].object:null;
}

/* ══════════════════════════
   THROW FLASH
══════════════════════════ */
function showThrow(){
  const el=$('throwFX');
  el.style.opacity='1';
  setTimeout(()=>el.style.opacity='0',400);
  throwCount++;
  $('score').textContent='THROWS: '+throwCount;
}

/* ══════════════════════════
   MAIN LOOP
══════════════════════════ */
let detecting=false;
const vid=$('vid');

async function mainLoop(){
  const dt=Math.min(clock.getDelta(),.05);

  // Run hand detection (throttle to every other frame for perf)
  if(detector&&!detecting&&vid.readyState>=2){
    detecting=true;
    detector.estimateHands(vid,{flipHorizontal:true}).then(hands=>{
      detecting=false;
      if(hands&&hands.length>0){
        latestKP=hands[0].keypoints;
        handVisible=true; lostFrames=0;
      } else {
        lostFrames++;
        if(lostFrames>10){handVisible=false;latestKP=null;}
      }
    }).catch(()=>{detecting=false;});
  }

  const kp=latestKP;

  // Draw green joint dots & skeleton on dotCanvas
  drawJoints(kp);

  if(handVisible&&kp){
    const depth=estimateDepth(kp);
    const tip3D=kp2D_to_3D(kp[8],depth);
    indexTip3D.copy(tip3D);

    // Grip score
    const gs=detectGrip(kp);
    gripScore=gs;

    // Grip pip display
    $('gripBar').style.opacity='1';
    for(let i=0;i<5;i++){
      $('gp'+i).classList.toggle('on',i<gs);
    }

    // Grip state transitions
    if(gs>=4&&!isGripping){
      gripFrames++;
      if(gripFrames>4){
        isGripping=true;
        // Grab locked orb
        if(lockedOrb&&!heldOrb){
          heldOrb=lockedOrb;
          heldOrb.userData.held=true;
          heldOrb.material.emissiveIntensity=2.5;
          ss('◈ OBJECT SEIZED');
        }
      }
    } else if(gs<3){
      if(isGripping&&heldOrb){
        // Release = throw
        heldOrb.userData.vel.copy(throwVel).multiplyScalar(12);
        heldOrb.userData.held=false;
        heldOrb.material.emissiveIntensity=.5;
        showThrow();
        ss('⚡ THROWN — '+Math.round(throwVel.length()*100)+' km/h');
        heldOrb=null;
        lockedOrb=null;
      }
      isGripping=false; gripFrames=0;
    }

    // While holding: track velocity for throw
    if(heldOrb){
      const newPos=tip3D.clone();
      if(prevIndexPos){
        throwVel.subVectors(newPos,prevIndexPos).divideScalar(dt);
      }
      prevIndexPos=newPos.clone();
      // Move held orb to fingertip
      heldOrb.position.lerp(tip3D,.35);
    } else {
      prevIndexPos=tip3D.clone();
      // Find target orb when not gripping
      if(!isGripping){
        const tgt=findTargetOrb(kp,depth);
        if(tgt!==lockedOrb){
          if(lockedOrb){
            lockedOrb.userData.locked=false;
            lockedOrb.material.color.copy(lockedOrb.userData.baseColor);
            lockedOrb.material.emissiveIntensity=.5;
          }
          lockedOrb=tgt;
          if(lockedOrb){
            lockedOrb.userData.locked=true;
            lockedOrb.material.color.set(0xffffff);
            lockedOrb.material.emissiveIntensity=1.5;
            ss('▶ TARGET LOCKED — CLOSE FIST TO GRAB');
          } else {
            ss('POINT FINGER AT ORB');
          }
        }
      }
    }

    // Lock ring follows locked orb
    if(lockedOrb&&!heldOrb){
      const projected=lockedOrb.position.clone().project(camera);
      const lx=(projected.x*.5+.5)*innerWidth;
      const ly=(-.5*projected.y+.5)*innerHeight;
      const lr=$('lockRing');
      lr.style.left=lx+'px'; lr.style.top=ly+'px';
      lr.style.transform='translate(-50%,-50%)';
      lr.classList.add('visible');
    } else {
      $('lockRing').classList.remove('visible');
    }

  } else {
    $('gripBar').style.opacity='0';
    $('lockRing').classList.remove('visible');
    if(!handVisible) ss('SHOW YOUR HAND TO CAMERA');
    drawJoints(null);
    // Release held orb if hand disappears
    if(heldOrb){heldOrb.userData.held=false;heldOrb.material.emissiveIntensity=.5;heldOrb=null;}
    if(lockedOrb){lockedOrb.material.color.copy(lockedOrb.userData.baseColor);lockedOrb.material.emissiveIntensity=.5;lockedOrb=null;}
  }

  // Physics update for all orbs
  orbs.forEach(orb=>{
    if(orb.userData.held) return;

    // Apply velocity
    orb.position.add(orb.userData.vel);

    // Spin
    orb.rotation.x+=orb.userData.spin.x;
    orb.rotation.y+=orb.userData.spin.y;
    orb.rotation.z+=orb.userData.spin.z;

    // Friction
    orb.userData.vel.multiplyScalar(.97);
    orb.userData.spin.multiplyScalar(.99);

    // Gentle float drift
    orb.userData.vel.y+=Math.sin(clock.elapsedTime*.5+orb.position.x*10)*.00003;

    // Boundary bounce — keep orbs in view
    const b={x:[-1.0,1.0],y:[-.7,.7],z:[-2.2,-.4]};
    ['x','y','z'].forEach(ax=>{
      if(orb.position[ax]<b[ax][0]){orb.position[ax]=b[ax][0];orb.userData.vel[ax]*=-.7;}
      if(orb.position[ax]>b[ax][1]){orb.position[ax]=b[ax][1];orb.userData.vel[ax]*=-.7;}
    });

    // Telekinesis ambient pull toward index when close
    if(handVisible&&latestKP&&!isGripping&&!heldOrb){
      const dist=orb.position.distanceTo(indexTip3D);
      if(dist<.25&&dist>.05){
        const pull=new THREE.Vector3().subVectors(indexTip3D,orb.position).normalize();
        orb.userData.vel.addScaledVector(pull,.0003);
      }
    }
  });

  renderer.render(scene,camera);
  requestAnimationFrame(mainLoop);
}

/* ══════════════════════════
   LAUNCH
══════════════════════════ */
$('startBtn').addEventListener('click',async()=>{
  $('startBtn').textContent='LOADING...';
  $('startBtn').disabled=true;
  showScreen('loading');

  try{
    setBar(10,'INITIALIZING THREE.JS...');
    initThree();
    setBar(25,'THREE.JS READY');

    setBar(35,'STARTING CAMERA...');
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'user'}, // front cam for selfie mode
        width:{ideal:1280},height:{ideal:720}
      },
      audio:false
    });
    vid.srcObject=stream;
    await vid.play();
    setBar(55,'CAMERA READY');

    setBar(65,'LOADING TENSORFLOW...');
    await tf.ready();
    setBar(75,'TF READY · LOADING HANDPOSE MODEL...');

    // Load MediaPipe HandPose via TF.js
    const model=handPoseDetection.SupportedModels.MediaPipeHands;
    const detectorConfig={
      runtime:'tfjs',        // pure JS, no WASM conflicts
      modelType:'full',      // full = more accurate
      maxHands:1,
    };
    detector=await handPoseDetection.createDetector(model,detectorConfig);
    setBar(95,'MODEL LOADED');

    // Warm up
    setBar(98,'WARMING UP...');
    await detector.estimateHands(vid,{flipHorizontal:true});

    setBar(100,'READY');
    setTimeout(()=>{
      showScreen('__none__');
      $('hud').style.display='block';
      ss('SHOW YOUR HAND TO CAMERA');
      mainLoop();
    },500);

  }catch(e){
    console.error(e);
    const msg=e.message||String(e);
    $('bootErr').textContent=msg.includes('camera')||msg.includes('Permission')
      ?'CAMERA PERMISSION DENIED — please allow camera access'
      :'ERROR: '+msg;
    $('bootErr').style.display='block';
    showScreen('boot');
    $('startBtn').textContent='⚡ ACTIVATE POWER';
    $('startBtn').disabled=false;
  }
});
</script>
