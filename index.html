<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>AR + TensorFlow Hand Tracking</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #info {
      position: absolute; left: 0; right: 0; top: 0;
      color: #9cf; font: 14px/1.4 system-ui, sans-serif;
      background: rgba(0,0,0,0.7); padding: 8px 12px; z-index: 3;
    }
    #hud {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
    }
    .reticle {
      position: absolute; left: 50%; top: 50%; width: 60px; height: 60px;
      border: 2px solid rgba(140,220,255,0.8); border-radius: 50%;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 12px rgba(140,220,255,0.6);
    }
    .tick { position: absolute; width: 2px; height: 18px; background: rgba(140,220,255,0.8); }
    .tick.t1 { left: 50%; top: calc(50% - 50px); transform: translateX(-50%); }
    .tick.t2 { left: 50%; top: calc(50% + 32px); transform: translateX(-50%); }
    .tick.t3 { top: 50%; left: calc(50% - 50px); transform: translateY(-50%); }
    .tick.t4 { top: 50%; left: calc(50% + 48px); transform: translateY(-50%); }
    #handCanvas {
      position: absolute; inset: 0; pointer-events: none; z-index: 1;
    }
    #handVideo {
      display: none;
    }
    #debug {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="info">🤏 Pinch or tap to spawn clock | Before AR: Test hand tracking</div>
  <div id="hud">
    <div class="reticle"></div>
    <div class="tick t1"></div><div class="tick t2"></div><div class="tick t3"></div><div class="tick t4"></div>
  </div>
  <canvas id="handCanvas"></canvas>
  <video id="handVideo" playsinline></video>
  <div id="debug">
    <div>Model: Loading...</div>
    <div id="debugHands">Hands: 0</div>
    <div id="debugPinch">Pinch: No</div>
    <div id="debugFPS">FPS: --</div>
  </div>

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { ARButton } from "https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js";

    let camera, scene, renderer;
    let reticle, controller;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    const panels = [];
    const raycaster = new THREE.Raycaster();
    let activePanel = null;

    // Hand tracking
    let handModel, handVideo, handCanvas, handCtx;
    let lastPinch = false;
    let isInAR = false;
    let frameCount = 0;
    let lastFPSTime = Date.now();

    init();
    initHandTracking();
    animate();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      const geometry = new THREE.RingGeometry(0.06, 0.075, 32).rotateX(-Math.PI / 2);
      const material = new THREE.MeshBasicMaterial({ color: 0x8cdcff });
      reticle = new THREE.Mesh(geometry, material);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      controller = renderer.xr.getController(0);
      controller.addEventListener("select", onSelect);
      scene.add(controller);

      renderer.domElement.addEventListener("click", onCanvasClick);

      const arButton = ARButton.createButton(renderer, {
        requiredFeatures: ["hit-test"],
        optionalFeatures: ["dom-overlay"],
        domOverlay: { root: document.body }
      });

      arButton.addEventListener('click', () => {
        setTimeout(() => {
          isInAR = renderer.xr.isPresenting;
        }, 100);
      });

      document.body.appendChild(arButton);
      window.addEventListener("resize", onWindowResize);
    }

    async function initHandTracking() {
      handVideo = document.getElementById('handVideo');
      handCanvas = document.getElementById('handCanvas');
      handCanvas.width = window.innerWidth;
      handCanvas.height = window.innerHeight;
      handCtx = handCanvas.getContext('2d');

      try {
        // Load TensorFlow HandPose model
        document.getElementById('debug').children[0].textContent = 'Model: Loading TensorFlow...';
        handModel = await handpose.load();
        document.getElementById('debug').children[0].textContent = 'Model: Loaded ✓';

        // Setup camera
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',  // Front camera for easier testing
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });

        handVideo.srcObject = stream;
        await handVideo.play();

        console.log('TensorFlow hand tracking initialized');
        detectHands();
      } catch (error) {
        console.error('Hand tracking error:', error);
        document.getElementById('debug').children[0].textContent = 'Model: Error';
      }
    }

    async function detectHands() {
      if (handVideo.readyState === handVideo.HAVE_ENOUGH_DATA) {
        const predictions = await handModel.estimateHands(handVideo);

        // Update FPS
        frameCount++;
        const now = Date.now();
        if (now - lastFPSTime > 1000) {
          const fps = Math.round(frameCount * 1000 / (now - lastFPSTime));
          document.getElementById('debugFPS').textContent = `FPS: ${fps}`;
          frameCount = 0;
          lastFPSTime = now;
        }

        document.getElementById('debugHands').textContent = `Hands: ${predictions.length}`;

        // Only draw when not in AR
        if (!isInAR) {
          drawHands(predictions);
        } else {
          handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
        }

        // Detect pinch even in AR
        if (predictions.length > 0) {
          checkPinch(predictions[0]);
        } else {
          document.getElementById('debugPinch').textContent = 'Pinch: No hand';
        }
      }

      requestAnimationFrame(detectHands);
    }

    function drawHands(predictions) {
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

      for (const hand of predictions) {
        const landmarks = hand.landmarks;

        // Draw connections
        const connections = [
          [0, 1], [1, 2], [2, 3], [3, 4],
          [0, 5], [5, 6], [6, 7], [7, 8],
          [0, 9], [9, 10], [10, 11], [11, 12],
          [0, 13], [13, 14], [14, 15], [15, 16],
          [0, 17], [17, 18], [18, 19], [19, 20],
          [5, 9], [9, 13], [13, 17]
        ];

        handCtx.lineWidth = 2;
        handCtx.lineCap = 'round';

        for (const [s, e] of connections) {
          const [x1, y1] = landmarks[s];
          const [x2, y2] = landmarks[e];

          const gradient = handCtx.createLinearGradient(x1, y1, x2, y2);
          gradient.addColorStop(0, 'rgba(255, 150, 200, 0.8)');
          gradient.addColorStop(1, 'rgba(255, 255, 255, 0.6)');

          handCtx.strokeStyle = gradient;
          handCtx.beginPath();
          handCtx.moveTo(x1, y1);
          handCtx.lineTo(x2, y2);
          handCtx.stroke();
        }

        // Draw dots
        for (let j = 0; j < landmarks.length; j++) {
          const [x, y] = landmarks[j];
          handCtx.beginPath();
          handCtx.arc(x, y, 3, 0, 2 * Math.PI);
          handCtx.fillStyle = 'rgba(255, 255, 255, 0.5)';
          handCtx.fill();
        }
      }
    }

    function checkPinch(hand) {
      const thumb = hand.landmarks[4];
      const index = hand.landmarks[8];
      const distance = Math.sqrt(
        Math.pow(thumb[0] - index[0], 2) +
        Math.pow(thumb[1] - index[1], 2)
      );

      const isPinching = distance < 40;
      document.getElementById('debugPinch').textContent = `Pinch: ${isPinching ? 'YES ✓' : `No (${Math.round(distance)}px)`}`;

      if (isPinching && !lastPinch && reticle.visible) {
        spawnClockPanel();
      }
      lastPinch = isPinching;
    }

    function onSelect() {
      const hitPanel = getPanelUnderGaze();

      if (activePanel) {
        activePanel.userData.selected = false;
        activePanel.scale.setScalar(1);
        activePanel = null;
        return;
      }

      if (hitPanel) {
        activePanel = hitPanel;
        activePanel.userData.selected = true;
        activePanel.scale.setScalar(1.08);
        return;
      }
    }

    function onCanvasClick() {
      if (reticle.visible) {
        spawnClockPanel();
      }
    }

    function getPanelUnderGaze() {
      if (panels.length === 0) return null;

      const origin = new THREE.Vector3();
      const direction = new THREE.Vector3();
      camera.getWorldPosition(origin);
      camera.getWorldDirection(direction);
      raycaster.set(origin, direction);

      const hits = raycaster.intersectObjects(panels, true);
      if (!hits.length) return null;

      const candidate = hits[0].object.parent;
      return candidate && candidate.userData && candidate.userData.isPanel ? candidate : null;
    }

    function spawnClockPanel() {
      const panel = makeClockPanel();
      panel.position.setFromMatrixPosition(reticle.matrix);
      panel.quaternion.setFromRotationMatrix(reticle.matrix);
      scene.add(panel);
      panels.push(panel);
    }

    function createVisionProGlass() {
      return new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.15,
        transmission: 0.9,
        roughness: 0.3,
        metalness: 0,
        clearcoat: 0.5,
        clearcoatRoughness: 0.2,
        reflectivity: 0.4,
        ior: 1.5,
        thickness: 0.5,
        side: THREE.DoubleSide
      });
    }

    function makeClockPanel() {
      const group = new THREE.Group();

      const panelGeom = new THREE.PlaneGeometry(0.8, 0.3);
      const panelMat = createVisionProGlass();
      const panel = new THREE.Mesh(panelGeom, panelMat);
      group.add(panel);

      const borderGeom = new THREE.EdgesGeometry(panelGeom);
      const borderMat = new THREE.LineBasicMaterial({ 
        color: 0xffffff, 
        transparent: true, 
        opacity: 0.4
      });
      const border = new THREE.LineSegments(borderGeom, borderMat);
      group.add(border);

      const clockCanvas = document.createElement('canvas');
      clockCanvas.width = 512;
      clockCanvas.height = 128;
      const clockCtx = clockCanvas.getContext('2d');
      const clockTexture = new THREE.CanvasTexture(clockCanvas);
      clockTexture.minFilter = THREE.LinearFilter;
      clockTexture.magFilter = THREE.LinearFilter;

      const clockMat = new THREE.MeshBasicMaterial({ map: clockTexture, transparent: true });
      const clockMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 0.25), clockMat);
      clockMesh.position.z = 0.002;
      group.add(clockMesh);

      group.userData.isPanel = true;
      group.userData.selected = false;
      group.userData.clockCtx = clockCtx;
      group.userData.clockTexture = clockTexture;
      group.scale.setScalar(1);

      updateClock(group);
      return group;
    }

    function updateClock(panel) {
      if (!panel.userData.clockCtx) return;

      const now = new Date();
      const timeString = now.toLocaleTimeString('en-US', { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit',
        hour12: true 
      });
      const dateString = now.toLocaleDateString('en-US', { 
        weekday: 'short', 
        month: 'short', 
        day: 'numeric' 
      });

      const ctx = panel.userData.clockCtx;
      const tex = panel.userData.clockTexture;

      ctx.clearRect(0, 0, 512, 128);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 56px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(timeString, 256, 55);

      ctx.font = '24px system-ui';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.fillText(dateString, 256, 100);

      tex.needsUpdate = true;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      handCanvas.width = window.innerWidth;
      handCanvas.height = window.innerHeight;
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace("viewer").then((space) => {
            session.requestHitTestSource({ space }).then((source) => {
              hitTestSource = source;
            });
          });

          session.addEventListener("end", () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
            isInAR = false;
          });

          hitTestSourceRequested = true;
          isInAR = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      if (activePanel && reticle.visible) {
        activePanel.position.setFromMatrixPosition(reticle.matrix);
        activePanel.quaternion.setFromRotationMatrix(reticle.matrix);
      }

      panels.forEach(panel => {
        if (panel.userData.clockCtx) {
          updateClock(panel);
        }
      });

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
