<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>AR Clock + Video - MAX Glass</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #info {
      position: absolute; left: 0; right: 0; top: 0;
      color: #9cf; font: 14px/1.4 system-ui, sans-serif;
      background: rgba(0,0,0,0.5); padding: 8px 12px; z-index: 2;
    }
    #hud {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
    }
    .reticle {
      position: absolute; left: 50%; top: 50%; width: 60px; height: 60px;
      border: 2px solid rgba(140,220,255,0.8); border-radius: 50%;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 12px rgba(140,220,255,0.6);
    }
    .tick { position: absolute; width: 2px; height: 18px; background: rgba(140,220,255,0.8); }
    .tick.t1 { left: 50%; top: calc(50% - 50px); transform: translateX(-50%); }
    .tick.t2 { left: 50%; top: calc(50% + 32px); transform: translateX(-50%); }
    .tick.t3 { top: 50%; left: calc(50% - 50px); transform: translateY(-50%); }
    .tick.t4 { top: 50%; left: calc(50% + 48px); transform: translateY(-50%); }
  </style>
</head>
<body>
  <div id="info">Tap "Enter AR". Single click spawns a translucent clock. Double click spawns a video panel. Tap a panel to pick up, tap again to drop. ALL VALUES AT MAX - TUNE DOWN AS NEEDED</div>
  <div id="hud">
    <div class="reticle"></div>
    <div class="tick t1"></div><div class="tick t2"></div><div class="tick t3"></div><div class="tick t4"></div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { ARButton } from "https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js";

    let camera, scene, renderer;
    let reticle, controller;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    const panels = [];
    const raycaster = new THREE.Raycaster();
    const liquidGlassTextures = [];
    let activePanel = null;
    let videoEl = null;
    let videoTexture = null;
    const liquidMaterials = [];
    let lastTapTime = 0;
    const tapCooldownMs = 250;
    let singleClickTimer = null;
    const doubleClickDelayMs = 260;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      const geometry = new THREE.RingGeometry(0.06, 0.075, 32).rotateX(-Math.PI / 2);
      const material = new THREE.MeshBasicMaterial({ color: 0x8cdcff });
      reticle = new THREE.Mesh(geometry, material);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      controller = renderer.xr.getController(0);
      controller.addEventListener("select", onSelect);
      scene.add(controller);

      renderer.domElement.addEventListener("click", onCanvasClick);
      renderer.domElement.addEventListener("dblclick", onDoubleClick);

      document.body.appendChild(ARButton.createButton(renderer, {
        requiredFeatures: ["hit-test"],
        optionalFeatures: ["dom-overlay"],
        domOverlay: { root: document.body }
      }));

      window.addEventListener("resize", onWindowResize);
    }

    function onSelect() {
      const now = performance.now();
      if (now - lastTapTime < tapCooldownMs) return;
      lastTapTime = now;

      const hitPanel = getPanelUnderGaze();

      if (activePanel) {
        activePanel.userData.selected = false;
        activePanel.scale.setScalar(1);
        activePanel = null;
        return;
      }

      if (hitPanel) {
        activePanel = hitPanel;
        activePanel.userData.selected = true;
        activePanel.scale.setScalar(1.08);
        return;
      }
    }

    function onCanvasClick() {
      if (singleClickTimer) clearTimeout(singleClickTimer);
      singleClickTimer = setTimeout(() => {
        spawnClockPanel();
        singleClickTimer = null;
      }, doubleClickDelayMs);
    }

    function spawnClockPanel() {
      if (!reticle.visible) return;
      const hud = makeHudPanel();
      hud.position.setFromMatrixPosition(reticle.matrix);
      hud.quaternion.setFromRotationMatrix(reticle.matrix);
      scene.add(hud);
      panels.push(hud);
    }

    function onDoubleClick() {
      if (singleClickTimer) {
        clearTimeout(singleClickTimer);
        singleClickTimer = null;
      }
      if (!reticle.visible) return;

      if (!videoTexture) {
        videoTexture = createVideoTexture("video.mp4");
      }
      if (videoEl && videoEl.paused) {
        videoEl.play().catch(() => {});
      }
      const videoPanel = makeScreenPanel(videoTexture);
      videoPanel.position.setFromMatrixPosition(reticle.matrix);
      videoPanel.quaternion.setFromRotationMatrix(reticle.matrix);
      scene.add(videoPanel);
      panels.push(videoPanel);
    }

    function createVideoTexture(src) {
      const video = document.createElement("video");
      video.src = src;
      video.loop = true;
      video.muted = true;
      video.playsInline = true;
      video.crossOrigin = "anonymous";
      videoEl = video;

      const texture = new THREE.VideoTexture(video);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function getPanelUnderGaze() {
      if (panels.length === 0) return null;

      const origin = new THREE.Vector3();
      const direction = new THREE.Vector3();
      camera.getWorldPosition(origin);
      camera.getWorldDirection(direction);
      raycaster.set(origin, direction);

      const hits = raycaster.intersectObjects(panels, true);
      if (!hits.length) return null;

      const candidate = hits[0].object.parent;
      return candidate && candidate.userData && candidate.userData.isHudPanel ? candidate : null;
    }

    // iOS-style frosted/glass material tuned for a subtle "glass" look
    function createGlassMaterial() {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      // subtle noise for a frosted appearance
      for (let i = 0; i < canvas.width; i++) {
        for (let j = 0; j < canvas.height; j++) {
          const noise = 200 + Math.floor(Math.random() * 55); // subtle luminance
          // low alpha so the noise only affects roughness/texture
          ctx.fillStyle = `rgba(${noise},${noise},${noise},${(6 + Math.random() * 10) / 255})`;
          ctx.fillRect(i, j, 1, 1);
        }
      }

      const noiseTexture = new THREE.CanvasTexture(canvas);
      noiseTexture.wrapS = noiseTexture.wrapT = THREE.RepeatWrapping;
      noiseTexture.repeat.set(4, 4);
      noiseTexture.anisotropy = 4;

      return new THREE.MeshPhysicalMaterial({
        color: 0xf8fbff,
        transparent: true,
        opacity: 0.86,
        transmission: 0.9,
        roughness: 0.55,
        roughnessMap: noiseTexture,
        metalness: 0.0,
        clearcoat: 0.12,
        clearcoatRoughness: 0.25,
        reflectivity: 0.5,
        ior: 1.45,
        thickness: 0.25,
        attenuationDistance: 0.6,
        attenuationColor: new THREE.Color(0xffffff),
        side: THREE.DoubleSide
      });
    }

    // Ported lightweight liquid-glass shader (samples a map when provided,
    // otherwise produces a subtle frosted/translucent surface). Materials
    // created here are tracked in `liquidMaterials` so we can update `time`.
    function createLiquidGlassMaterial(mapTexture, opts = {}) {
      opts = Object.assign({noiseScale: 4.0, strength: 0.035, opacity: 0.86}, opts);

      // noise texture (generated once per material; small and tiled)
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      for (let x = 0; x < canvas.width; x++) {
        for (let y = 0; y < canvas.height; y++) {
          const n = 128 + Math.floor(Math.random() * 96);
          ctx.fillStyle = `rgba(${n},${n},${n},${(4 + Math.random()*6)/255})`;
          ctx.fillRect(x,y,1,1);
        }
      }
      const noiseTex = new THREE.CanvasTexture(canvas);
      noiseTex.wrapS = noiseTex.wrapT = THREE.RepeatWrapping;
      noiseTex.repeat.set(opts.noiseScale, opts.noiseScale);

      const uniforms = {
        map: { value: mapTexture || null },
        noise: { value: noiseTex },
        time: { value: 0.0 },
        strength: { value: opts.strength },
        opacity: { value: opts.opacity },
        rimColor: { value: new THREE.Color(0x8cdcff) },
      };

      const mat = new THREE.ShaderMaterial({
        uniforms,
        transparent: true,
        side: THREE.DoubleSide,
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewDir;
          void main(){
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            vViewDir = normalize(-mvPosition.xyz);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform sampler2D map;
          uniform sampler2D noise;
          uniform float time;
          uniform float strength;
          uniform float opacity;
          uniform vec3 rimColor;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewDir;

          void main(){
            vec2 nuv = vUv + (texture2D(noise, vUv + vec2(time*0.03, time*0.02)).rg - 0.5) * strength * 0.5;
            vec2 offset = (texture2D(noise, vUv*4.0 + vec2(time*0.05)).rg - 0.5) * strength;
            vec4 base = vec4(0.96,0.97,0.99,1.0);
            if (map != NULL) {
              base = texture2D(map, vUv + offset);
            }

            float fresnel = pow(1.0 - max(0.0, dot(normalize(vNormal), normalize(vViewDir))), 3.0);
            vec3 rim = rimColor * fresnel * 0.7;

            // subtle white haze + rim + base color
            vec3 color = mix(base.rgb, vec3(1.0), 0.06) + rim * 0.9;
            gl_FragColor = vec4(color, opacity * (map == NULL ? 0.55 : 0.88));
          }
        `
      });

      // If a texture was passed ensure it's updated for linear filtering
      if (mapTexture) {
        mapTexture.minFilter = THREE.LinearFilter;
        mapTexture.magFilter = THREE.LinearFilter;
      }

      liquidMaterials.push(mat);
      return mat;
    }

    function makeHudPanel() {
      const group = new THREE.Group();

      const panelGeom = new THREE.PlaneGeometry(0.7, 0.35);
      const panelMat = createLiquidGlassMaterial(null, {noiseScale:4.0, strength:0.03, opacity:0.86});
      const panel = new THREE.Mesh(panelGeom, panelMat);
      group.add(panel);

      const borderGeom = new THREE.EdgesGeometry(panelGeom);
      const borderMat = new THREE.LineBasicMaterial({ 
        color: 0xffffff, 
        transparent: true, 
        opacity: 0.6  // MAX border
      });
      const border = new THREE.LineSegments(borderGeom, borderMat);
      group.add(border);
      
      // MAX inner glow for depth
      const glowGeom = new THREE.PlaneGeometry(0.68, 0.33);
      const glowMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.3,  // MAX
        side: THREE.DoubleSide
      });
      const glow = new THREE.Mesh(glowGeom, glowMat);
      glow.position.z = -0.001;
      group.add(glow);

      const timeCanvas = document.createElement("canvas");
      timeCanvas.width = 512;
      timeCanvas.height = 256;
      const timeCtx = timeCanvas.getContext("2d");
      const timeTexture = new THREE.CanvasTexture(timeCanvas);
      timeTexture.minFilter = THREE.LinearFilter;
      timeTexture.magFilter = THREE.LinearFilter;

      const timeMat = new THREE.MeshBasicMaterial({ map: timeTexture, transparent: true });
      const timePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.28), timeMat);
      timePlane.position.set(0, 0, 0.002);
      group.add(timePlane);

      const dotGeom = new THREE.CircleGeometry(0.01, 16);
      const dotMat = new THREE.MeshBasicMaterial({ 
        color: 0xffffff, 
        transparent: true, 
        opacity: 1.0  // MAX
      });
      const dot = new THREE.Mesh(dotGeom, dotMat);
      dot.position.set(-0.28, 0.11, 0.001);
      group.add(dot);

      group.userData.isHudPanel = true;
      group.userData.selected = false;
      group.userData.timeCtx = timeCtx;
      group.userData.timeTexture = timeTexture;
      group.userData.lastTimeText = "";
      group.scale.setScalar(1);

      updatePanelTime(group, true);

      return group;
    }

    function makeScreenPanel(texture) {
      const group = new THREE.Group();

      const panelGeom = new THREE.PlaneGeometry(0.9, 0.5);
      const panelMat = createLiquidGlassMaterial(texture, {noiseScale:4.0, strength:0.045, opacity:0.9});
      const panel = new THREE.Mesh(panelGeom, panelMat);
      group.add(panel);

      const borderGeom = new THREE.EdgesGeometry(panelGeom);
      const borderMat = new THREE.LineBasicMaterial({ 
        color: 0xffffff, 
        transparent: true, 
        opacity: 0.6  // MAX border
      });
      const border = new THREE.LineSegments(borderGeom, borderMat);
      group.add(border);
      
      // MAX inner glow for depth
      const glowGeom = new THREE.PlaneGeometry(0.88, 0.48);
      const glowMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.3,  // MAX
        side: THREE.DoubleSide
      });
      const glow = new THREE.Mesh(glowGeom, glowMat);
      glow.position.z = -0.001;
      group.add(glow);

      const videoMat = new THREE.MeshBasicMaterial({ map: texture });
      const videoPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.82, 0.46), videoMat);
      videoPlane.position.set(0, 0, 0.002);
      group.add(videoPlane);

      group.userData.isHudPanel = true;
      group.userData.selected = false;
      group.scale.setScalar(1);

      return group;
    }

    function updatePanelTime(panel, force) {
      const now = new Date();
      const timeText = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      if (!force && panel.userData.lastTimeText === timeText) return;

      panel.userData.lastTimeText = timeText;
      const ctx = panel.userData.timeCtx;
      const tex = panel.userData.timeTexture;

      ctx.clearRect(0, 0, 512, 256);
      drawAnalogClock(ctx, now);
      tex.needsUpdate = true;
    }

    function drawAnalogClock(ctx, now) {
      const w = 512;
      const h = 256;
      const cx = w * 0.5;
      const cy = h * 0.5;
      const r = 100;

      ctx.clearRect(0, 0, w, h);

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(10, 26, 40, 0.55)";
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = "rgba(140, 220, 255, 0.9)";
      ctx.stroke();

      for (let i = 0; i < 60; i++) {
        const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
        const isHour = i % 5 === 0;
        const tickOuter = r - 8;
        const tickInner = isHour ? r - 22 : r - 15;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * tickInner, cy + Math.sin(a) * tickInner);
        ctx.lineTo(cx + Math.cos(a) * tickOuter, cy + Math.sin(a) * tickOuter);
        ctx.lineWidth = isHour ? 3 : 1.5;
        ctx.strokeStyle = isHour ? "rgba(220, 242, 255, 0.95)" : "rgba(140, 220, 255, 0.75)";
        ctx.stroke();
      }

      const ms = now.getMilliseconds();
      const sec = now.getSeconds() + ms / 1000;
      const min = now.getMinutes() + sec / 60;
      const hour = (now.getHours() % 12) + min / 60;

      drawClockHand(ctx, cx, cy, hour / 12, 50, 5, "rgba(255,255,255,0.95)");
      drawClockHand(ctx, cx, cy, min / 60, 72, 4, "rgba(200,235,255,0.95)");
      drawClockHand(ctx, cx, cy, sec / 60, 84, 2, "rgba(255,120,120,0.95)");

      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.fill();
    }

    function drawClockHand(ctx, cx, cy, unit, len, width, color) {
      const angle = unit * Math.PI * 2 - Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angle) * len, cy + Math.sin(angle) * len);
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.strokeStyle = color;
      ctx.stroke();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace("viewer").then((space) => {
            session.requestHitTestSource({ space }).then((source) => {
              hitTestSource = source;
            });
          });

          session.addEventListener("end", () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });

          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      if (activePanel && reticle.visible) {
        activePanel.position.setFromMatrixPosition(reticle.matrix);
        activePanel.quaternion.setFromRotationMatrix(reticle.matrix);
      }

      for (const panel of panels) {
        if (panel.userData.timeCtx) updatePanelTime(panel, false);
      }

      // advance liquid shader time uniforms
      if (liquidMaterials.length) {
        const t = (timestamp || performance.now()) * 0.001;
        for (const m of liquidMaterials) {
          if (m && m.uniforms && typeof m.uniforms.time !== 'undefined') m.uniforms.time.value = t;
        }
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
