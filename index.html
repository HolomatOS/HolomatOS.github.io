<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>AR HUD Prototype</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #info {
      position: absolute; left: 0; right: 0; top: 0;
      color: #9cf; font: 14px/1.4 system-ui, sans-serif;
      background: rgba(0,0,0,0.5); padding: 8px 12px; z-index: 2;
    }
    #hud {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
    }
    .reticle {
      position: absolute; left: 50%; top: 50%; width: 60px; height: 60px;
      border: 2px solid rgba(140,220,255,0.8); border-radius: 50%;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 12px rgba(140,220,255,0.6);
    }
    .tick { position: absolute; width: 2px; height: 18px; background: rgba(140,220,255,0.8); }
    .tick.t1 { left: 50%; top: calc(50% - 50px); transform: translateX(-50%); }
    .tick.t2 { left: 50%; top: calc(50% + 32px); transform: translateX(-50%); }
    .tick.t3 { top: 50%; left: calc(50% - 50px); transform: translateY(-50%); }
    .tick.t4 { top: 50%; left: calc(50% + 48px); transform: translateY(-50%); }
  </style>
</head>
<body>
  <div id="info">Tap "Enter AR". Tap to spawn a time panel. Tap a panel to pick up, tap again to drop. Double-tap to spawn a video panel. Triple-tap to spawn a voice orb. Drag panels into the recycle bin to delete.</div>
  <div id="hud">
    <div class="reticle"></div>
    <div class="tick t1"></div><div class="tick t2"></div><div class="tick t3"></div><div class="tick t4"></div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { ARButton } from "https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js";

    let camera, scene, renderer;
    let reticle, controller;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    const panels = [];
    const raycaster = new THREE.Raycaster();
    let activePanel = null;
    let videoEl = null;
    let videoTexture = null;
    let recycleBin = null;
    let recycleBinPlaced = false;

    let tapCount = 0;
    let tapTimer = null;
    const tapWindowMs = 400;

    let voiceOrb = null;
    let audioCtx = null;
    let analyser = null;
    let audioData = null;
    let micReady = false;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      const geometry = new THREE.RingGeometry(0.06, 0.075, 32).rotateX(-Math.PI / 2);
      const material = new THREE.MeshBasicMaterial({ color: 0x8cdcff });
      reticle = new THREE.Mesh(geometry, material);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      controller = renderer.xr.getController(0);
      controller.addEventListener("select", onSelect);
      scene.add(controller);

      document.body.appendChild(ARButton.createButton(renderer, {
        requiredFeatures: ["hit-test"],
        optionalFeatures: ["dom-overlay"],
        domOverlay: { root: document.body }
      }));

      window.addEventListener("resize", onWindowResize);
    }

    function onSelect() {
      tapCount += 1;

      if (tapTimer) clearTimeout(tapTimer);

      if (tapCount === 3) {
        tapCount = 0;
        spawnVoiceOrb();
        return;
      }

      tapTimer = setTimeout(() => {
        if (tapCount === 1) {
          handleSingleTap();
        } else if (tapCount === 2) {
          handleDoubleTap();
        }
        tapCount = 0;
      }, tapWindowMs);
    }

    function handleSingleTap() {
      if (recycleBin && isGazingAt(recycleBin)) {
        recycleBin.userData.movable = !recycleBin.userData.movable;
        recycleBin.userData.highlight = recycleBin.userData.movable;
        return;
      }

      const hitPanel = getPanelUnderGaze();

      if (activePanel) {
        // Drop current panel on tap anywhere
        activePanel.userData.selected = false;
        activePanel.scale.setScalar(1);
        activePanel = null;
        return;
      }

      if (hitPanel) {
        // Pick up panel if gazing at one
        activePanel = hitPanel;
        activePanel.userData.selected = true;
        activePanel.scale.setScalar(1.08);
        return;
      }

      if (!reticle.visible) return;

      const hud = makeHudPanel();
      hud.position.setFromMatrixPosition(reticle.matrix);
      hud.quaternion.setFromRotationMatrix(reticle.matrix);
      scene.add(hud);
      panels.push(hud);
    }

    function handleDoubleTap() {
      if (!reticle.visible) return;
      if (!videoEl) initVideo();

      const vidPanel = makeVideoPanel();
      vidPanel.position.setFromMatrixPosition(reticle.matrix);
      vidPanel.quaternion.setFromRotationMatrix(reticle.matrix);
      scene.add(vidPanel);
      panels.push(vidPanel);

      videoEl.play().catch(() => {});
    }

    function spawnVoiceOrb() {
      if (!reticle.visible) return;

      if (!voiceOrb) {
        voiceOrb = makeVoiceOrb();
        scene.add(voiceOrb);
      }

      voiceOrb.position.setFromMatrixPosition(reticle.matrix);
      voiceOrb.quaternion.setFromRotationMatrix(reticle.matrix);
      initMic();
    }

    function initVideo() {
      videoEl = document.createElement("video");
      videoEl.src = "video.mp4";
      videoEl.crossOrigin = "anonymous";
      videoEl.loop = true;
      videoEl.muted = true;
      videoEl.playsInline = true;

      videoTexture = new THREE.VideoTexture(videoEl);
      videoTexture.minFilter = THREE.LinearFilter;
      videoTexture.magFilter = THREE.LinearFilter;
      videoTexture.encoding = THREE.sRGBEncoding;
    }

    function initMic() {
      if (micReady) return;

      navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        audioData = new Uint8Array(analyser.fftSize);
        micReady = true;
      }).catch(() => {
        micReady = false;
      });
    }

    function isGazingAt(object3d) {
      const origin = new THREE.Vector3();
      const direction = new THREE.Vector3();
      camera.getWorldPosition(origin);
      camera.getWorldDirection(direction);
      raycaster.set(origin, direction);
      const hits = raycaster.intersectObject(object3d, true);
      return hits.length > 0;
    }

    function getPanelUnderGaze() {
      if (panels.length === 0) return null;

      const origin = new THREE.Vector3();
      const direction = new THREE.Vector3();
      camera.getWorldPosition(origin);
      camera.getWorldDirection(direction);
      raycaster.set(origin, direction);

      const hits = raycaster.intersectObjects(panels, true);
      if (!hits.length) return null;

      const candidate = hits[0].object.parent;
      return candidate && candidate.userData && candidate.userData.isHudPanel ? candidate : null;
    }

    function makeHudPanel() {
      const group = new THREE.Group();

      const panelGeom = new THREE.PlaneGeometry(0.7, 0.35);
      const panelMat = new THREE.MeshBasicMaterial({ color: 0x0b2033, transparent: true, opacity: 0.75 });
      const panel = new THREE.Mesh(panelGeom, panelMat);
      group.add(panel);

      const borderGeom = new THREE.EdgesGeometry(panelGeom);
      const borderMat = new THREE.LineBasicMaterial({ color: 0x8cdcff });
      const border = new THREE.LineSegments(borderGeom, borderMat);
      group.add(border);

      const timeCanvas = document.createElement("canvas");
      timeCanvas.width = 512;
      timeCanvas.height = 256;
      const timeCtx = timeCanvas.getContext("2d");
      const timeTexture = new THREE.CanvasTexture(timeCanvas);
      timeTexture.minFilter = THREE.LinearFilter;
      timeTexture.magFilter = THREE.LinearFilter;

      const timeMat = new THREE.MeshBasicMaterial({ map: timeTexture, transparent: true });
      const timePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.2), timeMat);
      timePlane.position.set(0, 0, 0.002);
      group.add(timePlane);

      const dotGeom = new THREE.CircleGeometry(0.01, 16);
      const dotMat = new THREE.MeshBasicMaterial({ color: 0x8cdcff });
      const dot = new THREE.Mesh(dotGeom, dotMat);
      dot.position.set(-0.28, 0.11, 0.001);
      group.add(dot);

      group.userData.isHudPanel = true;
      group.userData.selected = false;
      group.userData.timeCtx = timeCtx;
      group.userData.timeTexture = timeTexture;
      group.userData.lastTimeText = "";
      group.scale.setScalar(1);

      updatePanelTime(group, true);

      return group;
    }

    function makeVideoPanel() {
      const group = new THREE.Group();

      const panelGeom = new THREE.PlaneGeometry(0.9, 0.5);
      const panelMat = new THREE.MeshBasicMaterial({ color: 0x0b2033, transparent: true, opacity: 0.75 });
      const panel = new THREE.Mesh(panelGeom, panelMat);
      group.add(panel);

      const borderGeom = new THREE.EdgesGeometry(panelGeom);
      const borderMat = new THREE.LineBasicMaterial({ color: 0x8cdcff });
      const border = new THREE.LineSegments(borderGeom, borderMat);
      group.add(border);

      const videoMat = new THREE.MeshBasicMaterial({ map: videoTexture });
      const videoPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.82, 0.46), videoMat);
      videoPlane.position.set(0, 0, 0.002);
      group.add(videoPlane);

      group.userData.isHudPanel = true;
      group.userData.selected = false;
      group.scale.setScalar(1);

      return group;
    }

    function makeRecycleBin() {
      const group = new THREE.Group();

      const binBody = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.14, 0.28, 24),
        new THREE.MeshStandardMaterial({ color: 0x2a2f36, metalness: 0.3, roughness: 0.5 })
      );
      group.add(binBody);

      const binRim = new THREE.Mesh(
        new THREE.TorusGeometry(0.14, 0.015, 12, 24),
        new THREE.MeshStandardMaterial({ color: 0x8cdcff, metalness: 0.6, roughness: 0.2 })
      );
      binRim.rotation.x = Math.PI / 2;
      binRim.position.y = 0.14;
      group.add(binRim);

      const binBase = new THREE.Mesh(
        new THREE.CylinderGeometry(0.13, 0.13, 0.02, 24),
        new THREE.MeshStandardMaterial({ color: 0x1b1f25, metalness: 0.2, roughness: 0.6 })
      );
      binBase.position.y = -0.14;
      group.add(binBase);

      group.userData.isRecycleBin = true;
      group.userData.movable = false;
      group.userData.highlight = false;

      return group;
    }

    function makeVoiceOrb() {
      const group = new THREE.Group();

      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 32, 24),
        new THREE.MeshStandardMaterial({
          color: 0x3fd1ff,
          emissive: 0x1a5a7a,
          emissiveIntensity: 0.6,
          metalness: 0.2,
          roughness: 0.15,
          transparent: true,
          opacity: 0.9
        })
      );
      group.add(sphere);

      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(0.11, 24, 18),
        new THREE.MeshBasicMaterial({ color: 0x8cdcff, transparent: true, opacity: 0.2 })
      );
      group.add(glow);

      group.userData.core = sphere;
      group.userData.glow = glow;
      group.scale.setScalar(1);

      return group;
    }

    function updateRecycleBin() {
      if (!recycleBin) return;

      if (recycleBin.userData.movable && reticle.visible) {
        recycleBin.position.setFromMatrixPosition(reticle.matrix);
        recycleBin.quaternion.setFromRotationMatrix(reticle.matrix);
      }

      const rim = recycleBin.children[1];
      if (rim && rim.material) {
        rim.material.color.set(recycleBin.userData.highlight ? 0xff4d4d : 0x8cdcff);
      }
    }

    function updatePanelTime(panel, force) {
      const now = new Date();
      const timeText = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      if (!force && panel.userData.lastTimeText === timeText) return;

      panel.userData.lastTimeText = timeText;
      const ctx = panel.userData.timeCtx;
      const tex = panel.userData.timeTexture;

      ctx.clearRect(0, 0, 512, 256);
      ctx.fillStyle = "rgba(0,0,0,0)";
      ctx.fillRect(0, 0, 512, 256);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 80px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(timeText, 256, 128);
      tex.needsUpdate = true;
    }

    function updateVoiceOrb() {
      if (!voiceOrb || !micReady) return;

      analyser.getByteTimeDomainData(audioData);
      let sum = 0;
      for (let i = 0; i < audioData.length; i += 1) {
        const v = (audioData[i] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / audioData.length);
      const level = Math.min(1, rms * 4);

      const baseScale = 1;
      const pulse = 1 + level * 0.6;
      voiceOrb.scale.setScalar(baseScale * pulse);

      const core = voiceOrb.userData.core;
      const glow = voiceOrb.userData.glow;
      if (core && core.material) {
        core.material.emissiveIntensity = 0.6 + level * 1.2;
      }
      if (glow && glow.material) {
        glow.material.opacity = 0.2 + level * 0.4;
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace("viewer").then((space) => {
            session.requestHitTestSource({ space }).then((source) => {
              hitTestSource = source;
            });
          });

          session.addEventListener("end", () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });

          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);

            if (!recycleBinPlaced) {
              recycleBin = makeRecycleBin();
              recycleBin.position.setFromMatrixPosition(reticle.matrix);
              recycleBin.quaternion.setFromRotationMatrix(reticle.matrix);
              scene.add(recycleBin);
              recycleBinPlaced = true;
            }
          } else {
            reticle.visible = false;
          }
        }
      }

      if (activePanel && reticle.visible) {
        activePanel.position.setFromMatrixPosition(reticle.matrix);
        activePanel.quaternion.setFromRotationMatrix(reticle.matrix);
      }

      updateRecycleBin();
      updateVoiceOrb();

      for (let i = panels.length - 1; i >= 0; i -= 1) {
        const panel = panels[i];
        if (panel.userData.timeCtx) updatePanelTime(panel, false);
        if (recycleBin && isPanelOverBin(panel)) {
          scene.remove(panel);
          panels.splice(i, 1);
          if (activePanel === panel) activePanel = null;
        }
      }

      renderer.render(scene, camera);
    }

    function isPanelOverBin(panel) {
      const panelPos = new THREE.Vector3();
      const binPos = new THREE.Vector3();
      panel.getWorldPosition(panelPos);
      recycleBin.getWorldPosition(binPos);
      return panelPos.distanceTo(binPos) < 0.2;
    }
  </script>
</body>
</html>
