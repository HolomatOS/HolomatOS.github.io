<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Holomatos Remote</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; width:100%; overflow:hidden;
    background:#0a0a0c; color:#ebebf0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action:manipulation; user-select:none;
  }
  #app {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100vh; width:100vw; padding:20px; gap:16px;
  }
  .preview {
    width:100%; max-width:640px; aspect-ratio:4/3; border-radius:14px;
    background:#141416; border:1.5px solid #2a2a30; overflow:hidden; position:relative;
  }
  .preview video {
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .preview .label {
    position:absolute; top:10px; left:10px;
    background:rgba(0,0,0,0.6); color:#eba53c;
    padding:4px 10px; border-radius:6px; font-size:11px; font-weight:600;
  }
  .btn {
    padding:14px 28px; border-radius:12px; border:none;
    background:linear-gradient(180deg,#eba53c,#c7852a); color:#0a0a0c;
    font-size:14px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .btn:active { transform:scale(0.96); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .status {
    font-size:13px; color:#6b6b76; text-align:center; max-width:500px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="preview">
    <video id="camera" autoplay playsinline muted></video>
    <div class="label" id="statusLabel">Initializing...</div>
  </div>

  <button class="btn" id="startBtn">
    <span>🎥</span> Start Camera & Mic
  </button>

  <div class="status" id="status">
    This page captures your camera and microphone and streams them to your phone.
  </div>
</div>

<script>
const WS_URL_PARAM = new URLSearchParams(window.location.search).get('ws');
const DEFAULT_WS = 'ws://localhost:18926/signal';
const SIGNAL_WS = WS_URL_PARAM || DEFAULT_WS;

const camera = document.getElementById('camera');
const startBtn = document.getElementById('startBtn');
const statusEl = document.getElementById('status');
const statusLabel = document.getElementById('statusLabel');

let ws = null;
let pc = null;
let localStream = null;
let audioContext = null;
let audioQueue = [];
let isPlaying = false;

const config = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
  ]
};

function log(msg) {
  console.log('[Holomatos]', msg);
  statusLabel.textContent = msg;
}

function playAudioChunk(int16Array) {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const float32 = new Float32Array(int16Array.length);
  for (let i = 0; i < int16Array.length; i++) {
    float32[i] = int16Array[i] / 0x8000;
  }
  const buffer = audioContext.createBuffer(1, float32.length, 16000);
  buffer.getChannelData(0).set(float32);
  const source = audioContext.createBufferSource();
  source.buffer = buffer;
  source.connect(audioContext.destination);
  source.start();
}

async function start() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { width:{ideal:1280}, height:{ideal:720}, facingMode:"user" },
      audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true }
    });

    camera.srcObject = localStream;
    await camera.play();

    statusLabel.textContent = 'Connecting to signaling server...';
    startBtn.disabled = true;
    startBtn.textContent = 'Connecting...';

    ws = new WebSocket(SIGNAL_WS);
    ws.onopen = () => {
      log('Connected to signaling server');
      ws.send(JSON.stringify({ client: 'laptop' }));
      createPeerConnection();
    };

    ws.onerror = () => {
      log('Signaling error');
      statusEl.textContent = 'Connection failed. Check JARVIS /remote-control.';
    };

    ws.onclose = () => {
      log('Disconnected');
      startBtn.disabled = false;
      startBtn.textContent = 'Reconnect';
    };

    ws.onmessage = async (event) => {
      const data = JSON.parse(event.data);
      if (!pc) return;

      if (data.type === 'offer') {
        log('Received offer from phone');
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'answer', sdp: answer }));
      } else if (data.type === 'answer') {
        log('Received answer from phone');
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      } else if (data.type === 'ice-candidate') {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) {
          console.error('ICE error:', e);
        }
      }
    };

  } catch (e) {
    log('Error: ' + e.message);
    statusEl.textContent = 'Permission denied: ' + e.message;
  }
}

function createPeerConnection() {
  pc = new RTCPeerConnection(config);

  // Add local camera track
  localStream.getTracks().forEach(track => {
    pc.addTrack(track, localStream);
  });

  // Create data channel for receiving audio from phone
  const dc = pc.createDataChannel('audio', { ordered: false, maxRetransmits: 0 });
  dc.binaryType = 'arraybuffer';
  dc.onopen = () => {
    log('Audio channel open');
  };
  dc.onmessage = (event) => {
    if (event.data instanceof ArrayBuffer) {
      const int16 = new Int16Array(event.data);
      playAudioChunk(int16);
    }
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      ws.send(JSON.stringify({ type: 'ice-candidate', candidate: event.candidate }));
    }
  };

  pc.oniceconnectionstatechange = () => {
    log('ICE state: ' + pc.iceConnectionState);
  };

  // Create offer
  pc.createOffer()
    .then(offer => pc.setLocalDescription(offer))
    .then(() => {
      log('Sent offer');
      ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription }));
    })
    .catch(e => {
      log('Offer error: ' + e.message);
    });
}

startBtn.addEventListener('click', start);

// Auto-start if WS URL provided
if (WS_URL_PARAM) {
  start();
}
</script>
</body>
</html>
