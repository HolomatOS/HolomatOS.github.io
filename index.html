<!DOCTYPE html>
<html>
<head>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165/build/three.module.js" } }
  </script>
</head>
<body>
  <button id="start-ar">Start AR</button>

  <script type="module">
    import * as THREE from 'three';

    let renderer, scene, camera, xrSession, hitTestSource;

    document.getElementById('start-ar').addEventListener('click', async () => {
      // 1. Request an immersive-ar session with hit-testing
      xrSession = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay', 'anchors'],
        domOverlay: { root: document.body }
      });

      // 2. Set up Three.js renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.xr.enabled = true;
      renderer.xr.setSession(xrSession);
      document.body.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();
      scene.add(new THREE.AmbientLight(0xffffff, 1.5));

      // 3. Get hit-test source (detects floors/surfaces)
      const refSpace = await xrSession.requestReferenceSpace('viewer');
      hitTestSource = await xrSession.requestHitTestSource({ space: refSpace });

      renderer.setAnimationLoop((time, frame) => onFrame(time, frame));
    });

    function onFrame(time, frame) {
      if (!frame) return;
      const refSpace = renderer.xr.getReferenceSpace();
      const hits = frame.getHitTestResults(hitTestSource);

      if (hits.length > 0) {
        const pose = hits[0].getPose(refSpace);
        // Place a data object at the hit position
        placeDataPoint(pose.transform.matrix);
      }

      renderer.render(scene, camera);
    }

    function placeDataPoint(matrix) {
      // Example: floating bar chart column
      const geo = new THREE.BoxGeometry(0.05, 0.2, 0.05); // 20cm tall bar
      const mat = new THREE.MeshStandardMaterial({ color: 0x00aaff });
      const bar = new THREE.Mesh(geo, mat);
      bar.matrix.fromArray(matrix);
      bar.matrixAutoUpdate = false;
      scene.add(bar);
    }
  </script>
</body>
</html>
