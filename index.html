<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hand Tracking Test - TensorFlow.js</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      /* mirror the video visually so rear camera appears reversed */
      transform: scaleX(-1);
      transform-origin: center center;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      /* mirror the canvas too so drawings align with the mirrored video */
      transform: scaleX(-1);
      transform-origin: center center;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      padding: 15px;
      border-radius: 8px;
      font-size: 16px;
      z-index: 10;
      min-width: 200px;
    }
    .loading { color: #ff0 !important; }
    .detected { color: #0f0 !important; }
    .error { color: #f00 !important; }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="status" class="loading">
      <div>Status: Loading...</div>
      <div id="fps">FPS: --</div>
      <div id="hands">Hands: 0</div>
    </div>
  </div>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const fpsDiv = document.getElementById('fps');
    const handsDiv = document.getElementById('hands');

    let lastTime = Date.now();
    let frameCount = 0;

    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          // Request the rear-facing camera when available
          facingMode: { ideal: 'environment' },
          width: { ideal: 640 },
          height: { ideal: 480 }
        }
      });

      video.srcObject = stream;

      return new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
          // set backing buffer to account for devicePixelRatio for crisp drawing
          const dpr = window.devicePixelRatio || 1;
          canvas.width = Math.round(video.videoWidth * dpr);
          canvas.height = Math.round(video.videoHeight * dpr);
          // set CSS size to match displayed video element size
          canvas.style.width = `${video.clientWidth}px`;
          canvas.style.height = `${video.clientHeight}px`;
          // scale the 2D context so draw coordinates match video pixel coords
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          resolve(video);
        };
      });
    }

    // Initialize MediaPipe Hands
    function setupMediaPipe() {
      updateStatus('Loading MediaPipe Hands...', 'loading');

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.5
      });

      hands.onResults(onResults);

      const cameraFeed = new Camera(video, {
        onFrame: async () => {
          await hands.send({image: video});
        },
        width: 640,
        height: 480
      });

      cameraFeed.start().then(() => {
        updateStatus('Model started — show your hand', 'detected');
      }).catch(err => {
        console.error(err);
        updateStatus(`Camera start error: ${err.message}`, 'error');
      });
    }

    function updateStatus(text, className) {
      statusDiv.querySelector('div').textContent = `Status: ${text}`;
      statusDiv.className = className;
    }

    // MediaPipe results handler
    function onResults(results) {
      // Clear canvas (use CSS-size coordinates; context transform handles DPR and mirroring)
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const hands = results.multiHandLandmarks || [];
      handsDiv.textContent = `Hands: ${hands.length}`;

      if (hands.length > 0) updateStatus('Hand detected!', 'detected');
      else updateStatus('Show your hand to camera', 'loading');

      for (const landmarks of hands) {
        // Draw connections
        const connections = [
          [0, 1], [1, 2], [2, 3], [3, 4],
          [0, 5], [5, 6], [6, 7], [7, 8],
          [0, 9], [9, 10], [10, 11], [11, 12],
          [0, 13], [13, 14], [14, 15], [15, 16],
          [0, 17], [17, 18], [18, 19], [19, 20],
          [5, 9], [9, 13], [13, 17]
        ];

        ctx.strokeStyle = '#ff00ff';
        ctx.lineWidth = 10;
        for (const [s, e] of connections) {
          const x1 = landmarks[s].x * video.videoWidth;
          const y1 = landmarks[s].y * video.videoHeight;
          const x2 = landmarks[e].x * video.videoWidth;
          const y2 = landmarks[e].y * video.videoHeight;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }

        // Draw keypoints
        for (let j = 0; j < landmarks.length; j++) {
          const lm = landmarks[j];
          const x = lm.x * video.videoWidth;
          const y = lm.y * video.videoHeight;
          const radius = (j === 4 || j === 8) ? 14 : 10;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, 2 * Math.PI);
          ctx.fillStyle = (j === 4 || j === 8) ? '#00ff00' : '#ffffff';
          ctx.fill();
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 4;
          ctx.stroke();
        }

        // Simple pinch check using thumb tip (4) and index tip (8)
        const thumb = landmarks[4];
        const index = landmarks[8];
        const dx = (thumb.x - index.x) * video.videoWidth;
        const dy = (thumb.y - index.y) * video.videoHeight;
        const distance = Math.sqrt(dx*dx + dy*dy);
        if (distance < 60) {
          const cx = ((thumb.x + index.x) / 2) * video.videoWidth;
          const cy = ((thumb.y + index.y) / 2) * video.videoHeight;
          ctx.beginPath();
          ctx.arc(cx, cy, 80, 0, 2 * Math.PI);
          ctx.strokeStyle = '#00ff00';
          ctx.lineWidth = 12;
          ctx.stroke();
          ctx.fillStyle = 'rgba(0, 255, 0, 0.45)';
          ctx.fill();
        }
      }

      // FPS
      frameCount++;
      const now = Date.now();
      if (now - lastTime > 1000) {
        const fps = Math.round(frameCount * 1000 / (now - lastTime));
        fpsDiv.textContent = `FPS: ${fps}`;
        frameCount = 0;
        lastTime = now;
      }
    }

    async function main() {
      try {
        await setupCamera();

        // Flip the 2D context horizontally so drawings align with mirrored video
        const dpr = window.devicePixelRatio || 1;
        // canvas.width is in device pixels; setTransform with negative scale flips horizontally
        ctx.setTransform(-dpr, 0, 0, dpr, canvas.width, 0);

        setupMediaPipe();
      } catch (error) {
        console.error('Error:', error);
        updateStatus(`Error: ${error.message}`, 'error');
      }
    }

    main();
  </script>
</body>
</html>
