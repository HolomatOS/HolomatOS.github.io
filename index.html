<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Vision Pro Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        #camera {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        #start-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #start-container.hidden {
            display: none;
        }

        h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
        }

        .start-btn {
            padding: 20px 40px;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.95);
            color: #667eea;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .ar-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .ar-ui.hidden {
            display: none;
        }

        .instructions {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 14px;
            text-align: center;
            max-width: 90%;
            pointer-events: auto;
        }

        .instructions strong {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .icon-preview {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .icon-preview img {
            width: 50px;
            height: 50px;
        }

        .icon-preview-text strong {
            display: block;
            font-size: 16px;
            color: #333;
        }

        .icon-preview-text span {
            font-size: 12px;
            color: #666;
        }

        .place-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 18px 40px;
            background: rgba(0, 122, 255, 0.95);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 122, 255, 0.4);
            pointer-events: auto;
        }

        .place-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        .reticle {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 122, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
        }

        .reticle::before,
        .reticle::after {
            content: '';
            position: absolute;
            background: rgba(0, 122, 255, 0.8);
        }

        .reticle::before {
            top: 50%;
            left: 20%;
            right: 20%;
            height: 3px;
            transform: translateY(-50%);
        }

        .reticle::after {
            left: 50%;
            top: 20%;
            bottom: 20%;
            width: 3px;
            transform: translateX(-50%);
        }

        .placed-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            transition: transform 0.2s ease;
            pointer-events: auto;
        }

        .placed-icon img {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.4));
        }

        .placed-icon.hovering {
            transform: scale(1.3);
        }

        .placed-icon.hovering img {
            filter: drop-shadow(0 8px 20px rgba(255, 255, 255, 0.8));
        }

        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0, 122, 255, 0.8);
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(0, 122, 255, 0.8);
            pointer-events: none;
            z-index: 20;
            transform: translate(-50%, -50%);
            display: none;
        }

        .cursor.active {
            display: block;
        }

        .cursor.pinching {
            background: rgba(255, 45, 85, 0.9);
            box-shadow: 0 0 30px rgba(255, 45, 85, 1);
            transform: translate(-50%, -50%) scale(1.5);
        }

        .complete-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .complete-screen.active {
            display: flex;
        }

        .complete-screen h2 {
            color: white;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .complete-screen p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            margin-bottom: 30px;
        }

        .complete-screen button {
            padding: 18px 40px;
            background: rgba(0, 122, 255, 0.95);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="start-container">
        <h1>🥽 AR Vision Pro Experience</h1>
        <button class="start-btn" onclick="startAR()">Start AR</button>
    </div>

    <video id="camera" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div class="ar-ui hidden" id="ar-ui">
        <div class="instructions" id="instructions">
            <strong>📍 Place Icon</strong>
            Position the crosshair and tap "Place Here"
        </div>

        <div class="icon-preview" id="icon-preview">
            <img id="preview-img" src="" alt="">
            <div class="icon-preview-text">
                <strong id="preview-name"></strong>
                <span id="preview-count"></span>
            </div>
        </div>

        <div class="reticle"></div>
        <button class="place-btn" id="place-btn">Place Here</button>
    </div>

    <div id="icons-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none;"></div>

    <div class="complete-screen" id="complete-screen">
        <h2>✅ Setup Complete!</h2>
        <p>All icons placed. Use hand gestures to interact!</p>
        <button onclick="enableHandTracking()">Enable Hand Tracking</button>
    </div>

    <div class="cursor" id="cursor"></div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <script>
        const icons = [
            { name: 'AI Assistant', img: 'https://cdn-icons-png.flaticon.com/512/8943/8943377.png', app: 'ai' },
            { name: 'Gmail', img: 'https://cdn-icons-png.flaticon.com/512/5968/5968534.png', app: 'gmail' },
            { name: 'App Store', img: 'https://cdn-icons-png.flaticon.com/512/888/888841.png', app: 'appstore' },
            { name: 'Apple Music', img: 'https://cdn-icons-png.flaticon.com/512/5968/5968959.png', app: 'music' }
        ];

        let currentIconIndex = 0;
        let placedIcons = [];
        let handTrackingEnabled = false;
        let hands = null;
        let lastPinchTime = 0;
        const camera = document.getElementById('camera');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        async function startAR() {
            try {
                document.getElementById('start-container').classList.add('hidden');

                // Start camera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });

                camera.srcObject = stream;

                await new Promise((resolve) => {
                    camera.onloadedmetadata = () => {
                        canvas.width = camera.videoWidth;
                        canvas.height = camera.videoHeight;
                        resolve();
                    };
                });

                // Show UI
                document.getElementById('ar-ui').classList.remove('hidden');
                updateIconPreview();

                // Go fullscreen
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }

            } catch (err) {
                alert('Camera Error: ' + err.message);
                document.getElementById('start-container').classList.remove('hidden');
            }
        }

        function updateIconPreview() {
            if (currentIconIndex >= icons.length) {
                showCompleteScreen();
                return;
            }

            const icon = icons[currentIconIndex];
            document.getElementById('preview-img').src = icon.img;
            document.getElementById('preview-name').textContent = icon.name;
            document.getElementById('preview-count').textContent = `Icon ${currentIconIndex + 1} of ${icons.length}`;
        }

        document.getElementById('place-btn').addEventListener('click', () => {
            placeIcon();
            currentIconIndex++;
            updateIconPreview();
        });

        function placeIcon() {
            const icon = icons[currentIconIndex];
            
            // Create icon element
            const iconEl = document.createElement('div');
            iconEl.className = 'placed-icon';
            iconEl.dataset.app = icon.app;
            iconEl.innerHTML = `<img src="${icon.img}" alt="${icon.name}">`;
            
            // Position at center of screen (where reticle is)
            iconEl.style.left = '50%';
            iconEl.style.top = '50%';
            iconEl.style.transform = 'translate(-50%, -50%)';
            
            document.getElementById('icons-container').appendChild(iconEl);
            placedIcons.push({ element: iconEl, app: icon.app, name: icon.name });

            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        function showCompleteScreen() {
            document.getElementById('icon-preview').style.display = 'none';
            document.getElementById('place-btn').style.display = 'none';
            document.querySelector('.reticle').style.display = 'none';
            document.getElementById('complete-screen').classList.add('active');
        }

        async function enableHandTracking() {
            document.getElementById('complete-screen').classList.remove('active');
            document.getElementById('instructions').innerHTML = '<strong>👋 Hand Tracking Active</strong>Point and pinch to interact';
            
            handTrackingEnabled = true;

            // Initialize hand tracking
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });

            hands.onResults(onHandResults);

            // Process frames
            processHandTracking();
        }

        async function processHandTracking() {
            if (handTrackingEnabled) {
                await hands.send({ image: camera });
                requestAnimationFrame(processHandTracking);
            }
        }

        function onHandResults(results) {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cursor = document.getElementById('cursor');

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Draw hand skeleton
                drawConnectors(ctx, landmarks, HAND_CONNECTIONS, { color: 'rgba(0, 255, 255, 0.3)', lineWidth: 2 });
                drawLandmarks(ctx, landmarks, { color: 'rgba(255, 255, 255, 0.5)', lineWidth: 1, radius: 3 });

                // Get finger positions
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                
                const indexX = indexTip.x * window.innerWidth;
                const indexY = indexTip.y * window.innerHeight;
                const thumbX = thumbTip.x * window.innerWidth;
                const thumbY = thumbTip.y * window.innerHeight;

                // Update cursor
                cursor.style.left = indexX + 'px';
                cursor.style.top = indexY + 'px';
                cursor.classList.add('active');

                // Check pinch
                const distance = Math.sqrt(
                    Math.pow(indexX - thumbX, 2) + Math.pow(indexY - thumbY, 2)
                );

                const isPinching = distance < 40;
                
                if (isPinching) {
                    cursor.classList.add('pinching');
                } else {
                    cursor.classList.remove('pinching');
                }

                // Check icon interaction
                placedIcons.forEach(icon => {
                    const rect = icon.element.getBoundingClientRect();
                    const isHovering = (
                        indexX >= rect.left &&
                        indexX <= rect.right &&
                        indexY >= rect.top &&
                        indexY <= rect.bottom
                    );

                    if (isHovering) {
                        icon.element.classList.add('hovering');
                        
                        if (isPinching && Date.now() - lastPinchTime > 500) {
                            lastPinchTime = Date.now();
                            handleIconClick(icon);
                        }
                    } else {
                        icon.element.classList.remove('hovering');
                    }
                });

            } else {
                cursor.classList.remove('active');
                placedIcons.forEach(icon => icon.element.classList.remove('hovering'));
            }
        }

        function handleIconClick(icon) {
            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }

            // Visual feedback
            icon.element.style.transform = icon.element.style.transform + ' scale(0.9)';
            setTimeout(() => {
                icon.element.style.transform = icon.element.style.transform.replace(' scale(0.9)', '');
            }, 200);

            alert(`Opening ${icon.name}!`);
        }
    </script>
</body>
</html>
