<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Crystal Garden AR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Raleway:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Raleway', sans-serif; }

  canvas { display: block; }

  /* ── START SCREEN ─────────────────────────────────────────── */
  #overlay {
    position: fixed; inset: 0; z-index: 200;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px;
    background: radial-gradient(ellipse at 60% 40%, #1a0533 0%, #080112 60%, #000 100%);
  }

  #overlay::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 70%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 85%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 65%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(2px 2px at 35% 55%, rgba(160,100,255,0.7) 0%, transparent 100%),
      radial-gradient(2px 2px at 70% 45%, rgba(100,200,255,0.7) 0%, transparent 100%),
      radial-gradient(2px 2px at 15% 45%, rgba(255,150,200,0.6) 0%, transparent 100%);
    pointer-events: none;
  }

  .gem-icon {
    font-size: 72px;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(150, 80, 255, 0.8));
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(-5deg); }
    50% { transform: translateY(-12px) rotate(5deg); }
  }

  #overlay h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(28px, 8vw, 42px);
    font-weight: 700;
    letter-spacing: 0.12em;
    background: linear-gradient(135deg, #e8b4ff, #90d0ff, #ffb3e6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
  }

  #overlay p {
    color: rgba(200, 180, 255, 0.75);
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.06em;
    text-align: center;
    max-width: 280px;
    line-height: 1.7;
  }

  #req-list {
    list-style: none;
    display: flex; flex-direction: column; gap: 8px;
    font-size: 13px; color: rgba(180,160,220,0.65);
    letter-spacing: 0.04em;
  }
  #req-list li::before { content: '✦ '; color: #a070ff; }

  #start-btn {
    margin-top: 8px;
    padding: 16px 48px;
    font-family: 'Cinzel', serif;
    font-size: 16px;
    letter-spacing: 0.18em;
    color: #fff;
    background: linear-gradient(135deg, rgba(120, 50, 200, 0.8), rgba(60, 120, 220, 0.8));
    border: 1px solid rgba(180, 130, 255, 0.5);
    border-radius: 50px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 30px rgba(120, 60, 220, 0.4), 0 0 60px rgba(80, 100, 255, 0.2);
  }

  #start-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    pointer-events: none;
  }

  #start-btn:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(150, 80, 255, 0.6); }
  #start-btn:active { transform: scale(0.97); }

  #error-msg {
    display: none;
    color: #ff6b8a;
    font-size: 13px;
    text-align: center;
    max-width: 280px;
    line-height: 1.6;
    background: rgba(255, 50, 80, 0.1);
    border: 1px solid rgba(255, 50, 80, 0.3);
    border-radius: 10px;
    padding: 12px 16px;
  }

  /* ── AR OVERLAY UI ────────────────────────────────────────── */
  #ar-ui {
    position: fixed; inset: 0; z-index: 50;
    pointer-events: none;
    display: none;
  }

  #ar-ui.active { display: block; }

  #hint-bar {
    position: absolute; bottom: 100px; left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 0, 30, 0.65);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(180, 130, 255, 0.3);
    border-radius: 30px;
    padding: 10px 22px;
    color: rgba(220, 200, 255, 0.9);
    font-size: 13px;
    letter-spacing: 0.08em;
    white-space: nowrap;
    transition: opacity 0.5s;
  }

  #crystal-count {
    position: absolute; top: 48px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: rgba(200, 170, 255, 0.85);
    background: rgba(10, 0, 30, 0.55);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(160, 110, 255, 0.25);
    border-radius: 20px;
    padding: 8px 20px;
  }

  #exit-btn {
    position: absolute; bottom: 44px; left: 50%;
    transform: translateX(-50%);
    pointer-events: all;
    padding: 12px 32px;
    font-family: 'Raleway', sans-serif;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: rgba(220, 200, 255, 0.8);
    background: rgba(10, 0, 30, 0.6);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(160, 110, 255, 0.3);
    border-radius: 30px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  #exit-btn:active { background: rgba(120, 60, 200, 0.5); color: #fff; }

  #clear-btn {
    position: absolute; top: 48px; right: 24px;
    pointer-events: all;
    padding: 8px 16px;
    font-family: 'Raleway', sans-serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: rgba(200, 170, 255, 0.7);
    background: rgba(10, 0, 30, 0.55);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(160, 110, 255, 0.2);
    border-radius: 20px;
    cursor: pointer;
  }
  #clear-btn:active { background: rgba(100, 50, 180, 0.5); }
</style>
</head>
<body>

<!-- ── START SCREEN ─────────────────────────────────────── -->
<div id="overlay">
  <div class="gem-icon">💎</div>
  <h1>CRYSTAL GARDEN</h1>
  <p>Grow glowing crystals anchored in your real world</p>
  <ul id="req-list">
    <li>Android Chrome browser</li>
    <li>ARCore installed</li>
    <li>Point at a flat surface</li>
    <li>Tap to summon crystals</li>
  </ul>
  <button id="start-btn">ENTER AR</button>
  <p id="error-msg"></p>
</div>

<!-- ── AR OVERLAY ──────────────────────────────────────── -->
<div id="ar-ui">
  <div id="crystal-count">✦ 0 CRYSTALS</div>
  <button id="clear-btn">CLEAR ALL</button>
  <div id="hint-bar">Point at a surface · Tap to place</div>
  <button id="exit-btn">EXIT AR</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   CRYSTAL GARDEN AR — WebXR + Three.js
   World-locked crystal placement with surface hit testing
═══════════════════════════════════════════════════════════ */

let scene, camera, renderer, reticle;
let xrSession     = null;
let hitTestSource = null;
let hitTestSourceRequested = false;
let crystals      = [];
let crystalCount  = 0;
let clock;

const countEl = document.getElementById('crystal-count');
const hintEl  = document.getElementById('hint-bar');

// ── INIT THREE.JS ─────────────────────────────────────────
function init() {
  clock = new THREE.Clock();

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 30);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Lights
  const ambient = new THREE.AmbientLight(0x8060ff, 1.5);
  scene.add(ambient);
  const fill = new THREE.DirectionalLight(0x60a0ff, 1);
  fill.position.set(-2, 4, 2);
  scene.add(fill);

  // Reticle — pulsing ring on detected surface
  const ringGeo = new THREE.RingGeometry(0.07, 0.10, 32).rotateX(-Math.PI / 2);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x88aaff,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.85,
  });
  reticle = new THREE.Mesh(ringGeo, ringMat);
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  // Inner dot
  const dotGeo = new THREE.CircleGeometry(0.015, 16).rotateX(-Math.PI / 2);
  const dot    = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
  reticle.add(dot);

  // XR controller (tap = select event)
  const controller = renderer.xr.getController(0);
  controller.addEventListener('select', onTap);
  scene.add(controller);

  // Session lifecycle
  renderer.xr.addEventListener('sessionstart', () => {
    xrSession = renderer.xr.getSession();
    xrSession.addEventListener('end', onSessionEnd);
  });

  renderer.setAnimationLoop(render);
  window.addEventListener('resize', onResize);
}

// ── TAP → PLACE CRYSTAL ───────────────────────────────────
function onTap() {
  if (!reticle.visible) return;
  placeCrystalCluster();
}

function placeCrystalCluster() {
  const group = new THREE.Group();

  // Pick a random crystalline color palette
  const palettes = [
    { h: 0.75, name: 'amethyst' },   // purple
    { h: 0.55, name: 'aquamarine' }, // cyan
    { h: 0.92, name: 'rose' },       // pink
    { h: 0.13, name: 'citrine' },    // gold
    { h: 0.35, name: 'emerald' },    // green
    { h: 0.60, name: 'sapphire' },   // blue
  ];
  const palette = palettes[Math.floor(Math.random() * palettes.length)];
  const hue = palette.h + (Math.random() - 0.5) * 0.05;

  const shardCount = 4 + Math.floor(Math.random() * 4); // 4–7 shards

  for (let i = 0; i < shardCount; i++) {
    const shard = makeCrystalShard(hue, i, shardCount);
    group.add(shard);
  }

  // Glowing point light at base
  const lightColor = new THREE.Color().setHSL(hue, 1.0, 0.65);
  const light = new THREE.PointLight(lightColor, 3, 0.6);
  light.position.y = 0.05;
  group.add(light);

  // Tiny sparkle particles
  const sparks = makeSparkles(hue);
  group.add(sparks);

  // Place at reticle world position
  group.position.setFromMatrixPosition(reticle.matrix);
  group.userData = {
    birthTime: clock.getElapsedTime(),
    lightRef: light,
    sparks,
    hue,
  };
  group.scale.setScalar(0.001); // start near zero → grow in

  scene.add(group);
  crystals.push(group);
  crystalCount++;
  countEl.textContent = `✦ ${crystalCount} CRYSTAL${crystalCount !== 1 ? 'S' : ''}`;
}

function makeCrystalShard(hue, index, total) {
  // Tall hexagonal prism crystal
  const height  = 0.06 + Math.random() * 0.12;
  const radius  = 0.012 + Math.random() * 0.014;
  const geo = new THREE.ConeGeometry(radius, height, 6, 1);

  const color    = new THREE.Color().setHSL(hue, 0.9, 0.65);
  const emissive = new THREE.Color().setHSL(hue, 1.0, 0.25);

  const mat = new THREE.MeshStandardMaterial({
    color,
    emissive,
    emissiveIntensity: 0.6,
    metalness: 0.1,
    roughness: 0.05,
    transparent: true,
    opacity: 0.78,
    side: THREE.DoubleSide,
  });

  const mesh = new THREE.Mesh(geo, mat);

  // Position in cluster circle
  const angle  = (index / total) * Math.PI * 2 + Math.random() * 0.5;
  const dist   = 0.02 + Math.random() * 0.04;
  mesh.position.set(
    Math.cos(angle) * dist,
    height * 0.5,
    Math.sin(angle) * dist
  );
  mesh.rotation.y = Math.random() * Math.PI;
  mesh.rotation.z = (Math.random() - 0.5) * 0.25;

  return mesh;
}

function makeSparkles(hue) {
  const geo = new THREE.BufferGeometry();
  const count = 20;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 0.02 + Math.random() * 0.08;
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.random() * Math.PI;
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = Math.random() * 0.18;
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: new THREE.Color().setHSL(hue, 1.0, 0.9),
    size: 0.006,
    transparent: true,
    opacity: 0.8,
  });
  return new THREE.Points(geo, mat);
}

// ── MAIN RENDER LOOP ──────────────────────────────────────
function render(timestamp, frame) {
  const t = clock.getElapsedTime();

  if (frame && xrSession) {
    const refSpace = renderer.xr.getReferenceSpace();

    // One-time: request hit test source
    if (!hitTestSourceRequested) {
      hitTestSourceRequested = true;
      xrSession.requestReferenceSpace('viewer').then(viewerSpace => {
        xrSession.requestHitTestSource({ space: viewerSpace }).then(src => {
          hitTestSource = src;
          hintEl.textContent = 'Point at a surface · Tap to place';
        });
      });
    }

    // Update reticle position
    if (hitTestSource) {
      const results = frame.getHitTestResults(hitTestSource);
      if (results.length > 0) {
        const pose = results[0].getPose(refSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
        hintEl.style.opacity = '1';
      } else {
        reticle.visible = false;
        hintEl.style.opacity = '0.4';
      }
    }
  }

  // Animate reticle pulse
  if (reticle.visible) {
    const pulse = 0.85 + Math.sin(t * 4) * 0.15;
    reticle.material.opacity = pulse;
    const rs = 0.9 + Math.sin(t * 3) * 0.12;
    reticle.scale.set(rs, 1, rs);
  }

  // Animate all crystals
  crystals.forEach((group, gi) => {
    const age = t - group.userData.birthTime;

    // Grow-in spring animation
    const targetScale = 1.0;
    const growT = Math.min(age / 0.6, 1.0);
    const eased = easeOutBack(growT);
    group.scale.setScalar(Math.max(0.001, eased));

    // Gentle float (only after grown in)
    if (age > 0.6) {
      group.position.y = group.position.y +
        Math.sin(t * 1.2 + gi * 1.3) * 0.00008;
    }

    // Slow rotation
    group.rotation.y = t * 0.25 + gi * 1.1;

    // Light flicker
    if (group.userData.lightRef) {
      group.userData.lightRef.intensity = 2.5 + Math.sin(t * 5 + gi) * 0.5;
    }

    // Sparkle opacity shimmer
    if (group.userData.sparks) {
      group.userData.sparks.material.opacity = 0.4 + Math.sin(t * 3 + gi * 2) * 0.35;
    }
  });

  renderer.render(scene, camera);
}

function easeOutBack(x) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}

// ── SESSION END ───────────────────────────────────────────
function onSessionEnd() {
  hitTestSource           = null;
  hitTestSourceRequested  = false;
  xrSession               = null;

  crystals.forEach(c => scene.remove(c));
  crystals    = [];
  crystalCount = 0;

  document.getElementById('ar-ui').classList.remove('active');
  document.getElementById('overlay').style.display = 'flex';
  countEl.textContent = '✦ 0 CRYSTALS';
}

function onResize() {
  if (!renderer.xr.isPresenting) {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
}

// ── BUTTON HANDLERS ───────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', async () => {
  const errEl = document.getElementById('error-msg');
  errEl.style.display = 'none';

  if (!navigator.xr) {
    showError('WebXR not found. Open this page in Chrome on your Android phone.');
    return;
  }

  let supported = false;
  try { supported = await navigator.xr.isSessionSupported('immersive-ar'); }
  catch(e) { showError('Error checking AR support: ' + e.message); return; }

  if (!supported) {
    showError('AR not supported on this device. Make sure ARCore is installed from the Play Store and you are using Chrome.');
    return;
  }

  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.getElementById('ar-ui') },
    });

    await renderer.xr.setSession(session);

    document.getElementById('overlay').style.display = 'none';
    document.getElementById('ar-ui').classList.add('active');
    hintEl.textContent = 'Initializing surface detection…';
  } catch(e) {
    showError('Could not start AR session: ' + e.message);
  }
});

document.getElementById('exit-btn').addEventListener('click', () => {
  if (xrSession) xrSession.end();
});

document.getElementById('clear-btn').addEventListener('click', () => {
  crystals.forEach(c => scene.remove(c));
  crystals     = [];
  crystalCount = 0;
  countEl.textContent = '✦ 0 CRYSTALS';
});

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

// ── GO ────────────────────────────────────────────────────
init();
</script>
</body>
</html>
