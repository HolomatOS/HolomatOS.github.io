<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Scanner</title>
<style>
  /* ── Reset & base ── */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    width: 100vw;
    height: 100dvh;
    touch-action: none;
  }

  /* ── Live camera feed — always visible behind everything ── */
  #camera-video {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;       /* fill the screen like a viewfinder */
    z-index: 1;
    display: none;           /* shown once stream is ready */
  }

  /* ── Canvas sits on top of the video — transparent background ── */
  #scan-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
    background: transparent; /* IMPORTANT: don't cover the video */
  }

  /* ── Start screen shown before WebXR activates ── */
  #start-screen {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 100;
  }

  #start-screen h1 {
    color: #00ffcc;
    font-size: 22px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  #start-screen p {
    color: #557;
    font-size: 13px;
    text-align: center;
    max-width: 280px;
    line-height: 1.7;
  }

  #start-btn {
    background: transparent;
    border: 1px solid #00ffcc;
    color: #00ffcc;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 14px 32px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #start-btn:hover { background: rgba(0,255,204,0.08); }
  #start-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ── HUD info box that floats next to the object ── */
  #hud {
    position: fixed;
    display: none;               /* hidden until scan completes */
    max-width: 200px;
    background: rgba(0, 0, 0, 0.75);
    border: 1px solid #00ffcc55;
    border-left: 2px solid #00ffcc;
    padding: 10px 12px;
    z-index: 20;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  #hud-title {
    color: #00ffcc;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  #hud-body {
    color: #aaa;
    font-size: 11px;
    line-height: 1.5;
  }

  #hud-dist {
    color: #555;
    font-size: 10px;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  /* ── Scanning status label at the top ── */
  #status {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #00ffcc;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 20;
    pointer-events: none;
  }
  #status.visible { opacity: 1; }

  /* ── Corner brackets that frame the detected object ── */
  #frame-overlay {
    position: fixed;
    pointer-events: none;
    z-index: 15;
    display: none;
  }
  .bracket {
    position: absolute;
    width: 14px;
    height: 14px;
    border-color: #00ffcc;
    border-style: solid;
    opacity: 0.8;
  }
  .bracket.tl { top: 0;  left: 0;  border-width: 1px 0 0 1px; }
  .bracket.tr { top: 0;  right: 0; border-width: 1px 1px 0 0; }
  .bracket.bl { bottom: 0; left: 0; border-width: 0 0 1px 1px; }
  .bracket.br { bottom: 0; right: 0; border-width: 0 1px 1px 0; }
</style>
</head>
<body>

<!-- ── START SCREEN ─────────────────────────────── -->
<div id="start-screen">
  <h1>AR Scanner</h1>
  <p>Point at any object. The scanner will outline it, sweep across it, then identify it.</p>
  <p style="color:#334;font-size:11px;">Requires Chrome on Android · HTTPS required</p>
  <button id="start-btn" onclick="startAR()">Start scanning</button>
</div>

<!-- ── CAMERA FEED: always-on background ──────── -->
<video id="camera-video" autoplay muted playsinline></video>

<!-- ── CANVAS: scan line drawn here (transparent) ── -->
<canvas id="scan-canvas"></canvas>

<!-- ── HUD: floats next to the detected object ─── -->
<div id="hud">
  <div id="hud-title">Unknown</div>
  <div id="hud-body">Scanning…</div>
  <div id="hud-dist"></div>
</div>

<!-- ── CORNER BRACKETS ──────────────────────────── -->
<div id="frame-overlay">
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>
</div>

<!-- ── STATUS LABEL ─────────────────────────────── -->
<div id="status">Detecting…</div>


<!-- ══════════════════════════════════════════════
     STEP 1 — Load MediaPipe Vision Tasks (WASM)
     This runs entirely on-device, no server needed
     ══════════════════════════════════════════════ -->
<script type="module">

// ─── CONFIG ──────────────────────────────────────────────
// Put your Claude API key here (or proxy it through your own server)
const CLAUDE_API_KEY = "YOUR_API_KEY_HERE";
const CLAUDE_MODEL   = "claude-opus-4-5";

// How long (ms) with no mask before HUD disappears
const LOOK_AWAY_GRACE = 400;

// Only re-query Claude if >2s has passed since last ID
const REQUERY_COOLDOWN = 2000;
// ─────────────────────────────────────────────────────────


import {
  ImageSegmenter,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";


// ── DOM refs ──
const canvas   = document.getElementById("scan-canvas");
const ctx      = canvas.getContext("2d");
const hud      = document.getElementById("hud");
const hudTitle = document.getElementById("hud-title");
const hudBody  = document.getElementById("hud-body");
const hudDist  = document.getElementById("hud-dist");
const statusEl = document.getElementById("status");
const frameEl  = document.getElementById("frame-overlay");
// The visible <video> in the HTML — shows camera feed on screen
const videoEl  = document.getElementById("camera-video");

// ── State ──
let segmenter       = null;
let xrSession       = null;
let scanY           = 0;
let scanDir         = 1;
let lastMaskTime    = 0;
let lastQueryTime   = 0;
let currentMaskBBox = null;
let isScanning      = false;
let rafId           = null;


// ══════════════════════════════════════════════
// STEP 2 — Initialise MediaPipe segmenter
// Model: selfie_multiclass — recognises many object categories
// ══════════════════════════════════════════════
async function initSegmenter() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  segmenter = await ImageSegmenter.createFromOptions(vision, {
    baseOptions: {
      // This model classifies each pixel into one of 24 categories
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite",
      delegate: "GPU"   // use the phone GPU for speed
    },
    runningMode: "VIDEO",           // frame-by-frame live mode
    outputCategoryMask: true,       // we get per-pixel class IDs
    outputConfidenceMasks: false    // skip probability maps (saves memory)
  });
}


// ══════════════════════════════════════════════
// STEP 3 — Start WebXR + camera
// DOM Overlay = our HTML renders ON TOP of the AR camera feed
// ══════════════════════════════════════════════
window.startAR = async function() {
  const btn = document.getElementById("start-btn");
  btn.disabled = true;
  btn.textContent = "Loading…";

  await initSegmenter();

  // Check if WebXR AR is supported
  if (!navigator.xr || !(await navigator.xr.isSessionSupported("immersive-ar"))) {
    // Fallback: use plain getUserMedia camera instead of WebXR
    // Useful for testing on desktop or non-AR browsers
    fallbackCamera();
    return;
  }

  xrSession = await navigator.xr.requestSession("immersive-ar", {
    requiredFeatures: ["dom-overlay"],
    domOverlay: { root: document.body }  // our full body is the overlay
  });

  // Resize canvas to match screen
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  // Hide start screen, show AR
  document.getElementById("start-screen").style.display = "none";
  showStatus("Point at an object");

  xrSession.addEventListener("end", () => location.reload());

  // Attach camera stream to our visible <video> element
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
  });
  videoEl.srcObject = stream;
  videoEl.style.display = "block"; // make it visible
  await videoEl.play();

  tick();
};


// ══════════════════════════════════════════════
// Fallback: plain camera (for non-WebXR browsers / desktop testing)
// ══════════════════════════════════════════════
async function fallbackCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });
  // Attach to the visible <video> element already in the page
  videoEl.srcObject = stream;
  videoEl.style.display = "block"; // show it — this IS the camera feed
  await videoEl.play();

  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  document.getElementById("start-screen").style.display = "none";
  showStatus("Camera ready");
  tick();
}


// ══════════════════════════════════════════════
// STEP 4 — Main animation loop
// Runs every frame (~30-60fps)
// ══════════════════════════════════════════════
function tick() {
  rafId = requestAnimationFrame(tick);

  // Clear canvas each frame — the <video> element behind it shows the feed
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Wait until video is actually playing before segmenting
  if (videoEl.readyState < 2) return;

  const now = performance.now();

  // ── Run segmentation on this frame ──
  let result, mask;
  try {
    result = segmenter.segmentForVideo(videoEl, now);
    mask   = result?.categoryMask;
  } catch(e) {
    // Segmenter occasionally errors mid-stream — skip frame, do not crash
    console.warn("Segmentation error:", e.message);
    return;
  }
  if (!mask) return;

  // ── Find the most-confident object in the mask ──
  const bbox = extractBestMaskBBox(
    mask.getAsUint8Array(),
    mask.width,
    mask.height
  );

  if (bbox) {
    // ── Object is visible ──
    lastMaskTime = now;
    currentMaskBBox = scaleBBoxToCanvas(bbox, mask.width, mask.height);
    updateFrameBrackets(currentMaskBBox);
    drawScanLine(currentMaskBBox, mask, mask.width, mask.height);
    showStatus("Scanning…");

    // Query Claude if we haven't recently
    if (now - lastQueryTime > REQUERY_COOLDOWN && !isScanning) {
      lastQueryTime = now;
      identifyObject(currentMaskBBox);
    }

  } else {
    // ── No object visible ──
    if (now - lastMaskTime > LOOK_AWAY_GRACE) {
      hideHUD();
      hideFrameBrackets();
      showStatus("Point at an object");
      isScanning = false;
    }
  }

  mask.close(); // free GPU memory
}


// ══════════════════════════════════════════════
// STEP 5 — Extract mask bounding box
// Finds the region where the most prominent object lives.
// Ignores background (class 0) and sky (class 1).
// Returns {minX, maxX, minY, maxY} in mask-pixel coordinates.
// ══════════════════════════════════════════════
function extractBestMaskBBox(maskData, mw, mh) {
  let minX = mw, maxX = 0, minY = mh, maxY = 0;
  let pixelCount = 0;

  for (let i = 0; i < maskData.length; i++) {
    const cls = maskData[i];
    // Class 0 = background, skip it
    if (cls === 0) continue;

    const x = i % mw;
    const y = Math.floor(i / mw);
    if (x < minX) minX = x;
    if (x > maxX) maxX = x;
    if (y < minY) minY = y;
    if (y > maxY) maxY = y;
    pixelCount++;
  }

  // If less than 1% of the frame is object, ignore it (noise filter)
  if (pixelCount < mw * mh * 0.01) return null;
  if (maxX <= minX || maxY <= minY) return null;

  return { minX, maxX, minY, maxY, maskData, mw, mh };
}


// Scale mask bbox (which is 256x256) up to canvas pixel coords
function scaleBBoxToCanvas(bbox, mw, mh) {
  const sx = canvas.width  / mw;
  const sy = canvas.height / mh;
  return {
    minX: bbox.minX * sx,
    maxX: bbox.maxX * sx,
    minY: bbox.minY * sy,
    maxY: bbox.maxY * sy,
    // Keep originals for mask drawing
    rawBbox: bbox
  };
}


// ══════════════════════════════════════════════
// STEP 6 — Draw the scan line CLIPPED to the object silhouette
//
// Key insight: ctx.clip() restricts ALL drawing to within the mask.
// So even though we draw a full-width line, it only SHOWS
// on the pixels where the object was detected.
// ══════════════════════════════════════════════
function drawScanLine(cbbox, mask, mw, mh) {
  const { minY, maxY } = cbbox;
  const bbox = cbbox.rawBbox;

  // Advance scan line position
  const speed = (maxY - minY) * 0.012;  // proportional to object height
  scanY += speed * scanDir;
  if (scanY > maxY) { scanY = maxY; scanDir = -1; }
  if (scanY < minY) { scanY = minY; scanDir =  1; }

  // ── Build the clip region from mask pixels ──
  // We create a Path2D that traces around every "object" pixel.
  // For performance, we work in mask coordinates and scale up.
  const sx = canvas.width  / mw;
  const sy = canvas.height / mh;

  ctx.save();

  // Use the mask pixels as clip path
  const path = new Path2D();
  const data = bbox.maskData;
  for (let y = bbox.minY; y <= bbox.maxY; y++) {
    for (let x = bbox.minX; x <= bbox.maxX; x++) {
      if (data[y * mw + x] !== 0) {
        // Each non-background pixel becomes a tiny rect in the clip path
        path.rect(x * sx, y * sy, sx + 0.5, sy + 0.5);
      }
    }
  }
  ctx.clip(path);

  // ── Draw the actual scan line (only visible inside clip) ──
  // Outer glow pass
  ctx.strokeStyle = "rgba(0, 255, 204, 0.2)";
  ctx.lineWidth   = 10;
  ctx.beginPath();
  ctx.moveTo(0, scanY);
  ctx.lineTo(canvas.width, scanY);
  ctx.stroke();

  // Core bright line
  ctx.strokeStyle = "#00ffcc";
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, scanY);
  ctx.lineTo(canvas.width, scanY);
  ctx.stroke();

  // Trailing fade (gradient below the scan line)
  const grad = ctx.createLinearGradient(0, scanY, 0, scanY + 40);
  grad.addColorStop(0, "rgba(0,255,204,0.15)");
  grad.addColorStop(1, "rgba(0,255,204,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, scanY, canvas.width, 40);

  ctx.restore();
  isScanning = true;
}


// ══════════════════════════════════════════════
// STEP 7 — Send cropped image to Claude Vision API
// We crop just the bounding box of the detected object,
// encode it as base64, and POST to Claude.
// ══════════════════════════════════════════════
async function identifyObject(cbbox) {
  // Create a small offscreen canvas with just the object region
  const oc  = document.createElement("canvas");
  const pad = 12;  // a little padding around the crop
  oc.width  = Math.min(256, cbbox.maxX - cbbox.minX + pad * 2);
  oc.height = Math.min(256, cbbox.maxY - cbbox.minY + pad * 2);
  const oc_ctx = oc.getContext("2d");

  // Draw the video frame cropped to bbox
  oc_ctx.drawImage(
    videoEl,
    Math.max(0, cbbox.minX - pad),   // source x (in video coords, scaled)
    Math.max(0, cbbox.minY - pad),   // source y
    cbbox.maxX - cbbox.minX + pad * 2,
    cbbox.maxY - cbbox.minY + pad * 2,
    0, 0, oc.width, oc.height        // destination = full offscreen canvas
  );

  const base64 = oc.toDataURL("image/jpeg", 0.75).split(",")[1];

  hudTitle.textContent = "Identifying…";
  hudBody.textContent  = "";
  showHUD(cbbox);

  // Bail if no API key set
  if (CLAUDE_API_KEY === "YOUR_API_KEY_HERE") {
    hudTitle.textContent = "Demo mode";
    hudBody.textContent  = "Add your Claude API key to the top of the file to get live object identification.";
    return;
  }

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type":         "application/json",
        "x-api-key":            CLAUDE_API_KEY,
        "anthropic-version":    "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: CLAUDE_MODEL,
        max_tokens: 120,
        messages: [{
          role: "user",
          content: [
            {
              type: "image",
              source: { type: "base64", media_type: "image/jpeg", data: base64 }
            },
            {
              type: "text",
              text: "What is this object? Reply with: 1) its name (3 words max), 2) one sentence describing what it does. Be direct, no preamble."
            }
          ]
        }]
      })
    });

    const data = await res.json();
    const reply = data?.content?.[0]?.text ?? "Could not identify.";

    // Split into name + description
    const lines = reply.trim().split("\n").filter(Boolean);
    hudTitle.textContent = lines[0]?.replace(/^1[).]\s*/, "") ?? "Object";
    hudBody.textContent  = lines[1]?.replace(/^2[).]\s*/, "") ?? reply;

  } catch (err) {
    hudBody.textContent = "Network error.";
    console.error(err);
  }
}


// ══════════════════════════════════════════════
// STEP 8 — HUD positioning
// Place the HUD div to the right of the bounding box.
// If near the right edge, flip it to the left.
// ══════════════════════════════════════════════
function showHUD(cbbox) {
  const hudW = 200;
  const gap  = 16;
  let left = cbbox.maxX + gap;

  // Flip to left side if not enough space
  if (left + hudW > window.innerWidth - 8) {
    left = cbbox.minX - hudW - gap;
  }

  // Clamp to screen
  left = Math.max(8, Math.min(left, window.innerWidth - hudW - 8));

  const top = Math.max(8, cbbox.minY);

  hud.style.left    = left + "px";
  hud.style.top     = top  + "px";
  hud.style.display = "block";
  hud.style.opacity = "1";
}

function hideHUD() {
  hud.style.opacity = "0";
  setTimeout(() => { hud.style.display = "none"; }, 300);
}


// ══════════════════════════════════════════════
// STEP 9 — Corner bracket frame around object
// ══════════════════════════════════════════════
function updateFrameBrackets(cbbox) {
  const el  = frameEl;
  const pad = 6;
  el.style.display = "block";
  el.style.left    = (cbbox.minX - pad) + "px";
  el.style.top     = (cbbox.minY - pad) + "px";
  el.style.width   = (cbbox.maxX - cbbox.minX + pad * 2) + "px";
  el.style.height  = (cbbox.maxY - cbbox.minY + pad * 2) + "px";
}

function hideFrameBrackets() {
  frameEl.style.display = "none";
}


// ── Tiny status label helpers ──
function showStatus(msg) {
  statusEl.textContent = msg;
  statusEl.classList.add("visible");
}

</script>
</body>
</html>
