<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCore Vision Pro Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        #start-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #start-container.hidden {
            display: none;
        }

        h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
        }

        .start-btn {
            padding: 20px 40px;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.95);
            color: #667eea;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        #ar-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .ar-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .instructions {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 14px;
            text-align: center;
            max-width: 90%;
            pointer-events: auto;
        }

        .instructions strong {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .icon-preview {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .icon-preview img {
            width: 50px;
            height: 50px;
        }

        .icon-preview-text {
            text-align: left;
        }

        .icon-preview-text strong {
            display: block;
            font-size: 16px;
            color: #333;
        }

        .icon-preview-text span {
            font-size: 12px;
            color: #666;
        }

        .place-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 18px 40px;
            background: rgba(0, 122, 255, 0.95);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 122, 255, 0.4);
            pointer-events: auto;
        }

        .place-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        .reticle {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 122, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
        }

        .reticle::before,
        .reticle::after {
            content: '';
            position: absolute;
            background: rgba(0, 122, 255, 0.8);
        }

        .reticle::before {
            top: 50%;
            left: 20%;
            right: 20%;
            height: 3px;
            transform: translateY(-50%);
        }

        .reticle::after {
            left: 50%;
            top: 20%;
            bottom: 20%;
            width: 3px;
            transform: translateX(-50%);
        }

        .complete-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .complete-screen.active {
            display: flex;
        }

        .complete-screen h2 {
            color: white;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .complete-screen p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            margin-bottom: 30px;
        }

        .complete-screen button {
            padding: 18px 40px;
            background: rgba(0, 122, 255, 0.95);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0, 122, 255, 0.8);
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(0, 122, 255, 0.8);
            pointer-events: none;
            z-index: 20;
            transform: translate(-50%, -50%);
            display: none;
        }

        .cursor.active {
            display: block;
        }

        .cursor.pinching {
            background: rgba(255, 45, 85, 0.9);
            box-shadow: 0 0 30px rgba(255, 45, 85, 1);
            transform: translate(-50%, -50%) scale(1.5);
        }
    </style>
</head>
<body>
    <div id="start-container">
        <h1>🥽 AR Vision Pro Experience</h1>
        <button class="start-btn" onclick="startAR()">Start AR</button>
    </div>

    <canvas id="ar-canvas"></canvas>

    <div class="ar-ui hidden" id="ar-ui">
        <div class="instructions" id="instructions">
            <strong>📍 Place Icon</strong>
            Point at a surface and tap "Place Here"
        </div>

        <div class="icon-preview" id="icon-preview">
            <img id="preview-img" src="" alt="">
            <div class="icon-preview-text">
                <strong id="preview-name"></strong>
                <span id="preview-count"></span>
            </div>
        </div>

        <div class="reticle"></div>

        <button class="place-btn" id="place-btn">Place Here</button>
    </div>

    <div class="complete-screen" id="complete-screen">
        <h2>✅ Setup Complete!</h2>
        <p>All icons placed. Use hand gestures to interact!</p>
        <button onclick="enableHandTracking()">Enable Hand Tracking</button>
    </div>

    <div class="cursor" id="cursor"></div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>

    <script>
        const icons = [
            { name: 'AI Assistant', img: 'https://cdn-icons-png.flaticon.com/512/8943/8943377.png', app: 'ai' },
            { name: 'Gmail', img: 'https://cdn-icons-png.flaticon.com/512/5968/5968534.png', app: 'gmail' },
            { name: 'App Store', img: 'https://cdn-icons-png.flaticon.com/512/888/888841.png', app: 'appstore' },
            { name: 'Apple Music', img: 'https://cdn-icons-png.flaticon.com/512/5968/5968959.png', app: 'music' }
        ];

        let currentIconIndex = 0;
        let xrSession = null;
        let xrRefSpace = null;
        let gl = null;
        let scene, camera, renderer;
        let placedIcons = [];
        let reticlePosition = null;
        let handTrackingEnabled = false;
        let hands = null;

        async function startAR() {
            try {
                document.getElementById('start-container').classList.add('hidden');

                // Request AR session
                xrSession = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['local', 'hit-test'],
                    optionalFeatures: ['dom-overlay'],
                    domOverlay: { root: document.getElementById('ar-ui') }
                });

                // Setup Three.js
                const canvas = document.getElementById('ar-canvas');
                renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
                renderer.xr.enabled = true;
                renderer.xr.setSession(xrSession);

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera();
                camera.matrixAutoUpdate = false;

                // Add lighting
                const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
                scene.add(light);

                // Get reference space
                xrRefSpace = await xrSession.requestReferenceSpace('local');

                // Show UI
                document.getElementById('ar-ui').classList.remove('hidden');
                updateIconPreview();

                // Start render loop
                renderer.setAnimationLoop(render);

            } catch (err) {
                alert('AR Error: ' + err.message);
                document.getElementById('start-container').classList.remove('hidden');
            }
        }

        function updateIconPreview() {
            if (currentIconIndex >= icons.length) {
                showCompleteScreen();
                return;
            }

            const icon = icons[currentIconIndex];
            document.getElementById('preview-img').src = icon.img;
            document.getElementById('preview-name').textContent = icon.name;
            document.getElementById('preview-count').textContent = `Icon ${currentIconIndex + 1} of ${icons.length}`;
        }

        document.getElementById('place-btn').addEventListener('click', () => {
            if (reticlePosition && currentIconIndex < icons.length) {
                placeIcon(reticlePosition);
                currentIconIndex++;
                updateIconPreview();
            }
        });

        function placeIcon(position) {
            const icon = icons[currentIconIndex];

            // Create icon mesh
            const texture = new THREE.TextureLoader().load(icon.img);
            const geometry = new THREE.PlaneGeometry(0.15, 0.15);
            const material = new THREE.MeshBasicMaterial({ 
                map: texture, 
                transparent: true,
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geometry, material);
            
            mesh.position.copy(position);
            mesh.userData = { app: icon.app, name: icon.name };
            
            scene.add(mesh);
            placedIcons.push(mesh);

            // Haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        function showCompleteScreen() {
            document.getElementById('icon-preview').style.display = 'none';
            document.getElementById('place-btn').style.display = 'none';
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('complete-screen').classList.add('active');
        }

        async function enableHandTracking() {
            document.getElementById('complete-screen').classList.remove('active');
            document.getElementById('instructions').innerHTML = '<strong>👋 Hand Tracking Active</strong>Point and pinch to interact';
            document.getElementById('instructions').style.display = 'block';
            
            handTrackingEnabled = true;

            // Initialize hand tracking
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });

            hands.onResults(onHandResults);

            // Create video for hand tracking
            const video = document.createElement('video');
            video.autoplay = true;
            video.playsInline = true;

            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }
            });
            video.srcObject = stream;

            // Process frames
            setInterval(async () => {
                if (handTrackingEnabled) {
                    await hands.send({ image: video });
                }
            }, 100);
        }

        let lastPinchTime = 0;
        function onHandResults(results) {
            const cursor = document.getElementById('cursor');

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Get finger positions
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                
                const indexX = indexTip.x * window.innerWidth;
                const indexY = indexTip.y * window.innerHeight;
                const thumbX = thumbTip.x * window.innerWidth;
                const thumbY = thumbTip.y * window.innerHeight;

                // Update cursor
                cursor.style.left = indexX + 'px';
                cursor.style.top = indexY + 'px';
                cursor.classList.add('active');

                // Check pinch
                const distance = Math.sqrt(
                    Math.pow(indexX - thumbX, 2) + Math.pow(indexY - thumbY, 2)
                );

                const isPinching = distance < 40;
                
                if (isPinching) {
                    cursor.classList.add('pinching');
                    
                    if (Date.now() - lastPinchTime > 500) {
                        lastPinchTime = Date.now();
                        checkIconInteraction(indexX, indexY);
                    }
                } else {
                    cursor.classList.remove('pinching');
                }
            } else {
                cursor.classList.remove('active');
            }
        }

        function checkIconInteraction(x, y) {
            // This is simplified - in full implementation would raycast from hand position
            alert('Icon interaction detected!');
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        function render(timestamp, frame) {
            if (!frame) return;

            const pose = frame.getViewerPose(xrRefSpace);
            if (!pose) return;

            const view = pose.views[0];
            
            // Update camera
            camera.matrix.fromArray(view.transform.matrix);
            camera.projectionMatrix.fromArray(view.projectionMatrix);
            camera.updateMatrixWorld(true);

            // Simple hit test simulation (center of screen)
            if (currentIconIndex < icons.length) {
                const centerDistance = 1.0; // 1 meter in front
                reticlePosition = new THREE.Vector3(0, 0, -centerDistance);
                reticlePosition.applyMatrix4(camera.matrixWorld);
            }

            // Make icons face camera
            placedIcons.forEach(icon => {
                icon.lookAt(camera.position);
            });

            // Render scene
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
