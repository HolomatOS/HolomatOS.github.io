<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEOCITY AR // 2077</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; touch-action:none; font-family:'Courier New',monospace; }

#start-screen {
  position:fixed; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:100;
  background: radial-gradient(ellipse at 40% 60%, #0d0025 0%, #000510 50%, #000 100%);
}
.glitch {
  font-size:44px; font-weight:900; letter-spacing:10px; color:#00ffff;
  text-shadow:0 0 20px #00ffff,0 0 60px #00ffff55; margin-bottom:6px;
  animation:glitch 4s infinite;
}
@keyframes glitch {
  0%,90%,100%{ transform:none; text-shadow:0 0 20px #00ffff,0 0 60px #00ffff55 }
  92%{ transform:translate(-2px,0); text-shadow:2px 0 #ff00aa,-2px 0 #00ffff }
  94%{ transform:translate(2px,0);  text-shadow:-2px 0 #ff00aa,2px 0 #00ffff }
}
.tagline { font-size:11px; letter-spacing:6px; color:#ff00aa; text-shadow:0 0 12px #ff00aa; margin-bottom:50px; }
#start-btn {
  border:1px solid #00ffff; background:transparent; color:#00ffff;
  font-family:'Courier New',monospace; font-size:13px; letter-spacing:5px;
  padding:16px 44px; cursor:pointer;
  box-shadow:0 0 20px #00ffff22,inset 0 0 20px #00ffff08;
}
#start-btn:active { background:#00ffff22; }
.prereqs { margin-top:40px; color:#334; font-size:10px; letter-spacing:2px; text-align:center; line-height:2.2; }
.prereqs span { color:#556; }

#hud { position:fixed; inset:0; pointer-events:none; z-index:10; display:none; }
#hud-tl { position:absolute; top:18px; left:18px; }
#hud-bl { position:absolute; bottom:36px; left:50%; transform:translateX(-50%); text-align:center; }
.hud-label { color:#ff00aa; font-size:14px; letter-spacing:5px; text-shadow:0 0 14px #ff00aa; }
.hud-value { color:#00ffff; font-size:10px; letter-spacing:2px; text-shadow:0 0 8px #00ffff; margin-top:4px; }
#instruction {
  display:inline-block; color:#00ffff; font-size:12px; letter-spacing:3px;
  padding:10px 22px; border:1px solid #00ffff66; background:#00000099;
  text-shadow:0 0 10px #00ffff;
}
.corner { position:absolute; width:24px; height:24px; border-color:#00ffff44; border-style:solid; }
.c-tl { top:10px; left:10px; border-width:1px 0 0 1px; }
.c-tr { top:10px; right:10px; border-width:1px 1px 0 0; }
.c-bl { bottom:28px; left:10px; border-width:0 0 1px 1px; }
.c-br { bottom:28px; right:10px; border-width:0 1px 1px 0; }

#no-ar {
  position:fixed; inset:0; display:none; flex-direction:column;
  align-items:center; justify-content:center; background:#000;
  z-index:200; gap:14px; padding:40px; text-align:center;
}
#no-ar .err { color:#ff4444; font-size:13px; letter-spacing:3px; }
#no-ar .msg { color:#556; font-size:12px; line-height:2; }
#no-ar a { color:#00ffff; }
</style>
</head>
<body>

<div id="start-screen">
  <div class="glitch">NEOCITY</div>
  <div class="tagline">AUGMENTED REALITY &nbsp;·&nbsp; 2077</div>
  <button id="start-btn" onclick="startAR()">⬡ &nbsp;ENTER AR MODE</button>
  <div class="prereqs">
    REQUIRES <span>Chrome on Android</span> + <span>ARCore</span><br>
    Moto G Stylus 2025 · WebXR Hit-Test
  </div>
</div>

<div id="hud">
  <div class="corner c-tl"></div><div class="corner c-tr"></div>
  <div class="corner c-bl"></div><div class="corner c-br"></div>
  <div id="hud-tl">
    <div class="hud-label">NEOCITY</div>
    <div class="hud-value" id="hud-status">SCANNING SURFACE...</div>
  </div>
  <div id="hud-bl">
    <div id="instruction">POINT AT FLOOR &nbsp;·&nbsp; TAP TO BUILD</div>
  </div>
</div>

<div id="no-ar">
  <div class="err">// AR NOT AVAILABLE //</div>
  <div class="msg">Open in <strong style="color:#ccc">Chrome</strong> on Android<br>
    with <a href="https://play.google.com/store/apps/details?id=com.google.ar.core" target="_blank">ARCore</a> installed.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ── globals ──────────────────────────────────────────────────────
let renderer, scene, camera, clock;
let reticle, hitTestSource, refSpace;
let cityPlaced = false;
let lastHitPos = null;
let buildings  = [];   // {mesh, floorY, fullH, startMs, doneMs}
let rainSystem = null;
let vehicles   = [];

const NEONS    = [0x00ffff, 0xff00aa, 0xff6622, 0x9900ff, 0x00ff55, 0xffee00];
const NEON_CSS = ['#00ffff','#ff00aa','#ff6622','#9900ff','#00ff55','#ffee00'];
const SIGNS    = ['ZION//NET','GH0ST CORP','CYBERWARE','RAMEN ++','NOODLE KING',
                  'YAKUZA.EXE','NET RUNNER','IMPLANTS','DATA HAVEN','ARASAKA',
                  'MILITECH','NEOCITY AI','BRAINDANCE','CHROME CO','MIDNIGHT'];

// ── three.js init ─────────────────────────────────────────────────
function initThree() {
  clock = new THREE.Clock();
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.appendChild(renderer.domElement);

  scene  = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 200);
  scene.add(camera);
  scene.add(new THREE.AmbientLight(0x050515, 0.6));

  // reticle ring
  reticle = new THREE.Group();
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  const rg = new THREE.RingGeometry(0.07, 0.09, 40);
  rg.applyMatrix4(new THREE.Matrix4().makeRotationX(-Math.PI/2));
  reticle.add(new THREE.Mesh(rg, new THREE.MeshBasicMaterial({ color:0x00ffff, side:THREE.DoubleSide })));
  scene.add(reticle);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// ── start AR session ──────────────────────────────────────────────
async function startAR() {
  if (!navigator.xr) { showNoAR('WebXR not found'); return; }
  const ok = await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
  if (!ok) { showNoAR('immersive-ar not supported'); return; }

  initThree();

  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.getElementById('hud') }
    });

    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);
    refSpace = await session.requestReferenceSpace('local');
    const viewerSpace = await session.requestReferenceSpace('viewer');
    hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

    session.addEventListener('select', onTap);
    session.addEventListener('end', () => {
      hitTestSource = null; cityPlaced = false; buildings = []; vehicles = [];
    });

    renderer.setAnimationLoop(onFrame);

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
  } catch(e) {
    console.error(e);
    showNoAR(e.message);
  }
}

// ── render loop ───────────────────────────────────────────────────
function onFrame(time, frame) {
  const t     = time * 0.001;
  const delta = clock.getDelta();

  // hit test → move reticle + cache floor position
  if (frame && hitTestSource && !cityPlaced) {
    const hits = frame.getHitTestResults(hitTestSource);
    if (hits.length > 0) {
      const pose = hits[0].getPose(refSpace);
      reticle.visible = true;
      reticle.matrix.fromArray(pose.transform.matrix);

      const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
      reticle.matrix.decompose(p, q, s);
      lastHitPos = p.clone();
      document.getElementById('hud-status').textContent = 'SURFACE FOUND — TAP TO BUILD';
    } else {
      reticle.visible = false;
    }
  }

  if (cityPlaced) animateCity(t, delta);

  renderer.render(scene, camera);
}

// ── tap ───────────────────────────────────────────────────────────
function onTap() {
  if (cityPlaced) return;
  cityPlaced = true;
  reticle.visible = false;

  let pos;
  if (lastHitPos) {
    pos = lastHitPos.clone();
  } else {
    // fallback: place 1.5m ahead, guess floor is 1m below camera
    pos = new THREE.Vector3(0, 0, -1.5).applyMatrix4(camera.matrixWorld);
    pos.y -= 1.0;
  }

  buildCity(pos);

  document.getElementById('instruction').textContent = 'WALK AROUND TO EXPLORE';
  document.getElementById('hud-status').textContent  = 'CITY GROWING...';
}

// ── canvas textures ───────────────────────────────────────────────
function windowTex(cols, rows, css) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#01010a'; g.fillRect(0, 0, 256, 256);
  const ww = 256/cols, wh = 256/rows;
  for (let col=0; col<cols; col++)
    for (let row=0; row<rows; row++)
      if (Math.random() < 0.6) {
        const b = 0.4 + Math.random()*0.6;
        g.fillStyle = Math.random() > 0.3
          ? `rgba(255,245,200,${b*0.9})`
          : hexA(css, b*0.75);
        g.fillRect(col*ww+1.5, row*wh+1.5, ww-3, wh-3);
      }
  return new THREE.CanvasTexture(c);
}

function signTex(text, css) {
  const c = document.createElement('canvas'); c.width=256; c.height=64;
  const g = c.getContext('2d');
  g.fillStyle='#000'; g.fillRect(0,0,256,64);
  g.font='bold 22px Courier New'; g.textAlign='center'; g.textBaseline='middle';
  g.shadowBlur=20; g.shadowColor=css; g.fillStyle=css;
  g.fillText(text,128,32); g.shadowBlur=8; g.fillText(text,128,32);
  return new THREE.CanvasTexture(c);
}

function hexA(hex, a) {
  const r=parseInt(hex.slice(1,3),16), gv=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${gv},${b},${a})`;
}

// ── building factory ──────────────────────────────────────────────
// The group's position.y starts at (floorY - fullH):
//   all geometry sits with y=0 at bottom, y=h at top.
//   As position.y rises from (floorY-h) → floorY, building emerges from floor.
function makeBuilding(floorY, wx, wz, w, d, h, neonIdx) {
  const nc  = NEONS[neonIdx];
  const css = NEON_CSS[neonIdx];
  const grp = new THREE.Group();

  // Start fully underground — grows up to floorY each frame
  grp.position.set(wx, floorY - h, wz);

  // Body — bottom face sits at local y=0
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x040412, roughness: 0.8, metalness: 0.5,
    emissive: new THREE.Color(nc).multiplyScalar(0.015),
  });
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bodyMat);
  body.position.y = h / 2;  // center at h/2, so bottom = 0
  grp.add(body);

  // Window planes on 4 sides
  const cols = Math.max(2, Math.round(w*8));
  const rows = Math.max(4, Math.round(h*7));
  const wt   = windowTex(cols, rows, css);
  const winMat = new THREE.MeshStandardMaterial({
    map: wt, emissiveMap: wt,
    emissive: new THREE.Color(0xffffff), emissiveIntensity: 0.5,
    roughness: 0.4, metalness: 0.05,
  });
  for (const [fw, fh, fx, fz, ry] of [
    [w, h,  0,        d/2+0.001,  0          ],
    [w, h,  0,       -d/2-0.001,  Math.PI    ],
    [d, h,  w/2+0.001, 0,         Math.PI/2  ],
    [d, h, -w/2-0.001, 0,        -Math.PI/2  ],
  ]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(fw, fh), winMat);
    m.position.set(fx, h/2, fz);
    m.rotation.y = ry;
    grp.add(m);
  }

  // Neon horizontal bands
  const bandMat = new THREE.MeshBasicMaterial({ color: nc });
  for (let bi = 0; bi < Math.floor(h/0.35); bi++) {
    if (Math.random() > 0.38) continue;
    const by = 0.1 + bi*0.35, bh = 0.012;
    for (const [bw2, fx, fz, ry] of [
      [w+0.006,  0,          d/2+0.002,  0          ],
      [w+0.006,  0,         -d/2-0.002,  Math.PI    ],
      [d+0.006,  w/2+0.002,  0,          Math.PI/2  ],
      [d+0.006, -w/2-0.002,  0,         -Math.PI/2  ],
    ]) {
      const s = new THREE.Mesh(new THREE.PlaneGeometry(bw2, bh), bandMat);
      s.position.set(fx, by, fz); s.rotation.y = ry;
      grp.add(s);
    }
  }

  // Vertical neon corner strips
  for (const [ex, ez] of [[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2]]) {
    if (Math.random() > 0.55) {
      const eh = h*(0.3 + Math.random()*0.7);
      const edge = new THREE.Mesh(
        new THREE.BoxGeometry(0.007, eh, 0.007),
        new THREE.MeshBasicMaterial({ color: nc })
      );
      edge.position.set(ex, eh/2, ez);
      grp.add(edge);
    }
  }

  // Roof slab
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(w+0.01, 0.025, d+0.01),
    new THREE.MeshStandardMaterial({ color:0x080820, roughness:0.9, metalness:0.6 })
  );
  roof.position.y = h + 0.012;
  grp.add(roof);

  // Antenna
  if (Math.random() > 0.35) {
    const ah  = 0.12 + Math.random()*0.35;
    const ant = new THREE.Mesh(
      new THREE.CylinderGeometry(0.004, 0.004, ah, 6),
      new THREE.MeshStandardMaterial({ color:0x888899, metalness:0.95, roughness:0.1 })
    );
    const ax = (Math.random()-0.5)*w*0.35;
    const az = (Math.random()-0.5)*d*0.35;
    ant.position.set(ax, h + ah/2, az);
    grp.add(ant);

    const blink = new THREE.PointLight(0xff2200, 3, 0.25);
    blink.position.set(ax, h + ah + 0.02, az);
    blink.userData.blink = true;
    blink.userData.phase = Math.random()*Math.PI*2;
    grp.add(blink);
  }

  // Neon sign
  if (Math.random() > 0.4) {
    const txt = SIGNS[Math.floor(Math.random()*SIGNS.length)];
    const sw  = 0.28 + Math.random()*0.28, sh = sw*0.25;
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(sw, sh),
      new THREE.MeshBasicMaterial({
        map: signTex(txt, css), transparent:true, side:THREE.DoubleSide, depthWrite:false
      })
    );
    const side = Math.floor(Math.random()*4), so = 0.012;
    if      (side===0) { sign.position.set(0,    h+sh/2+0.04,  d/2+so); }
    else if (side===1) { sign.position.set(0,    h+sh/2+0.04, -d/2-so); sign.rotation.y = Math.PI; }
    else if (side===2) { sign.position.set( w/2+so, h+sh/2+0.04, 0);     sign.rotation.y = Math.PI/2; }
    else               { sign.position.set(-w/2-so, h+sh/2+0.04, 0);     sign.rotation.y = -Math.PI/2; }
    grp.add(sign);
  }

  // Point light
  const pl = new THREE.PointLight(nc, 1.4, Math.max(w,d)*5);
  pl.position.set(0, h*0.5, 0);
  pl.userData.pulse = true;
  pl.userData.base  = 1.4;
  pl.userData.phase = Math.random()*Math.PI*2;
  grp.add(pl);

  return grp;
}

// ── city ──────────────────────────────────────────────────────────
function buildCity(origin) {
  const fy  = origin.y;  // floor world Y
  const now = performance.now();

  const layout = [
    { x:-0.85, z:-0.85, w:0.22, d:0.22, h:1.9,  n:0 },
    { x: 0.00, z:-0.95, w:0.20, d:0.26, h:2.4,  n:1 },
    { x: 0.85, z:-0.85, w:0.21, d:0.21, h:1.7,  n:2 },
    { x: 0.95, z: 0.00, w:0.24, d:0.19, h:2.1,  n:3 },
    { x: 0.85, z: 0.85, w:0.20, d:0.23, h:2.0,  n:4 },
    { x: 0.00, z: 0.95, w:0.18, d:0.18, h:1.5,  n:5 },
    { x:-0.85, z: 0.85, w:0.22, d:0.20, h:1.8,  n:0 },
    { x:-0.95, z: 0.00, w:0.20, d:0.24, h:2.2,  n:2 },
    { x:-0.50, z:-0.50, w:0.17, d:0.17, h:1.2,  n:5 },
    { x: 0.00, z:-0.55, w:0.15, d:0.19, h:1.05, n:0 },
    { x: 0.50, z:-0.50, w:0.16, d:0.16, h:1.15, n:3 },
    { x: 0.55, z: 0.00, w:0.17, d:0.15, h:1.0,  n:1 },
    { x: 0.50, z: 0.50, w:0.16, d:0.17, h:1.25, n:4 },
    { x: 0.00, z: 0.55, w:0.14, d:0.14, h:0.95, n:2 },
    { x:-0.50, z: 0.50, w:0.16, d:0.15, h:1.1,  n:0 },
    { x:-0.55, z: 0.00, w:0.15, d:0.17, h:1.2,  n:5 },
    { x:-0.25, z:-0.30, w:0.12, d:0.12, h:0.65, n:1 },
    { x: 0.00, z:-0.28, w:0.11, d:0.14, h:0.7,  n:3 },
    { x: 0.28, z:-0.20, w:0.13, d:0.11, h:0.75, n:4 },
    { x: 0.28, z: 0.20, w:0.12, d:0.12, h:0.6,  n:0 },
    { x: 0.00, z: 0.30, w:0.11, d:0.13, h:0.7,  n:2 },
    { x:-0.28, z: 0.20, w:0.12, d:0.11, h:0.68, n:5 },
    { x:-0.28, z:-0.20, w:0.13, d:0.12, h:0.72, n:1 },
    { x: 0.00, z: 0.00, w:0.24, d:0.24, h:3.5,  n:1 },  // central tower
    { x:-0.62, z:-0.25, w:0.14, d:0.28, h:0.5,  n:3 },
    { x: 0.62, z: 0.25, w:0.14, d:0.26, h:0.45, n:0 },
    { x: 0.20, z: 0.70, w:0.18, d:0.12, h:0.4,  n:4 },
    { x:-0.20, z:-0.70, w:0.16, d:0.14, h:0.55, n:2 },
  ];

  layout.forEach((cfg, i) => {
    const mesh = makeBuilding(
      fy,
      origin.x + cfg.x, origin.z + cfg.z,
      cfg.w, cfg.d, cfg.h,
      cfg.n % NEONS.length
    );
    scene.add(mesh);

    // Each building stores exactly what it needs to animate itself
    buildings.push({
      mesh,
      floorY:  fy,
      fullH:   cfg.h,
      startMs: now + i * 120,       // staggered 120ms apart
      doneMs:  now + i * 120 + 900, // 900ms duration each
    });
  });

  // Floor holographic grid
  const grid = new THREE.GridHelper(4, 24, 0x003355, 0x001122);
  grid.position.set(origin.x, fy + 0.001, origin.z);
  scene.add(grid);

  // Floor glow disc
  const gg = new THREE.CircleGeometry(2.2, 48);
  gg.applyMatrix4(new THREE.Matrix4().makeRotationX(-Math.PI/2));
  const gDisc = new THREE.Mesh(gg, new THREE.MeshBasicMaterial({
    color:0x000833, transparent:true, opacity:0.65, depthWrite:false, side:THREE.DoubleSide
  }));
  gDisc.position.set(origin.x, fy, origin.z);
  scene.add(gDisc);

  // Street lights ring
  for (let i = 0; i < 16; i++) {
    const a  = (i/16)*Math.PI*2;
    const sr = 0.7 + (i%2)*0.1;
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.006, 0.008, 0.5, 6),
      new THREE.MeshStandardMaterial({ color:0x222233, metalness:0.9, roughness:0.2 })
    );
    pole.position.set(origin.x + Math.cos(a)*sr, fy + 0.25, origin.z + Math.sin(a)*sr);
    scene.add(pole);

    const sl = new THREE.PointLight(NEONS[i % NEONS.length], 0.9, 0.8);
    sl.position.set(origin.x + Math.cos(a)*sr, fy + 0.52, origin.z + Math.sin(a)*sr);
    sl.userData.pulse = true; sl.userData.base = 0.9; sl.userData.phase = Math.random()*Math.PI*2;
    scene.add(sl);
  }

  // Rain
  rainSystem = makeRain(origin, fy);

  // Flying vehicles
  for (let i = 0; i < 10; i++) spawnVehicle(origin, fy + 2.0 + Math.random()*3.5);
}

// ── rain ──────────────────────────────────────────────────────────
function makeRain(origin, fy) {
  const N = 1000, pos = new Float32Array(N*3);
  for (let i = 0; i < N; i++) {
    const r = Math.sqrt(Math.random())*3, a = Math.random()*Math.PI*2;
    pos[i*3]   = origin.x + Math.cos(a)*r;
    pos[i*3+1] = fy + Math.random()*6;
    pos[i*3+2] = origin.z + Math.sin(a)*r;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const rain = new THREE.Points(geo,
    new THREE.PointsMaterial({ color:0x3366ff, size:0.006, transparent:true, opacity:0.4, depthWrite:false })
  );
  rain.userData = { origin, fy };
  scene.add(rain);
  return rain;
}

// ── vehicles ──────────────────────────────────────────────────────
function spawnVehicle(origin, worldH) {
  const color = Math.random() > 0.5 ? 0x00ccff : 0xff4400;
  const light = new THREE.PointLight(color, 2.5, 0.7);
  const a = Math.random()*Math.PI*2, r = 0.6 + Math.random()*2;
  light.position.set(origin.x + Math.cos(a)*r, worldH, origin.z + Math.sin(a)*r);
  light.userData = { origin, worldH, r, angle:a, speed:0.3+Math.random()*0.5, bob:Math.random()*Math.PI*2 };
  scene.add(light);
  vehicles.push(light);
}

// ── animate ───────────────────────────────────────────────────────
function animateCity(t, delta) {
  const now = performance.now();

  // GROW: raise each building from underground to floor level
  for (const b of buildings) {
    if (now < b.startMs) continue;  // not time yet

    if (now >= b.doneMs) {
      b.mesh.position.y = b.floorY; // fully risen, snap to final
    } else {
      const progress = (now - b.startMs) / (b.doneMs - b.startMs); // 0 → 1
      const eased    = 1 - Math.pow(1 - progress, 3);              // ease-out cubic
      // Rises from (floorY - fullH) up to floorY
      b.mesh.position.y = (b.floorY - b.fullH) + b.fullH * eased;
    }
  }

  // Pulse / blink all lights
  scene.traverse(obj => {
    if (!obj.isPointLight) return;
    const ph = obj.userData.phase || 0;
    if (obj.userData.blink) {
      obj.intensity = Math.sin(t*4 + ph) > 0.5 ? 3 : 0;
    } else if (obj.userData.pulse) {
      obj.intensity = obj.userData.base + Math.sin(t*1.8 + ph)*0.3;
    }
  });

  // Rain fall
  if (rainSystem) {
    const pa  = rainSystem.geometry.attributes.position;
    const fy  = rainSystem.userData.fy;
    const org = rainSystem.userData.origin;
    for (let i = 0; i < pa.count; i++) {
      const ny = pa.getY(i) - 0.02;
      if (ny < fy - 0.05) {
        const r2 = Math.sqrt(Math.random())*3, a2 = Math.random()*Math.PI*2;
        pa.setXYZ(i, org.x + Math.cos(a2)*r2, fy + 4 + Math.random()*2, org.z + Math.sin(a2)*r2);
      } else {
        pa.setY(i, ny);
      }
    }
    pa.needsUpdate = true;
  }

  // Vehicles orbit
  for (const v of vehicles) {
    v.userData.angle += v.userData.speed * delta;
    const a = v.userData.angle, r = v.userData.r;
    v.position.set(
      v.userData.origin.x + Math.cos(a)*r,
      v.userData.worldH + Math.sin(a*0.4 + v.userData.bob)*0.18,
      v.userData.origin.z + Math.sin(a)*r
    );
  }
}

function showNoAR(msg) {
  console.warn('No AR:', msg);
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('no-ar').style.display = 'flex';
}
