<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Moto G - AR Receiver</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body {
      background-image: url('bg.webp');
      background-size: cover;
      background-position: center;
    }
    #info {
      position: absolute; left: 0; right: 0; top: 0;
      color: #9cf; font: 14px/1.4 system-ui, sans-serif;
      background: rgba(0,0,0,0.7); padding: 8px 12px; z-index: 3;
    }
    #hud {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
    }
    .reticle {
      position: absolute; left: 50%; top: 50%;
      width: 56px; height: 56px;
      transform: translate(-50%,-50%);
      border-radius: 50%;
      border: 3px solid hsla(0,0%,100%,0.35);
      background: hsla(0,0%,100%,0.12);
      backdrop-filter: blur(4px);
      box-shadow:
        inset 0 0 10px 2px hsla(0,0%,100%,0.55),
        0 0 18px 2px hsla(0,0%,100%,0.15);
    }
    .reticle::after {
      content: '';
      position: absolute; left: 50%; top: 50%;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: hsla(0,0%,100%,0.9);
      transform: translate(-50%,-50%);
      box-shadow: 0 0 6px 2px hsla(0,0%,100%,0.7);
    }
    .tick {
      position: absolute;
      width: 1.5px; height: 14px;
      background: hsla(0,0%,100%,0.5);
      box-shadow: 0 0 4px 1px hsla(0,0%,100%,0.4);
    }
    .tick.t1 { left: 50%; top: calc(50% - 46px); transform: translateX(-50%); }
    .tick.t2 { left: 50%; top: calc(50% + 32px); transform: translateX(-50%); }
    .tick.t3 { top: 50%; left: calc(50% - 46px); transform: translateY(-50%) rotate(90deg); }
    .tick.t4 { top: 50%; left: calc(50% + 32px); transform: translateY(-50%) rotate(90deg); }
    #handCanvas {
      position: absolute; inset: 0; pointer-events: none; z-index: 1;
    }

    /* ── Pointer overlay canvas (draws the wrist-pointer stick) ── */
    #pointerCanvas {
      position: absolute; inset: 0; pointer-events: none; z-index: 5;
      display: none; /* shown only in hand tracking mode */
    }

    /* ── Pointer toggle button (hand tracking mode only) ── */
    #pointerToggleBtn {
      display: none; /* shown after hand tracking connects */
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(30,42,54,0.88);
      border: 1.5px solid rgba(140,200,255,0.38);
      color: #c8e8ff;
      font: 600 13px system-ui, sans-serif;
      padding: 9px 18px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 18px rgba(0,0,0,0.45);
      transition: background 0.18s, border-color 0.18s, box-shadow 0.18s;
      letter-spacing: 0.02em;
      gap: 7px;
      align-items: center;
    }
    #pointerToggleBtn.active {
      background: rgba(30,90,140,0.92);
      border-color: rgba(100,200,255,0.75);
      box-shadow: 0 0 18px rgba(80,180,255,0.35), 0 2px 18px rgba(0,0,0,0.45);
      color: #fff;
    }
    #pointerToggleBtn .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(100,180,255,0.45);
      margin-right: 7px;
      vertical-align: middle;
      transition: background 0.18s;
    }
    #pointerToggleBtn.active .dot {
      background: #5edfff;
      box-shadow: 0 0 6px #5edfff;
    }

    #connectPanel {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      text-align: center;
      min-width: 300px;
      padding: 1.4em;
      border-radius: 1em;
      border: 3px solid hsla(0,0%,100%,0.3);
      background: hsla(0,0%,100%,0.15);
      backdrop-filter: blur(18px);
      box-shadow: inset 0 0 8px 1px hsla(0,0%,100%,0.5), 0 8px 32px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 0.6em;
    }
    #connectPanel h2 { color: #fff; margin: 0 0 4px; font: 700 20px system-ui; }
    #connectPanel p { color: rgba(255,255,255,0.7); margin: 0; font-size: 13px; }
    .modeBtn {
      display: block;
      width: 100%;
      padding: 0.6em 1em;
      font: 700 15px system-ui;
      border-radius: 0.6em;
      cursor: pointer;
      color: white;
      border: 1px solid hsla(0,0%,100%,0.45);
      background: hsla(0,0%,100%,0.18);
      backdrop-filter: blur(6px);
      box-shadow: inset 0 0 6px 1px hsla(0,0%,100%,0.35);
      transition: background 0.15s, box-shadow 0.15s;
      letter-spacing: 0.03em;
    }
    .modeBtn:hover {
      background: hsla(0,0%,100%,0.28);
      box-shadow: inset 0 0 10px 2px hsla(0,0%,100%,0.5);
    }
    #handTrackingBtn { border-color: hsla(140,70%,70%,0.6); }
    #skipHandBtn { border-color: hsla(210,90%,70%,0.6); }
    #connectionStatus { color: #ff0; font-size: 12px; font-family: monospace; margin: 0; }
    #status {
      position: absolute;
      bottom: 10px; left: 10px;
      background: rgba(0,0,0,0.7);
      color: #0f0;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      z-index: 10;
    }
    .hidden { display: none; }

    /* ── AR Button (injected by Three.js ARButton) ── */
    #ARButton, a[href*="webxr"], button[onclick*="xr"], .ar-button {
      border: 3px solid hsla(0,0%,100%,0.35) !important;
      background: hsla(0,0%,42%,0.55) !important;
      backdrop-filter: blur(20px) !important;
      box-shadow: inset 0 0 10px 2px hsla(0,0%,100%,0.7), 0 0 28px 6px hsla(0,0%,100%,0.22), 0 6px 32px rgba(0,0,0,0.4) !important;
      color: #fff !important;
      border-radius: 0.65em !important;
      font: 700 15px system-ui, sans-serif !important;
      letter-spacing: 0.05em !important;
      padding: 14px 28px !important;
      cursor: pointer !important;
      transition: background 0.18s, box-shadow 0.18s !important;
      position: fixed !important;
      bottom: 24px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
    }
    #ARButton:hover {
      background: hsla(0,0%,42%,0.55) !important;
      box-shadow: inset 0 0 16px 3px hsla(0,0%,100%,0.85), 0 0 40px 10px hsla(0,0%,100%,0.32), 0 6px 32px rgba(0,0,0,0.4) !important;
    }
    #clarityPanel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 12;
      background: rgba(0, 0, 0, 0.65);
      color: #e8f4ff;
      border-radius: 12px;
      padding: 10px;
      font: 13px/1.3 system-ui, sans-serif;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .clarityBtn {
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.12);
      color: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      font: 600 13px system-ui, sans-serif;
      cursor: pointer;
    }
    #focusBadge {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      font-weight: 700;
    }
    #clarityProbeVideo { display: none; }
  </style>
</head>
<body>

  <div id="hud">
    <div class="reticle"></div>
    <div class="tick t1"></div><div class="tick t2"></div><div class="tick t3"></div><div class="tick t4"></div>
  </div>
  <canvas id="handCanvas"></canvas>

  <!-- Pointer overlay (wrist-to-index ray) -->
  <canvas id="pointerCanvas"></canvas>

  <!-- Pointer toggle button — only appears after hand tracking connects -->
  <button id="pointerToggleBtn">
    <span class="dot"></span>Pointer
  </button>

  <div id="connectPanel">
    <h2>Choose Mode</h2>
    <p>Enter the code shown on Phone 2<br>or skip to tap only</p>
    <div id="codeInputWrap" style="display:flex;gap:0.4em;">
      <input id="peerCodeInput" type="text" placeholder="Phone 2 code"
        style="flex:1;padding:0.55em 0.8em;border-radius:0.5em;border:1px solid hsla(0,0%,100%,0.35);
               background:hsla(0,0%,100%,0.12);color:#fff;font:700 15px system-ui;
               backdrop-filter:blur(6px);outline:none;letter-spacing:0.08em;" />
      <button class="modeBtn" id="handTrackingBtn" style="width:auto;padding:0.55em 1em;flex-shrink:0;">CONNECT</button>
    </div>
    <button class="modeBtn" id="skipHandBtn">SKIP - TAP ONLY</button>
    <div id="connectionStatus"></div>
  </div>




  <!-- Surface mode toggle -->
  <button id="surfaceToggleBtn" style="
    display:none;
    position:fixed;
    bottom:60px;
    right:16px;
    z-index:20;
    background:rgba(30,42,54,0.88);
    border:1.5px solid rgba(140,200,255,0.38);
    color:#c8e8ff;
    font:600 13px system-ui,sans-serif;
    padding:9px 14px;
    border-radius:999px;
    cursor:pointer;
    backdrop-filter:blur(12px);
    box-shadow:0 2px 18px rgba(0,0,0,0.45);
    letter-spacing:0.02em;">
    📐 Floor
  </button>

  <!-- PeerJS for WebRTC -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
    // Catch any uncaught errors so they don't close the app
    window.addEventListener('error', e => { console.error('Caught error:', e.message); e.preventDefault(); });
    window.addEventListener('unhandledrejection', e => { console.error('Caught rejection:', e.reason); e.preventDefault(); });
  </script>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    let camera, scene, renderer;
    let reticle, controller;
    let hitTestSource = null;
    let wallHitTestSource = null;
    let hitTestSourceRequested = false;
    let isWallMode = false;
    let wallSnapIndicator = null;
    const wallAnchors = [];
    let lastPinchTime = 0;
    const DOUBLE_PINCH_MS = 500;

    // ── Air drawing state ───────────────────────────────────────────
    let drawMode = false;
    let isDrawing = false;
    let currentStroke = [];          // current line points
    const drawnStrokes = [];         // all THREE.Line objects in scene
    let lastDrawPoint = null;
    let drawModeIconPos = null;      // where icon2 is, to return on exit
    const DRAW_MIN_DIST = 0.005;     // min distance between points
    const panels = [];
    const raycaster = new THREE.Raycaster();
    let hoveredObject = null;
    let activePanel = null;

    // Hand data from Phone 2
    let handLandmarks = null;
    let lastPinch = false;
    let peer, connection;
    let handTrackingEnabled = false;
    let clarityStream = null;
    let clarityTrack = null;
    let zoomValue = null;
    let zoomMin = null;
    let zoomMax = null;
    let zoomStep = 0.2;

    // ── Pointer state ──────────────────────────────────────────────
    let pointerEnabled = false;
    const pointerCanvas = document.getElementById('pointerCanvas');
    const pointerCtx = pointerCanvas.getContext('2d');
    const pointerToggleBtn = document.getElementById('pointerToggleBtn');

    function resizePointerCanvas() {
      pointerCanvas.width = window.innerWidth;
      pointerCanvas.height = window.innerHeight;
    }
    resizePointerCanvas();
    window.addEventListener('resize', resizePointerCanvas);

    // Pointer toggle button click
    pointerToggleBtn.addEventListener('click', () => {
      pointerEnabled = !pointerEnabled;
      if (pointerEnabled) {
        pointerToggleBtn.classList.add('active');
        pointerCanvas.style.display = 'block';
      } else {
        pointerToggleBtn.classList.remove('active');
        pointerCanvas.style.display = 'none';
        pointerCtx.clearRect(0, 0, pointerCanvas.width, pointerCanvas.height);
      }
    });

    function showPointerToggle() {
      pointerToggleBtn.style.display = 'inline-flex';
    }

    // Surface mode toggle
    const surfaceToggleBtn = document.getElementById('surfaceToggleBtn');
    surfaceToggleBtn.addEventListener('click', () => {
      isWallMode = !isWallMode;
      surfaceToggleBtn.textContent = isWallMode ? '🧱 Wall' : '📐 Floor';
      surfaceToggleBtn.style.borderColor = isWallMode ? 'rgba(255,180,100,0.6)' : 'rgba(140,200,255,0.38)';
      surfaceToggleBtn.style.color = isWallMode ? '#ffd0a0' : '#c8e8ff';
    });

    // ── Draw the Vision Pro style pointer (wrist → index ray) ──────
    function drawPointer(landmarks) {
      pointerCtx.clearRect(0, 0, pointerCanvas.width, pointerCanvas.height);
      if (!pointerEnabled || !landmarks) return;

      // Use first hand
      const lm = Array.isArray(landmarks[0]) ? landmarks[0] : landmarks;
      if (!lm || lm.length < 21) return;

      const W = pointerCanvas.width;
      const H = pointerCanvas.height;

      // Wrist = landmark 0, index tip = landmark 8
      const wrist = lm[0];
      const indexTip = lm[8];
      const middleTip = lm[12]; // use middle too to average direction

      const wx = wrist.x * W + HAND_OFFSET_X;
      const wy = wrist.y * H + HAND_OFFSET_Y;
      const ix = indexTip.x * W + HAND_OFFSET_X;
      const iy = indexTip.y * H + HAND_OFFSET_Y;

      // Direction from wrist toward index finger tip, extended far beyond it
      const dx = ix - wx;
      const dy = iy - wy;
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      const nx = dx / len;
      const ny = dy / len;

      // Ray starts at wrist, extends past fingertip to edge of screen
      const RAY_EXTEND = Math.max(W, H) * 1.5;
      const rayEndX = wx + nx * RAY_EXTEND;
      const rayEndY = wy + ny * RAY_EXTEND;

      // ── Draw the stick/ray ──────────────────────────────────────
      // Outer glow
      pointerCtx.save();
      pointerCtx.beginPath();
      pointerCtx.moveTo(wx, wy);
      pointerCtx.lineTo(rayEndX, rayEndY);
      const grad = pointerCtx.createLinearGradient(wx, wy, ix, iy);
      grad.addColorStop(0, 'rgba(255,255,255,0.0)');
      grad.addColorStop(0.18, 'rgba(200,235,255,0.55)');
      grad.addColorStop(0.65, 'rgba(180,225,255,0.35)');
      grad.addColorStop(1, 'rgba(140,210,255,0.0)');
      pointerCtx.strokeStyle = grad;
      pointerCtx.lineWidth = 6;
      pointerCtx.lineCap = 'round';
      pointerCtx.filter = 'blur(3px)';
      pointerCtx.stroke();
      pointerCtx.restore();

      // Core ray (sharp white line)
      pointerCtx.save();
      pointerCtx.beginPath();
      pointerCtx.moveTo(wx, wy);
      pointerCtx.lineTo(rayEndX, rayEndY);
      const coreGrad = pointerCtx.createLinearGradient(wx, wy, ix, iy);
      coreGrad.addColorStop(0, 'rgba(255,255,255,0.0)');
      coreGrad.addColorStop(0.15, 'rgba(255,255,255,0.9)');
      coreGrad.addColorStop(0.6, 'rgba(200,235,255,0.5)');
      coreGrad.addColorStop(1, 'rgba(180,225,255,0.0)');
      pointerCtx.strokeStyle = coreGrad;
      pointerCtx.lineWidth = 1.8;
      pointerCtx.lineCap = 'round';
      pointerCtx.filter = 'none';
      pointerCtx.stroke();
      pointerCtx.restore();

      // ── Cursor dot at the ray's aim point ──────────────────────
      // Aim point: extend ~2.2x from wrist through index finger
      const aimDist = len * 2.2;
      const aimX = wx + nx * aimDist;
      const aimY = wy + ny * aimDist;

      // Outer ring
      pointerCtx.save();
      pointerCtx.beginPath();
      pointerCtx.arc(aimX, aimY, 14, 0, Math.PI * 2);
      pointerCtx.strokeStyle = 'rgba(200,235,255,0.5)';
      pointerCtx.lineWidth = 1.5;
      pointerCtx.filter = 'blur(1px)';
      pointerCtx.stroke();
      pointerCtx.restore();

      // Inner bright dot
      pointerCtx.save();
      pointerCtx.beginPath();
      pointerCtx.arc(aimX, aimY, 5, 0, Math.PI * 2);
      const dotGrad = pointerCtx.createRadialGradient(aimX, aimY, 0, aimX, aimY, 5);
      dotGrad.addColorStop(0, 'rgba(255,255,255,1)');
      dotGrad.addColorStop(1, 'rgba(140,215,255,0.6)');
      pointerCtx.fillStyle = dotGrad;
      pointerCtx.shadowColor = '#8cd8ff';
      pointerCtx.shadowBlur = 10;
      pointerCtx.fill();
      pointerCtx.restore();
    }
    // ──────────────────────────────────────────────────────────────

    // Two-hand resize tracking
    let lastTwoHandDistance = null;
    let isResizing = false;
    let initialPanelScale = 1.0;

    const HAND_OFFSET_X = 0;
    const HAND_OFFSET_Y = -270;
    const HAND_SCALE = 1.0;
    const ICON_FORWARD_DISTANCE = 1.0;
    const ICON_HEIGHT_ABOVE_GROUND = 1.0;
    const XR_FRAMEBUFFER_SCALE = 1.35;
    const MAX_RENDER_PIXEL_RATIO = 2;
    const PANEL_SHELL_OPACITY = 0.72;
    let groundYEstimate = null;
    let handConnectTimeout = null;
    let hasInitialIconSpawned = false;

    // Weather
    let weatherData = null, weatherFetchedAt = 0;
    const WEATHER_TTL = 5 * 60 * 1000;
    let userLat = 40.7128, userLon = -74.006;

    const tmpOrigin = new THREE.Vector3();
    const tmpDirection = new THREE.Vector3();
    const tmpCamPos = new THREE.Vector3();
    const tmpForward = new THREE.Vector3();
    const tmpRight = new THREE.Vector3();
    const tmpReticlePos = new THREE.Vector3();

    const handCanvas = document.getElementById('handCanvas');
    const handCtx = handCanvas.getContext('2d');
    handCanvas.width = window.innerWidth;
    handCanvas.height = window.innerHeight;

    init();
    setupConnection();
    prefetchWeather();
    animate();

    function setupConnection() {
      const handBtn = document.getElementById('handTrackingBtn');
      const statusEl = document.getElementById('connectionStatus');

      function showConnectError(message) {
        document.getElementById('connectPanel').style.display = 'flex';
        statusEl.textContent = message;
        statusEl.style.color = '#ff6b6b';
        handBtn.disabled = false;
        handBtn.textContent = 'CONNECT';
      }

      handBtn.addEventListener('click', () => {
        const codeInput = document.getElementById('peerCodeInput');
        const targetId = codeInput.value.trim().toLowerCase();
        if (!targetId) {
          statusEl.textContent = 'Enter the code from Phone 2';
          statusEl.style.color = '#ff6b6b';
          return;
        }

        handTrackingEnabled = true;
        document.getElementById('connectPanel').style.display = 'none';
        statusEl.textContent = 'Connecting...';
        statusEl.style.color = '#ff0';
        handBtn.disabled = true;
        handBtn.textContent = 'Connecting...';

        if (peer && !peer.destroyed) { peer.destroy(); }

        try { peer = new Peer(); } catch(e) { showConnectError('Failed to init peer'); return; }
        peer.on('open', () => {
          try { connection = peer.connect(targetId); } catch(e) { showConnectError('Failed to connect'); return; }
          if (handConnectTimeout) clearTimeout(handConnectTimeout);
          handConnectTimeout = setTimeout(() => {
            if (!connection || !connection.open) {
              showConnectError('Could not connect. Check the code and retry.');
            }
          }, 30000);
          connection.on('open', () => {
            document.getElementById('connectPanel').style.display = 'none';
            showPointerToggle();
            // Phone 2 connected — show AR button prominently, user taps to enter AR
            const arBtn = document.getElementById('ARButton');
            if (arBtn) {
              arBtn.style.display = '';
              arBtn.textContent = 'ENTER AR ✓';
            }

            connection.on('data', (data) => {
              if (data.type === 'hand') {
                handLandmarks = data.landmarks;
                updateHandDisplay(data.handCount || 0, data.twoHandDistance);
                if (pointerEnabled) drawPointer(handLandmarks);
              }
            });

            connection.on('close', () => {
              handLandmarks = null;
              lastPinch = false;
              pointerCtx.clearRect(0, 0, pointerCanvas.width, pointerCanvas.height);
              pointerToggleBtn.style.display = 'none';
              pointerCanvas.style.display = 'none';
              pointerEnabled = false;
            });

            connection.on('error', () => {});
          });
        });

        peer.on('error', (err) => {
          showConnectError(`Peer error: ${err.type || 'unknown'}`);
        });
      });

      // TAP ONLY button — no pointer toggle shown
      document.getElementById('skipHandBtn').addEventListener('click', () => {
        handTrackingEnabled = false;
        document.getElementById('connectPanel').style.display = 'none';
      });
    }

    async function startClarityCameraProbe() {
      if (clarityTrack) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
        clarityStream = stream;
        clarityTrack = stream.getVideoTracks()[0];
        await applyAutoFocusConstraints();
        readZoomCapabilities();
      } catch (err) {
        console.warn('Clarity camera probe failed:', err);
      }
    }

    let autoFocusRetriggerTimer = null;

    async function applyAutoFocusConstraints() {
      if (!clarityTrack) return;
      const capabilities = clarityTrack.getCapabilities ? clarityTrack.getCapabilities() : {};

      // Apply continuous exposure + white balance where supported
      const contConstraints = { advanced: [] };
      if (Array.isArray(capabilities.exposureMode) && capabilities.exposureMode.includes('continuous')) {
        contConstraints.advanced.push({ exposureMode: 'continuous' });
      }
      if (Array.isArray(capabilities.whiteBalanceMode) && capabilities.whiteBalanceMode.includes('continuous')) {
        contConstraints.advanced.push({ whiteBalanceMode: 'continuous' });
      }
      if (contConstraints.advanced.length) {
        try { await clarityTrack.applyConstraints(contConstraints); } catch (_) {}
      }

      const supportedFocusModes = Array.isArray(capabilities.focusMode) ? capabilities.focusMode : [];

      if (supportedFocusModes.includes('continuous')) {
        try {
          await clarityTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
          // Re-ping every 4s to unstick AF on stubborn drivers
          startAutoFocusRetrigger('continuous', 4000);
        } catch (err) {
          // continuous advertised but failed — pulse auto instead
          startAutoFocusRetrigger('auto', 1800);
        }
      } else if (supportedFocusModes.includes('auto')) {
        // Pulse focusMode:'auto' every 1.8s to simulate continuous AF
        startAutoFocusRetrigger('auto', 1800);
      }
      // If neither mode available, camera stays at driver default
    }

    async function triggerAutoFocus(mode) {
      if (!clarityTrack) return;
      try { await clarityTrack.applyConstraints({ advanced: [{ focusMode: mode }] }); } catch (_) {}
    }

    function startAutoFocusRetrigger(mode, intervalMs) {
      stopAutoFocusRetrigger();
      triggerAutoFocus(mode); // fire immediately
      autoFocusRetriggerTimer = setInterval(() => triggerAutoFocus(mode), intervalMs);
    }

    function stopAutoFocusRetrigger() {
      if (autoFocusRetriggerTimer) { clearInterval(autoFocusRetriggerTimer); autoFocusRetriggerTimer = null; }
    }

    function readZoomCapabilities() {
      if (!clarityTrack || !clarityTrack.getCapabilities) return;
      const capabilities = clarityTrack.getCapabilities();
      if (!capabilities.zoom) return;
      zoomMin = capabilities.zoom.min;
      zoomMax = capabilities.zoom.max;
      zoomStep = capabilities.zoom.step || 0.2;
      const settings = clarityTrack.getSettings ? clarityTrack.getSettings() : {};
      zoomValue = settings.zoom || zoomMin;
    }

    async function changeZoom(delta) {
      if (!clarityTrack || zoomValue === null || zoomMin === null || zoomMax === null) return;
      zoomValue = Math.max(zoomMin, Math.min(zoomMax, zoomValue + delta));
      try { await clarityTrack.applyConstraints({ advanced: [{ zoom: zoomValue }] }); }
      catch (err) { console.warn('Zoom change failed:', err); }
    }


    function stopClarityCameraProbe() {
      stopAutoFocusRetrigger();
      if (clarityStream) { clarityStream.getTracks().forEach(track => track.stop()); }
      clarityStream = null; clarityTrack = null;
      zoomValue = null; zoomMin = null; zoomMax = null;

      
    }




    // ── Create a visual wall anchor at gaze point ──────────────────
    function createWallAnchor() {
      camera.getWorldPosition(tmpOrigin);
      camera.getWorldDirection(tmpDirection);

      // Cast ray 1.5m forward — place anchor there on the wall
      const anchorPos = tmpOrigin.clone().addScaledVector(tmpDirection, 1.5);

      const group = new THREE.Group();
      group.position.copy(anchorPos);
      group.lookAt(tmpOrigin); // face the user

      // Outer ring
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.06, 0.075, 32),
        new THREE.MeshBasicMaterial({ color: 0xffd090, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
      );
      group.add(ring);

      // Center dot
      const dot = new THREE.Mesh(
        new THREE.CircleGeometry(0.018, 32),
        new THREE.MeshBasicMaterial({ color: 0xffeebb, transparent: true, opacity: 0.95, side: THREE.DoubleSide })
      );
      dot.position.z = 0.001;
      group.add(dot);

      // Cross lines
      const crossMat = new THREE.LineBasicMaterial({ color: 0xffd090, transparent: true, opacity: 0.6 });
      const hGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-0.05,0,0), new THREE.Vector3(0.05,0,0)]);
      const vGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-0.05,0), new THREE.Vector3(0,0.05,0)]);
      group.add(new THREE.Line(hGeo, crossMat));
      group.add(new THREE.Line(vGeo, crossMat));

      group.userData.isAnchor = true;
      group.userData.snapRadius = 0.35; // how close panel needs to be to snap
      scene.add(group);
      wallAnchors.push(group);

      // Pulse animation data
      group.userData.spawnTime = Date.now();

      return group;
    }

    // ── Check if panel is near any anchor, snap if so ───────────────
    function checkAnchorSnap(panel) {
      for (const anchor of wallAnchors) {
        const dist = panel.position.distanceTo(anchor.position);
        if (dist < anchor.userData.snapRadius) {
          // Snap panel to anchor position and face user
          panel.position.copy(anchor.position);
          panel.lookAt(camera.position);
          panel.userData.snappedToAnchor = anchor;
          return true;
        }
      }
      panel.userData.snappedToAnchor = null;
      return false;
    }

    function spawnIconInAir() {
      if (hasInitialIconSpawned) return;
      if (groundYEstimate === null) return;
      hasInitialIconSpawned = true;

      camera.getWorldDirection(tmpForward);
      tmpForward.y = 0;
      if (tmpForward.lengthSq() < 1e-6) tmpForward.set(0, 0, -1);
      else tmpForward.normalize();
      camera.getWorldPosition(tmpCamPos);

      // Right vector perpendicular to forward, in XZ plane
      tmpRight.crossVectors(tmpForward, new THREE.Vector3(0, 1, 0)).normalize();

      const base = tmpCamPos.clone().addScaledVector(tmpForward, ICON_FORWARD_DISTANCE);
      base.y = groundYEstimate + ICON_HEIGHT_ABOVE_GROUND;

      // icon1 = clock, offset left
      const icon1 = makeIcon('icon1.png', 'clock');
      icon1.position.copy(base).addScaledVector(tmpRight, -0.18);
      icon1.lookAt(tmpCamPos);
      icon1.userData._baseY = icon1.position.y;
      scene.add(icon1); panels.push(icon1);

      // icon2 = air draw, offset right
      const icon2 = makeIcon('icon2.webp', 'draw');
      icon2.position.copy(base).addScaledVector(tmpRight, 0.18);
      icon2.lookAt(tmpCamPos);
      icon2.userData._baseY = icon2.position.y;
      drawModeIconPos = icon2.position.clone();
      scene.add(icon2); panels.push(icon2);
    }

    function updateHandDisplay(handCount, twoHandDistance) {
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
      

      if (!handLandmarks || handCount === 0) {
        
        lastPinch = false; isResizing = false; lastTwoHandDistance = null;
        if (pointerEnabled) pointerCtx.clearRect(0, 0, pointerCanvas.width, pointerCanvas.height);
        return;
      }

      if (drawMode) { handleDrawMode(); return; }
      if (handCount === 2 && twoHandDistance) { handleTwoHandResize(twoHandDistance); return; }
      if (handCount === 1) { handleSingleHandPinch(); }
    }

    function handleTwoHandResize(currentDistance) {
      
      if (!isResizing && activePanel) {
        isResizing = true; lastTwoHandDistance = currentDistance;
        initialPanelScale = activePanel.scale.x; return;
      }
      if (isResizing && activePanel && lastTwoHandDistance) {
        const scaleChange = currentDistance / lastTwoHandDistance;
        const newScale = initialPanelScale * scaleChange;
        const clampedScale = Math.max(0.5, Math.min(3.0, newScale));
        activePanel.scale.setScalar(clampedScale);
        
      }
      if (!activePanel) { isResizing = false; lastTwoHandDistance = null; }
    }

    function handleSingleHandPinch() {
      if (isResizing) { isResizing = false; lastTwoHandDistance = null; }
      const landmarks = Array.isArray(handLandmarks[0]) ? handLandmarks[0] : handLandmarks;
      const thumb = landmarks[4]; const index = landmarks[8];
      const thumbX = (thumb.x * handCanvas.width) + HAND_OFFSET_X;
      const thumbY = (thumb.y * handCanvas.height) + HAND_OFFSET_Y;
      const indexX = (index.x * handCanvas.width) + HAND_OFFSET_X;
      const indexY = (index.y * handCanvas.height) + HAND_OFFSET_Y;
      const dx = thumbX - indexX; const dy = thumbY - indexY;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const isPinching = distance < 50;

      // ── PINCH START — Vision Pro style: gaze = aim, pinch = activate ──
      if (isPinching && !lastPinch) {
        const now = Date.now();
        const isDoublePinch = (now - lastPinchTime) < DOUBLE_PINCH_MS;
        lastPinchTime = now;

        // Double pinch = create wall anchor at gaze point
        if (isDoublePinch && !hoveredObject) {
          createWallAnchor();
        } else {
          const gazedAt = hoveredObject;
          if (gazedAt) {
            if (gazedAt.userData.isCloseBtn) {
              closePanel(gazedAt.userData.panelRef);
            } else if (gazedAt.userData.isIcon && !gazedAt.userData.openPanel) {
              openPanelForIcon(gazedAt);
            } else if (gazedAt.userData.isPanel) {
              activePanel = gazedAt;
              activePanel.userData.selected = true;
              activePanel.userData.snappedToAnchor = null;
              initialPanelScale = activePanel.scale.x;
              // Fade to 30% while dragging
              if (activePanel.userData.glassShell) {
                activePanel.userData.glassShell.material.opacity = 0.30;
              }
            }
          }
        }
      }

      // ── HOLD pinch — drag active panel to where gaze is pointing ──
      if (isPinching && activePanel) {
        // Move panel to follow gaze direction at fixed distance
        camera.getWorldPosition(tmpOrigin);
        camera.getWorldDirection(tmpDirection);
        const dist = activePanel.position.distanceTo(tmpOrigin);
        const clampedDist = Math.max(0.4, Math.min(2.5, dist));
        const target = tmpOrigin.clone().addScaledVector(tmpDirection, clampedDist);
        // Smooth follow
        activePanel.position.lerp(target, 0.12);
        activePanel.quaternion.slerp(camera.quaternion, 0.08);
      }

      // ── PINCH RELEASE — snap to anchor if nearby, else drop ──
      if (!isPinching && lastPinch) {
        if (activePanel) {
          checkAnchorSnap(activePanel);
          // Restore opacity
          if (activePanel.userData.glassShell) {
            activePanel.userData.glassShell.material.opacity = activePanel.userData.shellOpacity || 0.82;
          }
          activePanel.userData.selected = false;
          activePanel = null;
        }
      }

      lastPinch = isPinching;
    }

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.01, 20);
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MAX_RENDER_PIXEL_RATIO));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.xr.enabled = true;
      renderer.xr.setFramebufferScaleFactor(XR_FRAMEBUFFER_SCALE);
      renderer.xr.addEventListener('sessionstart', () => {
        startClarityCameraProbe();
        const b = document.getElementById('ARButton');
        if (b) b.style.display = 'none';
      });
      renderer.xr.addEventListener('sessionend', () => {
        stopClarityCameraProbe();
        const b = document.getElementById('ARButton');
        if (b) b.style.display = '';
      });
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      // Original reticle — simple white ring on the floor
      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.10, 0.13, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x6b6b6b, transparent: true, opacity: 0.55, side: THREE.DoubleSide })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      controller = renderer.xr.getController(0);
      controller.addEventListener("select", onSelect);
      scene.add(controller);

      renderer.domElement.addEventListener("click", onCanvasClick);

      // Custom AR button with full error handling — no crash on failure
      const arBtn = document.createElement('button');
      arBtn.id = 'ARButton';
      arBtn.textContent = 'ENTER AR';
      Object.assign(arBtn.style, {
        border: '3px solid hsla(0,0%,100%,0.35)',
        background: 'hsla(0,0%,42%,0.55)',
        backdropFilter: 'blur(6px)',
        boxShadow: 'inset 0 0 10px 2px hsla(0,0%,100%,0.7), 0 0 28px 6px hsla(0,0%,100%,0.22), 0 6px 32px rgba(0,0,0,0.4)',
        color: '#fff',
        borderRadius: '0.65em',
        font: '700 15px system-ui, sans-serif',
        letterSpacing: '0.05em',
        padding: '14px 28px',
        cursor: 'pointer',
        position: 'fixed',
        bottom: '24px',
        left: '50%',
        transform: 'translateX(-50%)',
        zIndex: '50',
        textTransform: 'uppercase'
      });

      arBtn.addEventListener('click', async () => {
        if (!navigator.xr) { alert('WebXR not supported on this device/browser'); return; }
        try {
          arBtn.textContent = 'Starting...';
          arBtn.disabled = true;

          // Try with hit-test first, fall back without
          let session;
          try {
            session = await navigator.xr.requestSession('immersive-ar', {
              requiredFeatures: ['hit-test'],
              optionalFeatures: ['dom-overlay'],
              domOverlay: { root: document.body }
            });
          } catch(e) {
            // Retry without hit-test
            session = await navigator.xr.requestSession('immersive-ar', {
              optionalFeatures: ['dom-overlay'],
              domOverlay: { root: document.body }
            });
          }

          await renderer.xr.setSession(session);
          arBtn.style.display = 'none';

          session.addEventListener('end', () => {
            arBtn.style.display = '';
            arBtn.textContent = 'ENTER AR';
            arBtn.disabled = false;
          });

        } catch(err) {
          console.error('AR session failed:', err);
          arBtn.textContent = 'ENTER AR';
          arBtn.disabled = false;
          arBtn.style.boxShadow = 'inset 0 0 10px 2px hsla(0,60%,60%,0.7), 0 0 28px 6px hsla(0,0%,100%,0.22)';
          setTimeout(() => {
            arBtn.style.boxShadow = 'inset 0 0 10px 2px hsla(0,0%,100%,0.7), 0 0 28px 6px hsla(0,0%,100%,0.22)';
          }, 2000);
        }
      });

      document.body.appendChild(arBtn);
      window.addEventListener("resize", onWindowResize);
    }

    function onSelect() {
      const hitPanel = getPanelUnderGaze();
      if (activePanel) { activePanel.userData.selected = false; activePanel = null; return; }
      if (hitPanel) {
        activePanel = hitPanel; activePanel.userData.selected = true;
        activePanel.scale.setScalar(1.08); return;
      }
    }

    function onCanvasClick() {
      const hitIcon = getIconUnderGaze();
      if (hitIcon) { openPanelForIcon(hitIcon); return; }
    }

    function getPanelUnderGaze() {
      if (panels.length === 0) return null;
      camera.getWorldPosition(tmpOrigin);
      camera.getWorldDirection(tmpDirection);
      raycaster.set(tmpOrigin, tmpDirection);
      const hits = raycaster.intersectObjects(panels, true);
      if (!hits.length) return null;
      let candidate = hits[0].object;
      while (candidate && !candidate.userData.isPanel) { candidate = candidate.parent; }
      return candidate;
    }

    function getIconUnderGaze() {
      if (panels.length === 0) return null;
      camera.getWorldPosition(tmpOrigin);
      camera.getWorldDirection(tmpDirection);
      raycaster.set(tmpOrigin, tmpDirection);
      const allIcons = [];
      panels.forEach(panel => { if (panel.userData.isIcon) allIcons.push(panel); });
      const hits = raycaster.intersectObjects(allIcons, true);
      return hits.length > 0 ? hits[0].object.parent || hits[0].object : null;
    }

    // ── Icon factory: accepts filename + type ('clock' | 'weather') ──────
    function makeIcon(filename, type) {
      const group = new THREE.Group();
      group.userData = { isIcon: true, isPanel: false, iconType: type, hoverTime: 0 };

      // Pure image — no background, no disc, no ring
      new THREE.TextureLoader().load(filename, tex => {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.generateMipmaps = true;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const aspect = (tex.image.width || 1) / (tex.image.height || 1);
        // 20cm tall in world space so it's clearly visible at 1m
        const h = 0.20, w = h * aspect;
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({
            map: tex, transparent: true,
            depthWrite: false, side: THREE.DoubleSide
          })
        );
        group.add(m); group.userData.iconMesh = m;
      }, undefined, () => {
        // Fallback: small coloured dot if image fails to load
        const fb = new THREE.Mesh(
          new THREE.CircleGeometry(0.08, 32),
          new THREE.MeshBasicMaterial({
            color: type === 'clock' ? 0x3366ff : 0x22aacc,
            transparent: true, opacity: 0.85
          })
        );
        group.add(fb);
      });

      return group;
    }

    // ── Open the correct panel to the SIDE of the icon ────────────────
    function openPanelForIcon(icon) {
      if (icon.userData.openPanel) return;
      const type = icon.userData.iconType;

      // Draw mode icon
      if (type === 'draw') {
        enterDrawMode(icon);
        return;
      }

      const panel = type === 'clock' ? makeClockPanel() : makeWeatherPanel();

      // Spawn panel 0.82m to the right of the icon (in icon's local space)
      const right = new THREE.Vector3(1, 0, 0).applyQuaternion(icon.quaternion);
      panel.position.copy(icon.position).addScaledVector(right, 0.82);
      panel.quaternion.copy(icon.quaternion);
      panel.userData.baseZ = panel.position.z;

      scene.add(panel); panels.push(panel);
      icon.visible = false;
      icon.userData.openPanel = panel;
      panel.userData.iconRef = icon;
    }

    // ── Air Drawing ─────────────────────────────────────────────────
    function enterDrawMode(icon) {
      drawMode = true;
      icon.visible = false;
      icon.userData.openPanel = true; // prevent re-open
      // Show hint
      showDrawHint(true);
    }

    function exitDrawMode() {
      drawMode = false;
      isDrawing = false;
      lastDrawPoint = null;
      showDrawHint(false);
      // Unhide icon2
      panels.forEach(p => {
        if (p.userData.iconType === 'draw') {
          p.visible = true;
          p.userData.openPanel = false;
        }
      });
    }

    function showDrawHint(show) {
      let hint = document.getElementById('drawHint');
      if (!hint) {
        hint = document.createElement('div');
        hint.id = 'drawHint';
        Object.assign(hint.style, {
          position: 'fixed', bottom: '100px', left: '50%',
          transform: 'translateX(-50%)',
          background: 'hsla(0,0%,100%,0.2)',
          border: '1px solid hsla(0,0%,100%,0.35)',
          backdropFilter: 'blur(12px)',
          color: '#fff', padding: '10px 20px',
          borderRadius: '999px', fontSize: '13px',
          fontFamily: 'system-ui', zIndex: '30',
          boxShadow: 'inset 0 0 8px 1px hsla(0,0%,100%,0.4)',
          pointerEvents: 'none'
        });
        document.body.appendChild(hint);
      }
      hint.textContent = '✏️ Pinch to draw · Open palm to exit';
      hint.style.display = show ? 'block' : 'none';
    }

    function isOpenPalm(landmarks) {
      // All 4 fingers extended = open palm
      // Check each fingertip is far from wrist
      const wrist = landmarks[0];
      const tips = [landmarks[8], landmarks[12], landmarks[16], landmarks[20]];
      const bases = [landmarks[5], landmarks[9], landmarks[13], landmarks[17]];
      let extended = 0;
      for (let i = 0; i < 4; i++) {
        const tipDist = Math.hypot(tips[i].x - wrist.x, tips[i].y - wrist.y);
        const baseDist = Math.hypot(bases[i].x - wrist.x, bases[i].y - wrist.y);
        if (tipDist > baseDist * 1.4) extended++;
      }
      return extended >= 3;
    }

    function handleDrawMode() {
      if (!handLandmarks) return;
      const lm = Array.isArray(handLandmarks[0]) ? handLandmarks[0] : handLandmarks;
      if (!lm || lm.length < 21) return;

      // Open palm = exit
      if (isOpenPalm(lm)) {
        exitDrawMode();
        return;
      }

      // Pinch = draw
      const thumb = lm[4], index = lm[8];
      const dx = (thumb.x - index.x) * handCanvas.width;
      const dy = (thumb.y - index.y) * handCanvas.height;
      const pinching = Math.sqrt(dx*dx + dy*dy) < 50;

      if (pinching) {
        // Get 3D position of index fingertip in world space
        // Project from screen to world at ~0.7m depth
        const ix = (index.x * 2 - 1);
        const iy = -(index.y * 2 - 1);
        const vec = new THREE.Vector3(ix, iy, 0.5).unproject(camera);
        camera.getWorldPosition(tmpOrigin);
        const dir = vec.sub(tmpOrigin).normalize();
        const drawPoint = tmpOrigin.clone().addScaledVector(dir, 0.7);

        if (!isDrawing) {
          isDrawing = true;
          currentStroke = [drawPoint.clone()];
          lastDrawPoint = drawPoint.clone();
        } else {
          const dist = drawPoint.distanceTo(lastDrawPoint);
          if (dist > DRAW_MIN_DIST) {
            currentStroke.push(drawPoint.clone());
            lastDrawPoint = drawPoint.clone();
            // Rebuild line
            rebuildCurrentStrokeLine();
          }
        }
      } else {
        if (isDrawing && currentStroke.length > 1) {
          // Finalize stroke
          commitStroke();
        }
        isDrawing = false;
        lastDrawPoint = null;
        currentStroke = [];
      }
    }

    let currentStrokeLine = null;
    function rebuildCurrentStrokeLine() {
      if (currentStrokeLine) scene.remove(currentStrokeLine);
      if (currentStroke.length < 2) return;
      const geo = new THREE.BufferGeometry().setFromPoints(currentStroke);
      const mat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
      currentStrokeLine = new THREE.Line(geo, mat);
      scene.add(currentStrokeLine);
    }

    function commitStroke() {
      if (currentStrokeLine) {
        drawnStrokes.push(currentStrokeLine);
        currentStrokeLine = null;
      }
    }

    // ── Shared: rounded rect THREE.Shape ─────────────────────────────
    function makeRoundedRectShape(width, height, radius) {
      const shape = new THREE.Shape();
      const w = width, h = height, r = Math.min(radius, w * 0.5, h * 0.5);
      shape.moveTo(-w/2+r, -h/2); shape.lineTo(w/2-r, -h/2);
      shape.quadraticCurveTo(w/2, -h/2, w/2, -h/2+r);
      shape.lineTo(w/2, h/2-r); shape.quadraticCurveTo(w/2, h/2, w/2-r, h/2);
      shape.lineTo(-w/2+r, h/2); shape.quadraticCurveTo(-w/2, h/2, -w/2, h/2-r);
      shape.lineTo(-w/2, -h/2+r); shape.quadraticCurveTo(-w/2, -h/2, -w/2+r, -h/2);
      return shape;
    }

    // ── Shared: Vision Pro glass shell ────────────────────────────────
    function makeGlassShell(w, h, r, tint, shellOpacity = 0.82) {
      const shape = makeRoundedRectShape(w, h, r);
      const geom = new THREE.ShapeGeometry(shape, 28);
      const group = new THREE.Group();

      // Exact AR button style: white 0.2 opacity base, blur = transmission
      const shell = new THREE.Mesh(geom, new THREE.MeshPhysicalMaterial({
        color: 0x9a9a9a, transparent: true, opacity: shellOpacity,
        transmission: 0.15, roughness: 0.45, metalness: 0,
        clearcoat: 1.0, clearcoatRoughness: 0.35,
        reflectivity: 0.5, ior: 1.45, thickness: 0.5,
        side: THREE.DoubleSide
      }));
      group.add(shell);

      // Inset glow — bright edges like CSS inset box-shadow
      const glowCvs = document.createElement('canvas');
      glowCvs.width = glowCvs.height = 512;
      const glowCtx = glowCvs.getContext('2d');
      const insetGrad = glowCtx.createRadialGradient(256,256,140, 256,256,256);
      insetGrad.addColorStop(0, 'rgba(255,255,255,0)');
      insetGrad.addColorStop(0.70, 'rgba(255,255,255,0.06)');
      insetGrad.addColorStop(1, 'rgba(255,255,255,0.72)');
      glowCtx.fillStyle = insetGrad; glowCtx.fillRect(0,0,512,512);
      const glowMesh = new THREE.Mesh(new THREE.ShapeGeometry(shape, 28),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(glowCvs), transparent: true, opacity: 1 }));
      glowMesh.position.z = 0.001; group.add(glowMesh);

      // Outer glow plane — slightly larger, white halo behind the panel
      const outerGlowCvs = document.createElement('canvas');
      outerGlowCvs.width = outerGlowCvs.height = 512;
      const ogCtx = outerGlowCvs.getContext('2d');
      const ogGrad = ogCtx.createRadialGradient(256,256,180, 256,256,256);
      ogGrad.addColorStop(0, 'rgba(255,255,255,0)');
      ogGrad.addColorStop(0.6, 'rgba(255,255,255,0.06)');
      ogGrad.addColorStop(1, 'rgba(255,255,255,0.28)');
      ogCtx.fillStyle = ogGrad; ogCtx.fillRect(0,0,512,512);
      const outerGlowMesh = new THREE.Mesh(
        new THREE.ShapeGeometry(makeRoundedRectShape(w * 1.06, h * 1.06, r * 1.1), 28),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(outerGlowCvs), transparent: true, opacity: 0.9, depthWrite: false })
      );
      outerGlowMesh.position.z = -0.005; group.add(outerGlowMesh);

      // Border — matches: 3px solid hsla(0,0%,100%,0.35)
      const border = new THREE.LineSegments(
        new THREE.EdgesGeometry(geom),
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 })
      );
      group.add(border);

      // Drop shadow
      const shadowMesh = new THREE.Mesh(new THREE.ShapeGeometry(shape, 28),
        new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18, depthWrite: false }));
      shadowMesh.position.set(0.013, -0.02, -0.002); group.add(shadowMesh);

      // Hover edge glow — brightens border on gaze
      const hoverGlow = new THREE.LineSegments(
        new THREE.EdgesGeometry(geom),
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 })
      );
      hoverGlow.position.z = 0.006; group.add(hoverGlow);

      group.userData.isPanel = true; group.userData.hoverTime = 0;
      group.userData.shellOpacity = shellOpacity;
      group.userData.glassShell = shell;
      group.userData.innerBorder = border;
      group.userData.shadowMesh = shadowMesh;
      group.userData.hoverGlow = hoverGlow;
      return { group, shape };
    }

    // ── Canvas texture helper ─────────────────────────────────────────
    function makeCanvasTex(w, h, drawFn) {
      const cvs = document.createElement('canvas');
      cvs.width = w; cvs.height = h;
      const ctx = cvs.getContext('2d');
      drawFn(ctx, cvs);
      const tex = new THREE.CanvasTexture(cvs);
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = true;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return { tex, cvs, ctx };
    }

    function fillRR(ctx, x, y, w, h, r, fill) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
      ctx.quadraticCurveTo(x+w, y, x+w, y+r);
      ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
      ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
      ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    }

    // ════════════════════════════════════════════════════════════════
    //  CLOCK PANEL
    // ════════════════════════════════════════════════════════════════
    function makeClockPanel() {
      const PW = 0.90, PH = 0.62, CR = 0.09;
      const { group, shape } = makeGlassShell(PW, PH, CR, 0x071422, 0.92);
      const { tex, cvs, ctx } = makeCanvasTex(960, 640, drawClockFace);
      const content = new THREE.Mesh(
        new THREE.ShapeGeometry(makeRoundedRectShape(PW - 0.13, PH - 0.11, 0.06), 20),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.01 })
      );
      content.position.z = 0.0035; group.add(content);
      Object.assign(group.userData, { isClockPanel: true, clockCanvas: cvs, clockCtx: ctx, clockTexture: tex });
      return group;
    }

    function drawClockFace(ctx, cvs) {
      const W = cvs.width, H = cvs.height;
      ctx.clearRect(0, 0, W, H);

      const now = new Date();
      const h = now.getHours() % 12 || 12;
      const m = String(now.getMinutes()).padStart(2, '0');
      const ampm = now.getHours() >= 12 ? 'PM' : 'AM';

      // Dark semi-transparent background
      ctx.fillStyle = 'rgba(10,10,10,0.72)';
      roundRect(ctx, 0, 0, W, H, 80);
      ctx.fill();

      // Gold time
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '200 200px system-ui';
      ctx.fillStyle = 'rgba(212,168,75,0.55)';
      ctx.shadowColor = 'rgba(212,168,75,0.35)';
      ctx.shadowBlur = 30;
      ctx.fillText(`${h}:${m}`, W / 2 - 40, H / 2);

      // AM/PM small
      ctx.font = '300 48px system-ui';
      ctx.fillStyle = 'rgba(212,168,75,0.35)';
      ctx.shadowBlur = 0;
      ctx.textAlign = 'left';
      ctx.fillText(ampm, W / 2 + 200, H / 2 - 50);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.lineTo(x+w-r, y);
      ctx.quadraticCurveTo(x+w, y, x+w, y+r);
      ctx.lineTo(x+w, y+h-r);
      ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
      ctx.lineTo(x+r, y+h);
      ctx.quadraticCurveTo(x, y+h, x, y+h-r);
      ctx.lineTo(x, y+r);
      ctx.quadraticCurveTo(x, y, x+r, y);
      ctx.closePath();
    }

    // ════════════════════════════════════════════════════════════════
    //  WEATHER PANEL
    // ════════════════════════════════════════════════════════════════
    function makeWeatherPanel() {
      const PW = 0.95, PH = 0.72, CR = 0.09;
      const { group, shape } = makeGlassShell(PW, PH, CR, 0x081624);
      const { tex, cvs, ctx } = makeCanvasTex(1024, 768, (c, cv) => drawWeatherFace(c, cv, weatherData));
      const content = new THREE.Mesh(
        new THREE.ShapeGeometry(makeRoundedRectShape(PW - 0.055, PH - 0.045, 0.065), 20),
        new THREE.MeshBasicMaterial({ map: tex, transparent: false })
      );
      content.position.z = 0.003; group.add(content);
      Object.assign(group.userData, {
        isWeatherPanel: true, weatherCanvas: cvs, weatherCtx: ctx, weatherTexture: tex
      });
      // Refresh weather every WEATHER_TTL ms
      const timer = setInterval(async () => {
        navigator.geolocation.getCurrentPosition(async pos => {
          await fetchWeather(pos.coords.latitude, pos.coords.longitude);
          drawWeatherFace(group.userData.weatherCtx, group.userData.weatherCanvas, weatherData);
          group.userData.weatherTexture.needsUpdate = true;
        }, async () => {
          await fetchWeather(userLat, userLon);
          drawWeatherFace(group.userData.weatherCtx, group.userData.weatherCanvas, weatherData);
          group.userData.weatherTexture.needsUpdate = true;
        });
      }, WEATHER_TTL);
      group.userData.weatherTimer = timer;
      return group;
    }

    function wCode(code) {
      if (code === 0) return { label: 'Clear Sky', emoji: '☀️', sky: ['#0a1a3a','#1a4080'] };
      if (code <= 2)  return { label: 'Partly Cloudy', emoji: '🌤️', sky: ['#1a2a45','#243560'] };
      if (code === 3) return { label: 'Overcast', emoji: '☁️', sky: ['#1e2a38','#2a3848'] };
      if (code <= 49) return { label: 'Foggy', emoji: '🌫️', sky: ['#222830','#303848'] };
      if (code <= 59) return { label: 'Drizzle', emoji: '🌦️', sky: ['#182030','#222c3a'] };
      if (code <= 69) return { label: 'Rain', emoji: '🌧️', sky: ['#101820','#1a2430'] };
      if (code <= 79) return { label: 'Snow', emoji: '❄️', sky: ['#1a2848','#243060'] };
      if (code <= 84) return { label: 'Showers', emoji: '🌧️', sky: ['#101820','#1c2835'] };
      return { label: 'Thunderstorm', emoji: '⛈️', sky: ['#0c1020','#18202c'] };
    }

    function drawWeatherFace(ctx, cvs, data) {
      const W = cvs.width, H = cvs.height;
      ctx.clearRect(0, 0, W, H);

      if (!data) {
        fillRR(ctx, 0, 0, W, H, 48, '#030810');
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '300 38px system-ui'; ctx.fillStyle = 'rgba(255,255,255,0.38)';
        ctx.fillText('Fetching weather…', W/2, H/2); return;
      }

      const info = wCode(data.weather_code || 0);
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, info.sky[0]); bg.addColorStop(1, info.sky[1]);
      fillRR(ctx, 0, 0, W, H, 48, null); ctx.fillStyle = bg; ctx.fill();

      const temp = Math.round(data.temperature_2m ?? '--');
      const feels = Math.round(data.apparent_temperature ?? '--');
      const humidity = Math.round(data.relative_humidity_2m ?? '--');
      const wind = Math.round(data.wind_speed_10m ?? '--');

      // Emoji
      ctx.textAlign = 'center';
      ctx.font = '130px serif'; ctx.fillText(info.emoji, W/2, 205);

      // Temperature
      ctx.save();
      ctx.font = '200 148px system-ui'; ctx.fillStyle = 'rgba(255,255,255,0.97)';
      ctx.shadowColor = 'rgba(100,200,255,0.22)'; ctx.shadowBlur = 28;
      ctx.textAlign = 'center'; ctx.fillText(`${temp}°`, W/2, 400); ctx.restore();

      // Condition label
      ctx.font = '300 38px system-ui'; ctx.fillStyle = 'rgba(255,255,255,0.60)';
      ctx.fillText(info.label, W/2, 462);

      // Divider
      const dg = ctx.createLinearGradient(W*0.1, 0, W*0.9, 0);
      dg.addColorStop(0, 'rgba(255,255,255,0)'); dg.addColorStop(0.5, 'rgba(255,255,255,0.14)'); dg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.save(); ctx.strokeStyle = dg; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(W*0.1, 505); ctx.lineTo(W*0.9, 505); ctx.stroke(); ctx.restore();

      // Stats row
      [{ label: 'FEELS LIKE', val: `${feels}°` }, { label: 'HUMIDITY', val: `${humidity}%` }, { label: 'WIND', val: `${wind} mph` }]
        .forEach((s, i) => {
          const x = W * (0.19 + i * 0.31);
          ctx.font = '500 36px system-ui'; ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillText(s.val, x, 580);
          ctx.font = '300 21px system-ui'; ctx.fillStyle = 'rgba(255,255,255,0.34)'; ctx.fillText(s.label, x, 618);
        });

      // Timestamp
      ctx.font = '200 19px system-ui'; ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillText(`Updated ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`, W/2, H - 26);
    }

    // ════════════════════════════════════════════════════════════════
    //  WEATHER FETCH (Open-Meteo, no API key)
    // ════════════════════════════════════════════════════════════════
    function prefetchWeather() {
      navigator.geolocation.getCurrentPosition(pos => {
        userLat = pos.coords.latitude; userLon = pos.coords.longitude;
        fetchWeather(userLat, userLon);
      }, () => fetchWeather(userLat, userLon));
    }

    async function fetchWeather(lat, lon) {
      if (weatherData && Date.now() - weatherFetchedAt < WEATHER_TTL) return;
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&temperature_unit=celsius&wind_speed_unit=mph&timezone=auto`;
        const r = await fetch(url);
        const j = await r.json();
        weatherData = j.current; weatherFetchedAt = Date.now();
      } catch(e) { console.warn('Weather fetch failed', e); }
    }

        function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      handCanvas.width = window.innerWidth;
      handCanvas.height = window.innerHeight;
      resizePointerCanvas();
    }

    function animate() { renderer.setAnimationLoop(render); }

    function render(timestamp, frame) {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace("viewer").then((space) => {
            // Floor hit test
            session.requestHitTestSource({ space }).then((source) => { hitTestSource = source; }).catch(()=>{});
            // Wall hit test — vertical planes
            session.requestHitTestSource({ space, entityTypes: ['plane'] }).then((source) => { wallHitTestSource = source; }).catch(()=>{});
          });
          session.addEventListener("end", () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
            wallHitTestSource = null;
          });
          hitTestSourceRequested = true;
          // Show surface toggle button in AR
          document.getElementById('surfaceToggleBtn').style.display = 'block';
        }

        if (hitTestSource) {
          // Pick correct source based on mode
          const activeSource = (isWallMode && wallHitTestSource) ? wallHitTestSource : hitTestSource;
          const hitTestResults = frame.getHitTestResults(activeSource);

          if (hitTestResults.length) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);

            // Check normal to filter: wall = mostly vertical normal, floor = mostly horizontal
            const mat = new THREE.Matrix4().fromArray(pose.transform.matrix);
            const normal = new THREE.Vector3(0, 1, 0).applyMatrix4(mat).normalize();
            const isVertical = Math.abs(normal.y) < 0.5; // normal pointing sideways = wall

            if (isWallMode ? isVertical : !isVertical) {
              reticle.visible = true;
              reticle.matrix.fromArray(pose.transform.matrix);
              tmpReticlePos.setFromMatrixPosition(reticle.matrix);
              if (!isWallMode) groundYEstimate = tmpReticlePos.y;
            } else {
              reticle.visible = false;
            }
          } else { reticle.visible = false; }
          spawnIconInAir();
        }
      }

      if (activePanel && reticle.visible) {
        activePanel.position.setFromMatrixPosition(reticle.matrix);
        if (isWallMode) {
          // Face the camera when snapped to wall
          activePanel.lookAt(camera.position);
        } else {
          activePanel.quaternion.setFromRotationMatrix(reticle.matrix);
        }
      }

      panels.forEach(panel => {
        if (panel.userData.isClockPanel) drawClockFace(panel.userData.clockCtx, panel.userData.clockCanvas);
        if (panel.userData.isClockPanel) panel.userData.clockTexture.needsUpdate = true;
        updateHoverEffect(panel);
      });

      // Animate wall anchors — pulse scale
      wallAnchors.forEach(anchor => {
        const age = (Date.now() - anchor.userData.spawnTime) / 1000;
        const pulse = 1 + Math.sin(age * 4) * 0.08;
        anchor.scale.setScalar(pulse);
        // Face user always
        anchor.lookAt(camera.position);
      });

      detectHover();
      renderer.render(scene, camera);
    }

    function detectHover() {
      camera.getWorldPosition(tmpOrigin);
      camera.getWorldDirection(tmpDirection);
      raycaster.set(tmpOrigin, tmpDirection);
      const hits = raycaster.intersectObjects(panels, true);

      let target = null;
      if (hits.length > 0) {
        let t = hits[0].object;
        while (t && !t.userData.isIcon && !t.userData.isPanel) t = t.parent;
        if (t && (t.userData.isIcon || t.userData.isPanel)) target = t;
      }

      if (target !== hoveredObject) {
        if (hoveredObject) hoveredObject.userData.hoverTime = 0;
        hoveredObject = target;
      }
    }

    function updateHoverEffect(object) {
      if (!object.userData) return;
      const isHovered = (hoveredObject === object);
      if (isHovered) { object.userData.hoverTime = Math.min(object.userData.hoverTime + 0.045, 1); }
      else { object.userData.hoverTime = Math.max(object.userData.hoverTime - 0.055, 0); }
      const hoverAmount = object.userData.hoverTime;

      if (object.userData.isIcon) {
        const pulse = Math.sin(Date.now() * 0.005) * 0.5 + 0.5;
        // Scale up smoothly on hover
        object.scale.setScalar(1 + hoverAmount * 0.18 + pulse * hoverAmount * 0.06);
        // Idle float + rise toward camera on hover
        if (object.userData._baseY !== undefined) {
          object.position.y = object.userData._baseY
            + hoverAmount * 0.025
            + Math.sin(Date.now() * 0.0018) * 0.008;
        }
        // Icon image brightens slightly on hover
        if (object.userData.iconMesh) {
          object.userData.iconMesh.material.opacity = 0.85 + hoverAmount * 0.15;
        }
      }
      if (object.userData.hoverRing) {
        const ring = object.userData.hoverRing;
        const pulse = Math.sin(Date.now() * 0.0045) * 0.18 + 0.82;
        ring.material.opacity = hoverAmount * pulse * 0.9;
        ring.scale.setScalar(1 + hoverAmount * 0.12);
        object.scale.setScalar(1 + hoverAmount * 0.06);
      }
      if (object.userData.hoverGlow) {
        const glow = object.userData.hoverGlow;
        const sweep = Math.sin(Date.now() * 0.0035) * 0.25 + 0.75;
        glow.material.opacity = hoverAmount * sweep * 0.75;
        object.position.z = (object.userData.baseZ || object.position.z) + hoverAmount * 0.01;
      }
      if (object.userData.glassShell) {
        object.userData.glassShell.material.clearcoat = 1.0 - (0.15 * (1 - hoverAmount));
        object.userData.glassShell.material.transmission = 0.18 + (hoverAmount * 0.08);
      }
      if (object.userData.innerBorder) {
        object.userData.innerBorder.material.opacity = 0.35 + (hoverAmount * 0.35);
      }
      if (object.userData.shadowMesh) {
        object.userData.shadowMesh.material.opacity = 0.08 + (hoverAmount * 0.08);
      }
    }
  </script>
