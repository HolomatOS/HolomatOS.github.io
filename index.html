<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Horizon Lock — Cardboard</title>
  <style>
    html,body{height:100%;margin:0;background:#000;color:#0ff;font-family:Inter,system-ui,Arial}
    .container{height:100vh;display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(0,0,0,.3)}
    .controls{display:flex;gap:8px;align-items:center}
    button{background:#062; color:#bff;border:none;padding:8px 10px;border-radius:6px}
    .hint{color:#6fd;font-size:13px}
    .vr{flex:1;display:flex;align-items:stretch}
    canvas{flex:1;display:block;width:50%;height:calc(100vh - 52px);background:#001}
    .overlay-ui{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:20;color:#7ff;font-weight:700}
    .big-label{font-size:22px;letter-spacing:4px}
    .small{font-size:12px;color:#9ff}
    .center-guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
    .reticle{width:110px;height:110px;border:2px solid rgba(0,255,255,.25);border-radius:50%;box-shadow:0 0 16px rgba(0,255,200,.06)}
    .warning{color:#f66}
    @media (orientation:portrait){ .big-label{font-size:18px} }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <strong>Horizon Lock</strong>
        <div class="hint">Use in Google Cardboard — allow Motion permission</div>
      </div>
      <div class="controls">
        <button id="requestPerm">Enable Motion</button>
        <button id="calibrate">Calibrate</button>
        <button id="fullscreen">VR Fullscreen</button>
      </div>
    </div>

    <div class="vr" id="vr">
      <canvas id="left"></canvas>
      <canvas id="right"></canvas>

      <div class="overlay-ui">
        <div class="big-label">HORIZON LOCK</div>
        <div class="small">Pitch & Roll locked to world — Tap & calibrate to set reference</div>
      </div>

      <div class="center-guide" aria-hidden>
        <div class="reticle"></div>
      </div>

    </div>

    <div style="padding:8px 12px;background:rgba(0,0,0,.25);font-size:13px;color:#9ff">Status: <span id="status">waiting</span> — <span id="debug"></span></div>
  </div>

<script>
// Minimal Horizon Lock for Cardboard
// Uses DeviceOrientation (alpha,beta,gamma). Calibrate to set current pose as horizon.

const left = document.getElementById('left');
const right = document.getElementById('right');
const status = document.getElementById('status');
const debug = document.getElementById('debug');
const reqBtn = document.getElementById('requestPerm');
const calibBtn = document.getElementById('calibrate');
const fsBtn = document.getElementById('fullscreen');

function sizeCanvases() {
  left.width = left.clientWidth * devicePixelRatio;
  left.height = left.clientHeight * devicePixelRatio;
  right.width = right.clientWidth * devicePixelRatio;
  right.height = right.clientHeight * devicePixelRatio;
}
window.addEventListener('resize', sizeCanvases);
sizeCanvases();

const ctxL = left.getContext('2d');
const ctxR = right.getContext('2d');

let reference = {roll:0, pitch:0};
let calibrated = false;
let last = {roll:0,pitch:0,yaw:0};
let hasSensor = false;
let smoothing = 0.12; // simple low-pass
let sm = {roll:0,pitch:0};

function toRad(d){return d*Math.PI/180}

function drawHorizon(ctx, w, h, rollDeg, pitchDeg) {
  ctx.clearRect(0,0,w,h);
  ctx.save();
  ctx.translate(w/2,h/2);
  ctx.rotate(-toRad(rollDeg)); // rotate opposite to phone roll so horizon stays level in world

  // vertical shift based on pitch (smaller factor for nicer range)
  const pxPerDeg = h / 90; // 90deg -> full screen
  const y = -pitchDeg * pxPerDeg; // negative so pitching up moves horizon down

  // draw sky
  ctx.fillStyle = '#001f2f';
  ctx.fillRect(-w, -h*2 + y, w*2, h*2);
  // draw ground
  ctx.fillStyle = '#06221a';
  ctx.fillRect(-w, y, w*2, h*2);

  // horizon line
  ctx.strokeStyle = '#2ff';
  ctx.lineWidth = 4 * devicePixelRatio;
  ctx.beginPath();
  ctx.moveTo(-w, y);
  ctx.lineTo(w, y);
  ctx.stroke();

  // graduations (pitch ticks)
  ctx.strokeStyle = 'rgba(47,255,255,0.15)';
  ctx.lineWidth = 1 * devicePixelRatio;
  for(let deg=-60;deg<=60;deg+=10){
    const yy = y + deg*pxPerDeg;
    ctx.beginPath();
    ctx.moveTo(-40*devicePixelRatio, yy);
    ctx.lineTo(40*devicePixelRatio, yy);
    ctx.stroke();
  }

  // center label
  ctx.fillStyle = '#9ff';
  ctx.font = `${18*devicePixelRatio}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(`${Math.round(pitchDeg)}°`, 0, y - 12*devicePixelRatio);

  ctx.restore();

  // vignette
  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,w,h);
}

function render() {
  // smoothing
  sm.roll += (last.roll - sm.roll) * smoothing;
  sm.pitch += (last.pitch - sm.pitch) * smoothing;

  // left and right draw (small eye offset)
  const wL = left.width, hL = left.height;
  const wR = right.width, hR = right.height;

  // slight stereo offset (no parallax for horizon, but small effect)
  drawHorizon(ctxL, wL, hL, sm.roll, sm.pitch);
  drawHorizon(ctxR, wR, hR, sm.roll, sm.pitch);

  requestAnimationFrame(render);
}
requestAnimationFrame(render);

// Handle DeviceOrientation
function handleOrientation(e){
  // alpha = yaw, beta = pitch (-180..180), gamma = roll (-90..90)
  let alpha = e.alpha; // compass
  let beta = e.beta;   // front-back
  let gamma = e.gamma; // left-right

  if (beta === null || gamma === null) return;
  hasSensor = true;
  status.textContent = 'active';

  // define roll and pitch in degrees
  let roll = gamma;    // device left/right tilt -> roll
  let pitch = beta;    // device front/back tilt -> pitch

  // normalize to -180..180 for pitch
  if (pitch > 180) pitch -= 360;

  // apply reference (calibration)
  if (calibrated) {
    roll = roll - reference.roll;
    pitch = pitch - reference.pitch;
  }

  last.roll = roll;
  last.pitch = pitch;
  last.yaw = alpha || 0;

  debug.textContent = `roll:${roll.toFixed(1)}° pitch:${pitch.toFixed(1)}°`;
}

// permission request for iOS
async function requestPermission(){
  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res === 'granted') {
        window.addEventListener('deviceorientation', handleOrientation, true);
        status.textContent = 'granted';
      } else {
        status.textContent = 'denied';
      }
    } catch(err) { status.textContent = 'error'; debug.textContent = err.message }
  } else {
    // non-iOS: just attach
    window.addEventListener('deviceorientation', handleOrientation, true);
    status.textContent = 'listening';
  }
}
reqBtn.addEventListener('click', requestPermission);

// calibrate button: set reference to current smoothed orientation
calibBtn.addEventListener('click', ()=>{
  reference.roll = last.roll;
  reference.pitch = last.pitch;
  calibrated = true;
  status.textContent = 'calibrated';
});

// fullscreen VR
fsBtn.addEventListener('click', async ()=>{
  const el = document.getElementById('vr');
  if (el.requestFullscreen) await el.requestFullscreen();
  else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
});

// fallback message if no sensor activity after a short timeout
setTimeout(()=>{
  if (!hasSensor) status.textContent = 'no sensor / permission needed';
},2500);

// initial quick calibration if we get data
let first = true;
window.addEventListener('deviceorientation', function initOnce(e){
  if (first && e.beta!==null && e.gamma!==null){
    reference.roll = e.gamma; reference.pitch = e.beta; calibrated = true; first=false; status.textContent='calibrated';
  }
}, { once:true });

// resize handling
window.addEventListener('resize', ()=>{
  sizeCanvases();
});

// instruct user
if (window.DeviceOrientationEvent === undefined) {
  status.textContent = 'unsupported';
}
</script>
</body>
</html>
