<!DOCTYPE html>
<html>
<head>
  <title>My First AR Cube</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true">

    <!-- Marker -->
    <a-marker preset="hiro" emitevents="true">

      <!-- 3D Cube -->
      <a-box 
        id="cube"
        position="0 0.5 0" 
        material="color: red; opacity: 0.8"
        rotation="0 45 0"
        animation="property: rotation; to: 0 405 0; loop: true; dur: 8000"
        >
      </a-box>

    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>

    <!-- Lighting -->
    <a-light type="ambient" intensity="0.5"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.7"></a-light>

  </a-scene>

  <script>
    // Request fullscreen on page load
    function goFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.mozRequestFullScreen) { /* Firefox */
        elem.mozRequestFullScreen();
      } else if (elem.webkitRequestFullscreen) { /* Chrome, Safari & Opera */
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) { /* IE/Edge */
        elem.msRequestFullscreen();
      }
    }

    // Try fullscreen automatically
    window.addEventListener('load', () => {
      goFullscreen();
    });

    // Change cube color on tap
    const cube = document.querySelector('#cube');
    cube.addEventListener('click', () => {
      const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'cyan'];
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      cube.setAttribute('material', 'color', randomColor);
    });
  </script>

</body>
</html>
