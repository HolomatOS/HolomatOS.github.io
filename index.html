<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Cardboard Passthrough</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #camera {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .split-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .eye {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .icon {
            position: absolute;
            width: 45px;
            height: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .icon img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.3));
        }

        .icon:hover {
            transform: scale(1.15);
        }

        .icon-label {
            position: absolute;
            top: 52px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 500;
            color: white;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
        }

        /* Row 2 - Middle (only row) - Centered with 140px spacing */
        .icon5 { top: 50%; left: 50%; transform: translate(-210px, -50%); }
        .icon6 { top: 50%; left: 50%; transform: translate(-70px, -50%); }
        .icon7 { top: 50%; left: 50%; transform: translate(70px, -50%); }
        .icon8 { top: 50%; left: 50%; transform: translate(210px, -50%); }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-3px);
            }
        }

        .icon::before {
            display: none;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0;
            }
        }

        #start-button {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            padding: 20px 40px;
            font-size: 20px;
            background: rgba(0, 122, 255, 0.9);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #start-button:hover {
            background: rgba(0, 122, 255, 1);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <button id="start-button">Start AR Experience</button>
    
    <video id="camera" autoplay playsinline></video>
    
    <div class="split-view hidden" id="split-view">
        <!-- Single View -->
        <div class="eye">
            <!-- Row 2 (only row) -->
            <div class="icon icon5">
                <img src="https://cdn-icons-png.flaticon.com/512/8943/8943377.png" alt="AI">
                <span class="icon-label">AI Assistant</span>
            </div>
            <div class="icon icon6">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968534.png" alt="Gmail">
                <span class="icon-label">Gmail</span>
            </div>
            <div class="icon icon7">
                <img src="https://cdn-icons-png.flaticon.com/512/888/888841.png" alt="App Store">
                <span class="icon-label">App Store</span>
            </div>
            <div class="icon icon8">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968959.png" alt="Apple Music">
                <span class="icon-label">Apple Music</span>
            </div>
        </div>
    </div>

    <script>
        const startButton = document.getElementById('start-button');
        const camera = document.getElementById('camera');
        const splitView = document.getElementById('split-view');

        startButton.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });

                camera.srcObject = stream;
                startButton.classList.add('hidden');
                splitView.classList.remove('hidden');

                // Make fullscreen
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }
            } catch (err) {
                alert('Camera access denied: ' + err.message);
            }
        });

        // Add click interaction to icons
        document.querySelectorAll('.icon').forEach(icon => {
            icon.addEventListener('click', function() {
                this.style.transform = 'scale(1.3)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });
        });
    </script>
</body>
</html>
