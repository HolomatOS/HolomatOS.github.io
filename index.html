<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Holomatos</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; width:100%; overflow:hidden;
    background:#0a0a0c; color:#ebebf0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action:manipulation; user-select:none;
  }
  #app {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100vh; width:100vw; padding:20px; gap:16px;
  }
  .preview {
    width:100%; max-width:640px; aspect-ratio:4/3; border-radius:14px;
    background:#141416; border:1.5px solid #2a2a30; overflow:hidden; position:relative;
  }
  .preview video {
    width:100%; height:100%; object-fit:cover; display:block; background:#000;
  }
  .preview .label {
    position:absolute; top:10px; left:10px;
    background:rgba(0,0,0,0.6); color:#eba53c;
    padding:4px 10px; border-radius:6px; font-size:11px; font-weight:600;
  }
  .btn {
    padding:14px 28px; border-radius:12px; border:none;
    background:linear-gradient(180deg,#eba53c,#c7852a); color:#0a0a0c;
    font-size:14px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .btn:active { transform:scale(0.96); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .status {
    font-size:13px; color:#6b6b76; text-align:center; max-width:500px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="preview" id="preview">
    <video id="camera" autoplay playsinline muted></video>
    <div class="label" id="statusLabel">Initializing...</div>
    <div id="playOverlay" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);color:#eba53c;font-size:18px;font-weight:700;cursor:pointer;z-index:10;">
      Tap to start video
    </div>
  </div>

  <button class="btn" id="micBtn" style="display:none;">
    <span>🎤</span> Hold to Talk
  </button>

  <div class="status" id="status">
    Holomatos Remote
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const isHost = params.has('broadcast');
  const hostPeerId = params.get('id') || 'holomatos-host';

  const camera = document.getElementById('camera');
  const micBtn = document.getElementById('micBtn');
  const statusEl = document.getElementById('status');
  const statusLabel = document.getElementById('statusLabel');

  let peer = null;
  let localStream = null;
  let audioContext = null;
  let dataChannel = null;
  let pc = null;
  let micStream = null;
  let scriptProcessor = null;

  function log(msg) {
    console.log('[Holomatos]', msg);
    statusLabel.textContent = msg;
  }

  function playAudioChunk(int16Array) {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    const float32 = new Float32Array(int16Array.length);
    for (let i = 0; i < int16Array.length; i++) {
      float32[i] = int16Array[i] / 0x8000;
    }
    const buffer = audioContext.createBuffer(1, float32.length, 16000);
    buffer.getChannelData(0).set(float32);
    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.start();
  }

  function setupMediaPC() {
    if (pc) {
      try { pc.close(); } catch (e) {}
      pc = null;
    }

    pc = new RTCPeerConnection({
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
      ]
    });

    if (isHost && localStream) {
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    } else if (!isHost) {
      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.addTransceiver('audio', { direction: 'recvonly' });
    }

    pc.ontrack = (event) => {
      console.log('ontrack:', event.track.kind, event.streams.length);
      if (event.track.kind === 'video' && event.streams[0]) {
        log('Receiving camera');
        const stream = event.streams[0];
        camera.srcObject = stream;
        camera.muted = true;
        camera.style.display = 'block';
        camera.style.opacity = '1';
        const playOverlay = document.getElementById('playOverlay');
        if (playOverlay) playOverlay.style.display = 'none';
        camera.onloadedmetadata = () => {
          console.log('Phone video loadedmetadata, readyState:', camera.readyState, 'paused:', camera.paused);
          camera.play().then(() => {
            console.log('Phone video playing');
            statusEl.textContent = 'Connected. Hold mic to talk.';
            if (playOverlay) playOverlay.style.display = 'none';
          }).catch(e => console.error('Phone play failed:', e));
        };
        camera.onplaying = () => {
          console.log('Phone video onplaying');
          statusEl.textContent = 'Connected. Hold mic to talk.';
          if (playOverlay) playOverlay.style.display = 'none';
        };
        camera.onerror = (e) => {
          console.error('Phone video error:', e);
        };
        if (camera.readyState >= 2) {
          camera.play().catch(e => console.error('Phone immediate play failed:', e));
        }
      }
      if (event.track.kind === 'audio' && event.streams[0]) {
        const audio = new Audio();
        audio.srcObject = event.streams[0];
        audio.play();
      }
    };

    pc.onicecandidate = (event) => {
      if (event.candidate && dataChannel && dataChannel.readyState === 'open') {
        dataChannel.send(JSON.stringify({ type: 'ice-candidate', candidate: event.candidate }));
      }
    };

    pc.oniceconnectionstatechange = () => {
      console.log('ICE:', pc.iceConnectionState);
    };
  }

  async function handleSignaling(msg, channel) {
    if (!pc) {
      console.warn('Host got signaling but mediaPc is null');
      return;
    }
    const sendChannel = channel;
    try {
      const data = typeof msg === 'string' ? JSON.parse(msg) : msg;
      if (data.type === 'offer') {
        console.log('Host got offer, setting remote');
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        console.log('Host creating answer');
        const answer = await pc.createAnswer();
        console.log('Host setting local answer');
        await pc.setLocalDescription(answer);
        console.log('Host sending answer');
        const channelReady = sendChannel && sendChannel.open === true;
        console.log('Host dataChannel ready:', channelReady, 'open:', sendChannel && sendChannel.open);
        if (channelReady) {
          sendChannel.send(JSON.stringify({ type: 'answer', sdp: answer }));
          statusEl.textContent = 'Sent answer, waiting for video...';
        } else {
          console.warn('Host cannot send answer: dataChannel not open');
        }
      } else if (data.type === 'answer') {
        console.log('Host got answer');
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      } else if (data.type === 'ice-candidate') {
        console.log('Host got ICE candidate');
        try {
          await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) {}
      }
    } catch (e) {
      console.error('Host signaling error:', e);
    }
  }

  async function startHost() {
    try {
      log('Requesting camera/mic...');
      statusEl.textContent = 'Please allow camera and microphone.';

      localStream = await navigator.mediaDevices.getUserMedia({
        video: { width:{ideal:1280}, height:{ideal:720}, facingMode:"user" },
        audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true }
      });

      camera.srcObject = localStream;
      await camera.play();
      log('Camera active. Starting broadcast...');

      peer = new Peer(hostPeerId, {
        host: '0.peerjs.com',
        port: 443,
        path: '/',
        secure: true,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
          ]
        }
      });

      peer.on('open', (id) => {
        log('Broadcast ID: ' + id);
        statusEl.textContent = 'Phone URL: ' + window.location.origin + window.location.pathname + '?host=' + id;
      });

      peer.on('connection', (conn) => {
        log('Phone connected');
        statusEl.textContent = 'Phone connected. Streaming...';
        const channel = conn;
        channel.binaryType = 'arraybuffer';

        channel.on('data', (data) => {
          if (typeof data === 'string') {
            handleSignaling(data, channel);
            return;
          }
          if (data instanceof ArrayBuffer) {
            const int16 = new Int16Array(data);
            playAudioChunk(int16);
          }
        });

        channel.on('close', () => {
          log('Phone disconnected');
        });

        setupMediaPC();
      });

      peer.on('error', (err) => {
        console.error('Peer error:', err);
        log('Error: ' + err.type);
        statusEl.textContent = 'Error: ' + err.type;
      });

    } catch (e) {
      console.error('Start error:', e);
      log('Error: ' + e.message);
      statusEl.textContent = 'Error: ' + e.message;
    }
  }

  async function startPhone() {
    const targetHost = params.get('host') || 'holomatos-host';
    
    try {
      log('Connecting to broadcast...');
      statusEl.textContent = 'Connecting to ' + targetHost + '...';

      peer = new Peer(null, {
        host: '0.peerjs.com',
        port: 443,
        path: '/',
        secure: true,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
          ]
        }
      });

      peer.on('open', (id) => {
        log('Phone ready. Connecting to ' + targetHost + '...');
        
        const conn = peer.connect(targetHost, { reliable: false });
        
        conn.on('open', () => {
          log('Connected to broadcast');
          statusEl.textContent = 'Connected. Starting video...';
          dataChannel = conn;
          dataChannel.binaryType = 'arraybuffer';

          dataChannel.on('data', (data) => {
            if (typeof data === 'string') {
              handleSignaling(data);
              return;
            }
            if (data instanceof ArrayBuffer) {
              const int16 = new Int16Array(data);
              playAudioChunk(int16);
            }
          });

          dataChannel.on('close', () => {
            log('Disconnected');
            dataChannel = null;
            statusEl.textContent = 'Disconnected. Refresh to reconnect.';
          });

          setupMediaPC();
          
          setTimeout(async () => {
            if (pc && pc.signalingState === 'stable') {
              console.log('Creating offer');
              try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                dataChannel.send(JSON.stringify({ type: 'offer', sdp: offer }));
                statusEl.textContent = 'Sent offer, waiting for video...';
              } catch (e) {
                console.error('Offer failed:', e);
              }
            }
          }, 1000);
        });

        conn.on('error', (err) => {
          console.error('Connection error:', err);
          statusEl.textContent = 'Connection error. Retrying...';
          setTimeout(() => peer.connect(targetHost, { reliable: false }), 3000);
        });

        conn.on('close', () => {
          log('Disconnected');
          dataChannel = null;
          statusEl.textContent = 'Disconnected. Refresh to reconnect.';
        });
      });

      peer.on('error', (err) => {
        console.error('Peer error:', err);
        if (err.type === 'peer-unavailable') {
          log('Broadcast not found. Retrying...');
          statusEl.textContent = 'Broadcast not found. Retrying in 3s...';
          setTimeout(startPhone, 3000);
        } else {
          statusEl.textContent = 'Error: ' + err.type;
        }
      });

    } catch (e) {
      console.error('Start error:', e);
      log('Error: ' + e.message);
    }
  }

  async function startMic() {
    if (!dataChannel || dataChannel.readyState !== 'open') {
      alert('Not connected yet');
      return;
    }

    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          sampleRate: 16000,
          channelCount: 1
        },
        video: false
      });

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioContext.createMediaStreamSource(micStream);
      scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);

      scriptProcessor.onaudioprocess = (e) => {
        if (!dataChannel || dataChannel.readyState !== 'open') return;

        const input = e.inputBuffer.getChannelData(0);
        const int16 = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
          const s = Math.max(-1, Math.min(1, input[i]));
          int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        try {
          dataChannel.send(int16.buffer);
        } catch (err) {
          // Channel closed
        }
      };

      source.connect(scriptProcessor);

      micBtn.style.animation = 'pulse 1.2s infinite';
      statusEl.textContent = 'Talking...';

    } catch (e) {
      alert('Mic access denied: ' + e.message);
    }
  }

  function stopMic() {
    if (micStream) {
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }
    if (audioContext) {
      audioContext.close();
      audioContext = null;
    }
    if (scriptProcessor) {
      scriptProcessor.disconnect();
      scriptProcessor = null;
    }
    micBtn.style.animation = '';
    statusEl.textContent = 'Connected to broadcast';
  }

  const style = document.createElement('style');
  style.textContent = '@keyframes pulse { 0%,100% { box-shadow:0 0 20px rgba(235,165,60,0.4); } 50% { box-shadow:0 0 40px rgba(235,165,60,0.7); } }';
  document.head.appendChild(style);

  micBtn.addEventListener('mousedown', startMic);
  micBtn.addEventListener('mouseup', stopMic);
  micBtn.addEventListener('mouseleave', stopMic);
  micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startMic(); });
  micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopMic(); });

  camera.addEventListener('click', () => {
    console.log('Phone camera clicked');
    if (camera.srcObject && camera.paused) {
      camera.play().catch(() => {});
    }
    const playOverlay = document.getElementById('playOverlay');
    if (playOverlay) playOverlay.style.display = 'none';
  });
  camera.addEventListener('touchstart', () => {
    console.log('Phone camera touched');
    if (camera.srcObject && camera.paused) {
      camera.play().catch(() => {});
    }
    const playOverlay = document.getElementById('playOverlay');
    if (playOverlay) playOverlay.style.display = 'none';
  });

  const playOverlay = document.getElementById('playOverlay');
  if (playOverlay) {
    playOverlay.addEventListener('click', () => {
      console.log('Phone playOverlay clicked');
      if (camera.srcObject) {
        camera.play().catch(() => {});
      }
      playOverlay.style.display = 'none';
    });
    playOverlay.addEventListener('touchstart', () => {
      console.log('Phone playOverlay touched');
      if (camera.srcObject) {
        camera.play().catch(() => {});
      }
      playOverlay.style.display = 'none';
    });
  }

  if (isHost) {
    micBtn.style.display = 'none';
    startHost();
  } else {
    micBtn.style.display = 'flex';
    startPhone();
  }
})();
</script>
</body>
</html>
