<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Nav</title>

  <!-- A-Frame + AR.js GPS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <script src="https://raw.githack.com/nicktindall/cyclon.p2p/master/lib/browser/UDPCommLayer.js"></script>
  <!-- AR.js Location-Based -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne+Mono&family=Syne:wght@400;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --neon: #00ffe7;
      --neon2: #ff2d78;
      --dark: #080c14;
      --glass: rgba(8, 12, 20, 0.75);
    }

    body {
      background: var(--dark);
      font-family: 'Syne', sans-serif;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ── SETUP SCREEN ───────────────────────────────────────────── */
    #setup-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--dark);
      gap: 1.5rem;
    }

    #setup-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 80%, rgba(0,255,231,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 80% 20%, rgba(255,45,120,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      text-align: center;
    }

    .logo span { color: var(--neon); }

    .tagline {
      font-family: 'Syne Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon), transparent);
      opacity: 0.3;
    }

    .section-label {
      font-family: 'Syne Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--neon);
      text-transform: uppercase;
      align-self: flex-start;
    }

    .pin-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .pin-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .pin-row input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(0,255,231,0.2);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      color: #fff;
      font-family: 'Syne Mono', monospace;
      font-size: 0.75rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .pin-row input:focus { border-color: var(--neon); }
    .pin-row input::placeholder { color: rgba(255,255,255,0.2); }

    .remove-btn {
      background: none;
      border: 1px solid rgba(255,45,120,0.3);
      color: var(--neon2);
      border-radius: 6px;
      width: 32px; height: 32px;
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .remove-btn:hover { background: rgba(255,45,120,0.1); }

    .add-btn {
      align-self: flex-start;
      background: none;
      border: 1px dashed rgba(0,255,231,0.3);
      color: var(--neon);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-family: 'Syne Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-btn:hover { background: rgba(0,255,231,0.07); }

    .use-location-btn {
      width: 100%;
      background: rgba(0,255,231,0.07);
      border: 1px solid rgba(0,255,231,0.3);
      color: var(--neon);
      border-radius: 10px;
      padding: 0.65rem;
      font-family: 'Syne Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s;
    }

    .use-location-btn:hover { background: rgba(0,255,231,0.14); }

    .launch-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--neon) 0%, #00b8a0 100%);
      border: none;
      border-radius: 12px;
      padding: 1rem;
      color: var(--dark);
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .launch-btn:active { transform: scale(0.98); }

    /* ── AR SCENE ────────────────────────────────────────────────── */
    #ar-wrapper {
      display: none;
      position: fixed;
      inset: 0;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    /* ── HUD OVERLAY ─────────────────────────────────────────────── */
    #hud {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }

    #hud-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 1rem;
      background: linear-gradient(to bottom, rgba(8,12,20,0.85), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #hud-title {
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.5px;
    }

    #hud-title span { color: var(--neon); }

    #coords-pill {
      font-family: 'Syne Mono', monospace;
      font-size: 0.6rem;
      background: var(--glass);
      border: 1px solid rgba(0,255,231,0.2);
      border-radius: 20px;
      padding: 0.3rem 0.7rem;
      color: rgba(255,255,255,0.5);
      backdrop-filter: blur(8px);
    }

    #hud-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 1rem;
      background: linear-gradient(to top, rgba(8,12,20,0.9), transparent);
      pointer-events: all;
    }

    #pin-legend {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.75rem;
    }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-dist {
      font-family: 'Syne Mono', monospace;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.4);
      margin-left: auto;
    }

    .back-btn {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 0.7rem;
      color: rgba(255,255,255,0.6);
      font-family: 'Syne', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* ── STATUS ──────────────────────────────────────────────────── */
    #status-bar {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--glass);
      border: 1px solid rgba(0,255,231,0.3);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      font-family: 'Syne Mono', monospace;
      font-size: 0.75rem;
      color: var(--neon);
      z-index: 200;
      backdrop-filter: blur(12px);
      display: none;
      text-align: center;
    }

    /* scanning pulse on the crosshair */
    #crosshair {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 40px; height: 40px;
      border: 2px solid var(--neon);
      border-radius: 50%;
      opacity: 0.4;
      pointer-events: none;
      z-index: 51;
      animation: pulse 2s ease-in-out infinite;
      display: none;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.4; }
      50% { transform: translate(-50%,-50%) scale(1.4); opacity: 0.15; }
    }
  </style>
</head>
<body>

<!-- ── SETUP SCREEN ────────────────────────────────────────────── -->
<div id="setup-screen">
  <div class="logo">AR<span>NAV</span></div>
  <div class="tagline">GPS · WebXR · Location Anchors</div>
  <div class="divider"></div>

  <div class="section-label">📍 Drop Pins</div>

  <div class="pin-list" id="pin-list">
    <!-- pins injected by JS -->
  </div>

  <button class="add-btn" onclick="addPin()">+ Add Another Pin</button>

  <div class="divider"></div>

  <button class="use-location-btn" onclick="addCurrentLocation()">
    ◎ &nbsp;Add My Current Location as Pin
  </button>

  <button class="launch-btn" onclick="launchAR()">
    Launch AR &nbsp;→
  </button>
</div>

<!-- ── STATUS TOAST ────────────────────────────────────────────── -->
<div id="status-bar">Acquiring GPS…</div>

<!-- ── AR SCENE ────────────────────────────────────────────────── -->
<div id="ar-wrapper">
  <a-scene
    id="ar-scene"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true;"
    renderer="logarithmicDepthBuffer: true;"
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
  >
    <a-camera gps-camera rotation-reader></a-camera>
  </a-scene>
</div>

<!-- ── HUD ─────────────────────────────────────────────────────── -->
<div id="hud">
  <div id="hud-top">
    <div id="hud-title">AR<span>NAV</span></div>
    <div id="coords-pill" id="coords">---, ---</div>
  </div>

  <div id="crosshair"></div>

  <div id="hud-bottom">
    <div id="pin-legend"></div>
    <button class="back-btn" onclick="goBack()">← Back to Setup</button>
  </div>
</div>

<script>
  // ── PIN COLORS ──────────────────────────────────────────────────
  const COLORS = ['#00ffe7','#ff2d78','#ffe600','#a78bfa','#34d399','#fb923c'];
  const PIN_HEIGHTS = [0, 3, 6, 9, 12, 15]; // stagger heights so pins don't overlap

  let pins = [];
  let userLat = null, userLng = null;
  let watchId = null;

  // ── SETUP UI ────────────────────────────────────────────────────
  function addPin(lat = '', lng = '', label = '') {
    const id = Date.now();
    pins.push({ id, lat, lng, label });
    renderPinList();
  }

  function removePin(id) {
    pins = pins.filter(p => p.id !== id);
    renderPinList();
  }

  function renderPinList() {
    const list = document.getElementById('pin-list');
    list.innerHTML = '';

    if (pins.length === 0) {
      addPin(); // always start with one row
      return;
    }

    pins.forEach((pin, i) => {
      const color = COLORS[i % COLORS.length];
      const row = document.createElement('div');
      row.className = 'pin-row';
      row.innerHTML = `
        <div style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0;"></div>
        <input type="text" placeholder="Label (e.g. Coffee Shop)"
          value="${pin.label}"
          onchange="updatePin(${pin.id}, 'label', this.value)"
          style="flex:1.2"
        />
        <input type="number" placeholder="Lat" step="any"
          value="${pin.lat}"
          onchange="updatePin(${pin.id}, 'lat', this.value)"
        />
        <input type="number" placeholder="Lng" step="any"
          value="${pin.lng}"
          onchange="updatePin(${pin.id}, 'lng', this.value)"
        />
        <button class="remove-btn" onclick="removePin(${pin.id})">×</button>
      `;
      list.appendChild(row);
    });
  }

  function updatePin(id, field, value) {
    const pin = pins.find(p => p.id === id);
    if (pin) pin[field] = value;
  }

  // ── USE CURRENT LOCATION ─────────────────────────────────────────
  function addCurrentLocation() {
    showStatus('Getting your location…');
    navigator.geolocation.getCurrentPosition(pos => {
      hideStatus();
      addPin(
        pos.coords.latitude.toFixed(6),
        pos.coords.longitude.toFixed(6),
        'You Are Here'
      );
    }, err => {
      hideStatus();
      showStatus('Location denied. Enable GPS & retry.', 3000);
    }, { enableHighAccuracy: true });
  }

  // ── LAUNCH AR ────────────────────────────────────────────────────
  function launchAR() {
    const valid = pins.filter(p => p.lat && p.lng);
    if (valid.length === 0) {
      showStatus('Add at least one pin with coordinates!', 2500);
      return;
    }

    showStatus('Acquiring GPS…');

    navigator.geolocation.getCurrentPosition(pos => {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;

      buildARScene(valid);
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('ar-wrapper').style.display = 'block';
      document.getElementById('hud').style.display = 'block';
      document.getElementById('crosshair').style.display = 'block';

      hideStatus();
      startLocationWatch();
    }, err => {
      hideStatus();
      showStatus('GPS access denied. Please allow location.', 3000);
    }, { enableHighAccuracy: true, timeout: 10000 });
  }

  // ── BUILD SCENE ──────────────────────────────────────────────────
  function buildARScene(validPins) {
    const scene = document.getElementById('ar-scene');

    // Remove old entities (except camera)
    scene.querySelectorAll('[gps-entity-place]').forEach(e => e.remove());

    const legend = document.getElementById('pin-legend');
    legend.innerHTML = '';

    validPins.forEach((pin, i) => {
      const color = COLORS[i % COLORS.length];
      const height = PIN_HEIGHTS[i % PIN_HEIGHTS.length];
      const label = pin.label || `Pin ${i + 1}`;

      // Pillar
      const pillar = document.createElement('a-cylinder');
      pillar.setAttribute('gps-entity-place', `latitude: ${pin.lat}; longitude: ${pin.lng}`);
      pillar.setAttribute('color', color);
      pillar.setAttribute('radius', '0.6');
      pillar.setAttribute('height', `${3 + height}`);
      pillar.setAttribute('position', `0 ${(3 + height) / 2} 0`);
      pillar.setAttribute('opacity', '0.85');
      scene.appendChild(pillar);

      // Floating sphere on top
      const sphere = document.createElement('a-sphere');
      sphere.setAttribute('gps-entity-place', `latitude: ${pin.lat}; longitude: ${pin.lng}`);
      sphere.setAttribute('color', color);
      sphere.setAttribute('radius', '1.2');
      sphere.setAttribute('position', `0 ${3 + height + 1.2} 0`);
      sphere.setAttribute('opacity', '0.95');
      sphere.setAttribute('animation', 'property: position; to: 0 ' + (3 + height + 2.4) + ' 0; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true');
      scene.appendChild(sphere);

      // Text label
      const text = document.createElement('a-text');
      text.setAttribute('gps-entity-place', `latitude: ${pin.lat}; longitude: ${pin.lng}`);
      text.setAttribute('value', label);
      text.setAttribute('color', color);
      text.setAttribute('align', 'center');
      text.setAttribute('width', '20');
      text.setAttribute('position', `0 ${3 + height + 4} 0`);
      scene.appendChild(text);

      // HUD legend
      const dist = getDistanceMeters(userLat, userLng, parseFloat(pin.lat), parseFloat(pin.lng));
      const distLabel = dist > 1000 ? `${(dist / 1000).toFixed(1)} km` : `${Math.round(dist)} m`;
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `
        <div class="legend-dot" style="background:${color}"></div>
        <span>${label}</span>
        <span class="legend-dist">${distLabel}</span>
      `;
      legend.appendChild(item);
    });
  }

  // ── LIVE LOCATION WATCH ──────────────────────────────────────────
  function startLocationWatch() {
    if (watchId) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(pos => {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      const coordPill = document.getElementById('coords-pill');
      if (coordPill) {
        coordPill.textContent = `${userLat.toFixed(4)}, ${userLng.toFixed(4)}`;
      }
    }, null, { enableHighAccuracy: true });
  }

  // ── BACK TO SETUP ────────────────────────────────────────────────
  function goBack() {
    if (watchId) navigator.geolocation.clearWatch(watchId);
    document.getElementById('setup-screen').style.display = 'flex';
    document.getElementById('ar-wrapper').style.display = 'none';
    document.getElementById('hud').style.display = 'none';
    document.getElementById('crosshair').style.display = 'none';
    // Reset scene
    const scene = document.getElementById('ar-scene');
    scene.querySelectorAll('[gps-entity-place]').forEach(e => e.remove());
  }

  // ── UTILS ────────────────────────────────────────────────────────
  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 +
              Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
              Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function showStatus(msg, autoDismiss = 0) {
    const bar = document.getElementById('status-bar');
    bar.textContent = msg;
    bar.style.display = 'block';
    if (autoDismiss) setTimeout(hideStatus, autoDismiss);
  }

  function hideStatus() {
    document.getElementById('status-bar').style.display = 'none';
  }

  // ── INIT ─────────────────────────────────────────────────────────
  addPin(); // start with one empty pin row
</script>
</body>
</html>
