<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Cube Grab - Moto G Stylus</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
        }
        #container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        #ar-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #hand-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }
        #hand-canvas {
            display: none;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 13px;
            border: 2px solid #00ff00;
            z-index: 100;
            max-width: 250px;
            backdrop-filter: blur(5px);
        }
        #start-button {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0, 212, 255, 0.4);
            z-index: 100;
            transition: all 0.3s;
        }
        #start-button:hover {
            transform: translateX(-50%) scale(1.05);
        }
        #start-button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .status {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #00ff00;
            font-size: 11px;
            opacity: 0.9;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 1000;
            display: none;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">Loading hand tracker...</div>
        
        <div id="info">
            <div><strong>📱 Moto G AR Cube</strong></div>
            <div class="status">
                You'll see your room + hand<br>
                📱 Tap to place cube<br>
                ✋ Move hand near cube to grab
            </div>
            <div style="font-size: 10px; margin-top: 8px; opacity: 0.7; border-top: 1px solid #00ff0044; padding-top: 8px;">
                <strong>Black screen?</strong><br>
                • Install ARCore from Play Store<br>
                • Use Chrome browser<br>
                • Allow camera access
            </div>
        </div>
        
        <video id="hand-video" autoplay playsinline></video>
        <canvas id="hand-canvas"></canvas>
        
        <button id="start-button">Start AR Experience</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/handtrackjs@0.0.13/dist/handtrack.min.js"></script>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

        class MotoGARCubeGrab {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.xrSession = null;
                this.xrRefSpace = null;
                this.hitTestSource = null;
                this.cubes = [];
                this.handModel = null;
                this.handVideo = null;
                this.handCanvas = null;
                this.handCtx = null;
                this.handDetected = false;
                this.handPosition = null;
                this.handSize = null;
                this.grabbedCube = null;
                this.isTracking = false;
                
                this.init();
            }

            async init() {
                // Scene setup
                this.scene = new THREE.Scene();
                
                // Camera
                this.camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
                
                // Renderer
                this.renderer = new THREE.WebGLRenderer({ 
                    antialias: true, 
                    alpha: true 
                });
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.xr.enabled = true;
                this.renderer.domElement.id = 'ar-canvas';
                document.getElementById('container').appendChild(this.renderer.domElement);
                
                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
                this.scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
                directionalLight.position.set(1, 2, 3);
                this.scene.add(directionalLight);
                
                this.cameraLight = new THREE.PointLight(0xffffff, 1, 10);
                this.camera.add(this.cameraLight);
                this.scene.add(this.camera);
                
                // Reticle
                this.reticle = this.createReticle();
                this.reticle.visible = false;
                this.scene.add(this.reticle);
                
                // Hand tracking setup
                this.handVideo = document.getElementById('hand-video');
                this.handCanvas = document.getElementById('hand-canvas');
                this.handCtx = this.handCanvas.getContext('2d');
                
                // Window resize
                window.addEventListener('resize', () => this.onWindowResize());
                
                // Setup button
                this.setupButton();
                
                // Load hand tracking model
                await this.loadHandTracking();
            }

            async loadHandTracking() {
                document.getElementById('loading').style.display = 'block';
                
                const modelParams = {
                    flipHorizontal: true,
                    maxNumBoxes: 1,
                    iouThreshold: 0.5,
                    scoreThreshold: 0.6,
                };
                
                try {
                    this.handModel = await handTrack.load(modelParams);
                    console.log('Hand tracking model loaded');
                    document.getElementById('loading').style.display = 'none';
                } catch (error) {
                    console.error('Failed to load hand tracking:', error);
                    document.getElementById('loading').innerHTML = 'Failed to load hand tracker';
                }
            }

            async startHandTracking() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: 'user',
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        } 
                    });
                    
                    this.handVideo.srcObject = stream;
                    this.handCanvas.width = 160;
                    this.handCanvas.height = 120;
                    
                    await this.handVideo.play();
                    this.isTracking = true;
                    this.detectHands();
                    
                } catch (error) {
                    console.error('Failed to start camera:', error);
                    alert('Cannot access camera for hand tracking');
                }
            }

            detectHands() {
                if (!this.isTracking || !this.handModel) return;
                
                this.handModel.detect(this.handVideo).then(predictions => {
                    // Clear canvas
                    this.handCtx.clearRect(0, 0, this.handCanvas.width, this.handCanvas.height);
                    
                    if (predictions.length > 0) {
                        const hand = predictions[0];
                        this.handDetected = true;
                        
                        // Draw bounding box
                        this.handCtx.strokeStyle = '#00ff00';
                        this.handCtx.lineWidth = 2;
                        this.handCtx.strokeRect(
                            hand.bbox[0] * (160/640),
                            hand.bbox[1] * (120/480),
                            hand.bbox[2] * (160/640),
                            hand.bbox[3] * (120/480)
                        );
                        
                        // Calculate hand center in normalized coordinates
                        const centerX = (hand.bbox[0] + hand.bbox[2] / 2) / 640;
                        const centerY = (hand.bbox[1] + hand.bbox[3] / 2) / 480;
                        
                        // Hand width (used for sizing)
                        const handWidth = hand.bbox[2] / 640;
                        
                        this.handPosition = { x: centerX, y: centerY };
                        this.handSize = handWidth;
                        
                        // Draw center point
                        this.handCtx.fillStyle = '#00ffff';
                        this.handCtx.beginPath();
                        this.handCtx.arc(
                            centerX * 160,
                            centerY * 120,
                            5, 0, Math.PI * 2
                        );
                        this.handCtx.fill();
                        
                    } else {
                        this.handDetected = false;
                    }
                    
                    // Continue detection
                    requestAnimationFrame(() => this.detectHands());
                });
            }

            createReticle() {
                const geometry = new THREE.RingGeometry(0.08, 0.1, 32);
                const material = new THREE.MeshBasicMaterial({ 
                    color: 0x00ff00,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.7
                });
                const reticle = new THREE.Mesh(geometry, material);
                reticle.rotateX(-Math.PI / 2);
                return reticle;
            }

            createCube(position) {
                const geometry = new THREE.BoxGeometry(0.15, 0.15, 0.15);
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0x00d4ff,
                    emissive: 0x0066ff,
                    emissiveIntensity: 0.5,
                    metalness: 0.7,
                    roughness: 0.2,
                    transparent: true,
                    opacity: 0.8
                });
                const cube = new THREE.Mesh(geometry, material);
                
                // Inner core
                const coreGeometry = new THREE.BoxGeometry(0.08, 0.08, 0.08);
                const coreMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.9
                });
                const core = new THREE.Mesh(coreGeometry, coreMaterial);
                cube.add(core);
                
                // Outer glow
                const glowGeometry = new THREE.BoxGeometry(0.18, 0.18, 0.18);
                const glowMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0x00d4ff,
                    transparent: true,
                    opacity: 0.3,
                    side: THREE.BackSide
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                cube.add(glow);
                
                cube.position.copy(position);
                cube.position.y += 0.2;
                
                cube.userData.initialY = cube.position.y;
                cube.userData.time = 0;
                cube.userData.rotationSpeed = Math.random() * 2 + 1;
                cube.userData.targetScale = 1.0;
                cube.userData.currentScale = 1.0;
                cube.scale.set(1, 1, 1);
                
                this.scene.add(cube);
                this.cubes.push(cube);
                return cube;
            }

            setupButton() {
                const button = document.getElementById('start-button');
                
                if (!navigator.xr) {
                    button.textContent = 'WebXR Not Supported';
                    button.disabled = true;
                    return;
                }
                
                navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                    if (supported) {
                        button.addEventListener('click', () => this.startXR());
                    } else {
                        button.textContent = 'AR Not Supported';
                        button.disabled = true;
                    }
                });
            }

            async startXR() {
                try {
                    // Check if AR is really supported
                    const supported = await navigator.xr.isSessionSupported('immersive-ar');
                    if (!supported) {
                        alert('AR not supported on this device. Make sure:\n1. Chrome browser is updated\n2. ARCore is installed\n3. Camera permissions are granted');
                        return;
                    }
                    
                    this.xrSession = await navigator.xr.requestSession('immersive-ar', {
                        requiredFeatures: ['hit-test'],
                        optionalFeatures: ['dom-overlay', 'camera-access'],
                        domOverlay: { root: document.getElementById('container') }
                    });
                    
                    await this.onSessionStarted();
                } catch (error) {
                    console.error('Failed to start XR:', error);
                    let errorMsg = 'Failed to start AR. ';
                    
                    if (error.name === 'NotAllowedError') {
                        errorMsg += 'Please allow camera access and try again.';
                    } else if (error.name === 'NotSupportedError') {
                        errorMsg += 'AR not supported. Install Google ARCore from Play Store.';
                    } else {
                        errorMsg += 'Make sure Chrome is updated and ARCore is installed.';
                    }
                    
                    alert(errorMsg);
                    
                    // Show helpful info
                    document.querySelector('#info .status').innerHTML = 
                        '❌ AR Failed<br>' +
                        '1. Install ARCore<br>' +
                        '2. Update Chrome<br>' +
                        '3. Allow camera';
                }
            }

            async onSessionStarted() {
                this.xrSession.addEventListener('end', () => this.onSessionEnded());
                
                await this.renderer.xr.setSession(this.xrSession);
                
                this.xrRefSpace = await this.xrSession.requestReferenceSpace('local');
                
                const viewerSpace = await this.xrSession.requestReferenceSpace('viewer');
                this.hitTestSource = await this.xrSession.requestHitTestSource({ space: viewerSpace });
                
                this.xrSession.addEventListener('select', (event) => this.onSelect(event));
                
                document.getElementById('start-button').style.display = 'none';
                
                // Show initial instructions
                document.querySelector('#info .status').innerHTML = 
                    '✅ AR Starting...<br>👁️ You should see your room<br>🔄 Loading camera...';
                
                // Start hand tracking
                await this.startHandTracking();
                
                // Update status after camera loads
                setTimeout(() => {
                    document.querySelector('#info .status').innerHTML = 
                        '✅ AR Active<br>🎥 Hand tracking ON<br>📱 Tap to place cube';
                }, 2000);
                
                this.renderer.setAnimationLoop((time, frame) => this.render(time, frame));
            }

            onSessionEnded() {
                this.hitTestSource = null;
                this.xrSession = null;
                this.isTracking = false;
                
                if (this.handVideo.srcObject) {
                    this.handVideo.srcObject.getTracks().forEach(track => track.stop());
                }
                
                document.getElementById('start-button').style.display = 'block';
            }

            onSelect(event) {
                if (this.reticle.visible) {
                    this.createCube(this.reticle.position);
                }
            }

            get3DHandPosition() {
                if (!this.handPosition || !this.camera) return null;
                
                // Convert 2D hand position to 3D world space
                // Hand is in front of camera
                const handX = (this.handPosition.x - 0.5) * 2; // -1 to 1
                const handY = -(this.handPosition.y - 0.5) * 2; // -1 to 1 (inverted)
                
                // Project from camera
                const distance = 0.5; // 50cm from camera
                const worldPos = new THREE.Vector3(handX * 0.3, handY * 0.3, -distance);
                worldPos.applyMatrix4(this.camera.matrixWorld);
                
                return worldPos;
            }

            handleGrabbing() {
                if (!this.handDetected || !this.handPosition) {
                    // Release cube if hand lost
                    if (this.grabbedCube) {
                        this.grabbedCube.userData.targetScale = 1.0;
                        this.grabbedCube.material.emissiveIntensity = 0.5;
                        this.grabbedCube.material.color.setHex(0x00d4ff);
                        this.grabbedCube.children[0].material.opacity = 0.9;
                        this.grabbedCube.children[1].material.opacity = 0.3;
                        this.grabbedCube.userData.initialY = this.grabbedCube.position.y;
                        this.grabbedCube = null;
                    }
                    return;
                }
                
                const handWorld = this.get3DHandPosition();
                if (!handWorld) return;
                
                const grabRadius = 0.15;
                
                if (!this.grabbedCube) {
                    // Check grab
                    for (const cube of this.cubes) {
                        const distance = handWorld.distanceTo(cube.position);
                        
                        // Show grab zone when hand is nearby
                        if (distance < grabRadius * 1.5) {
                            if (!cube.userData.grabZone) {
                                const zoneGeometry = new THREE.SphereGeometry(grabRadius, 16, 16);
                                const zoneMaterial = new THREE.MeshBasicMaterial({
                                    color: 0x00ff00,
                                    transparent: true,
                                    opacity: 0.2,
                                    wireframe: true
                                });
                                cube.userData.grabZone = new THREE.Mesh(zoneGeometry, zoneMaterial);
                                cube.add(cube.userData.grabZone);
                            }
                            cube.userData.grabZone.visible = true;
                            
                            // Pulse the grab zone
                            const time = Date.now() / 1000;
                            const scale = 1 + Math.sin(time * 6) * 0.1;
                            cube.userData.grabZone.scale.set(scale, scale, scale);
                        } else if (cube.userData.grabZone) {
                            cube.userData.grabZone.visible = false;
                        }
                        
                        if (distance < grabRadius) {
                            // Grab!
                            this.grabbedCube = cube;
                            cube.material.emissiveIntensity = 1.0;
                            cube.material.color.setHex(0x00ff88);
                            cube.children[0].material.opacity = 1.0;
                            cube.children[1].material.opacity = 0.5;
                            
                            // Hide grab zone
                            if (cube.userData.grabZone) {
                                cube.userData.grabZone.visible = false;
                            }
                            
                            // Scale based on hand size
                            if (this.handSize) {
                                const targetSize = this.handSize * 0.5; // Smaller for better fit
                                cube.userData.targetScale = Math.max(0.3, Math.min(1.0, targetSize / 0.15));
                            }
                            
                            this.createEnergyRing(cube);
                            break;
                        }
                    }
                } else {
                    // Update position
                    this.grabbedCube.position.copy(handWorld);
                    
                    // Update scale based on hand size
                    if (this.handSize) {
                        const targetSize = this.handSize * 0.5;
                        this.grabbedCube.userData.targetScale = Math.max(0.3, Math.min(1.0, targetSize / 0.15));
                    }
                }
            }

            createEnergyRing(cube) {
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        const ringGeometry = new THREE.RingGeometry(0.05, 0.08, 32);
                        const ringMaterial = new THREE.MeshBasicMaterial({ 
                            color: 0x00ffff,
                            transparent: true,
                            opacity: 0.8,
                            side: THREE.DoubleSide
                        });
                        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                        ring.position.copy(cube.position);
                        ring.userData.startTime = Date.now();
                        ring.userData.duration = 1000;
                        this.scene.add(ring);
                        
                        const animateRing = () => {
                            const elapsed = Date.now() - ring.userData.startTime;
                            const progress = elapsed / ring.userData.duration;
                            
                            if (progress < 1) {
                                const scale = 1 + progress * 3;
                                ring.scale.set(scale, scale, 1);
                                ring.material.opacity = 0.8 * (1 - progress);
                                requestAnimationFrame(animateRing);
                            } else {
                                this.scene.remove(ring);
                                ring.geometry.dispose();
                                ring.material.dispose();
                            }
                        };
                        animateRing();
                    }, i * 150);
                }
            }

            updateCubes(deltaTime) {
                for (const cube of this.cubes) {
                    // Smooth scaling
                    const scaleLerpSpeed = 8.0;
                    cube.userData.currentScale += (cube.userData.targetScale - cube.userData.currentScale) * scaleLerpSpeed * deltaTime;
                    cube.scale.set(cube.userData.currentScale, cube.userData.currentScale, cube.userData.currentScale);
                    
                    if (cube !== this.grabbedCube) {
                        // Float animation
                        cube.userData.time += deltaTime;
                        const floatOffset = Math.sin(cube.userData.time * 2) * 0.03;
                        cube.position.y = cube.userData.initialY + floatOffset;
                        
                        cube.rotation.x += deltaTime * cube.userData.rotationSpeed * 0.5;
                        cube.rotation.y += deltaTime * cube.userData.rotationSpeed;
                        
                        const pulse = 0.7 + Math.sin(cube.userData.time * 3) * 0.2;
                        cube.children[0].material.opacity = pulse;
                        cube.children[1].material.opacity = pulse * 0.4;
                    } else {
                        cube.rotation.y += deltaTime * 4;
                        cube.rotation.x += deltaTime * 2;
                        
                        const time = Date.now() / 1000;
                        const pulse = 0.9 + Math.sin(time * 8) * 0.1;
                        cube.children[0].material.opacity = pulse;
                    }
                }
            }

            render(time, frame) {
                if (!frame) return;
                
                const deltaTime = time / 1000;
                
                // Handle grabbing with hand tracking
                this.handleGrabbing();
                
                // Update cubes
                this.updateCubes(deltaTime);
                
                // Update UI
                if (this.grabbedCube && this.handSize) {
                    const scalePercent = Math.round(this.grabbedCube.userData.currentScale * 100);
                    const handWidthCm = Math.round(this.handSize * 100);
                    document.querySelector('#info .status').innerHTML = 
                        `🟢 <strong>GRABBED!</strong><br>` +
                        `📏 Hand: ${handWidthCm}cm<br>` +
                        `🔽 Cube: ${scalePercent}%`;
                } else if (this.handDetected) {
                    document.querySelector('#info .status').innerHTML = 
                        '✅ AR Active<br>👋 Hand detected!<br>Move near cube to grab';
                } else {
                    document.querySelector('#info .status').innerHTML = 
                        '✅ AR Active<br>Show your hand<br>📱 Tap to place cube';
                }
                
                // Hit testing
                if (this.hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(this.hitTestSource);
                    
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(this.xrRefSpace);
                        
                        this.reticle.visible = true;
                        this.reticle.position.set(
                            pose.transform.position.x,
                            pose.transform.position.y,
                            pose.transform.position.z
                        );
                        
                        const scale = 1 + Math.sin(time / 200) * 0.1;
                        this.reticle.scale.set(scale, scale, scale);
                    } else {
                        this.reticle.visible = false;
                    }
                }
                
                this.renderer.render(this.scene, this.camera);
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // Initialize
        const app = new MotoGARCubeGrab();
    </script>
</body>
</html>
