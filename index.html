<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>HolomatOS // Uplink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg: #060a0d;
    --panel: rgba(10,20,24,.62);
    --line: #1d3a40;
    --cyan: #49e0ea;
    --cyan-dim: #2c8c93;
    --amber: #e8a23f;
    --red: #e85b4f;
    --text: #cdeef1;
    --text-dim: #6f9498;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: radial-gradient(120% 140% at 50% 0%, #0b171c 0%, var(--bg) 55%, #030506 100%);
    color:var(--text);
    font-family:'Share Tech Mono', monospace;
    overflow:hidden;
    overscroll-behavior:none;
  }
  #stage{
    position:fixed; inset:0;
    height:100dvh; width:100vw;
  }

  /* ---------- video layers ---------- */
  video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    background:#000;
  }
  #remoteVideo{ z-index:1; }
  #remoteVideo.hidden{ opacity:0; }
  #localPreview{
    position:absolute; z-index:1;
    object-fit:cover;
    background:#000;
  }

  /* broadcast mode (laptop): split screen — own camera left, phone camera right */
  body.mode-broadcast #localPreview{
    top:0; bottom:0; left:0; right:auto; width:50%; height:100%;
  }
  body.mode-broadcast #remoteVideo{
    top:0; bottom:0; left:50%; right:0; width:50%; height:100%;
  }
  body.mode-broadcast #standby{
    left:50%; right:0; top:0; bottom:0; width:auto;
  }
  body.mode-broadcast #standby p{ padding:0 8%; }

  /* viewer mode (phone): own camera is sent but not previewed locally —
     the incoming laptop feed fills the whole screen */
  body.mode-viewer #localPreview{ display:none; }

  /* vertical divider between the two halves, broadcast mode only */
  #splitDivider{
    position:absolute; z-index:4; top:0; bottom:0; left:50%; width:1px;
    background:linear-gradient(180deg, transparent 0%, var(--cyan-dim) 15%, var(--cyan-dim) 85%, transparent 100%);
    display:none; pointer-events:none;
  }
  body.mode-broadcast #splitDivider{ display:block; }

  /* darken under the HUD chrome */
  #scrim{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    background:linear-gradient(180deg, rgba(3,6,7,.75) 0%, rgba(3,6,7,0) 16%, rgba(3,6,7,0) 78%, rgba(3,6,7,.85) 100%);
  }

  /* ---------- scanline / grid texture ---------- */
  #grain{
    position:absolute; inset:0; z-index:3; pointer-events:none; opacity:.5;
    background-image:
      repeating-linear-gradient(180deg, rgba(73,224,234,.035) 0px, rgba(73,224,234,.035) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:screen;
  }

  /* ---------- corner frame ---------- */
  .corner{
    position:absolute; z-index:6; width:34px; height:34px;
    border-color:var(--cyan-dim); pointer-events:none;
  }
  .corner.tl{ top:calc(14px + var(--safe-t)); left:calc(14px + var(--safe-l)); border-top:2px solid; border-left:2px solid; }
  .corner.tr{ top:calc(14px + var(--safe-t)); right:calc(14px + var(--safe-r)); border-top:2px solid; border-right:2px solid; }
  .corner.bl{ bottom:calc(14px + var(--safe-b)); left:calc(14px + var(--safe-l)); border-bottom:2px solid; border-left:2px solid; }
  .corner.br{ bottom:calc(14px + var(--safe-b)); right:calc(14px + var(--safe-r)); border-bottom:2px solid; border-right:2px solid; }

  /* ---------- top identity tag ---------- */
  #idTag{
    position:absolute; z-index:6;
    top:calc(18px + var(--safe-t)); left:calc(30px + var(--safe-l));
    font-family:'Orbitron', sans-serif; font-weight:700;
    font-size:13px; letter-spacing:.14em; color:var(--cyan);
    text-shadow:0 0 10px rgba(73,224,234,.45);
  }
  #idTag span{
    display:block; margin-top:3px;
    font-family:'Share Tech Mono', monospace; font-weight:400;
    font-size:10px; letter-spacing:.1em; color:var(--text-dim);
  }

  /* ---------- status readout — sits above the mic meter row ---------- */
  #telemetry{
    position:absolute; z-index:6;
    left:calc(30px + var(--safe-l)); right:calc(30px + var(--safe-r));
    bottom:calc(68px + var(--safe-b));
  }
  #statusLine{
    font-family:'Orbitron', sans-serif; font-weight:700;
    font-size:13px; letter-spacing:.1em;
    color:var(--amber);
    display:flex; align-items:center; gap:9px;
  }
  #statusLine .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 8px var(--amber);
    flex:none;
  }
  #statusLine.ok{ color:var(--cyan); }
  #statusLine.ok .dot{ background:var(--cyan); box-shadow:0 0 8px var(--cyan); animation:pulse 2s ease-in-out infinite; }
  #statusLine.bad{ color:var(--red); }
  #statusLine.bad .dot{ background:var(--red); box-shadow:0 0 8px var(--red); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  #statusSub{
    margin-top:5px; font-size:10.5px; letter-spacing:.06em; color:var(--text-dim);
    max-width:70vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* ---------- mic level meters ---------- */
  .meterWrap{
    position:absolute; z-index:6; bottom:calc(18px + var(--safe-b));
    display:flex; flex-direction:column; align-items:center; gap:6px;
    pointer-events:none;
  }
  .meterLabel{
    font-size:9px; letter-spacing:.14em; color:var(--text-dim);
  }
  .meter{ display:flex; align-items:flex-end; gap:3px; height:22px; }
  .meter i{
    display:block; width:4px; border-radius:1px;
    background:var(--line);
    height:20%;
    transition:height .07s linear, background .07s linear;
  }

  /* viewer: single meter, bottom center */
  body.mode-viewer #meterOwn{ left:50%; transform:translateX(-50%); }
  body.mode-viewer #meterRemote{ display:none; }

  /* broadcast: one meter centered under each half */
  body.mode-broadcast #meterOwn{ left:25%; transform:translateX(-50%); }
  body.mode-broadcast #meterRemote{ left:75%; transform:translateX(-50%); }

  #retryBtn{
    position:absolute; z-index:6;
    top:calc(18px + var(--safe-t)); right:calc(30px + var(--safe-r));
    font-family:'Share Tech Mono', monospace; font-size:10.5px; letter-spacing:.08em;
    color:var(--text-dim); background:transparent; border:1px solid var(--line);
    padding:6px 10px; cursor:pointer; border-radius:2px;
  }
  #retryBtn:hover{ color:var(--cyan); border-color:var(--cyan-dim); }
  #retryBtn:focus-visible, button:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

  /* standby placeholder — "awaiting uplink" (viewer) / "awaiting phone feed" (broadcast) */
  #standby{
    position:absolute; inset:0; z-index:1;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    text-align:center; padding:0 12vw;
  }
  #standby .glyph{
    width:64px; height:64px; border:1px solid var(--cyan-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 24px rgba(73,224,234,.15) inset;
    flex:none;
  }
  #standby .glyph::before{
    content:''; width:10px; height:10px; border-radius:50%;
    background:var(--amber); box-shadow:0 0 10px var(--amber);
    animation:pulse 1.6s ease-in-out infinite;
  }
  #standby h1{
    font-family:'Orbitron', sans-serif; font-size:15px; letter-spacing:.12em;
    color:var(--text); margin:8px 0 0; font-weight:700;
  }
  #standby p{
    font-size:11px; letter-spacing:.05em; color:var(--text-dim); margin:0; line-height:1.6;
  }
  #remoteVideo.hidden ~ #standby{ display:flex; }
  #remoteVideo:not(.hidden) ~ #standby{ display:none; }

  @media (prefers-reduced-motion: reduce){
    #statusLine.ok .dot, #standby .glyph::before{ animation:none; }
  }

  /* ---------- tuned for the phone (viewer mode), forced landscape ----------
     Matches the Galaxy A17 either as a narrow portrait fallback or, more
     commonly now, its locked landscape footprint (~892x412 CSS px). */
  @media (max-width: 480px), (orientation: landscape) and (max-height: 520px){
    body.mode-viewer #idTag{
      top:calc(14px + var(--safe-t)); left:calc(18px + var(--safe-l));
      font-size:12px;
    }
    body.mode-viewer #idTag span{ font-size:9px; }
    body.mode-viewer #retryBtn{
      top:calc(14px + var(--safe-t)); right:calc(18px + var(--safe-r));
      font-size:10px; padding:6px 9px;
    }
    body.mode-viewer .corner{ width:24px; height:24px; }
    body.mode-viewer .corner.tl, body.mode-viewer .corner.tr{ top:calc(8px + var(--safe-t)); }
    body.mode-viewer .corner.bl, body.mode-viewer .corner.br{ bottom:calc(8px + var(--safe-b)); }
    body.mode-viewer .corner.tl, body.mode-viewer .corner.bl{ left:calc(8px + var(--safe-l)); }
    body.mode-viewer .corner.tr, body.mode-viewer .corner.br{ right:calc(8px + var(--safe-r)); }
    body.mode-viewer #telemetry{
      left:calc(18px + var(--safe-l)); right:calc(18px + var(--safe-r));
      bottom:calc(58px + var(--safe-b));
    }
    body.mode-viewer #statusLine{ font-size:12px; }
    body.mode-viewer #statusSub{ font-size:10px; }
    body.mode-viewer #meterOwn{ bottom:calc(12px + var(--safe-b)); }
    body.mode-viewer .meter{ height:20px; }
    body.mode-viewer .meter i{ width:4px; }
    body.mode-viewer #standby{ padding:0 10vw; gap:12px; }
    body.mode-viewer #standby .glyph{ width:56px; height:56px; }
    body.mode-viewer #standby h1{ font-size:14px; }
    body.mode-viewer #standby p{ font-size:11px; line-height:1.6; }
  }
</style>
</head>
<body>

<div id="stage">
  <video id="remoteVideo" class="hidden" autoplay playsinline></video>
  <div id="standby">
    <div class="glyph"></div>
    <h1 id="standbyTitle">AWAITING UPLINK</h1>
    <p id="standbyText">Standing by for the laptop broadcast.<br>Keep this page open on the handset.</p>
  </div>

  <video id="localPreview" autoplay playsinline muted></video>
  <div id="splitDivider"></div>
  <div id="scrim"></div>
  <div id="grain"></div>

  <i class="corner tl"></i><i class="corner tr"></i>
  <i class="corner bl"></i><i class="corner br"></i>

  <div id="idTag">HOLOMAT·OS<span id="idSub">—</span></div>
  <button id="retryBtn" type="button">RE-SYNC</button>

  <div id="telemetry">
    <div id="statusLine"><i class="dot"></i><span id="statusText">INITIALIZING</span></div>
    <div id="statusSub"></div>
  </div>

  <div id="meterOwn" class="meterWrap" aria-hidden="true">
    <span class="meterLabel" id="meterOwnLabel">MIC</span>
    <div class="meter"></div>
  </div>
  <div id="meterRemote" class="meterWrap" aria-hidden="true">
    <span class="meterLabel">REMOTE MIC</span>
    <div class="meter"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------------- config ----------------
  var params = new URLSearchParams(location.search);
  var isBroadcast = params.get('broadcast') === '1';
  // "id" (optional) names THIS peer; "target" (optional) names the far side.
  var MY_ID     = params.get('id') || (isBroadcast ? 'holomatos-laptop-01' : 'holomatos-phone-01');
  var TARGET_ID = params.get('target') || (isBroadcast ? 'holomatos-phone-01' : 'holomatos-laptop-01');

  document.body.classList.add(isBroadcast ? 'mode-broadcast' : 'mode-viewer');

  var idSub = document.getElementById('idSub');
  idSub.textContent = (isBroadcast ? 'BROADCAST · ' : 'RECEIVER · ') + MY_ID;

  var standbyTitle = document.getElementById('standbyTitle');
  var standbyText  = document.getElementById('standbyText');
  if (isBroadcast){
    standbyTitle.textContent = 'AWAITING PHONE FEED';
    standbyText.innerHTML = 'Open the receiver page on the handset to start its camera.';
  }

  var statusLine = document.getElementById('statusLine');
  var statusText = document.getElementById('statusText');
  var statusSub  = document.getElementById('statusSub');
  var retryBtn   = document.getElementById('retryBtn');
  var remoteVideo = document.getElementById('remoteVideo');
  var localPreview = document.getElementById('localPreview');

  document.getElementById('meterOwnLabel').textContent = isBroadcast ? 'LOCAL MIC' : 'MIC';

  function setStatus(text, sub, state){
    statusText.textContent = text;
    statusSub.textContent = sub || '';
    statusLine.className = state ? state : '';
  }

  // ---------------- mic level meters ----------------
  function buildMeterBars(container){
    var n = 14;
    for (var i=0;i<n;i++){ container.appendChild(document.createElement('i')); }
    return container.querySelectorAll('i');
  }
  var meterOwnBars    = buildMeterBars(document.querySelector('#meterOwn .meter'));
  var meterRemoteBars = buildMeterBars(document.querySelector('#meterRemote .meter'));

  function attachMeter(stream, bars){
    try{
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var src = ctx.createMediaStreamSource(stream);
      var analyser = ctx.createAnalyser();
      analyser.fftSize = 64;
      src.connect(analyser);
      var data = new Uint8Array(analyser.frequencyBinCount);
      (function tick(){
        analyser.getByteFrequencyData(data);
        var avg = data.reduce(function(a,b){return a+b;},0) / data.length;
        var level = Math.min(1, avg / 90);
        for (var i=0;i<bars.length;i++){
          var on = level > i / bars.length;
          bars[i].style.height = on ? (24 + i*4) + '%' : '20%';
          bars[i].style.background = on ? (i > bars.length*0.75 ? '#e85b4f' : '#49e0ea') : '#1d3a40';
        }
        requestAnimationFrame(tick);
      })();
    }catch(e){ /* meter is cosmetic; ignore failures */ }
  }

  // ---------------- fullscreen + forced landscape (phone only) ----------------
  function goImmersive(){
    if (isBroadcast) return;
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    function lock(){
      try{
        if (screen.orientation && screen.orientation.lock){
          screen.orientation.lock('landscape').catch(function(){});
        }
      }catch(e){}
    }
    if (!req){ lock(); return; }
    try{
      var res = req.call(el);
      if (res && res.then){ res.then(lock).catch(function(){ /* needs a user gesture — fallback listener below covers it */ }); }
      else { lock(); }
    }catch(e){}
  }
  if (!isBroadcast){
    goImmersive();
    ['touchend','click'].forEach(function(evt){
      document.addEventListener(evt, function retryImmersive(){
        if (!document.fullscreenElement){ goImmersive(); }
      }, { passive:true });
    });
    document.addEventListener('fullscreenchange', function(){
      if (document.fullscreenElement && screen.orientation && screen.orientation.lock){
        screen.orientation.lock('landscape').catch(function(){});
      }
    });
  }

  // ---------------- media acquisition ----------------
  var localStream = null;
  var peer = null;
  var activeCall = null;
  var reconnectTimer = null;
  var callAttemptTimer = null;
  var reconnectAttempts = 0;

  function getMedia(){
    // both the laptop and the phone now send camera + mic
    return navigator.mediaDevices.getUserMedia({
      video: { facingMode:'user', width:{ideal:1280}, height:{ideal:720} },
      audio: true
    });
  }

  function backoffDelay(){
    // 3s, ~5s, ~8s, ~13s ... capped at 30s, with jitter so both devices
    // don't hammer the signaling server in lockstep
    var d = Math.min(30000, 3000 * Math.pow(1.6, reconnectAttempts));
    return d + Math.random() * 500;
  }

  function startPeer(){
    setStatus('LINKING NODE', MY_ID, '');
    peer = new Peer(MY_ID, {
      debug: 1
    });

    peer.on('open', function(id){
      reconnectAttempts = 0;
      setStatus(isBroadcast ? 'NODE ONLINE' : 'STANDBY', 'ID ' + id + ' · target ' + TARGET_ID, '');
      if (isBroadcast){
        beginCallLoop();
      }
    });

    peer.on('call', function(call){
      // viewer side receives the laptop's call and answers with its own camera + mic
      activeCall = call;
      call.answer(localStream);
      wireCall(call);
    });

    peer.on('error', function(err){
      var type = err && err.type;
      console.warn('peer error', type, err);

      // peer-unavailable just means the far side isn't registered yet —
      // completely normal while waiting for the other device, and NOT a
      // fault of our own connection. Reconnecting here would fight our own
      // live signaling session and can trigger spurious disconnects.
      if (type === 'peer-unavailable'){
        return;
      }
      if (type === 'unavailable-id'){
        // our own ID is still held by a previous session on the broker —
        // rebuild from scratch (not reconnect) once it clears
        setStatus('ID BUSY', 'previous session clearing — retrying…', 'bad');
        scheduleRebuild();
        return;
      }
      setStatus('LINK ERROR', type || 'unknown', 'bad');
      scheduleRebuild();
    });

    peer.on('disconnected', function(){
      // signaling socket dropped but the peer object is still salvageable —
      // try the cheaper peer.reconnect() first
      setStatus('DISCONNECTED', 'reconnecting…', 'bad');
      scheduleSoftReconnect();
    });

    peer.on('close', function(){
      setStatus('NODE CLOSED', 'retrying…', 'bad');
      scheduleRebuild();
    });
  }

  function scheduleSoftReconnect(){
    clearTimeout(reconnectTimer);
    var delay = backoffDelay();
    reconnectAttempts++;
    reconnectTimer = setTimeout(function(){
      if (peer && !peer.destroyed){
        try{ peer.reconnect(); }catch(e){ scheduleRebuild(); }
      } else {
        rebuildPeer();
      }
    }, delay);
  }

  function scheduleRebuild(){
    clearTimeout(reconnectTimer);
    var delay = backoffDelay();
    reconnectAttempts++;
    reconnectTimer = setTimeout(rebuildPeer, delay);
  }

  function rebuildPeer(){
    try{ if (peer) peer.destroy(); }catch(e){}
    startPeer();
  }

  function beginCallLoop(){
    clearInterval(callAttemptTimer);
    callAttemptTimer = setInterval(function(){
      if (activeCall && activeCall.open) return; // already connected
      if (!peer || peer.disconnected || peer.destroyed) return;
      setStatus('SEEKING RECEIVER', 'calling ' + TARGET_ID + '…', '');
      var call = peer.call(TARGET_ID, localStream);
      if (!call) return;
      activeCall = call;
      wireCall(call);
    }, 3000);
  }

  function wireCall(call){
    call.on('stream', function(remoteStream){
      setStatus('UPLINK ESTABLISHED', TARGET_ID, 'ok');
      remoteVideo.srcObject = remoteStream;
      remoteVideo.classList.remove('hidden');
      attachMeter(remoteStream, meterRemoteBars);
    });
    call.on('close', function(){
      setStatus(isBroadcast ? 'PHONE FEED LOST' : 'UPLINK LOST', 'awaiting reconnection…', 'bad');
      remoteVideo.classList.add('hidden');
      remoteVideo.srcObject = null;
      activeCall = null;
    });
    call.on('error', function(err){
      console.warn('call error', err);
      setStatus('CALL ERROR', String(err && err.message || err), 'bad');
      activeCall = null;
    });
  }

  retryBtn.addEventListener('click', function(){
    setStatus('RE-SYNCING', '', '');
    clearTimeout(reconnectTimer);
    reconnectAttempts = 0;
    if (activeCall){ try{ activeCall.close(); }catch(e){} activeCall = null; }
    rebuildPeer();
    if (!isBroadcast) goImmersive();
  });

  // ---------------- boot ----------------
  getMedia().then(function(stream){
    localStream = stream;
    localPreview.srcObject = stream;
    attachMeter(stream, meterOwnBars);
    startPeer();
  }).catch(function(err){
    setStatus('MEDIA DENIED', String(err && err.message || err), 'bad');
  });

  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible'){
      if (peer && peer.disconnected){ try{ peer.reconnect(); }catch(e){} }
      if (!isBroadcast) goImmersive();
    }
  });
})();
</script>
</body>
</html>
