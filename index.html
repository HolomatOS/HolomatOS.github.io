<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AIR DRAW AR</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;touch-action:none;font-family:'Share Tech Mono',monospace}
#vid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transform:scaleX(-1)}
#dotCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;transform:scaleX(-1)}
#threeCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center}
.screen.hidden{display:none!important}

/* BOOT */
#boot{background:radial-gradient(ellipse at 50% 45%,#050510 0%,#000 70%)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:58px;letter-spacing:6px;line-height:1;background:linear-gradient(180deg,#fff 0%,#88aaff 50%,#2244cc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 24px rgba(100,140,255,.6));animation:glo 3s ease-in-out infinite}
@keyframes glo{0%,100%{filter:drop-shadow(0 0 18px rgba(100,140,255,.5))}50%{filter:drop-shadow(0 0 40px rgba(100,140,255,1))}}
.tagline{font-size:8px;letter-spacing:5px;color:#1a1a44}
.instructions{font-size:8px;color:#111133;letter-spacing:1px;line-height:2.6;border:1px solid #0a0a22;padding:14px 20px;max-width:320px}
.instructions b{color:#3355cc}
.go-btn{padding:13px 40px;background:transparent;border:1px solid #3355ff;color:#4466ff;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:4px;cursor:pointer;transition:all .3s;-webkit-appearance:none}
.go-btn:active{color:#fff;background:#3355ff;transform:scale(.96)}
#bootErr{font-size:8px;color:#ff3344;letter-spacing:1px;display:none;margin-top:4px;line-height:2}

/* LOADING */
#loading{background:rgba(0,0,0,.97)}
.ld-title{font-size:11px;letter-spacing:5px;color:#4466ff}
.bar-wrap{width:260px;height:2px;background:#0a0a1a}
.bar-fill{height:100%;background:linear-gradient(90deg,#0011aa,#4466ff);width:0%;transition:width .3s}
.ld-msg{font-size:8px;color:#1a1a44;letter-spacing:2px}

/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
.hc{position:absolute;width:26px;height:26px;border-style:solid;opacity:.3}
.hc.tl{top:12px;left:12px;border-color:#4466ff;border-width:2px 0 0 2px}
.hc.tr{top:12px;right:12px;border-color:#4466ff;border-width:2px 2px 0 0}
.hc.bl{bottom:12px;left:12px;border-color:#4466ff;border-width:0 0 2px 2px}
.hc.br{bottom:12px;right:12px;border-color:#4466ff;border-width:0 2px 2px 0}
#status{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);border:1px solid rgba(50,80,255,.25);border-top:2px solid #4466ff;padding:7px 16px;font-size:8px;letter-spacing:3px;color:#4466ff;text-shadow:0 0 8px rgba(68,102,255,.8);white-space:nowrap}
#gesture{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:3px;padding:5px 12px;border:1px solid rgba(50,80,255,.2);background:rgba(0,0,0,.7);color:rgba(68,102,255,.7);transition:color .2s}
#gesture.drawing{color:#00ff88;border-color:rgba(0,255,136,.4);text-shadow:0 0 8px rgba(0,255,136,.8)}
#gesture.paused{color:#ffcc00;border-color:rgba(255,204,0,.3)}
#brushDot{position:absolute;width:20px;height:20px;border-radius:50%;pointer-events:none;border:2px solid #fff;display:none;z-index:12;transition:transform .1s}
#tools{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.tool-btn{width:38px;height:38px;background:rgba(0,0,0,.75);border:1px solid rgba(50,80,255,.3);color:#4466ff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tool-btn:active{background:#3355ff;color:#fff}
#palette{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
.pal-swatch{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer;transition:all .2s;pointer-events:auto}
.pal-swatch.active{transform:scale(1.35);border-color:#fff}
#strokeCount{position:absolute;bottom:66px;right:16px;font-size:7px;letter-spacing:2px;color:rgba(68,102,255,.5)}
#worldLock{position:absolute;top:16px;left:16px;font-size:7px;letter-spacing:2px;color:rgba(68,102,255,.4);display:flex;align-items:center;gap:5px}
#lockDot{width:5px;height:5px;border-radius:50%;background:#4466ff;box-shadow:0 0 6px #4466ff;animation:ld 1.5s ease-in-out infinite}
@keyframes ld{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>

<video id="vid" playsinline autoplay muted></video>
<canvas id="dotCanvas"></canvas>
<canvas id="threeCanvas"></canvas>

<!-- BOOT -->
<div id="boot" class="screen">
  <div class="logo">AIR<br>DRAW</div>
  <div class="tagline">MEDIAPIPE · WORLD-LOCKED AR</div>
  <div class="instructions">
    <b>☝ INDEX ONLY</b> → draw in the air<br>
    <b>✋ OPEN PALM</b> → pause / lift brush<br>
    <b>🤏 PINCH</b> thumb+index → next color<br>
    <b>✊ FIST</b> → undo last stroke
  </div>
  <button class="go-btn" id="startBtn">✦ START DRAWING</button>
  <div id="bootErr"></div>
</div>

<!-- LOADING -->
<div id="loading" class="screen hidden">
  <div class="ld-title">INITIALIZING</div>
  <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>
  <div class="ld-msg" id="ldMsg">LOADING...</div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hc tl"></div><div class="hc tr"></div>
  <div class="hc bl"></div><div class="hc br"></div>
  <div id="worldLock"><div id="lockDot"></div>WORLD LOCKED</div>
  <div id="gesture">SHOW HAND</div>
  <div id="brushDot"></div>
  <div id="tools">
    <div class="tool-btn" id="undoBtn">↩</div>
    <div class="tool-btn" id="clearBtn">✕</div>
  </div>
  <div id="status">☝ POINT INDEX FINGER TO DRAW</div>
  <div id="palette"></div>
  <div id="strokeCount">STROKES: 0</div>
</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>
<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
'use strict';

const $=id=>document.getElementById(id);
function ss(t){$('status').textContent=t}
function showScreen(id){
  ['boot','loading'].forEach(s=>$(s).classList.add('hidden'));
  if(id!=='__none__') $(id)?.classList.remove('hidden');
}
function setBar(p,m){$('barFill').style.width=p+'%';if(m)$('ldMsg').textContent=m}

/* ── COLORS ── */
const COLORS=[
  {hex:'#ff2244',three:0xff2244,name:'RED'},
  {hex:'#ff8800',three:0xff8800,name:'ORANGE'},
  {hex:'#ffee00',three:0xffee00,name:'YELLOW'},
  {hex:'#00ff88',three:0x00ff88,name:'GREEN'},
  {hex:'#00ccff',three:0x00ccff,name:'CYAN'},
  {hex:'#4466ff',three:0x4466ff,name:'BLUE'},
  {hex:'#cc44ff',three:0xcc44ff,name:'PURPLE'},
  {hex:'#ffffff',three:0xffffff,name:'WHITE'},
];
let colorIdx=4;
let currentColor=COLORS[colorIdx].three;

function buildPalette(){
  const pal=$('palette'); pal.innerHTML='';
  COLORS.forEach((c,i)=>{
    const sw=document.createElement('div');
    sw.className='pal-swatch'+(i===colorIdx?' active':'');
    sw.style.background=c.hex;
    sw.style.boxShadow=`0 0 8px ${c.hex}`;
    sw.addEventListener('click',()=>setColor(i));
    pal.appendChild(sw);
  });
}
function setColor(i){
  colorIdx=i%COLORS.length;
  currentColor=COLORS[colorIdx].three;
  buildPalette();
  ss('COLOR: '+COLORS[colorIdx].name);
}

/* ── DEVICE ORIENTATION (world locking) ── */
let devQuat=new THREE.Quaternion();
let devQuatInv=new THREE.Quaternion();
let orientReady=false;

function initOrientation(){
  const listen=()=>{
    window.addEventListener('deviceorientation',e=>{
      if(!e.alpha&&!e.beta&&!e.gamma) return;
      const euler=new THREE.Euler(
        THREE.MathUtils.degToRad(e.beta||0),
        THREE.MathUtils.degToRad(e.alpha||0),
        THREE.MathUtils.degToRad(-(e.gamma||0)),
        'ZXY'
      );
      devQuat.setFromEuler(euler);
      devQuatInv.copy(devQuat).invert();
      orientReady=true;
    },{passive:true});
  };
  if(typeof DeviceOrientationEvent!=='undefined'&&
     typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission()
      .then(r=>{if(r==='granted')listen();else orientReady=true;})
      .catch(()=>{orientReady=true;});
  } else { listen(); }
}

function camToWorld(v){ return v.clone().applyQuaternion(devQuatInv); }
function worldToCam(v){ return v.clone().applyQuaternion(devQuat); }

/* ── THREE.JS ── */
let scene,camera,renderer,clock;

function initThree(){
  clock=new THREE.Clock();
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.001,30);

  renderer=new THREE.WebGLRenderer({canvas:$('threeCanvas'),antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.setClearColor(0,0);

  scene.add(new THREE.AmbientLight(0xffffff,1.2));
  const d1=new THREE.DirectionalLight(0xffffff,1.5); d1.position.set(0,1,1); scene.add(d1);
  const d2=new THREE.DirectionalLight(0x8899ff,.8); d2.position.set(-1,0,-1); scene.add(d2);

  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    resizeDot();
  });
}

/* ── STROKES ── */
const strokeGroups=[];
let currentWorldPts=[];
let currentMesh=null;
let isDrawing=false;
const MIN_DIST=0.005;

function addPoint(camPos){
  const wPos=camToWorld(camPos);
  if(currentWorldPts.length>0&&wPos.distanceTo(currentWorldPts[currentWorldPts.length-1])<MIN_DIST) return;
  currentWorldPts.push(wPos);
  if(currentWorldPts.length<2) return;
  rebuildCurrent();
}

function rebuildCurrent(){
  if(currentMesh){scene.remove(currentMesh);currentMesh=null;}
  if(currentWorldPts.length<2) return;
  const pts=currentWorldPts.map(p=>worldToCam(p));
  try{
    const curve=new THREE.CatmullRomCurve3(pts,false,'chordal',.5);
    const geo=new THREE.TubeGeometry(curve,Math.max(3,pts.length*3),.004,6,false);
    const mat=new THREE.MeshStandardMaterial({
      color:currentColor,metalness:.3,roughness:.4,
      emissive:new THREE.Color(currentColor),emissiveIntensity:.5
    });
    currentMesh=new THREE.Mesh(geo,mat);
    scene.add(currentMesh);
  }catch(e){}
}

function commitStroke(){
  if(currentWorldPts.length<2){currentWorldPts=[];return;}
  strokeGroups.push({worldPts:[...currentWorldPts],color:currentColor,mesh:currentMesh});
  currentMesh=null; currentWorldPts=[];
  $('strokeCount').textContent='STROKES: '+strokeGroups.length;
}

function undoStroke(){
  if(currentMesh){scene.remove(currentMesh);currentMesh=null;}
  currentWorldPts=[];
  if(!strokeGroups.length){ss('NOTHING TO UNDO');return;}
  const last=strokeGroups.pop();
  if(last.mesh) scene.remove(last.mesh);
  $('strokeCount').textContent='STROKES: '+strokeGroups.length;
  ss('UNDONE');
}

function clearAll(){
  if(currentMesh){scene.remove(currentMesh);currentMesh=null;}
  currentWorldPts=[];
  strokeGroups.forEach(s=>{if(s.mesh)scene.remove(s.mesh);});
  strokeGroups.length=0;
  $('strokeCount').textContent='STROKES: 0';
  ss('CLEARED');
}

function updateAllStrokes(){
  strokeGroups.forEach(sg=>{
    if(!sg.mesh||sg.worldPts.length<2) return;
    const pts=sg.worldPts.map(p=>worldToCam(p));
    try{
      const curve=new THREE.CatmullRomCurve3(pts,false,'chordal',.5);
      sg.mesh.geometry.dispose();
      sg.mesh.geometry=new THREE.TubeGeometry(curve,Math.max(3,pts.length*3),.004,6,false);
    }catch(e){}
  });
  if(currentWorldPts.length>=2&&currentMesh){
    const pts=currentWorldPts.map(p=>worldToCam(p));
    try{
      const curve=new THREE.CatmullRomCurve3(pts,false,'chordal',.5);
      currentMesh.geometry.dispose();
      currentMesh.geometry=new THREE.TubeGeometry(curve,Math.max(3,pts.length*3),.004,6,false);
    }catch(e){}
  }
}

/* ── DOT CANVAS ── */
const dotCanvas=$('dotCanvas');
const dotCtx=dotCanvas.getContext('2d');
function resizeDot(){dotCanvas.width=innerWidth;dotCanvas.height=innerHeight;}
resizeDot();

const BONES=[
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],
  [0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],
  [5,9],[9,13],[13,17],
];

function drawJoints(lms,drawing){
  const W=innerWidth,H=innerHeight;
  dotCtx.clearRect(0,0,W,H);
  if(!lms||lms.length<21) return;

  // Bones
  dotCtx.strokeStyle='rgba(0,255,136,0.3)';
  dotCtx.lineWidth=1.5;
  dotCtx.beginPath();
  BONES.forEach(([a,b])=>{
    const A=lms[a],B=lms[b];
    if(!A||!B) return;
    dotCtx.moveTo(A.x*W,A.y*H);
    dotCtx.lineTo(B.x*W,B.y*H);
  });
  dotCtx.stroke();

  // Dots
  lms.forEach((p,i)=>{
    if(!p) return;
    const x=p.x*W, y=p.y*H;
    const isTip=i===8, isWrist=i===0;
    const r=isTip?8:isWrist?6:4;
    const col=isTip?(drawing?'#ffffff':'#00ff88'):'#00ff88';
    // Glow
    const gr=dotCtx.createRadialGradient(x,y,0,x,y,r*3.5);
    gr.addColorStop(0,'rgba(0,255,136,.22)');
    gr.addColorStop(1,'rgba(0,255,136,0)');
    dotCtx.fillStyle=gr;
    dotCtx.beginPath();dotCtx.arc(x,y,r*3.5,0,Math.PI*2);dotCtx.fill();
    // Dot
    dotCtx.beginPath();dotCtx.arc(x,y,r,0,Math.PI*2);
    dotCtx.fillStyle=col;dotCtx.fill();
    dotCtx.strokeStyle='rgba(0,255,136,.5)';dotCtx.lineWidth=1;dotCtx.stroke();
    // Number label
    dotCtx.fillStyle='rgba(0,255,136,.45)';
    dotCtx.font='bold 7px Share Tech Mono';
    dotCtx.fillText(i,x+r+2,y-r);
  });
}

/* ── GESTURE ── */
let pinchCD=0,fistCD=0;

function getGesture(lms){
  if(!lms||lms.length<21) return 'none';
  const w=lms[0];
  const td=i=>Math.hypot(lms[i].x-w.x,lms[i].y-w.y);
  const md=i=>Math.hypot(lms[i].x-w.x,lms[i].y-w.y);
  const ext=[
    td(8)>md(5)*1.15,
    td(12)>md(9)*1.15,
    td(16)>md(13)*1.15,
    td(20)>md(17)*1.15,
  ];
  const extN=ext.filter(Boolean).length;
  const pinchD=Math.hypot(lms[4].x-lms[8].x,lms[4].y-lms[8].y);
  if(pinchD<0.05) return 'pinch';
  if(extN===0&&td(4)<md(2)*1.1) return 'fist';
  if(ext[0]&&!ext[1]&&!ext[2]&&!ext[3]) return 'draw';
  if(extN>=3) return 'pause';
  return 'pause';
}

/* ── DEPTH + 3D projection ── */
function estimateDepth(lms){
  const iM=lms[5],pM=lms[17];
  if(!iM||!pM) return 0.7;
  const px=Math.hypot((iM.x-pM.x)*innerWidth,(iM.y-pM.y)*innerHeight);
  if(px<5) return 0.7;
  const fovR=camera.fov*Math.PI/180;
  const focal=innerHeight/(2*Math.tan(fovR/2));
  return Math.max(.18,Math.min((0.07*focal)/px,1.8));
}

function lm3D(lm,depth){
  const ndcX=-(lm.x*2-1); // un-mirror
  const ndcY=-(lm.y*2-1);
  const v=new THREE.Vector3(ndcX,ndcY,.5).unproject(camera);
  const dir=v.sub(camera.position).normalize();
  return camera.position.clone().add(dir.multiplyScalar(depth));
}

/* ── MEDIAPIPE ── */
let latestLms=null;
let handLost=0;
const vid=$('vid');

function initMediaPipe(onReady){
  setBar(60,'LOADING MEDIAPIPE MODEL...');

  const hands=new Hands({
    locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
  });
  hands.setOptions({
    maxNumHands:1,
    modelComplexity:1,
    minDetectionConfidence:.65,
    minTrackingConfidence:.6,
  });
  hands.onResults(r=>{
    if(r.multiHandLandmarks&&r.multiHandLandmarks.length>0){
      latestLms=r.multiHandLandmarks[0];
      handLost=0;
    } else {
      handLost++;
      if(handLost>10) latestLms=null;
    }
  });

  setBar(80,'STARTING CAMERA FEED...');
  const mpCam=new Camera(vid,{
    onFrame:async()=>{ await hands.send({image:vid}); },
    width:640, height:480,
  });
  mpCam.start().then(()=>{
    setBar(100,'READY');
    setTimeout(onReady,500);
  }).catch(e=>{
    throw new Error('Camera failed: '+e.message);
  });
}

/* ── MAIN LOOP ── */
function mainLoop(){
  requestAnimationFrame(mainLoop);
  const dt=Math.min(clock.getDelta(),.05);
  const lms=latestLms;
  const gesture=getGesture(lms);
  const drawing=gesture==='draw';

  drawJoints(lms,drawing);

  // Brush dot on screen
  const bd=$('brushDot');
  if(lms&&lms[8]){
    const tip=lms[8];
    const sx=(1-tip.x)*innerWidth; // mirror-corrected
    const sy=tip.y*innerHeight;
    bd.style.display='block';
    bd.style.left=(sx-10)+'px';
    bd.style.top=(sy-10)+'px';
    bd.style.background=drawing?COLORS[colorIdx].hex:'transparent';
    bd.style.borderColor=COLORS[colorIdx].hex;
    bd.style.boxShadow=`0 0 12px ${COLORS[colorIdx].hex}`;
    bd.style.transform=drawing?'scale(1.4)':'scale(1)';
  } else { bd.style.display='none'; }

  // Gesture label
  const geo=$('gesture');
  if(!lms){ geo.className='';geo.textContent='SHOW HAND'; }
  else if(drawing){ geo.className='drawing';geo.textContent='✦ DRAWING'; }
  else if(gesture==='fist'){ geo.className='paused';geo.textContent='✊ FIST'; }
  else if(gesture==='pinch'){ geo.className='paused';geo.textContent='🤏 PINCH'; }
  else{ geo.className='paused';geo.textContent='✋ PAUSE'; }

  // Cooldowns
  if(pinchCD>0) pinchCD--;
  if(fistCD>0)  fistCD--;

  if(lms){
    if(gesture==='pinch'&&pinchCD===0){
      pinchCD=35;
      if(isDrawing){commitStroke();isDrawing=false;}
      setColor(colorIdx+1);
    }
    if(gesture==='fist'&&fistCD===0){
      fistCD=35;
      if(isDrawing){commitStroke();isDrawing=false;}
      undoStroke();
    }

    if(drawing){
      const depth=estimateDepth(lms);
      const tip3d=lm3D(lms[8],depth);
      if(!isDrawing){
        isDrawing=true;
        currentWorldPts=[];
        currentColor=COLORS[colorIdx].three;
        ss('✦ DRAWING...');
      }
      addPoint(tip3d);
    } else {
      if(isDrawing){ commitStroke(); isDrawing=false; ss('☝ POINT INDEX FINGER TO DRAW'); }
    }
  } else {
    if(isDrawing){ commitStroke(); isDrawing=false; }
    ss('SHOW YOUR HAND TO CAMERA');
  }

  if(orientReady) updateAllStrokes();
  renderer.render(scene,camera);
}

/* ── BUTTONS ── */
$('undoBtn').addEventListener('click',()=>{if(isDrawing){commitStroke();isDrawing=false;}undoStroke();});
$('clearBtn').addEventListener('click',()=>{if(isDrawing){commitStroke();isDrawing=false;}clearAll();});

/* ── START ── */
$('startBtn').addEventListener('click',async()=>{
  $('startBtn').textContent='LOADING...';
  $('startBtn').disabled=true;
  showScreen('loading');

  try{
    setBar(5,'SETTING UP 3D...');
    initThree();
    buildPalette();
    setBar(15,'REQUESTING ORIENTATION...');
    initOrientation();
    setBar(25,'REQUESTING CAMERA...');

    // Request camera first so MediaPipe can use it
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    vid.srcObject=stream;
    await vid.play();
    setBar(50,'CAMERA READY');

    initMediaPipe(()=>{
      showScreen('__none__');
      $('hud').style.display='block';
      ss('☝ POINT INDEX FINGER TO DRAW');
      mainLoop();
    });

  }catch(e){
    console.error(e);
    $('bootErr').textContent=
      (e.message||'').toLowerCase().includes('permission')||
      (e.message||'').toLowerCase().includes('denied')
      ?'CAMERA PERMISSION DENIED'
      :'ERROR: '+(e.message||e);
    $('bootErr').style.display='block';
    showScreen('boot');
    $('startBtn').textContent='✦ START DRAWING';
    $('startBtn').disabled=false;
  }
});
</script>
</body>
