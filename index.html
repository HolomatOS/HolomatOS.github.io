<script>
// ───────────────────────────────────────────────────────────────
//  CANVAS & VIDEO SETUP
// ───────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const video  = document.getElementById('video');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ───────────────────────────────────────────────────────────────
//  DRAW ARMOR PIECES (offscreen canvases)
//  Real Iron Man MK50 metallic armor pieces
// ───────────────────────────────────────────────────────────────

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

// ── Helpers ──
function metalGrad(ctx, x0, y0, x1, y1, light, mid, dark) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0,   light);
  g.addColorStop(0.35, mid);
  g.addColorStop(0.75, dark);
  g.addColorStop(1,   '#1a0a00');
  return g;
}

function addShine(ctx, w, h) {
  const s = ctx.createLinearGradient(0, 0, w * 0.7, h * 0.3);
  s.addColorStop(0,   'rgba(255,255,255,0)');
  s.addColorStop(0.3, 'rgba(255,255,255,0.32)');
  s.addColorStop(0.7, 'rgba(255,255,255,0.06)');
  s.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle = s;
}

function panelLine(ctx, x1, y1, x2, y2) {
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,220,100,0.18)';
  ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(x1+0.5,y1+0.5); ctx.lineTo(x2+0.5,y2+0.5); ctx.stroke();
}

// ── WRIST GUARD (gold) ──
function drawWristGuard() {
  const c = makeCanvas(100, 60); const g = c.getContext('2d');
  const w = 100, h = 60;

  g.beginPath();
  g.moveTo(12, 0); g.lineTo(w-12, 0);
  g.lineTo(w, h); g.lineTo(0, h);
  g.closePath();
  g.fillStyle = metalGrad(g, 0, 0, 0, h, '#FFE566','#C8960A','#7A5500');
  g.fill();

  // panel lines
  for (let i = 1; i < 4; i++) {
    const px = i/4; const lx1 = w*0.05*px + w*0.03;
    panelLine(g, lx1, h*i/4, w - lx1, h*i/4);
  }
  panelLine(g, w*0.35, 0, w*0.35, h);
  panelLine(g, w*0.65, 0, w*0.65, h);

  // Center rivet pattern
  for (let rx of [w*0.22, w*0.5, w*0.78]) {
    for (let ry of [h*0.25, h*0.75]) {
      const rg = g.createRadialGradient(rx, ry, 0, rx, ry, 4);
      rg.addColorStop(0, '#fff8cc'); rg.addColorStop(1, '#8B6914');
      g.fillStyle = rg; g.beginPath(); g.arc(rx, ry, 3.5, 0, Math.PI*2); g.fill();
    }
  }

  // Shine
  g.beginPath(); g.moveTo(12,0); g.lineTo(w-12,0); g.lineTo(w,h); g.lineTo(0,h); g.closePath();
  addShine(g, w, h); g.fill();

  // Edge
  g.strokeStyle = 'rgba(255,240,120,0.7)'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(12,0.8); g.lineTo(w-12,0.8); g.stroke();
  g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(12,0); g.lineTo(w-12,0); g.lineTo(w,h); g.lineTo(0,h); g.closePath(); g.stroke();
  return c;
}

// ── HAND PLATE (gold, back of hand) ──
function drawHandPlate() {
  const c = makeCanvas(120, 75); const g = c.getContext('2d');
  const w = 120, h = 75;

  // Hexagonal-ish shape
  g.beginPath();
  g.moveTo(w*0.1, 0); g.lineTo(w*0.9, 0);
  g.lineTo(w, h*0.15); g.lineTo(w*0.95, h);
  g.lineTo(w*0.05, h); g.lineTo(0, h*0.15);
  g.closePath();
  g.fillStyle = metalGrad(g, 0, 0, 0, h, '#FFE566','#C8960A','#7A5500');
  g.fill();

  // Radiating panel lines from center
  const cx = w*0.5, cy = h*0.55;
  const rays = 6;
  for (let i = 0; i < rays; i++) {
    const a = (i / rays) * Math.PI * 2;
    panelLine(g, cx, cy, cx + Math.cos(a)*w*0.5, cy + Math.sin(a)*h*0.55);
  }
  // Horizontal divider
  panelLine(g, w*0.05, h*0.4, w*0.95, h*0.4);

  // Center hex
  g.save(); g.translate(cx, h*0.35);
  g.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i/6)*Math.PI*2 - Math.PI/6;
    i===0 ? g.moveTo(Math.cos(a)*10,Math.sin(a)*10) : g.lineTo(Math.cos(a)*10,Math.sin(a)*10);
  }
  g.closePath();
  const hg = g.createRadialGradient(0,0,0,0,0,10);
  hg.addColorStop(0,'#FFF5AA'); hg.addColorStop(1,'#B8860B');
  g.fillStyle = hg; g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth=1; g.stroke();
  g.restore();

  // Shine
  g.beginPath(); g.moveTo(w*0.1,0); g.lineTo(w*0.9,0); g.lineTo(w,h*0.15); g.lineTo(w*0.95,h); g.lineTo(w*0.05,h); g.lineTo(0,h*0.15); g.closePath();
  addShine(g, w, h); g.fill();

  g.strokeStyle='rgba(0,0,0,0.6)'; g.lineWidth=1.5;
  g.beginPath(); g.moveTo(w*0.1,0); g.lineTo(w*0.9,0); g.lineTo(w,h*0.15); g.lineTo(w*0.95,h); g.lineTo(w*0.05,h); g.lineTo(0,h*0.15); g.closePath(); g.stroke();
  return c;
}

// ── REPULSOR (gold ring + blue glow) ──
function drawRepulsor() {
  const c = makeCanvas(52, 52); const g = c.getContext('2d');
  const cx = 26, cy = 26, r = 24;

  // Outer ring body
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI*2);
  const og = g.createRadialGradient(cx-5,cy-5, 2, cx,cy, r);
  og.addColorStop(0,'#FFE566'); og.addColorStop(0.6,'#B8860B'); og.addColorStop(1,'#5C4000');
  g.fillStyle = og; g.fill();

  // Inner dark ring
  g.beginPath(); g.arc(cx,cy,r*0.62,0,Math.PI*2);
  g.fillStyle='#0a0500'; g.fill();

  // Glowing blue repulsor core
  const bg = g.createRadialGradient(cx,cy,0,cx,cy,r*0.58);
  bg.addColorStop(0,'rgba(220,240,255,1)');
  bg.addColorStop(0.3,'rgba(100,180,255,0.95)');
  bg.addColorStop(0.7,'rgba(30,100,220,0.8)');
  bg.addColorStop(1,'rgba(0,40,120,0)');
  g.beginPath(); g.arc(cx,cy,r*0.58,0,Math.PI*2);
  g.fillStyle=bg; g.fill();

  // Concentric detail rings on outer
  for (const fr of [0.75, 0.88]) {
    g.beginPath(); g.arc(cx,cy,r*fr,0,Math.PI*2);
    g.strokeStyle='rgba(0,0,0,0.5)'; g.lineWidth=1; g.stroke();
    g.strokeStyle='rgba(255,220,80,0.2)'; g.lineWidth=0.5; g.stroke();
  }

  // Radial notches
  for (let i=0; i<8; i++) {
    const a = (i/8)*Math.PI*2;
    g.strokeStyle='rgba(0,0,0,0.4)'; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(cx+Math.cos(a)*r*0.7, cy+Math.sin(a)*r*0.7);
    g.lineTo(cx+Math.cos(a)*r*0.95, cy+Math.sin(a)*r*0.95); g.stroke();
  }

  // Blue glow bloom (outer)
  const glow = g.createRadialGradient(cx,cy,r*0.2,cx,cy,r*0.62);
  glow.addColorStop(0,'rgba(120,200,255,0.5)');
  glow.addColorStop(1,'rgba(50,120,255,0)');
  g.beginPath(); g.arc(cx,cy,r*0.62,0,Math.PI*2);
  g.fillStyle=glow; g.fill();

  // Shine
  const sh = g.createRadialGradient(cx-6,cy-6,0,cx,cy,r);
  sh.addColorStop(0,'rgba(255,255,200,0.45)'); sh.addColorStop(1,'rgba(255,255,200,0)');
  g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2);
  g.fillStyle=sh; g.fill();

  return c;
}

// ── FINGER ARMOR (red, reused for all 5 fingers) ──
function drawFingerArmor(label) {
  const c = makeCanvas(34, 65); const g = c.getContext('2d');
  const w = 34, h = 65;

  // Upper segment (tip)
  g.beginPath();
  g.moveTo(w*0.2, 0); g.lineTo(w*0.8, 0);
  g.quadraticCurveTo(w, 0, w, w*0.25);
  g.lineTo(w, h*0.42); g.lineTo(0, h*0.42);
  g.lineTo(0, w*0.25);
  g.quadraticCurveTo(0, 0, w*0.2, 0);
  g.closePath();
  g.fillStyle = metalGrad(g,0,0,w,h*0.4,'#FF5555','#CC0000','#700000');
  g.fill();
  panelLine(g, w*0.15, h*0.18, w*0.85, h*0.18);
  addShine(g, w, h*0.4); g.fill();

  // Joint gap
  g.fillStyle='rgba(0,0,0,0.7)';
  g.fillRect(2, h*0.42, w-4, h*0.07);

  // Lower segment (knuckle)
  g.beginPath();
  g.moveTo(0, h*0.49); g.lineTo(w, h*0.49);
  g.lineTo(w*0.95, h); g.lineTo(w*0.05, h);
  g.closePath();
  g.fillStyle = metalGrad(g,0,h*0.49,w,h,'#FF4444','#BB0000','#5C0000');
  g.fill();
  panelLine(g, w*0.1, h*0.68, w*0.9, h*0.68);
  g.beginPath();
  g.moveTo(0, h*0.49); g.lineTo(w, h*0.49); g.lineTo(w*0.95, h); g.lineTo(w*0.05, h); g.closePath();
  addShine(g, w, h); g.fill();

  // Outline
  g.strokeStyle='rgba(0,0,0,0.6)'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(w*0.2,0); g.lineTo(w*0.8,0); g.quadraticCurveTo(w,0,w,w*0.25);
  g.lineTo(w,h*0.42); g.lineTo(0,h*0.42); g.lineTo(0,w*0.25); g.quadraticCurveTo(0,0,w*0.2,0); g.closePath(); g.stroke();
  g.beginPath(); g.moveTo(0,h*0.49); g.lineTo(w,h*0.49); g.lineTo(w*0.95,h); g.lineTo(w*0.05,h); g.closePath(); g.stroke();

  // Small label indicator dot
  const dg = g.createRadialGradient(w/2,h*0.28,0,w/2,h*0.28,4);
  dg.addColorStop(0,'rgba(255,200,200,0.9)'); dg.addColorStop(1,'rgba(200,0,0,0)');
  g.fillStyle=dg; g.beginPath(); g.arc(w/2,h*0.28,3.5,0,Math.PI*2); g.fill();

  return c;
}

// ── THUMB ARMOR (wider, angled) ──
function drawThumbArmor() {
  const c = makeCanvas(40, 58); const g = c.getContext('2d');
  const w = 40, h = 58;

  // Main body
  g.beginPath();
  g.moveTo(w*0.1, 0); g.lineTo(w*0.9, 0);
  g.lineTo(w, h*0.5); g.lineTo(w*0.9, h);
  g.lineTo(w*0.1, h); g.lineTo(0, h*0.5);
  g.closePath();
  g.fillStyle = metalGrad(g,0,0,w,h,'#FF5555','#CC0000','#700000');
  g.fill();

  panelLine(g, w*0.1, h*0.42, w*0.9, h*0.42);
  panelLine(g, w*0.3, 0, w*0.3, h);
  panelLine(g, w*0.7, 0, w*0.7, h);

  g.beginPath();
  g.moveTo(w*0.1,0); g.lineTo(w*0.9,0); g.lineTo(w,h*0.5); g.lineTo(w*0.9,h); g.lineTo(w*0.1,h); g.lineTo(0,h*0.5); g.closePath();
  addShine(g, w, h); g.fill();

  g.strokeStyle='rgba(0,0,0,0.6)'; g.lineWidth=1.2;
  g.beginPath();
  g.moveTo(w*0.1,0); g.lineTo(w*0.9,0); g.lineTo(w,h*0.5); g.lineTo(w*0.9,h); g.lineTo(w*0.1,h); g.lineTo(0,h*0.5); g.closePath(); g.stroke();
  return c;
}

// Pre-render all armor pieces
const ARMOR_IMGS = {
  wrist:     drawWristGuard(),
  backplate: drawHandPlate(),
  repulsor:  drawRepulsor(),
  thumb:     drawThumbArmor(),
  index:     drawFingerArmor('I'),
  middle:    drawFingerArmor('M'),
  ring:      drawFingerArmor('R'),
  pinky:     drawFingerArmor('P'),
};

// ───────────────────────────────────────────────────────────────
//  PART DEFINITIONS
// ───────────────────────────────────────────────────────────────
function avgLandmarks(lms, indices) {
  let sx = 0, sy = 0;
  for (const i of indices) { sx += lms[i].x; sy += lms[i].y; }
  return { x: sx/indices.length, y: sy/indices.length };
}

function lmScreen(lm) {
  // Flip X because video is mirrored
  return { x: (1 - lm.x) * canvas.width, y: lm.y * canvas.height };
}

function avgScreen(lms, indices) {
  const avg = avgLandmarks(lms, indices);
  return { x: (1 - avg.x) * canvas.width, y: avg.y * canvas.height };
}

const PARTS = [
  {
    id: 'wrist', name: 'WRIST GUARD', img: ARMOR_IMGS.wrist,
    w: 100, h: 60,
    getTarget: (lms) => lmScreen(lms[0]),
    delay: 0, state: 'floor',
    x: 0, y: 0, vx: 0, vy: 0, rot: 0, vrot: 0, scale: 1, attachScale: 1,
    floorX: 0, floorY: 0, floorRot: 0, bobPhase: 0,
  },
  {
    id: 'backplate', name: 'HAND PLATE', img: ARMOR_IMGS.backplate,
    w: 120, h: 75,
    getTarget: (lms) => avgScreen(lms, [5,9,13,17]),
    delay: 80, state: 'floor',
    x: 0, y: 0, vx: 0, vy: 0, rot: 0, vrot: 0, scale: 1, attachScale: 1,
    floorX: 0, floorY: 0, floorRot: 0, bobPhase: 0,
  },
  {
    id: 'repulsor', name: 'REPULSOR', img: ARMOR_IMGS.repulsor,
    w: 52, h: 52,
    getTarget: (lms) => avgScreen(lms, [0,5,9,13,17]),
    delay: 160, state: 'floor',
    x: 0, y: 0, vx: 0, vy: 0, rot: 0, vrot: 0, scale: 1, attachScale: 1,
    floorX: 0, floorY: 0, floorRot: 0, bobPhase: 0,
  },
  {
    id: 'thumb', name: 'THUMB', img: ARMOR_IMGS.thumb,
    w: 40, h: 58,
    getTarget: (lms) => avgScreen(lms, [2,3,4]),
    delay: 240, state: 'floor',
    x: 0, y: 0, vx: 0, vy: 0, rot: 0, vrot: 0, scale: 1, attachScale: 1,
    floorX: 0, floorY: 0, floorRot: 0, bobPhase: 0,
  },
  {
    id: 'index', name: 'INDEX', img: ARMOR_IMGS.index,
    w: 34, h: 65,
    getTarget: (lms) => avgScreen(lms, [6,7,8]),
    delay: 300, state: 'floor',
    x: 0, y: 0, vx: 0, vy: 0, rot: 0, vrot: 0, scale: 1, attachScale: 1,
    floorX: 0, floorY: 0, floorRot: 0, bobPhase: 0,
  },
  {
    id: 'middle', name: 'MIDDLE', img: ARMOR_IMGS.middle,

    getTarget: (lms) => avgScreen(lms, [10,11,12]),
    delay: 360, state: 'floor',
    x: 0, y: 0, vx: 0, vy: 0, rot: 0, vrot: 0, scale: 1, attachScale: 1,
    floorX: 0, floorY: 0, floorRot: 0, bobPhase: 0,
  },
  {
    id: 'ring', name: 'RING', img: ARMOR_IMGS.ring,
    w: 34, h: 65,
    getTarget: (lms) => avgScreen(lms, [14,15,16]),
    delay: 420, state: 'floor',
    x: 0, y: 0, vx: 0, vy: 0, rot: 0, vrot: 0, scale: 1, attachScale: 1,
    floorX: 0, floorY: 0, floorRot: 0, bobPhase: 0,
  },
  {
    id: 'pinky', name: 'PINKY', img: ARMOR_IMGS.pinky,
    w: 34, h: 65,
    getTarget: (lms) => avgScreen(lms, [18,19,20]),
    delay: 480, state: 'floor',
    x: 0, y: 0, vx: 0, vy: 0, rot: 0, vrot: 0, scale: 1, attachScale: 1,
    floorX: 0, floorY: 0, floorRot: 0, bobPhase: 0,
  },

// Scatter on floor
function scatterParts() {
  const floorY = canvas.height - 30;
  const spread = canvas.width * 0.85;
  const startX = canvas.width * 0.075;
  PARTS.forEach((p, i) => {
    const t = i / (PARTS.length - 1);
    p.floorX = startX + spread * t + (Math.random()-0.5)*50;
    p.floorY = floorY - Math.random()*30;
    p.floorRot = (Math.random()-0.5)*0.5;
    p.bobPhase = Math.random() * Math.PI * 2;
    p.x = p.floorX;
    p.y = p.floorY;
    p.rot = p.floorRot;
  });
}
scatterParts();

// ───────────────────────────────────────────────────────────────
//  PARTICLE SYSTEM  (sparks on attach)
// ───────────────────────────────────────────────────────────────
const particles = [];

function spawnSparks(x, y, color) {
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 6;
    particles.push({
      x, y,
      vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
      life: 1, decay: 0.04 + Math.random()*0.04,
      r: 2 + Math.random()*3,
      color
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.15; // gravity
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// ───────────────────────────────────────────────────────────────
//  STATE
// ───────────────────────────────────────────────────────────────
let handLandmarks = null;
let handVisible   = false;
let suiteDeployed = false;
let allAttached   = false;
let frameCount    = 0;
let deployTimestamp = 0;

// Pulse ring effect on attach
const pulseRings = [];
function addPulse(x, y) {
  pulseRings.push({ x, y, r: 10, life: 1 });
}
function updatePulses() {
  for (let i = pulseRings.length-1; i>=0; i--) {
    pulseRings[i].r += 4; pulseRings[i].life -= 0.04;
    if (pulseRings[i].life <= 0) pulseRings.splice(i,1);
  }
}
function drawPulses() {
  for (const p of pulseRings) {
    ctx.save();
    ctx.globalAlpha = p.life * 0.6;
    ctx.strokeStyle = '#ffcc00';
    ctx.shadowBlur = 15; ctx.shadowColor = '#ff8800';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

// ───────────────────────────────────────────────────────────────
//  UPDATE LOOP
// ───────────────────────────────────────────────────────────────
function update() {
  frameCount++;
  const t = frameCount * 0.03;

  // Detect raised hand
  if (handLandmarks) {
    const wrist = handLandmarks[0];
    const wristScreen = wrist.y * canvas.height;
    // Trigger when wrist is above bottom 40% of screen
    if (wristScreen < canvas.height * 0.62 && !suiteDeployed) {
      suiteDeployed = true;
      deployTimestamp = frameCount;
      document.getElementById('status-msg').textContent = 'SUIT DEPLOYING...';
    }
  }

  // Part updates
  let attachedCount = 0;
  for (const part of PARTS) {
    part.bobPhase += 0.04;

    if (part.state === 'floor') {
      // Idle bounce on floor
      part.x = part.floorX + Math.sin(part.bobPhase * 0.7 + part.id.length) * 3;
      part.y = part.floorY + Math.sin(part.bobPhase + part.id.length) * 4;
      part.rot = part.floorRot + Math.sin(part.bobPhase * 0.5) * 0.08;

      // Check if we should start flying (with delay)
      if (suiteDeployed && handLandmarks) {
        const elapsed = (frameCount - deployTimestamp);
        if (elapsed * (1000/60) >= part.delay) {
          part.state = 'flying';
          // Initial burst velocity toward hand
          const tgt = part.getTarget(handLandmarks);
          const dx = tgt.x - part.x, dy = tgt.y - part.y;
          const d = Math.hypot(dx, dy);
          part.vx = (dx/d) * 12;
          part.vy = (dy/d) * 12;
          part.vrot = (Math.random()-0.5)*0.3;
        }
      }

    } else if (part.state === 'flying') {
      if (handLandmarks) {
        const tgt = part.getTarget(handLandmarks);
        const dx = tgt.x - part.x, dy = tgt.y - part.y;
        const dist = Math.hypot(dx, dy);

        // Spring toward target
        const spring = 0.18;
        const damp   = 0.82;
        part.vx = (part.vx + dx * spring) * damp;
        part.vy = (part.vy + dy * spring) * damp;
        part.vrot *= 0.88;

        part.x += part.vx;
        part.y += part.vy;
        part.rot += part.vrot;

        // Attach when close
        if (dist < 22) {
          part.state = 'attached';
          part.x = tgt.x; part.y = tgt.y;
          part.vx = 0; part.vy = 0; part.vrot = 0;
          spawnSparks(tgt.x, tgt.y, part.id === 'repulsor' ? '#80d0ff' : '#ffcc44');
          addPulse(tgt.x, tgt.y);
        }
      } else {
        // Hand lost → float back down
        part.vy += 0.4;
        part.vx *= 0.97;
        part.x += part.vx; part.y += part.vy;
        part.rot += part.vrot; part.vrot *= 0.98;
        if (part.y > canvas.height + 100) {
          // Reset to floor
          part.state = 'floor';
          part.y = canvas.height - 30;
          part.vy = 0; part.vx = 0; part.vrot = 0;
          suiteDeployed = false;
          deployTimestamp = 0;
        }
      }
      attachedCount++;

    } else if (part.state === 'attached') {
      if (handLandmarks) {
        const tgt = part.getTarget(handLandmarks);
        // Smooth snap follow
        part.x += (tgt.x - part.x) * 0.35;
        part.y += (tgt.y - part.y) * 0.35;
        part.rot += (0 - part.rot) * 0.2;
        attachedCount++;
      } else {
        // Hand lost
        part.state = 'flying';
        part.vx = (Math.random()-0.5)*3;
        part.vy = -2;
      }
    }
  }

  allAttached = (attachedCount === PARTS.length) && PARTS.every(p => p.state === 'attached');
  if (allAttached) {
    document.getElementById('status-msg').textContent = 'SUIT ONLINE — POWER AT 100%';
  }

  updateParticles();
  updatePulses();
}

// ───────────────────────────────────────────────────────────────
//  DRAW LOOP
// ───────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Scanline vignette overlay
  const vgrd = ctx.createRadialGradient(
    canvas.width/2, canvas.height/2, canvas.height*0.3,
    canvas.width/2, canvas.height/2, canvas.height*0.9
  );
  vgrd.addColorStop(0, 'rgba(0,0,0,0)');
  vgrd.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vgrd;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Floor glow line
  const floorGlow = ctx.createLinearGradient(0, canvas.height-8, 0, canvas.height);
  floorGlow.addColorStop(0, 'rgba(255,140,0,0.0)');
  floorGlow.addColorStop(0, 'rgba(255,140,0,0.18)');
  floorGlow.addColorStop(1, 'rgba(255,80,0,0.0)');
  ctx.fillStyle = 'rgba(255,120,0,0.08)';
  ctx.fillRect(0, canvas.height-2, canvas.width, 2);

  // Hand skeleton (subtle)
  if (handLandmarks && handVisible) {
    drawHandSkeleton();
  }

  // Shadow under floor parts
  for (const part of PARTS) {
    if (part.state === 'floor') {
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = 'rgba(255,80,0,0.4)';
      ctx.filter = 'blur(8px)';
      ctx.fillRect(part.x - part.w*0.5*0.8, canvas.height - 12, part.w*0.8, 8);
      ctx.restore();
    }
  }

  // Draw parts (floor first, then flying, then attached on top)
  const drawOrder = ['floor', 'flying', 'attached'];
  for (const state of drawOrder) {
    for (const part of PARTS) {
      if (part.state !== state) continue;
      drawPart(part, state);
    }
  }

  drawPulses();
  drawParticles();

  // All-attached glow effect
  if (allAttached) {
    const framesSinceAll = PARTS.filter(p=>p.state==='attached').length === PARTS.length;
    if (framesSinceAll) {
      ctx.save();
      ctx.globalAlpha = 0.07 + 0.04 * Math.sin(frameCount * 0.12);
      ctx.fillStyle = 'rgba(255,150,50,1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }
  }
}

function drawPart(part, state) {
  ctx.save();
  ctx.translate(part.x, part.y);
  ctx.rotate(part.rot);
  ctx.scale(part.scale, part.scale);

  const hw = part.w * 0.5, hh = part.h * 0.5;

  // Glow for flying state
  if (state === 'flying') {
    ctx.shadowBlur = 25;
    ctx.shadowColor = part.id === 'repulsor' ? '#60b0ff' : '#ff9900';
  }
  if (state === 'attached') {
    ctx.shadowBlur = 12;
    ctx.shadowColor = part.id === 'repulsor' ? '#40a0ff' : '#ff7700';
  }

  ctx.drawImage(part.img, -hw, -hh, part.w, part.h);

  // Flying trail streak
  if (state === 'flying' && (Math.abs(part.vx) + Math.abs(part.vy)) > 5) {
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = part.id === 'repulsor' ? '#80c0ff' : '#ff9900';
    ctx.filter = 'blur(6px)';
    for (let s = 1; s <= 3; s++) {
      ctx.globalAlpha = 0.15 / s;
      ctx.fillRect(-hw - part.vx*s*0.5, -hh - part.vy*s*0.5, part.w, part.h);
    }
  }

  ctx.restore();
}

function drawHandSkeleton() {
  const lms = handLandmarks;
  const connections = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],
    [0,17]
  ];

  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = '#ff8800';
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 6; ctx.shadowColor = '#ff6600';

  for (const [a, b] of connections) {
    const pa = { x: (1-lms[a].x)*canvas.width, y: lms[a].y*canvas.height };
    const pb = { x: (1-lms[b].x)*canvas.width, y: lms[b].y*canvas.height };
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  }

  for (let i = 0; i < 21; i++) {
    const p = { x: (1-lms[i].x)*canvas.width, y: lms[i].y*canvas.height };
    ctx.fillStyle = '#ffcc00';
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ───────────────────────────────────────────────────────────────
//  ANIMATION LOOP
// ───────────────────────────────────────────────────────────────
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ───────────────────────────────────────────────────────────────
//  MEDIAPIPE HANDS
// ───────────────────────────────────────────────────────────────
let mediapipeReady = false;

function initMediaPipe() {
  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6
  });

  hands.onResults((results) => {
    if (!mediapipeReady) {
      mediapipeReady = true;
      hideLoading();
    }

    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      handLandmarks = results.multiHandLandmarks[0];
      handVisible   = true;
    } else {
      handLandmarks = null;
      handVisible   = false;
    }
  });

  // Webcam
  navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: 'user' } })
    .then((stream) => {
      video.srcObject = stream;
      video.play();

      const camera = new Camera(video, {
        onFrame: async () => { await hands.send({ image: video }); },
        width: 1280, height: 720
      });
      camera.start();
    })
    .catch((err) => {
      console.error(err);
      document.getElementById('loading-label').textContent = 'CAMERA ACCESS DENIED';
    });
}

// ───────────────────────────────────────────────────────────────
//  LOADING SCREEN
// ───────────────────────────────────────────────────────────────
const loadingBar = document.getElementById('loading-bar');
const loadingLabel = document.getElementById('loading-label');
const loadingSteps = [
  [10, 'BOOTING REPULSOR CORE...'],
  [25, 'CALIBRATING NANO-ACTUATORS...'],
  [45, 'LOADING SUIT INVENTORY...'],
  [65, 'ACQUIRING CAMERA FEED...'],
  [80, 'HAND RECOGNITION ONLINE...'],
  [95, 'AWAITING SUIT LOCK...'],
];

let loadStep = 0;
function animateLoading() {
  if (loadStep < loadingSteps.length) {
    const [pct, msg] = loadingSteps[loadStep];
    loadingBar.style.width = pct + '%';
    loadingLabel.textContent = msg;
    loadStep++;
    setTimeout(animateLoading, 400 + Math.random()*300);
  }
}
animateLoading();

function hideLoading() {
  loadingBar.style.width = '100%';
  loadingLabel.textContent = 'SUIT SYSTEMS NOMINAL';
  setTimeout(() => {
    const ls = document.getElementById('loading-screen');
    ls.style.opacity = '0';
    setTimeout(() => ls.style.display = 'none', 1000);
    document.getElementById('jarvis-text').style.opacity = '1';
    document.getElementById('status-msg').style.opacity = '1';
    scatterParts();
  }, 600);
}

// ───────────────────────────────────────────────────────────────
//  BOOT
// ───────────────────────────────────────────────────────────────
loop();
setTimeout(initMediaPipe, 500);
</script>
</body>
