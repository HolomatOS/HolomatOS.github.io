<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Hand Tracking - World Locked</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #camera {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .ui-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            transform-origin: center center;
        }

        .icon {
            position: absolute;
            width: 45px;
            height: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            pointer-events: auto;
        }

        .icon img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.3));
        }

        .icon.hovering {
            transform: scale(1.3);
            filter: brightness(1.2);
        }

        .icon.hovering img {
            filter: drop-shadow(0 5px 15px rgba(255, 255, 255, 0.8));
        }

        .icon-label {
            position: absolute;
            top: 52px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 500;
            color: white;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
        }

        /* Icon positions - World-locked positions */
        .icon1 { top: 50%; left: 50%; margin-left: -210px; margin-top: -22.5px; }
        .icon2 { top: 50%; left: 50%; margin-left: -70px; margin-top: -22.5px; }
        .icon3 { top: 50%; left: 50%; margin-left: 70px; margin-top: -22.5px; }
        .icon4 { top: 50%; left: 50%; margin-left: 210px; margin-top: -22.5px; }

        #start-button {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            padding: 20px 40px;
            font-size: 20px;
            background: rgba(0, 122, 255, 0.9);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #start-button:hover {
            background: rgba(0, 122, 255, 1);
        }

        .hidden {
            display: none;
        }

        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0, 122, 255, 0.8);
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(0, 122, 255, 0.8);
            pointer-events: none;
            z-index: 10;
            transform: translate(-50%, -50%);
        }

        .cursor.pinching {
            background: rgba(255, 45, 85, 0.9);
            box-shadow: 0 0 30px rgba(255, 45, 85, 1);
            transform: translate(-50%, -50%) scale(1.5);
        }

        #loading {
            position: fixed;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 101;
        }

        #debug {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 12px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 101;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <button id="start-button">Start AR Hand Tracking</button>
    <div id="loading" class="hidden">Loading hand tracking...</div>
    <div id="debug" class="hidden"></div>
    
    <video id="camera" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    
    <div class="ui-container hidden" id="ui-container">
        <div class="icon icon1" data-app="ai">
            <img src="https://cdn-icons-png.flaticon.com/512/8943/8943377.png" alt="AI">
            <span class="icon-label">AI Assistant</span>
        </div>
        <div class="icon icon2" data-app="gmail">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968534.png" alt="Gmail">
            <span class="icon-label">Gmail</span>
        </div>
        <div class="icon icon3" data-app="appstore">
            <img src="https://cdn-icons-png.flaticon.com/512/888/888841.png" alt="App Store">
            <span class="icon-label">App Store</span>
        </div>
        <div class="icon icon4" data-app="music">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968959.png" alt="Apple Music">
            <span class="icon-label">Apple Music</span>
        </div>
    </div>

    <div class="cursor hidden" id="cursor"></div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <script>
        const startButton = document.getElementById('start-button');
        const loading = document.getElementById('loading');
        const camera = document.getElementById('camera');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const uiContainer = document.getElementById('ui-container');
        const cursor = document.getElementById('cursor');
        const icons = document.querySelectorAll('.icon');
        const debugDiv = document.getElementById('debug');

        let hands;
        let cameraInstance;
        let isTracking = false;
        let lastPinchTime = 0;
        let currentHoveredIcon = null;

        // Gyroscope data
        let gyroAlpha = 0;  // Rotation around Z axis (compass)
        let gyroBeta = 0;   // Rotation around X axis (tilt forward/back)
        let gyroGamma = 0;  // Rotation around Y axis (tilt left/right)
        let initialAlpha = null;
        let initialBeta = null;
        let initialGamma = null;

        startButton.addEventListener('click', async () => {
            try {
                startButton.classList.add('hidden');
                loading.classList.remove('hidden');

                // Request device orientation permission (iOS 13+)
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        alert('Device orientation permission denied');
                        loading.classList.add('hidden');
                        startButton.classList.remove('hidden');
                        return;
                    }
                }

                // Get camera stream - BACK CAMERA
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });

                camera.srcObject = stream;

                // Wait for video to be ready
                await new Promise((resolve) => {
                    camera.onloadedmetadata = () => {
                        canvas.width = camera.videoWidth;
                        canvas.height = camera.videoHeight;
                        resolve();
                    };
                });

                // Initialize MediaPipe Hands
                hands = new Hands({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                    }
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.7
                });

                hands.onResults(onResults);

                // Start camera processing
                cameraInstance = new Camera(camera, {
                    onFrame: async () => {
                        if (isTracking) {
                            await hands.send({ image: camera });
                        }
                    },
                    width: 1920,
                    height: 1080
                });

                await cameraInstance.start();

                // Start gyroscope tracking
                window.addEventListener('deviceorientation', handleOrientation, true);

                loading.classList.add('hidden');
                uiContainer.classList.remove('hidden');
                cursor.classList.remove('hidden');
                debugDiv.classList.remove('hidden');
                isTracking = true;

                // Make fullscreen automatically
                setTimeout(() => {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        document.documentElement.webkitRequestFullscreen();
                    } else if (document.documentElement.mozRequestFullScreen) {
                        document.documentElement.mozRequestFullScreen();
                    } else if (document.documentElement.msRequestFullscreen) {
                        document.documentElement.msRequestFullscreen();
                    }
                }, 100);
            } catch (err) {
                alert('Error: ' + err.message);
                loading.classList.add('hidden');
                startButton.classList.remove('hidden');
            }
        });

        function handleOrientation(event) {
            gyroAlpha = event.alpha || 0;  // 0-360 degrees (compass)
            gyroBeta = event.beta || 0;    // -180 to 180 degrees (front/back tilt)
            gyroGamma = event.gamma || 0;  // -90 to 90 degrees (left/right tilt)

            // Set initial position (calibrate)
            if (initialAlpha === null) {
                initialAlpha = gyroAlpha;
                initialBeta = gyroBeta;
                initialGamma = gyroGamma;
            }

            // Calculate rotation deltas
            let deltaAlpha = gyroAlpha - initialAlpha;
            let deltaBeta = gyroBeta - initialBeta;
            let deltaGamma = gyroGamma - initialGamma;

            // Apply rotation to UI container (icons stay in world space)
            // Multiply by sensitivity factor to control how much icons move
            const sensitivity = 2;
            const rotateY = deltaGamma * sensitivity;  // Left/Right head movement
            const rotateX = -deltaBeta * sensitivity;  // Up/Down head movement

            uiContainer.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;

            // Debug info
            debugDiv.innerHTML = `
                Gyro: α:${gyroAlpha.toFixed(1)}° β:${gyroBeta.toFixed(1)}° γ:${gyroGamma.toFixed(1)}°<br>
                Delta: Y:${rotateY.toFixed(1)}° X:${rotateX.toFixed(1)}°
            `;
        }

        function onResults(results) {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Draw hand skeleton
                drawConnectors(ctx, landmarks, HAND_CONNECTIONS, { color: 'rgba(0, 255, 255, 0.3)', lineWidth: 2 });
                drawLandmarks(ctx, landmarks, { color: 'rgba(255, 255, 255, 0.5)', lineWidth: 1, radius: 3 });

                // Get index finger tip (landmark 8)
                const indexTip = landmarks[8];
                const indexTipX = indexTip.x * window.innerWidth;
                const indexTipY = indexTip.y * window.innerHeight;

                // Get thumb tip (landmark 4)
                const thumbTip = landmarks[4];
                const thumbTipX = thumbTip.x * window.innerWidth;
                const thumbTipY = thumbTip.y * window.innerHeight;

                // Calculate distance for pinch detection
                const distance = Math.sqrt(
                    Math.pow(indexTipX - thumbTipX, 2) + 
                    Math.pow(indexTipY - thumbTipY, 2)
                );

                const isPinching = distance < 40;

                // Update cursor position
                cursor.style.left = indexTipX + 'px';
                cursor.style.top = indexTipY + 'px';

                if (isPinching) {
                    cursor.classList.add('pinching');
                } else {
                    cursor.classList.remove('pinching');
                }

                // Check icon hover and click
                let hoveredIcon = null;
                icons.forEach(icon => {
                    const rect = icon.getBoundingClientRect();
                    const isHovering = (
                        indexTipX >= rect.left &&
                        indexTipX <= rect.right &&
                        indexTipY >= rect.top &&
                        indexTipY <= rect.bottom
                    );

                    if (isHovering) {
                        hoveredIcon = icon;
                        icon.classList.add('hovering');

                        // Click on pinch
                        if (isPinching && Date.now() - lastPinchTime > 500) {
                            lastPinchTime = Date.now();
                            const appName = icon.dataset.app;
                            handleAppClick(appName);
                        }
                    } else {
                        icon.classList.remove('hovering');
                    }
                });

                currentHoveredIcon = hoveredIcon;
            } else {
                // No hand detected
                cursor.style.display = 'none';
                icons.forEach(icon => icon.classList.remove('hovering'));
                currentHoveredIcon = null;
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                cursor.style.display = 'block';
            }
        }

        function handleAppClick(appName) {
            // Visual feedback
            const clickedIcon = document.querySelector(`[data-app="${appName}"]`);
            const originalTransform = clickedIcon.style.transform;
            clickedIcon.style.transform = 'scale(0.9)';
            setTimeout(() => {
                clickedIcon.style.transform = originalTransform;
            }, 200);

            // Haptic feedback (if supported)
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }

            // Alert (replace with actual app launch logic)
            alert(`Opening ${appName}!`);
        }
    </script>
</body>
</html>
