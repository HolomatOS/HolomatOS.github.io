<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>AR World Builder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --neon: #00ffe7;
    --neon2: #ff3cac;
    --dark: #090912;
    --glass: rgba(9,9,18,0.75);
    --border: rgba(0,255,231,0.25);
  }

  body {
    background: var(--dark);
    font-family: 'Syne', sans-serif;
    color: #fff;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ── LANDING SCREEN ── */
  #landing {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding: 32px 24px;
    text-align: center;
    position: relative;
    z-index: 10;
  }

  .logo-ring {
    width: 96px; height: 96px;
    border-radius: 50%;
    border: 2px solid var(--neon);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 24px var(--neon), inset 0 0 24px rgba(0,255,231,0.08);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .logo-ring svg { width: 44px; height: 44px; }

  @keyframes pulse {
    0%,100% { box-shadow: 0 0 18px var(--neon), inset 0 0 18px rgba(0,255,231,0.06); }
    50%      { box-shadow: 0 0 36px var(--neon), inset 0 0 32px rgba(0,255,231,0.14); }
  }

  h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
  h1 span { color: var(--neon); }

  .subtitle {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .req-list {
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 22px;
    width: 100%;
    max-width: 340px;
    text-align: left;
  }
  .req-list p {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.5);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .req-list li {
    list-style: none;
    font-size: 0.82rem;
    padding: 5px 0;
    color: rgba(255,255,255,0.75);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .req-list li::before { content: '→'; color: var(--neon); font-size: 0.75rem; }

  #start-btn {
    background: transparent;
    border: 2px solid var(--neon);
    color: var(--neon);
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 16px 44px;
    border-radius: 100px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: color 0.3s, background 0.3s, box-shadow 0.3s;
    width: 100%;
    max-width: 260px;
  }
  #start-btn:hover, #start-btn:active {
    background: var(--neon);
    color: var(--dark);
    box-shadow: 0 0 28px var(--neon);
  }
  #start-btn:disabled {
    border-color: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.25);
    cursor: not-allowed;
    box-shadow: none;
    background: transparent;
  }

  #status-msg {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--neon2);
    min-height: 18px;
    letter-spacing: 0.05em;
  }

  /* ── AR CANVAS ── */
  #ar-canvas {
    position: fixed;
    inset: 0;
    display: none;
    touch-action: none;
  }

  /* ── AR HUD ── */
  #ar-hud {
    display: none;
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
  }
  #ar-hud.active { display: block; }

  /* Top bar */
  .hud-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 20px 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .hud-tag {
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--neon);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    pointer-events: auto;
  }

  #exit-btn {
    background: rgba(255,60,172,0.12);
    border: 1px solid rgba(255,60,172,0.4);
    color: var(--neon2);
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    padding: 6px 14px;
    border-radius: 100px;
    cursor: pointer;
    pointer-events: auto;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background 0.2s;
  }
  #exit-btn:hover { background: rgba(255,60,172,0.3); }

  /* Object count */
  #obj-count {
    position: absolute;
    top: 72px; left: 50%;
    transform: translateX(-50%);
    background: var(--glass);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 5px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  /* Hint pill */
  #hint {
    position: absolute;
    bottom: 180px; left: 50%;
    transform: translateX(-50%);
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.7);
    text-align: center;
    white-space: nowrap;
    transition: opacity 0.5s;
  }

  /* Object picker */
  .obj-picker {
    position: absolute;
    bottom: 28px; left: 0; right: 0;
    display: flex;
    gap: 12px;
    justify-content: center;
    padding: 0 16px;
    pointer-events: auto;
    flex-wrap: nowrap;
    overflow-x: auto;
  }

  .obj-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: var(--glass);
    backdrop-filter: blur(14px);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px;
    min-width: 64px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    pointer-events: auto;
    flex-shrink: 0;
  }
  .obj-btn:active { transform: scale(0.93); }
  .obj-btn.selected {
    border-color: var(--neon);
    box-shadow: 0 0 14px rgba(0,255,231,0.35);
  }
  .obj-btn .icon { font-size: 1.5rem; }
  .obj-btn .label {
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.5);
  }
  .obj-btn.selected .label { color: var(--neon); }

  /* Place button */
  #place-btn {
    position: absolute;
    bottom: 140px; left: 50%;
    transform: translateX(-50%);
    background: var(--neon);
    color: var(--dark);
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    border: none;
    border-radius: 100px;
    padding: 14px 36px;
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 0 24px rgba(0,255,231,0.5);
    transition: transform 0.15s, box-shadow 0.2s;
    display: none;
  }
  #place-btn:active { transform: translateX(-50%) scale(0.94); }
  #place-btn.visible { display: block; }

  /* Clear btn */
  #clear-btn {
    position: absolute;
    top: 72px; right: 20px;
    background: rgba(255,60,172,0.1);
    border: 1px solid rgba(255,60,172,0.3);
    color: var(--neon2);
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    padding: 5px 12px;
    border-radius: 100px;
    cursor: pointer;
    pointer-events: auto;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: background 0.2s;
  }
  #clear-btn:hover { background: rgba(255,60,172,0.25); }

  /* BG noise */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }
</style>
</head>
<body>

<!-- LANDING -->
<div id="landing">
  <div class="logo-ring">
    <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="22" cy="22" r="10" stroke="#00ffe7" stroke-width="1.5"/>
      <line x1="22" y1="4" x2="22" y2="12" stroke="#00ffe7" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="22" y1="32" x2="22" y2="40" stroke="#00ffe7" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="22" x2="12" y2="22" stroke="#00ffe7" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="32" y1="22" x2="40" y2="22" stroke="#00ffe7" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="22" cy="22" r="3" fill="#00ffe7"/>
    </svg>
  </div>

  <div>
    <h1>AR <span>World</span><br/>Builder</h1>
    <p class="subtitle" style="margin-top:8px;">WebXR · Hit Test · 3D Objects</p>
  </div>

  <ul class="req-list">
    <p>Requirements</p>
    <li>Android Chrome 81+ (latest)</li>
    <li>ARCore installed & updated</li>
    <li>Moto G Stylus 2025 ✓</li>
    <li>Serve over HTTPS or localhost</li>
  </ul>

  <button id="start-btn">Launch AR</button>
  <p id="status-msg"></p>
</div>

<!-- AR CANVAS (Three.js renders here) -->
<canvas id="ar-canvas"></canvas>

<!-- AR HUD -->
<div id="ar-hud">
  <div class="hud-top">
    <div class="hud-tag">▸ AR LIVE</div>
    <button id="exit-btn">✕ Exit</button>
  </div>

  <div id="obj-count">0 objects placed</div>
  <button id="clear-btn">Clear All</button>

  <div id="hint">Move your phone to scan a surface…</div>

  <button id="place-btn">⊕ Place Object</button>

  <div class="obj-picker">
    <button class="obj-btn selected" data-shape="box">
      <span class="icon">⬛</span>
      <span class="label">Cube</span>
    </button>
    <button class="obj-btn" data-shape="sphere">
      <span class="icon">🔵</span>
      <span class="label">Sphere</span>
    </button>
    <button class="obj-btn" data-shape="cone">
      <span class="icon">🔺</span>
      <span class="label">Cone</span>
    </button>
    <button class="obj-btn" data-shape="torus">
      <span class="icon">🍩</span>
      <span class="label">Torus</span>
    </button>
    <button class="obj-btn" data-shape="cylinder">
      <span class="icon">🥫</span>
      <span class="label">Cylinder</span>
    </button>
  </div>
</div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ─────────────────────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────────────────────
let renderer, scene, camera;
let xrSession = null;
let hitTestSource = null;
let hitTestSourceRequested = false;
let reticle = null;
let placedObjects = [];
let hitPoseAvailable = false;
let currentHitMatrix = new THREE.Matrix4();
let selectedShape = 'box';
let objectCount = 0;

// ─────────────────────────────────────────────────────────────
//  DOM
// ─────────────────────────────────────────────────────────────
const startBtn   = document.getElementById('start-btn');
const statusMsg  = document.getElementById('status-msg');
const arCanvas   = document.getElementById('ar-canvas');
const arHud      = document.getElementById('ar-hud');
const landing    = document.getElementById('landing');
const placeBtn   = document.getElementById('place-btn');
const hintEl     = document.getElementById('hint');
const objCountEl = document.getElementById('obj-count');
const exitBtn    = document.getElementById('exit-btn');
const clearBtn   = document.getElementById('clear-btn');
const objBtns    = document.querySelectorAll('.obj-btn');

// ─────────────────────────────────────────────────────────────
//  CHECK WebXR SUPPORT
// ─────────────────────────────────────────────────────────────
(async () => {
  if (!navigator.xr) {
    statusMsg.textContent = '✗ WebXR not available in this browser';
    startBtn.disabled = true;
    return;
  }
  const supported = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
  if (!supported) {
    statusMsg.textContent = '✗ AR not supported — check ARCore & Chrome';
    startBtn.disabled = true;
  } else {
    statusMsg.textContent = '✓ AR ready — tap Launch AR';
  }
})();

// ─────────────────────────────────────────────────────────────
//  INIT THREE.JS
// ─────────────────────────────────────────────────────────────
function initThree() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);

  renderer = new THREE.WebGLRenderer({
    canvas: arCanvas,
    antialias: true,
    alpha: true
  });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.shadowMap.enabled = true;

  // Lighting
  const ambient = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.2);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
  dirLight.position.set(1, 3, 2);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // Reticle (placement indicator)
  const ringGeo = new THREE.RingGeometry(0.08, 0.10, 32);
  ringGeo.applyMatrix4(new THREE.Matrix4().makeRotationX(-Math.PI / 2));
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x00ffe7,
    transparent: true,
    opacity: 0.85,
    side: THREE.DoubleSide
  });
  reticle = new THREE.Mesh(ringGeo, ringMat);
  reticle.visible = false;

  // Inner dot
  const dotGeo = new THREE.CircleGeometry(0.025, 24);
  dotGeo.applyMatrix4(new THREE.Matrix4().makeRotationX(-Math.PI / 2));
  const dotMat = new THREE.MeshBasicMaterial({ color: 0x00ffe7, transparent: true, opacity: 0.6 });
  const dot = new THREE.Mesh(dotGeo, dotMat);
  reticle.add(dot);
  scene.add(reticle);

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });
}

// ─────────────────────────────────────────────────────────────
//  GEOMETRY FACTORY
// ─────────────────────────────────────────────────────────────
const COLORS = [0x00ffe7, 0xff3cac, 0xf7d94c, 0x7b61ff, 0x4cffa0, 0xff6b35];

function createGeometry(shape) {
  switch(shape) {
    case 'sphere':    return new THREE.SphereGeometry(0.08, 24, 24);
    case 'cone':      return new THREE.ConeGeometry(0.07, 0.18, 24);
    case 'torus':     return new THREE.TorusGeometry(0.07, 0.025, 16, 64);
    case 'cylinder':  return new THREE.CylinderGeometry(0.055, 0.055, 0.16, 24);
    default:          return new THREE.BoxGeometry(0.12, 0.12, 0.12);
  }
}

function placeObject(matrix) {
  const geo = createGeometry(selectedShape);
  const color = COLORS[objectCount % COLORS.length];
  const mat = new THREE.MeshPhongMaterial({
    color,
    shininess: 90,
    emissive: color,
    emissiveIntensity: 0.12
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  // Position from hit matrix
  mesh.position.setFromMatrixPosition(matrix);
  mesh.position.y += 0.06; // slightly above surface

  // Random spin
  mesh.rotation.y = Math.random() * Math.PI * 2;

  // Store for animation
  mesh.userData.spinSpeed = (Math.random() - 0.5) * 0.02;
  mesh.userData.bobOffset = Math.random() * Math.PI * 2;
  mesh.userData.baseY = mesh.position.y;

  scene.add(mesh);
  placedObjects.push(mesh);
  objectCount++;
  updateObjCount();

  // Flash reticle
  flashReticle();
}

function flashReticle() {
  if (!reticle) return;
  reticle.material.opacity = 1;
  let t = 0;
  const iv = setInterval(() => {
    t++;
    reticle.material.opacity = 0.85 - Math.sin(t * 0.4) * 0.3;
    if (t > 20) { reticle.material.opacity = 0.85; clearInterval(iv); }
  }, 30);
}

function updateObjCount() {
  objCountEl.textContent = `${objectCount} object${objectCount !== 1 ? 's' : ''} placed`;
}

// ─────────────────────────────────────────────────────────────
//  START AR SESSION
// ─────────────────────────────────────────────────────────────
async function startAR() {
  startBtn.disabled = true;
  statusMsg.textContent = 'Starting AR session…';

  initThree();

  try {
    xrSession = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay', 'light-estimation'],
      domOverlay: { root: document.getElementById('ar-hud') }
    });
  } catch(e) {
    statusMsg.textContent = '✗ Could not start AR: ' + e.message;
    startBtn.disabled = false;
    return;
  }

  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(xrSession);

  // Show AR UI
  landing.style.display = 'none';
  arCanvas.style.display = 'block';
  arHud.classList.add('active');

  xrSession.addEventListener('end', onSessionEnd);
  renderer.setAnimationLoop(onXRFrame);
}

// ─────────────────────────────────────────────────────────────
//  XR FRAME LOOP
// ─────────────────────────────────────────────────────────────
function onXRFrame(time, frame) {
  if (!frame) return;

  const referenceSpace = renderer.xr.getReferenceSpace();
  const session = renderer.xr.getSession();

  // Request hit test source once
  if (!hitTestSourceRequested) {
    session.requestReferenceSpace('viewer').then(viewerSpace => {
      session.requestHitTestSource({ space: viewerSpace }).then(source => {
        hitTestSource = source;
      });
    });
    hitTestSourceRequested = true;
  }

  // Run hit test
  if (hitTestSource) {
    const results = frame.getHitTestResults(hitTestSource);
    if (results.length > 0) {
      const hit = results[0];
      const pose = hit.getPose(referenceSpace);
      if (pose) {
        hitPoseAvailable = true;
        currentHitMatrix.fromArray(pose.transform.matrix);
        reticle.visible = true;
        reticle.position.setFromMatrixPosition(currentHitMatrix);
        reticle.quaternion.setFromRotationMatrix(currentHitMatrix);

        // Update hint & place button
        hintEl.style.opacity = '0';
        placeBtn.classList.add('visible');
      }
    } else {
      hitPoseAvailable = false;
      reticle.visible = false;
      placeBtn.classList.remove('visible');
      hintEl.style.opacity = '1';
    }
  }

  // Animate placed objects
  const t = time * 0.001;
  for (const obj of placedObjects) {
    obj.rotation.y += obj.userData.spinSpeed;
    obj.position.y = obj.userData.baseY + Math.sin(t * 1.2 + obj.userData.bobOffset) * 0.008;
  }

  renderer.render(scene, camera);
}

// ─────────────────────────────────────────────────────────────
//  SESSION END
// ─────────────────────────────────────────────────────────────
function onSessionEnd() {
  hitTestSource = null;
  hitTestSourceRequested = false;
  hitPoseAvailable = false;
  placedObjects = [];
  objectCount = 0;
  xrSession = null;

  arCanvas.style.display = 'none';
  arHud.classList.remove('active');
  landing.style.display = 'flex';
  startBtn.disabled = false;
  statusMsg.textContent = '✓ Session ended. Tap to restart.';

  renderer.setAnimationLoop(null);
}

// ─────────────────────────────────────────────────────────────
//  CONTROLS
// ─────────────────────────────────────────────────────────────
startBtn.addEventListener('click', startAR);

placeBtn.addEventListener('click', () => {
  if (hitPoseAvailable) placeObject(currentHitMatrix);
});

exitBtn.addEventListener('click', () => {
  if (xrSession) xrSession.end();
});

clearBtn.addEventListener('click', () => {
  for (const obj of placedObjects) scene.remove(obj);
  placedObjects = [];
  objectCount = 0;
  updateObjCount();
});

objBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    objBtns.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedShape = btn.dataset.shape;
  });
});
</script>
</body>
</html>
