<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>YOLO Scan</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4"></script>
  <script async src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2"></script>
  <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.4.1633559619"></script>
  <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1633559619"></script>
  <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.4.1633559619"></script>
  <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1633559619"></script>
  <style>
    html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:Arial;touch-action:none}
    .container{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column}
    video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:none}
    canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:none}
    .timer{color:#0ff;font-size:min(80px,15vw);font-weight:bold;z-index:10;text-shadow:0 0 30px #0ff}
    .fullscreen-btn{margin-top:30px;padding:15px 40px;background:#0ff;color:#000;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 0 20px #0ff;z-index:10;text-transform:uppercase;letter-spacing:2px}
    .fullscreen-btn:active{background:#0aa;transform:scale(0.95)}
    .hud-top-left{position:absolute;top:10px;left:10px;width:min(280px,calc(100vw - 40px));background:rgba(0,255,255,0.1);border:2px solid #0ff;border-radius:8px;padding:10px;color:#0ff;font-size:12px;display:none;z-index:5;font-family:monospace;flex-direction:column}
    .hud-middle-left{position:absolute;top:50%;left:10px;transform:translateY(-50%);width:min(280px,calc(100vw - 40px));background:rgba(0,255,255,0.1);border:2px solid #0ff;border-radius:8px;padding:10px;color:#0ff;font-size:11px;display:none;z-index:5;max-height:40vh;overflow-y:auto;font-family:monospace;flex-direction:column}
    .hud-top-left.visible, .hud-middle-left.visible {display:flex;}
    .hud-title{font-weight:bold;margin-bottom:8px;border-bottom:1px solid #0ff;padding-bottom:6px;font-size:13px}
    .hud-content{line-height:1.6;display:flex;flex-direction:column;gap:5px}
    .loading{color:#6f6;font-style:italic}
    .object-box{color:#0f0;margin:5px 0;padding:5px;background:rgba(0,255,0,0.1);border-left:2px solid #0f0;display:flex;align-items:center;font-size:11px}
    .compass-container{position:absolute;bottom:20px;left:20px;width:120px;height:120px;display:none;align-items:center;justify-content:center;z-index:5;filter:drop-shadow(0 0 25px rgba(0,255,255,0.6))}
    .compass-container.visible {display:flex;}
    .compass-dial{position:absolute;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(50,100,150,0.9),rgba(10,30,60,0.95));border:3px solid;border-color:#0ff #00a0c0 #0088aa #0ff;display:flex;align-items:center;justify-content:center;font-size:9px;color:#0ff;font-family:monospace;font-weight:bold;letter-spacing:2px;box-shadow:inset 0 0 20px rgba(0,0,0,0.8),inset 0 2px 5px rgba(255,255,255,0.1),0 0 30px rgba(0,255,255,0.4)}
    .compass-rings{position:absolute;width:110px;height:110px;border-radius:50%;border:1px solid rgba(0,255,255,0.3)}
    .compass-rings-outer{width:105px;height:105px;border-radius:50%;border:1px dashed rgba(0,200,255,0.2);position:absolute;top:2.5px;left:2.5px}
    .compass-ticks{position:absolute;width:110px;height:110px;border-radius:50%}
    .tick{position:absolute;width:1px;background:#0ff;left:50%;top:2px;transform-origin:0 53px}
    .tick.major{height:7px;background:#0f0;width:2px}
    .tick.minor{height:4px;opacity:0.6}
    .compass-cardinal{position:absolute;width:100px;height:100px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#0f0;font-weight:bold;text-shadow:0 0 8px rgba(0,255,0,0.8);z-index:3}
    .compass-cardinal span{position:absolute}
    .compass-cardinal span:nth-child(1){top:6px;color:#0f0;text-shadow:0 0 10px #0f0}
    .compass-cardinal span:nth-child(2){left:6px;color:#0ff}
    .compass-cardinal span:nth-child(3){right:6px;color:#0ff}
    .compass-cardinal span:nth-child(4){bottom:6px;color:#ff3333}
    .needle-container{position:absolute;width:110px;height:110px;z-index:6}
    .compass-needle{position:absolute;width:3px;height:50px;background:linear-gradient(180deg,#0f0 0%,#00ff00 40%,#0099ff 60%,#0077ff 100%);border-radius:2px;left:50%;top:8px;transform-origin:center 50px;box-shadow:0 0 12px rgba(0,255,0,0.9),0 0 25px rgba(0,200,255,0.6);z-index:10;filter:drop-shadow(0 0 5px rgba(0,255,0,0.8))}
    .compass-center{position:absolute;width:12px;height:12px;background:radial-gradient(circle at 30% 30%,#00ff00,#00aa00);border-radius:50%;border:2px solid #0ff;top:50%;left:50%;transform:translate(-50%,-50%);z-index:11;box-shadow:0 0 15px rgba(0,255,0,0.9),inset 0 0 8px rgba(255,255,255,0.3),0 0 25px rgba(0,200,255,0.6)}
    .compass-heading{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);color:#0f0;font-size:10px;font-family:monospace;font-weight:bold;letter-spacing:1px;white-space:nowrap;text-shadow:0 0 10px rgba(0,255,0,0.8)}
    .audio-visualizer{position:absolute;top:10px;right:10px;width:min(200px,40vw);height:40px;display:none;align-items:center;justify-content:center;z-index:5;background:rgba(0,20,40,0.6);border:2px solid #0ff;border-radius:8px;padding:8px;gap:2px;filter:drop-shadow(0 0 15px rgba(255,0,255,0.5))}
    .audio-visualizer.visible {display:flex;}
    .audio-bar{width:3px;background:linear-gradient(180deg,#ff00ff,#ff69b4);border-radius:2px;box-shadow:0 0 10px #ff00ff;transition:height 50ms ease-out;min-height:3px}
    .detail-panel{position:absolute;bottom:20px;right:10px;width:min(250px,calc(100vw - 40px));background:rgba(0,20,40,0.95);border:2px solid #0ff;border-radius:8px;padding:12px;color:#0f0;font-family:monospace;font-size:11px;display:none;z-index:10;flex-direction:column;gap:6px;box-shadow:0 0 20px rgba(0,255,255,0.5)}
    .detail-panel.visible {display:flex;}
    .detail-title{font-weight:bold;color:#0ff;border-bottom:1px solid #0ff;padding-bottom:6px;font-size:12px}
    .detail-row{display:flex;justify-content:space-between;border-bottom:1px solid rgba(0,255,255,0.2);padding:4px 0;font-size:10px}
    .detail-label{color:#0ff}
    .detail-value{color:#0f0;text-align:right}
    .close-btn{align-self:flex-end;background:#ff3333;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-weight:bold;font-size:10px}
    .hand-canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:none;z-index:4}
    .pose-canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:none;z-index:4}
  </style>
</head>
<body>
  <div class="container">
    <div class="timer" id="timer">10</div>
    <button class="fullscreen-btn" id="fullscreenBtn">Enter Fullscreen</button>
  </div>
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <canvas id="handCanvas" class="hand-canvas"></canvas>
  
  <div class="hud-top-left" id="hudTopLeft">
    <div class="hud-title">YOLO SYSTEM STATUS</div>
    <div class="hud-content">
      <div>TIME: <span id="timeDisplay">--:--:--</span></div>
      <div>DATE: <span id="dateDisplay">--/--/----</span></div>
      <div>MODEL: <span id="modelStatus">Loading...</span></div>
    </div>
  </div>
  <div class="hud-middle-left" id="hudMiddleLeft">
    <div class="hud-title">YOLO DETECTIONS</div>
    <div class="hud-content" id="objectsList">Scanning...</div>
  </div>

  <div class="compass-container" id="compassContainer">
    <div class="compass-dial">
      <div class="compass-rings"></div>
      <div class="compass-rings compass-rings-outer"></div>
      <div class="compass-ticks" id="compassTicks"></div>
      <div class="compass-cardinal" id="compassCardinal">
        <span>N</span>
        <span>W</span>
        <span>E</span>
        <span>S</span>
      </div>
      <div class="needle-container">
        <div class="compass-needle" id="compassNeedle"></div>
      </div>
      <div class="compass-center"></div>
      <div class="compass-heading" id="compassHeading">0°</div>
    </div>
  </div>

  <div class="audio-visualizer" id="audioVisualizer">
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
    <div class="audio-bar"></div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <div class="detail-title" id="detailName">🎯 OBJECT</div>
    <div class="detail-row">
      <span class="detail-label">Class:</span>
      <span class="detail-value" id="detailClass">-</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Confidence:</span>
      <span class="detail-value" id="detailConfidence">-</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Position X:</span>
      <span class="detail-value" id="detailX">-</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Position Y:</span>
      <span class="detail-value" id="detailY">-</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Width:</span>
      <span class="detail-value" id="detailWidth">-</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Height:</span>
      <span class="detail-value" id="detailHeight">-</span>
    </div>
    <button class="close-btn" onclick="closeDetailPanel()">CLOSE</button>
  </div>

<script>
const canvas = document.getElementById('canvas');
const camera = document.getElementById('camera');
const timer = document.getElementById('timer');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const ctx = canvas.getContext('2d');
const hudTopLeft = document.getElementById('hudTopLeft');
const hudMiddleLeft = document.getElementById('hudMiddleLeft');
const objectsList = document.getElementById('objectsList');
const timeDisplay = document.getElementById('timeDisplay');
const dateDisplay = document.getElementById('dateDisplay');
const modelStatus = document.getElementById('modelStatus');

let sweeping = false;
let sweepPos = 0;
let scanComplete = false;
let yoloSession = null;
let modelLoaded = false;
let audioContext = null;
let analyser = null;
let dataArray = null;
let detectedObjects = [];
let selectedObject = null;
let hands = null;
let handCanvasCtx = null;

// Fullscreen function
function enterFullscreen() {
  const elem = document.documentElement;
  if (elem.requestFullscreen) {
    elem.requestFullscreen();
  } else if (elem.webkitRequestFullscreen) {
    elem.webkitRequestFullscreen();
  } else if (elem.mozRequestFullScreen) {
    elem.mozRequestFullScreen();
  } else if (elem.msRequestFullscreen) {
    elem.msRequestFullscreen();
  }
}

// Fullscreen button click handler
fullscreenBtn.addEventListener('click', () => {
  enterFullscreen();
});

const classNames = [
  'person', 'bicycle', 'car', 'motorcycle', 'airplane', 'bus', 'train', 'truck', 'boat', 'traffic light',
  'fire hydrant', 'stop sign', 'parking meter', 'bench', 'cat', 'dog', 'horse', 'sheep', 'cow', 'elephant',
  'bear', 'zebra', 'giraffe', 'backpack', 'umbrella', 'handbag', 'tie', 'suitcase', 'frisbee', 'skis',
  'snowboard', 'sports ball', 'kite', 'baseball bat', 'baseball glove', 'skateboard', 'surfboard', 'tennis racket', 'bottle', 'wine glass',
  'cup', 'fork', 'knife', 'spoon', 'bowl', 'banana', 'apple', 'sandwich', 'orange', 'broccoli',
  'carrot', 'hot dog', 'pizza', 'donut', 'cake', 'chair', 'couch', 'potted plant', 'bed', 'dining table',
  'toilet', 'tv', 'laptop', 'mouse', 'remote', 'keyboard', 'microwave', 'oven', 'toaster', 'sink',
  'refrigerator', 'book', 'clock', 'vase', 'scissors', 'teddy bear', 'hair drier', 'toothbrush'
];

async function loadYOLOModel() {
  try {
    modelStatus.textContent = 'Loading YOLO...';
    console.log('Starting YOLO model load...');
    
    let tfReady = typeof tf !== 'undefined';
    let cocoReady = typeof cocoSsd !== 'undefined';
    
    if (!tfReady) {
      console.log('Waiting for TensorFlow...');
      let attempts = 0;
      while (!tfReady && attempts < 50) {
        await new Promise(resolve => setTimeout(resolve, 100));
        tfReady = typeof tf !== 'undefined';
        attempts++;
      }
      if (!tfReady) throw new Error('TensorFlow.js failed to load');
    }
    
    if (!cocoReady) {
      console.log('Waiting for COCO-SSD...');
      let attempts = 0;
      while (!cocoReady && attempts < 50) {
        await new Promise(resolve => setTimeout(resolve, 100));
        cocoReady = typeof cocoSsd !== 'undefined';
        attempts++;
      }
      if (!cocoReady) throw new Error('COCO-SSD failed to load');
    }
    
    console.log('Loading COCO-SSD model...');
    window.cocoSsdModel = await cocoSsd.load();
    
    modelLoaded = true;
    modelStatus.textContent = '✓ YOLO Ready';
    console.log('✓ YOLO model loaded successfully');
    
  } catch(err) {
    console.error('Model load error:', err);
    modelStatus.textContent = 'Error: ' + err.message;
  }
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const handCanvas = document.getElementById('handCanvas');
  handCanvas.width = window.innerWidth;
  handCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

async function requestCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: 'environment', width: {ideal: 1280}, height: {ideal: 720}}
    });
    camera.srcObject = stream;
  } catch(err) {
    console.error('Camera error:', err);
  }
}

function updateTimeDate() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const mins = String(now.getMinutes()).padStart(2, '0');
  const secs = String(now.getSeconds()).padStart(2, '0');
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  const year = now.getFullYear();
  
  timeDisplay.textContent = `${hours}:${mins}:${secs}`;
  dateDisplay.textContent = `${month}/${day}/${year}`;
}

async function analyzeFrameWithYOLO() {
  if (!scanComplete || !modelLoaded) return;
  
  try {
    const predictions = await window.cocoSsdModel.detect(canvas);
    
    if (predictions.length === 0) {
      objectsList.innerHTML = '<span class="loading">No objects detected</span>';
      detectedObjects = [];
      return;
    }
    
    let detectionHTML = '';
    const drawnBoxes = new Set();
    detectedObjects = [];
    
    predictions.forEach((prediction) => {
      const [x, y, width, height] = prediction.bbox;
      const confidence = Math.round(prediction.score * 100);
      
      if (!drawnBoxes.has(prediction.class)) {
        detectionHTML += `<div class="object-box">▪ ${prediction.class} (${confidence}%)</div>`;
        drawnBoxes.add(prediction.class);
      }
      
      detectedObjects.push({
        name: prediction.class,
        x: x,
        y: y,
        width: width,
        height: height,
        confidence: confidence
      });
    });
    
    objectsList.innerHTML = detectionHTML || '<span class="loading">Detecting...</span>';
    
  } catch(err) {
    objectsList.innerHTML = '<span class="loading">YOLO Error</span>';
    console.error('YOLO detection error:', err);
  }
}

function continueLiveCamera() {
  ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);
  
  if (scanComplete && modelLoaded) {
    analyzeFrameWithYOLO();
  }
  
  requestAnimationFrame(continueLiveCamera);
}

function sweep() {
  if (!sweeping) return;
  
  ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);
  
  if (sweepPos <= canvas.width) {
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(sweepPos, 0);
    ctx.lineTo(sweepPos, canvas.height);
    ctx.stroke();
    
    sweepPos += 2;
    requestAnimationFrame(sweep);
  } else {
    sweeping = false;
    scanComplete = true;
    
    document.getElementById('hudTopLeft').classList.add('visible');
    document.getElementById('hudMiddleLeft').classList.add('visible');
    document.getElementById('compassContainer').classList.add('visible');
    document.getElementById('audioVisualizer').classList.add('visible');
    
    objectsList.textContent = 'Detecting objects...';
    
    // Start audio visualizer if it's ready
    if (analyser && dataArray) {
      updateAudioVisualizer();
    }
    
    continueLiveCamera();
  }
}

requestCamera();
loadYOLOModel();

let currentHeading = 0;

function initializeCompass() {
  createCompassMarkings();
  
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(permissionState => {
        if (permissionState === 'granted') {
          window.addEventListener('deviceorientationabsolute', updateCompass, true);
          window.addEventListener('deviceorientation', updateCompass);
        }
      })
      .catch(console.error);
  } else {
    window.addEventListener('deviceorientationabsolute', updateCompass, true);
    window.addEventListener('deviceorientation', updateCompass);
  }
}

function createCompassMarkings() {
  const ticksContainer = document.getElementById('compassTicks');
  
  for (let i = 0; i < 360; i += 2) {
    const tick = document.createElement('div');
    tick.className = 'tick ' + (i % 30 === 0 ? 'major' : 'minor');
    tick.style.transform = `rotate(${i}deg)`;
    ticksContainer.appendChild(tick);
  }
}

function updateCompass(event) {
  let heading = event.alpha;
  
  if (heading === null) {
    heading = event.webkitCompassHeading || 0;
  }
  
  heading = (heading + 360) % 360;
  currentHeading = heading;
  
  const cardinal = document.getElementById('compassCardinal');
  cardinal.style.transform = `rotate(${heading}deg)`;
  
  const headingDisplay = document.getElementById('compassHeading');
  let direction = 'N';
  if (heading > 337.5 || heading <= 22.5) direction = 'N';
  else if (heading > 22.5 && heading <= 67.5) direction = 'NE';
  else if (heading > 67.5 && heading <= 112.5) direction = 'E';
  else if (heading > 112.5 && heading <= 157.5) direction = 'SE';
  else if (heading > 157.5 && heading <= 202.5) direction = 'S';
  else if (heading > 202.5 && heading <= 247.5) direction = 'SW';
  else if (heading > 247.5 && heading <= 292.5) direction = 'W';
  else if (heading > 292.5 && heading <= 337.5) direction = 'NW';
  
  headingDisplay.textContent = Math.round(heading) + '° ' + direction;
}

function getObjectAtPoint(x, y) {
  for (let obj of detectedObjects) {
    if (x >= obj.x && x <= obj.x + obj.width && y >= obj.y && y <= obj.y + obj.height) {
      return obj;
    }
  }
  return null;
}

function showDetailPanel(obj) {
  const panel = document.getElementById('detailPanel');
  document.getElementById('detailName').textContent = '🎯 ' + obj.name.toUpperCase();
  document.getElementById('detailClass').textContent = obj.name;
  document.getElementById('detailConfidence').textContent = obj.confidence + '%';
  document.getElementById('detailX').textContent = Math.round(obj.x);
  document.getElementById('detailY').textContent = Math.round(obj.y);
  document.getElementById('detailWidth').textContent = Math.round(obj.width);
  document.getElementById('detailHeight').textContent = Math.round(obj.height);
  
  selectedObject = obj;
  panel.classList.add('visible');
}

function closeDetailPanel() {
  document.getElementById('detailPanel').classList.remove('visible');
  selectedObject = null;
}

window.addEventListener('load', () => {
  initializeCompass();
  
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    
    const obj = getObjectAtPoint(x, y);
    if (obj) {
      showDetailPanel(obj);
    }
  });
  
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length > 0) {
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
      const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
      
      const obj = getObjectAtPoint(x, y);
      if (obj) {
        showDetailPanel(obj);
      }
    }
  }, {passive: false});
});

async function initializeAudioVisualizer() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    const bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
    console.log('Audio visualizer initialized');
  } catch(err) {
    console.error('Audio visualizer error:', err);
  }
}

function updateAudioVisualizer() {
  if (!analyser || !dataArray) return;
  
  analyser.getByteFrequencyData(dataArray);
  
  const bars = document.querySelectorAll('.audio-bar');
  const step = Math.floor(dataArray.length / bars.length);
  
  bars.forEach((bar, index) => {
    const value = dataArray[index * step];
    const height = (value / 255) * 30;
    bar.style.height = Math.max(3, height) + 'px';
  });
  
  requestAnimationFrame(updateAudioVisualizer);
}

// Start countdown
let countdown = 10;
timer.textContent = countdown;

// Request microphone permission during countdown
initializeAudioVisualizer().catch(err => {
  console.log('Microphone permission denied or error:', err);
});

const countdownInterval = setInterval(() => {
  countdown--;
  timer.textContent = countdown;
  if (countdown <= 0) {
    clearInterval(countdownInterval);
    timer.style.display = 'none';
    fullscreenBtn.style.display = 'none';
    
    camera.style.display = 'block';
    canvas.style.display = 'block';
    sweeping = true;
    
    updateTimeDate();
    setInterval(updateTimeDate, 1000);
    
    sweep();
  }
}, 1000);
</script>
</body>
</html>
