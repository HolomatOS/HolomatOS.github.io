<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Cardboard Passthrough</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #camera {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .split-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: 2;
        }

        .eye {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .eye::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(0, 0, 0, 0.5);
            right: 0;
            z-index: 10;
        }

        .eye:last-child::after {
            display: none;
        }

        .icon {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.2s ease;
            overflow: hidden;
        }

        .icon img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .icon:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3);
        }

        .icon-label {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 500;
            color: white;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
            white-space: nowrap;
        }

        /* Row 1 - Top */
        .icon1 { top: 12%; left: 18%; }
        .icon2 { top: 12%; left: 38%; }
        .icon3 { top: 12%; left: 58%; }
        .icon4 { top: 12%; left: 78%; }

        /* Row 2 - Middle */
        .icon5 { top: 38%; left: 13%; }
        .icon6 { top: 38%; left: 33%; }
        .icon7 { top: 38%; left: 53%; }
        .icon8 { top: 38%; left: 73%; }

        /* Row 3 - Bottom */
        .icon9 { top: 64%; left: 23%; }
        .icon10 { top: 64%; left: 43%; }
        .icon11 { top: 64%; left: 63%; }
        .icon12 { top: 64%; left: 83%; }

        /* Left sidebar */
        .sidebar { top: 30%; left: 3%; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-3px);
            }
        }

        .icon::before {
            display: none;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0;
            }
        }

        #start-button {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            padding: 20px 40px;
            font-size: 20px;
            background: rgba(0, 122, 255, 0.9);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #start-button:hover {
            background: rgba(0, 122, 255, 1);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <button id="start-button">Start AR Experience</button>
    
    <video id="camera" autoplay playsinline></video>
    
    <div class="split-view hidden" id="split-view">
        <!-- Left Eye -->
        <div class="eye">
            <!-- Sidebar -->
            <div class="icon sidebar">
                <img src="https://cdn-icons-png.flaticon.com/512/2040/2040504.png" alt="People">
                <span class="icon-label">People</span>
            </div>
            
            <!-- Row 1 -->
            <div class="icon icon1">
                <img src="https://cdn-icons-png.flaticon.com/512/5977/5977575.png" alt="TV">
                <span class="icon-label">TV</span>
            </div>
            <div class="icon icon2">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111624.png" alt="Music">
                <span class="icon-label">Music</span>
            </div>
            <div class="icon icon3">
                <img src="https://cdn-icons-png.flaticon.com/512/2913/2913133.png" alt="Mindfulness">
                <span class="icon-label">Mindfulness</span>
            </div>
            <div class="icon icon4">
                <img src="https://cdn-icons-png.flaticon.com/512/2040/2040504.png" alt="Settings">
                <span class="icon-label">Settings</span>
            </div>

            <!-- Row 2 -->
            <div class="icon icon5">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968534.png" alt="Freeform">
                <span class="icon-label">Freeform</span>
            </div>
            <div class="icon icon6">
                <img src="https://cdn-icons-png.flaticon.com/512/565/565527.png" alt="Safari">
                <span class="icon-label">Safari</span>
            </div>
            <div class="icon icon7">
                <img src="https://cdn-icons-png.flaticon.com/512/1829/1829589.png" alt="Photos">
                <span class="icon-label">Photos</span>
            </div>
            <div class="icon icon8">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Notes">
                <span class="icon-label">Notes</span>
            </div>

            <!-- Row 3 -->
            <div class="icon icon9">
                <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Mail">
                <span class="icon-label">Mail</span>
            </div>
            <div class="icon icon10">
                <img src="https://cdn-icons-png.flaticon.com/512/134/134718.png" alt="Messages">
                <span class="icon-label">Messages</span>
            </div>
            <div class="icon icon11">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991235.png" alt="Keynote">
                <span class="icon-label">Keynote</span>
            </div>
            <div class="icon icon12">
                <img src="https://cdn-icons-png.flaticon.com/512/2702/2702602.png" alt="Apps">
                <span class="icon-label">Compatible Apps</span>
            </div>
        </div>

        <!-- Right Eye -->
        <div class="eye">
            <!-- Sidebar -->
            <div class="icon sidebar">
                <img src="https://cdn-icons-png.flaticon.com/512/2040/2040504.png" alt="People">
                <span class="icon-label">People</span>
            </div>
            
            <!-- Row 1 -->
            <div class="icon icon1">
                <img src="https://cdn-icons-png.flaticon.com/512/5977/5977575.png" alt="TV">
                <span class="icon-label">TV</span>
            </div>
            <div class="icon icon2">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111624.png" alt="Music">
                <span class="icon-label">Music</span>
            </div>
            <div class="icon icon3">
                <img src="https://cdn-icons-png.flaticon.com/512/2913/2913133.png" alt="Mindfulness">
                <span class="icon-label">Mindfulness</span>
            </div>
            <div class="icon icon4">
                <img src="https://cdn-icons-png.flaticon.com/512/2040/2040504.png" alt="Settings">
                <span class="icon-label">Settings</span>
            </div>

            <!-- Row 2 -->
            <div class="icon icon5">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968534.png" alt="Freeform">
                <span class="icon-label">Freeform</span>
            </div>
            <div class="icon icon6">
                <img src="https://cdn-icons-png.flaticon.com/512/565/565527.png" alt="Safari">
                <span class="icon-label">Safari</span>
            </div>
            <div class="icon icon7">
                <img src="https://cdn-icons-png.flaticon.com/512/1829/1829589.png" alt="Photos">
                <span class="icon-label">Photos</span>
            </div>
            <div class="icon icon8">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Notes">
                <span class="icon-label">Notes</span>
            </div>

            <!-- Row 3 -->
            <div class="icon icon9">
                <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Mail">
                <span class="icon-label">Mail</span>
            </div>
            <div class="icon icon10">
                <img src="https://cdn-icons-png.flaticon.com/512/134/134718.png" alt="Messages">
                <span class="icon-label">Messages</span>
            </div>
            <div class="icon icon11">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991235.png" alt="Keynote">
                <span class="icon-label">Keynote</span>
            </div>
            <div class="icon icon12">
                <img src="https://cdn-icons-png.flaticon.com/512/2702/2702602.png" alt="Apps">
                <span class="icon-label">Compatible Apps</span>
            </div>
        </div>
    </div>

    <script>
        const startButton = document.getElementById('start-button');
        const camera = document.getElementById('camera');
        const splitView = document.getElementById('split-view');

        startButton.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });

                camera.srcObject = stream;
                startButton.classList.add('hidden');
                splitView.classList.remove('hidden');

                // Make fullscreen
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }
            } catch (err) {
                alert('Camera access denied: ' + err.message);
            }
        });

        // Add click interaction to icons
        document.querySelectorAll('.icon').forEach(icon => {
            icon.addEventListener('click', function() {
                this.style.transform = 'scale(1.3)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });
        });
    </script>
</body>
</html>
