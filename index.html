<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hand Tracking Test - TensorFlow.js</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      padding: 15px;
      border-radius: 8px;
      font-size: 16px;
      z-index: 10;
      min-width: 200px;
    }
    .loading { color: #ff0 !important; }
    .detected { color: #0f0 !important; }
    .error { color: #f00 !important; }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="status" class="loading">
      <div>Status: Loading...</div>
      <div id="fps">FPS: --</div>
      <div id="hands">Hands: 0</div>
    </div>
  </div>

  <!-- TensorFlow.js HandPose -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const fpsDiv = document.getElementById('fps');
    const handsDiv = document.getElementById('hands');

    let model;
    let lastTime = Date.now();
    let frameCount = 0;

    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width: { ideal: 640 },
          height: { ideal: 480 }
        }
      });

      video.srcObject = stream;

      return new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          resolve(video);
        };
      });
    }

    async function loadModel() {
      updateStatus('Loading hand tracking model...', 'loading');
      
      // Load TensorFlow.js HandPose model
      model = await handpose.load({
        maxContinuousChecks: Infinity,
        detectionConfidence: 0.7,
        iouThreshold: 0.3,
        scoreThreshold: 0.7
      });
      
      updateStatus('Model loaded! Show your hand', 'detected');
    }

    function updateStatus(text, className) {
      statusDiv.querySelector('div').textContent = `Status: ${text}`;
      statusDiv.className = className;
    }

    async function detectHands() {
      const predictions = await model.estimateHands(video, true);

      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Update hand count
      handsDiv.textContent = `Hands: ${predictions.length}`;

      if (predictions.length > 0) {
        updateStatus('Hand detected!', 'detected');

        for (let i = 0; i < predictions.length; i++) {
          const hand = predictions[i];
          
          // Draw keypoints
          for (let j = 0; j < hand.landmarks.length; j++) {
            const [x, y] = hand.landmarks[j];
            
            // Draw circle at each landmark
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, 2 * Math.PI);
            ctx.fillStyle = j === 4 || j === 8 ? '#00ff00' : '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.stroke();
          }

          // Draw connections
          const connections = [
            [0, 1], [1, 2], [2, 3], [3, 4],  // Thumb
            [0, 5], [5, 6], [6, 7], [7, 8],  // Index
            [0, 9], [9, 10], [10, 11], [11, 12],  // Middle
            [0, 13], [13, 14], [14, 15], [15, 16],  // Ring
            [0, 17], [17, 18], [18, 19], [19, 20],  // Pinky
            [5, 9], [9, 13], [13, 17]  // Palm
          ];

          ctx.strokeStyle = '#ff69b4';
          ctx.lineWidth = 3;
          for (const [start, end] of connections) {
            const [x1, y1] = hand.landmarks[start];
            const [x2, y2] = hand.landmarks[end];
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
          }

          // Check for pinch
          const thumb = hand.landmarks[4];
          const index = hand.landmarks[8];
          const distance = Math.sqrt(
            Math.pow(thumb[0] - index[0], 2) +
            Math.pow(thumb[1] - index[1], 2)
          );

          if (distance < 40) {
            // Draw pinch indicator
            ctx.beginPath();
            ctx.arc((thumb[0] + index[0]) / 2, (thumb[1] + index[1]) / 2, 30, 0, 2 * Math.PI);
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.fillStyle = 'rgba(0, 255, 0, 0.3)';
            ctx.fill();
          }
        }
      } else {
        updateStatus('Show your hand to camera', 'loading');
      }

      // Calculate FPS
      frameCount++;
      const now = Date.now();
      if (now - lastTime > 1000) {
        const fps = Math.round(frameCount * 1000 / (now - lastTime));
        fpsDiv.textContent = `FPS: ${fps}`;
        frameCount = 0;
        lastTime = now;
      }

      // Continue detection loop
      requestAnimationFrame(detectHands);
    }

    async function main() {
      try {
        await setupCamera();
        await loadModel();
        detectHands();
      } catch (error) {
        console.error('Error:', error);
        updateStatus(`Error: ${error.message}`, 'error');
      }
    }

    main();
  </script>
</body>
</html>
