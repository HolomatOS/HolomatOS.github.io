<!DOCTYPE html>
<html>
<head>
  <title>My First AR Cube</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: sans-serif;
    }

    #start-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 18px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 15px;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>

  <button id="start-button">Start AR</button>

  <a-scene id="ar-scene" embedded arjs="sourceType: webcam; debugUIEnabled: true" style="display:none;">

    <!-- Marker -->
    <a-marker preset="hiro" emitevents="true">

      <!-- 3D Cube -->
      <a-box 
        id="cube"
        position="0 0.5 0" 
        material="color: red; opacity: 0.8"
        rotation="0 45 0"
        animation="property: rotation; to: 0 405 0; loop: true; dur: 8000"
      ></a-box>

    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>

    <!-- Lighting -->
    <a-light type="ambient" intensity="0.5"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.7"></a-light>

  </a-scene>

  <script>
    const startButton = document.getElementById('start-button');
    const arScene = document.getElementById('ar-scene');
    const cube = document.querySelector('#cube');

    // Function to go fullscreen (cross-browser)
    function goFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen();
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      else if (elem.mozRequestFullScreen) elem.mozRequestFullScreen();
      else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
    }

    // Start AR after user clicks button
    startButton.addEventListener('click', () => {
      // Hide start button
      startButton.style.display = 'none';

      // Show AR scene
      arScene.style.display = 'block';

      // Request fullscreen
      goFullscreen();

      // Change cube color on tap
      cube.addEventListener('click', () => {
        const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'cyan'];
        const randomColor = colors[Math.floor(Math.random() * colors.length)];
        cube.setAttribute('material', 'color', randomColor);
      });
    });
  </script>

</body>
</html>
