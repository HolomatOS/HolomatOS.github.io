<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rear Camera Hand Tracking + 3D Hand</title>
  <style>
    :root {
      --bg: #000000;
      --blue: #4da3ff;
      --blue-soft: rgba(77, 163, 255, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #d7e8ff;
    }

    #app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #000;
    }

    .panel {
      position: relative;
      overflow: hidden;
      background: #000;
      border: 1px solid #0f172a;
    }

    #trackingCanvas, #threeCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    #camera {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .label {
      position: absolute;
      left: 10px;
      top: 10px;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #93c5fd;
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid rgba(77, 163, 255, 0.35);
      border-radius: 999px;
      padding: 6px 10px;
      z-index: 2;
      user-select: none;
      -webkit-user-select: none;
    }

    #status {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      min-width: 240px;
      max-width: calc(100% - 24px);
      text-align: center;
      font-size: 12px;
      color: #bfdbfe;
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(77, 163, 255, 0.4);
      border-radius: 10px;
      padding: 8px 10px;
      z-index: 3;
      line-height: 1.35;
    }

    #startOverlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #startBtn {
      appearance: none;
      border: 1px solid rgba(77, 163, 255, 0.7);
      background: linear-gradient(180deg, rgba(16, 60, 130, 0.9), rgba(8, 33, 78, 0.95));
      color: #dbeafe;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 14px 24px;
      border-radius: 14px;
      min-width: 180px;
      cursor: pointer;
      box-shadow: 0 0 28px var(--blue-soft), inset 0 0 18px rgba(147, 197, 253, 0.2);
      touch-action: manipulation;
    }

    #startBtn:active {
      transform: translateY(1px) scale(0.995);
    }

    #debugBox {
      position: fixed;
      right: 8px;
      top: 8px;
      width: min(92vw, 420px);
      max-height: 42vh;
      overflow: auto;
      z-index: 20;
      font: 12px/1.35 Consolas, "Courier New", monospace;
      color: #dbeafe;
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid rgba(77, 163, 255, 0.5);
      border-radius: 10px;
      padding: 8px;
      white-space: pre-wrap;
    }

    #debugBox b {
      color: #93c5fd;
    }

    @media (max-width: 900px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: 42% 58%;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <section class="panel" id="leftPanel">
      <div class="label">Hand Tracking</div>
      <canvas id="trackingCanvas"></canvas>
    </section>
    <section class="panel" id="rightPanel">
      <div class="label">3D Hand</div>
      <canvas id="threeCanvas"></canvas>
    </section>
  </div>

  <video id="camera" playsinline autoplay muted></video>
  <div id="status">Press Start to run rear camera hand tracking.</div>
  <div id="startOverlay">
    <button id="startBtn" type="button">Start</button>
  </div>
  <div id="debugBox"><b>Debug</b>\nPage loaded.</div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script>
    (function () {
      const box = document.getElementById("debugBox");
      function line(msg) {
        if (!box) return;
        const t = new Date().toLocaleTimeString();
        box.textContent += "\n[" + t + "] " + msg;
        box.scrollTop = box.scrollHeight;
      }
      window.__dbg = line;
      window.addEventListener("error", function (e) {
        line("ERROR: " + (e.message || "unknown"));
      });
      window.addEventListener("unhandledrejection", function (e) {
        const m = e && e.reason ? (e.reason.message || String(e.reason)) : "unknown rejection";
        line("PROMISE: " + m);
      });
      line("Classic script ready.");
    })();
  </script>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

    const statusEl = document.getElementById("status");
    const startOverlay = document.getElementById("startOverlay");
    const startBtn = document.getElementById("startBtn");
    const video = document.getElementById("camera");
    const trackingCanvas = document.getElementById("trackingCanvas");
    const trackingCtx = trackingCanvas.getContext("2d", { alpha: false, desynchronized: true });
    const threeCanvas = document.getElementById("threeCanvas");

    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const targetFPS = isMobile ? 30 : 45;
    const minFrameGap = 1000 / targetFPS;

    const state = {
      handSeen: false,
      modelLoaded: false,
      lastTrackTs: 0,
      smoothPos: new THREE.Vector3(0, 0, 0),
      smoothQuat: new THREE.Quaternion(),
      targetPos: new THREE.Vector3(0, 0, 0),
      targetQuat: new THREE.Quaternion(),
      hasPose: false,
      mirrorInput: true,
      started: false
    };

    const dbg = (msg) => {
      if (window.__dbg) window.__dbg(msg);
    };

    dbg("Module script loaded.");
    dbg("UserAgent: " + navigator.userAgent);

    function setStatus(text) {
      statusEl.textContent = text;
      dbg("STATUS: " + text);
    }

    function fitCanvases() {
      const leftRect = trackingCanvas.parentElement.getBoundingClientRect();
      const rightRect = threeCanvas.parentElement.getBoundingClientRect();

      const dpr2d = Math.min(window.devicePixelRatio || 1, 1.5);
      trackingCanvas.width = Math.max(2, Math.floor(leftRect.width * dpr2d));
      trackingCanvas.height = Math.max(2, Math.floor(leftRect.height * dpr2d));
      trackingCtx.setTransform(1, 0, 0, 1, 0, 0);
      trackingCtx.scale(dpr2d, dpr2d);
      trackingCtx.fillStyle = "#000";
      trackingCtx.fillRect(0, 0, leftRect.width, leftRect.height);

      renderer.setSize(rightRect.width, rightRect.height, false);
      camera.aspect = rightRect.width / rightRect.height;
      camera.updateProjectionMatrix();
    }

    const renderer = new THREE.WebGLRenderer({
      canvas: threeCanvas,
      alpha: false,
      antialias: false,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setClearColor(0x000000, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 20);
    camera.position.set(0, 0, 2.2);

    const hemi = new THREE.HemisphereLight(0xbad7ff, 0x111111, 0.9);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0x99c3ff, 1.3);
    key.position.set(1.7, 1.2, 2.0);
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x4477ff, 0.85);
    rim.position.set(-1.2, 0.3, -0.7);
    scene.add(rim);

    const handRoot = new THREE.Group();
    scene.add(handRoot);

    const fallbackHand = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0x4da3ff, metalness: 0.15, roughness: 0.25, emissive: 0x123a8c, emissiveIntensity: 0.35 })
    );
    fallbackHand.visible = false;
    handRoot.add(fallbackHand);

    let handModel = null;

    const loader = new GLTFLoader();
    const modelCandidates = [
      "./assets/realistic-right-hand.glb",
      "https://cdn.jsdelivr.net/npm/@webxr-input-profiles/assets@1.0/dist/profiles/generic-hand/right.glb"
    ];

    function tintBlue(object3d) {
      object3d.traverse((obj) => {
        if (!obj.isMesh) return;
        const base = obj.material;
        const mat = new THREE.MeshPhysicalMaterial({
          color: 0x69b0ff,
          roughness: 0.28,
          metalness: 0.22,
          clearcoat: 0.45,
          clearcoatRoughness: 0.2,
          transmission: 0.08,
          thickness: 0.6,
          emissive: 0x0c2f80,
          emissiveIntensity: 0.22,
          transparent: true,
          opacity: 0.95
        });
        if (base && base.map) mat.map = base.map;
        obj.material = mat;
      });
    }

    async function loadModel() {
      for (const url of modelCandidates) {
        try {
          const gltf = await loader.loadAsync(url);
          handModel = gltf.scene;
          handModel.scale.setScalar(1.35);
          handModel.rotation.x = -Math.PI * 0.1;
          tintBlue(handModel);
          handRoot.add(handModel);
          state.modelLoaded = true;
          setStatus("Rear camera active. Move your hand in front of the camera.");
          return;
        } catch (_) {
          // try next candidate
        }
      }
      fallbackHand.visible = true;
      setStatus("Hand model URL failed to load. Add ./assets/realistic-right-hand.glb for a realistic hand.");
    }

    function getRearCameraConstraints() {
      return {
        audio: false,
        video: {
          facingMode: { exact: "environment" },
          width: { ideal: 640, max: 960 },
          height: { ideal: 480, max: 720 },
          frameRate: { ideal: 30, max: 30 }
        }
      };
    }

    async function openRearCamera() {
      try {
        return await navigator.mediaDevices.getUserMedia(getRearCameraConstraints());
      } catch (err) {
        const fallback = {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 640, max: 960 },
            height: { ideal: 480, max: 720 },
            frameRate: { ideal: 30, max: 30 }
          }
        };
        return await navigator.mediaDevices.getUserMedia(fallback);
      }
    }

    function averagePoints(points) {
      const out = { x: 0, y: 0, z: 0 };
      for (const p of points) {
        out.x += p.x;
        out.y += p.y;
        out.z += p.z;
      }
      const inv = 1 / points.length;
      out.x *= inv;
      out.y *= inv;
      out.z *= inv;
      return out;
    }

    function applyHandPose(landmarks) {
      const wrist = landmarks[0];
      const indexMcp = landmarks[5];
      const middleMcp = landmarks[9];
      const ringMcp = landmarks[13];
      const pinkyMcp = landmarks[17];

      const center = averagePoints([wrist, indexMcp, middleMcp, ringMcp, pinkyMcp]);

      let nx = (center.x - 0.5) * 2.0;
      const ny = (0.5 - center.y) * 2.0;
      if (state.mirrorInput) nx = -nx;

      const depth = THREE.MathUtils.clamp(-center.z * 2.0, -0.35, 0.65);
      state.targetPos.set(nx * 0.9, ny * 0.9, depth);

      const vIndex = new THREE.Vector3(indexMcp.x - pinkyMcp.x, pinkyMcp.y - indexMcp.y, indexMcp.z - pinkyMcp.z).normalize();
      const vUp = new THREE.Vector3(middleMcp.x - wrist.x, wrist.y - middleMcp.y, middleMcp.z - wrist.z).normalize();
      const vForward = new THREE.Vector3().crossVectors(vIndex, vUp).normalize();
      const vOrthoUp = new THREE.Vector3().crossVectors(vForward, vIndex).normalize();

      const basis = new THREE.Matrix4();
      basis.makeBasis(vIndex, vOrthoUp, vForward);
      state.targetQuat.setFromRotationMatrix(basis);

      const adjust = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, Math.PI));
      state.targetQuat.multiply(adjust);
      state.hasPose = true;
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.55
    });

    hands.onResults((results) => {
      const rect = trackingCanvas.parentElement.getBoundingClientRect();
      trackingCtx.setTransform(1, 0, 0, 1, 0, 0);
      trackingCtx.fillStyle = "#000";
      trackingCtx.fillRect(0, 0, trackingCanvas.width, trackingCanvas.height);

      const sx = trackingCanvas.width / rect.width;
      const sy = trackingCanvas.height / rect.height;
      trackingCtx.setTransform(sx, 0, 0, sy, 0, 0);

      const hasHand = !!(results.multiHandLandmarks && results.multiHandLandmarks.length);
      state.handSeen = hasHand;

      if (hasHand) {
        const lm = results.multiHandLandmarks[0];

        drawConnectors(trackingCtx, lm, HAND_CONNECTIONS, {
          color: "rgba(77, 163, 255, 0.85)",
          lineWidth: 3
        });

        drawLandmarks(trackingCtx, lm, {
          color: "#b9dcff",
          fillColor: "#4da3ff",
          lineWidth: 1,
          radius: 3
        });

        applyHandPose(lm);
      }
    });

    async function start() {
      if (state.started) return;
      state.started = true;
      try {
        dbg("Start handler entered.");
        setStatus("Starting fullscreen...");
        if (document.fullscreenElement == null && document.documentElement.requestFullscreen) {
          try {
            await document.documentElement.requestFullscreen();
            dbg("Fullscreen success.");
          } catch (_) {
            // Continue even if fullscreen is rejected by browser policy.
            dbg("Fullscreen rejected/blocked.");
          }
        } else {
          dbg("Fullscreen API unavailable or already active.");
        }

        setStatus("Loading 3D hand...");
        await loadModel();

        setStatus("Opening rear camera...");
        const stream = await openRearCamera();
        dbg("Rear camera stream obtained.");
        video.srcObject = stream;
        await video.play();
        dbg("Video play success.");

        fitCanvases();
        window.addEventListener("resize", fitCanvases, { passive: true });

        setStatus(state.modelLoaded
          ? "Rear camera locked. Move your hand to drive the 3D hand."
          : statusEl.textContent);

        startOverlay.style.display = "none";
        dbg("Overlay hidden, loop starting.");
        requestAnimationFrame(loop);
      } catch (err) {
        state.started = false;
        dbg("Start failed: " + (err && err.message ? err.message : String(err)));
        setStatus(`Failed to start: ${err.message}`);
      }
    }

    async function loop(ts) {
      if (ts - state.lastTrackTs >= minFrameGap && video.readyState >= 2) {
        state.lastTrackTs = ts;
        await hands.send({ image: video });
      }

      if (state.hasPose) {
        state.smoothPos.lerp(state.targetPos, 0.2);
        state.smoothQuat.slerp(state.targetQuat, 0.2);

        handRoot.position.copy(state.smoothPos);
        handRoot.quaternion.copy(state.smoothQuat);
      }

      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    startBtn.addEventListener("click", (e) => {
      dbg("Start click event.");
      start();
    });
    startBtn.addEventListener("pointerup", (e) => {
      dbg("Start pointerup event.");
    });
    startBtn.addEventListener("touchstart", () => {
      dbg("Start touchstart event.");
    }, { passive: true });
    dbg("Start listeners attached.");
  </script>
</body>
</html>
