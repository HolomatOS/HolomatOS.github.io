<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rear Camera Hand Tracking + 3D Hand</title>
  <style>
    :root {
      --bg: #000000;
      --blue: #4da3ff;
      --blue-soft: rgba(77, 163, 255, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #d7e8ff;
    }

    #app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #000;
    }

    .panel {
      position: relative;
      overflow: hidden;
      background: #000;
      border: 1px solid #0f172a;
    }

    #trackingCanvas, #threeCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    #camera {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .label {
      position: absolute;
      left: 10px;
      top: 10px;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #93c5fd;
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid rgba(77, 163, 255, 0.35);
      border-radius: 999px;
      padding: 6px 10px;
      z-index: 2;
      user-select: none;
      -webkit-user-select: none;
    }

    #status {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      min-width: 240px;
      max-width: calc(100% - 24px);
      text-align: center;
      font-size: 12px;
      color: #bfdbfe;
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(77, 163, 255, 0.4);
      border-radius: 10px;
      padding: 8px 10px;
      z-index: 3;
      line-height: 1.35;
    }

    #startOverlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #startBtn {
      appearance: none;
      border: 1px solid rgba(77, 163, 255, 0.7);
      background: linear-gradient(180deg, rgba(16, 60, 130, 0.9), rgba(8, 33, 78, 0.95));
      color: #dbeafe;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 14px 24px;
      border-radius: 14px;
      min-width: 180px;
      cursor: pointer;
      box-shadow: 0 0 28px var(--blue-soft), inset 0 0 18px rgba(147, 197, 253, 0.2);
      touch-action: manipulation;
    }

    #startBtn:active {
      transform: translateY(1px) scale(0.995);
    }

    @media (max-width: 900px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: 42% 58%;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <section class="panel" id="leftPanel">
      <div class="label">Hand Tracking</div>
      <canvas id="trackingCanvas"></canvas>
    </section>
    <section class="panel" id="rightPanel">
      <div class="label">3D Hand</div>
      <canvas id="threeCanvas"></canvas>
    </section>
  </div>

  <video id="camera" playsinline autoplay muted></video>
  <div id="status">Press Start to run rear camera hand tracking.</div>
  <div id="startOverlay">
    <button id="startBtn" type="button">Start</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";

    const statusEl = document.getElementById("status");
    const startOverlay = document.getElementById("startOverlay");
    const startBtn = document.getElementById("startBtn");
    const video = document.getElementById("camera");
    const trackingCanvas = document.getElementById("trackingCanvas");
    const trackingCtx = trackingCanvas.getContext("2d", { alpha: false, desynchronized: true });
    const threeCanvas = document.getElementById("threeCanvas");

    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const targetFPS = isMobile ? 30 : 45;
    const minFrameGap = 1000 / targetFPS;

    const state = {
      handSeen: false,
      modelLoaded: false,
      lastTrackTs: 0,
      smoothPos: new THREE.Vector3(0, 0, 0),
      smoothQuat: new THREE.Quaternion(),
      targetPos: new THREE.Vector3(0, 0, 0),
      targetQuat: new THREE.Quaternion(),
      hasPose: false,
      mirrorInput: false,
      started: false,
      fingerRigReady: false,
      fingerTarget: { thumb: 0, index: 0, middle: 0, ring: 0, pinky: 0 },
      fingerSmooth: { thumb: 0, index: 0, middle: 0, ring: 0, pinky: 0 }
    };

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function fitCanvases() {
      const leftRect = trackingCanvas.parentElement.getBoundingClientRect();
      const rightRect = threeCanvas.parentElement.getBoundingClientRect();

      const dpr2d = Math.min(window.devicePixelRatio || 1, 1.5);
      trackingCanvas.width = Math.max(2, Math.floor(leftRect.width * dpr2d));
      trackingCanvas.height = Math.max(2, Math.floor(leftRect.height * dpr2d));
      trackingCtx.setTransform(1, 0, 0, 1, 0, 0);
      trackingCtx.scale(dpr2d, dpr2d);
      trackingCtx.fillStyle = "#000";
      trackingCtx.fillRect(0, 0, leftRect.width, leftRect.height);

      renderer.setSize(rightRect.width, rightRect.height, false);
      camera.aspect = rightRect.width / rightRect.height;
      camera.updateProjectionMatrix();
    }

    const renderer = new THREE.WebGLRenderer({
      canvas: threeCanvas,
      alpha: false,
      antialias: false,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setClearColor(0x000000, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 20);
    camera.position.set(0, 0, 2.2);

    const hemi = new THREE.HemisphereLight(0xbad7ff, 0x111111, 0.9);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0x99c3ff, 1.3);
    key.position.set(1.7, 1.2, 2.0);
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x4477ff, 0.85);
    rim.position.set(-1.2, 0.3, -0.7);
    scene.add(rim);

    const handRoot = new THREE.Group();
    scene.add(handRoot);

    const fallbackHand = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0x4da3ff, metalness: 0.15, roughness: 0.25, emissive: 0x123a8c, emissiveIntensity: 0.35 })
    );
    fallbackHand.visible = false;
    handRoot.add(fallbackHand);

    let handModel = null;
    const fingerBones = { thumb: [], index: [], middle: [], ring: [], pinky: [] };
    const boneAxis = {
      thumb: new THREE.Vector3(0, 0, 1),
      index: new THREE.Vector3(1, 0, 0),
      middle: new THREE.Vector3(1, 0, 0),
      ring: new THREE.Vector3(1, 0, 0),
      pinky: new THREE.Vector3(1, 0, 0)
    };
    const curlMax = {
      thumb: [0.6, 0.8, 0.7],
      index: [0.4, 1.05, 0.75],
      middle: [0.4, 1.1, 0.75],
      ring: [0.4, 1.1, 0.75],
      pinky: [0.4, 1.05, 0.75]
    };

    const loader = new GLTFLoader();
    const modelCandidates = [
      "./hand.glb",
      "https://cdn.jsdelivr.net/npm/@webxr-input-profiles/assets@1.0/dist/profiles/generic-hand/right.glb",
      "./assets/realistic-right-hand.glb"
    ];

    function rankBoneName(name) {
      const n = name.toLowerCase();
      if (n.includes("metacarp") || n.includes("mcp") || n.includes("prox")) return 1;
      if (n.includes("inter") || n.includes("mid") || n.includes("pip")) return 2;
      if (n.includes("dist") || n.includes("dip") || n.includes("tip")) return 3;
      const m = n.match(/(\d+)/);
      return m ? Number(m[1]) : 99;
    }

    function classifyFinger(name) {
      const n = name.toLowerCase();
      if (n.includes("thumb")) return "thumb";
      if (n.includes("index") || n.includes("fore")) return "index";
      if (n.includes("middle")) return "middle";
      if (n.includes("ring")) return "ring";
      if (n.includes("pinky") || n.includes("little")) return "pinky";
      return null;
    }

    function setupFingerRig(root) {
      for (const key of Object.keys(fingerBones)) fingerBones[key] = [];
      root.traverse((obj) => {
        if (!obj.isBone) return;
        const finger = classifyFinger(obj.name || "");
        if (!finger) return;
        fingerBones[finger].push(obj);
        obj.userData.baseQuat = obj.quaternion.clone();
      });

      let found = false;
      for (const key of Object.keys(fingerBones)) {
        fingerBones[key].sort((a, b) => rankBoneName(a.name) - rankBoneName(b.name));
        if (fingerBones[key].length >= 2) found = true;
      }
      state.fingerRigReady = found;
    }

    function tintBlue(object3d) {
      object3d.traverse((obj) => {
        if (!obj.isMesh) return;
        const base = obj.material;
        const mat = new THREE.MeshPhysicalMaterial({
          color: 0x69b0ff,
          roughness: 0.28,
          metalness: 0.22,
          clearcoat: 0.45,
          clearcoatRoughness: 0.2,
          transmission: 0.08,
          thickness: 0.6,
          emissive: 0x0c2f80,
          emissiveIntensity: 0.22,
          transparent: true,
          opacity: 0.95
        });
        if (base && base.map) mat.map = base.map;
        obj.material = mat;
      });
    }

    async function loadModel() {
      for (const url of modelCandidates) {
        try {
          const gltf = await loader.loadAsync(url);
          handModel = gltf.scene;
          handModel.scale.setScalar(1.35);
          handModel.rotation.set(-0.2, Math.PI, 0.06);
          tintBlue(handModel);
          setupFingerRig(handModel);
          handRoot.add(handModel);
          state.modelLoaded = true;
          setStatus(state.fingerRigReady
            ? "Rear camera active. Move your hand in front of the camera."
            : "Rear camera active. Model loaded (no finger rig found).");
          return;
        } catch (_) {
          // try next candidate
        }
      }
      fallbackHand.visible = true;
      setStatus("Hand model URL failed to load. Add ./assets/realistic-right-hand.glb for a realistic hand.");
    }

    function getRearCameraConstraints() {
      return {
        audio: false,
        video: {
          facingMode: { exact: "environment" },
          width: { ideal: 640, max: 960 },
          height: { ideal: 480, max: 720 },
          frameRate: { ideal: 30, max: 30 }
        }
      };
    }

    async function openRearCamera() {
      try {
        return await navigator.mediaDevices.getUserMedia(getRearCameraConstraints());
      } catch (err) {
        const fallback = {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 640, max: 960 },
            height: { ideal: 480, max: 720 },
            frameRate: { ideal: 30, max: 30 }
          }
        };
        return await navigator.mediaDevices.getUserMedia(fallback);
      }
    }

    function averagePoints(points) {
      const out = { x: 0, y: 0, z: 0 };
      for (const p of points) {
        out.x += p.x;
        out.y += p.y;
        out.z += p.z;
      }
      const inv = 1 / points.length;
      out.x *= inv;
      out.y *= inv;
      out.z *= inv;
      return out;
    }

    function pointToVec(p) {
      return new THREE.Vector3(p.x, p.y, p.z);
    }

    function fingerCurlFromLandmarks(landmarks, mcp, pip, dip, tip) {
      const pmcp = pointToVec(landmarks[mcp]);
      const ppip = pointToVec(landmarks[pip]);
      const pdip = pointToVec(landmarks[dip]);
      const ptip = pointToVec(landmarks[tip]);

      const v1 = pmcp.clone().sub(ppip).normalize();
      const v2 = pdip.clone().sub(ppip).normalize();
      const v3 = ppip.clone().sub(pdip).normalize();
      const v4 = ptip.clone().sub(pdip).normalize();

      const a1 = Math.acos(THREE.MathUtils.clamp(v1.dot(v2), -1, 1));
      const a2 = Math.acos(THREE.MathUtils.clamp(v3.dot(v4), -1, 1));
      const curl = ((Math.PI - a1) * 0.65 + (Math.PI - a2) * 0.35) / Math.PI;
      return THREE.MathUtils.clamp(curl, 0, 1);
    }

    function updateFingerTargets(landmarks) {
      state.fingerTarget.thumb = fingerCurlFromLandmarks(landmarks, 1, 2, 3, 4);
      state.fingerTarget.index = fingerCurlFromLandmarks(landmarks, 5, 6, 7, 8);
      state.fingerTarget.middle = fingerCurlFromLandmarks(landmarks, 9, 10, 11, 12);
      state.fingerTarget.ring = fingerCurlFromLandmarks(landmarks, 13, 14, 15, 16);
      state.fingerTarget.pinky = fingerCurlFromLandmarks(landmarks, 17, 18, 19, 20);
    }

    function applyRigCurl(finger, curl) {
      if (!state.fingerRigReady) return;
      const chain = fingerBones[finger];
      if (!chain || chain.length === 0) return;
      const axis = boneAxis[finger];
      const strengths = curlMax[finger];

      for (let i = 0; i < Math.min(chain.length, 3); i++) {
        const bone = chain[i];
        const baseQuat = bone.userData.baseQuat;
        if (!baseQuat) continue;
        const q = new THREE.Quaternion().setFromAxisAngle(axis, -curl * strengths[i]);
        bone.quaternion.copy(baseQuat).multiply(q);
      }
    }

    function applyHandPose(landmarks) {
      const wrist = landmarks[0];
      const indexMcp = landmarks[5];
      const middleMcp = landmarks[9];
      const ringMcp = landmarks[13];
      const pinkyMcp = landmarks[17];

      const center = averagePoints([wrist, indexMcp, middleMcp, ringMcp, pinkyMcp]);

      let nx = (wrist.x - 0.5) * 2.0;
      const ny = (0.5 - wrist.y) * 2.0;
      if (state.mirrorInput) nx = -nx;

      const depth = THREE.MathUtils.clamp(-center.z * 2.0, -0.35, 0.65);
      const anchorX = 0.86;
      const anchorY = -0.92;
      const swayX = THREE.MathUtils.clamp(nx * 0.2, -0.16, 0.16);
      const swayY = THREE.MathUtils.clamp(ny * 0.2, -0.12, 0.12);
      const px = THREE.MathUtils.clamp(anchorX + swayX, 0.7, 1.02);
      const py = THREE.MathUtils.clamp(anchorY + swayY, -0.98, -0.72);
      const pz = THREE.MathUtils.clamp(depth * 0.5, -0.25, 0.4);
      state.targetPos.set(px, py, pz);

      const vIndex = new THREE.Vector3(indexMcp.x - pinkyMcp.x, pinkyMcp.y - indexMcp.y, indexMcp.z - pinkyMcp.z).normalize();
      const vUp = new THREE.Vector3(middleMcp.x - wrist.x, wrist.y - middleMcp.y, middleMcp.z - wrist.z).normalize();
      const vForward = new THREE.Vector3().crossVectors(vIndex, vUp).normalize();
      const vOrthoUp = new THREE.Vector3().crossVectors(vForward, vIndex).normalize();

      const basis = new THREE.Matrix4();
      basis.makeBasis(vIndex, vOrthoUp, vForward);
      state.targetQuat.setFromRotationMatrix(basis);

      const adjust = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, Math.PI));
      state.targetQuat.multiply(adjust);
      updateFingerTargets(landmarks);
      state.hasPose = true;
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.55
    });

    hands.onResults((results) => {
      const rect = trackingCanvas.parentElement.getBoundingClientRect();
      trackingCtx.setTransform(1, 0, 0, 1, 0, 0);
      trackingCtx.fillStyle = "#000";
      trackingCtx.fillRect(0, 0, trackingCanvas.width, trackingCanvas.height);

      const sx = trackingCanvas.width / rect.width;
      const sy = trackingCanvas.height / rect.height;
      trackingCtx.setTransform(sx, 0, 0, sy, 0, 0);

      const hasHand = !!(results.multiHandLandmarks && results.multiHandLandmarks.length);
      state.handSeen = hasHand;

      if (hasHand) {
        const lm = results.multiHandLandmarks[0];

        drawConnectors(trackingCtx, lm, HAND_CONNECTIONS, {
          color: "rgba(77, 163, 255, 0.85)",
          lineWidth: 3
        });

        drawLandmarks(trackingCtx, lm, {
          color: "#b9dcff",
          fillColor: "#4da3ff",
          lineWidth: 1,
          radius: 3
        });

        applyHandPose(lm);
      } else {
        state.hasPose = false;
        state.fingerTarget.thumb = 0;
        state.fingerTarget.index = 0;
        state.fingerTarget.middle = 0;
        state.fingerTarget.ring = 0;
        state.fingerTarget.pinky = 0;
      }
    });

    async function start() {
      if (state.started) return;
      state.started = true;
      try {
        setStatus("Starting fullscreen...");
        if (document.fullscreenElement == null && document.documentElement.requestFullscreen) {
          try {
            await document.documentElement.requestFullscreen();
          } catch (_) {
            // Continue even if fullscreen is rejected by browser policy.
          }
        }

        setStatus("Loading 3D hand...");
        await loadModel();

        setStatus("Opening rear camera...");
        const stream = await openRearCamera();
        video.srcObject = stream;
        await video.play();

        fitCanvases();
        window.addEventListener("resize", fitCanvases, { passive: true });

        setStatus(state.modelLoaded
          ? "Rear camera locked. Move your hand to drive the 3D hand."
          : statusEl.textContent);

        startOverlay.style.display = "none";
        requestAnimationFrame(loop);
      } catch (err) {
        state.started = false;
        setStatus(`Failed to start: ${err.message}`);
      }
    }

    async function loop(ts) {
      if (ts - state.lastTrackTs >= minFrameGap && video.readyState >= 2) {
        state.lastTrackTs = ts;
        await hands.send({ image: video });
      }

      if (state.hasPose) {
        state.smoothPos.lerp(state.targetPos, 0.2);
        state.smoothQuat.slerp(state.targetQuat, 0.2);

        handRoot.position.copy(state.smoothPos);
        handRoot.quaternion.copy(state.smoothQuat);
      }

      state.fingerSmooth.thumb = THREE.MathUtils.lerp(state.fingerSmooth.thumb, state.fingerTarget.thumb, 0.28);
      state.fingerSmooth.index = THREE.MathUtils.lerp(state.fingerSmooth.index, state.fingerTarget.index, 0.28);
      state.fingerSmooth.middle = THREE.MathUtils.lerp(state.fingerSmooth.middle, state.fingerTarget.middle, 0.28);
      state.fingerSmooth.ring = THREE.MathUtils.lerp(state.fingerSmooth.ring, state.fingerTarget.ring, 0.28);
      state.fingerSmooth.pinky = THREE.MathUtils.lerp(state.fingerSmooth.pinky, state.fingerTarget.pinky, 0.28);
      applyRigCurl("thumb", state.fingerSmooth.thumb);
      applyRigCurl("index", state.fingerSmooth.index);
      applyRigCurl("middle", state.fingerSmooth.middle);
      applyRigCurl("ring", state.fingerSmooth.ring);
      applyRigCurl("pinky", state.fingerSmooth.pinky);

      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    startBtn.addEventListener("click", start);
    startBtn.addEventListener("pointerup", start);
  </script>
</body>
</html>
